name: Patch Vision Structural V3

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/patch-vision-structural-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
          fetch-depth: 0
      - name: Apply dense structural matcher patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('vision-sync.js')
          text = path.read_text('utf-8')
          text = text.replace("const VISION=window.__WWMSYNC_VISION_BRIDGE__;if(!VISION)return;const CONTRACT='ANCHOR_FREE_STRUCTURAL_V2';", "const VISION=window.__WWMSYNC_VISION_BRIDGE__;if(!VISION)return;const CONTRACT='ANCHOR_FREE_STRUCTURAL_V3';")
          text = text.replace("topologyScore:0,angle:0", "topologyScore:0,denseScore:0,angle:0")
          text = text.replace(" · verify ${state.verifyScore.toFixed(3)} · ${Math.round(state.angle)}°", " · dense ${state.denseScore.toFixed(3)} · verify ${state.verifyScore.toFixed(3)} · ${Math.round(state.angle)}°")

          dense = r'''function denseStructuralScore(source,field,cx,cy,radius,angle){if(!source||!field||!Number.isFinite(radius)||radius<=0)return{score:-1,coverage:0};const midX=(source.w-1)/2,midY=(source.h-1)/2,a=rad(angle),c=Math.cos(a),s=Math.sin(a),ca=Math.cos(2*a),sa=Math.sin(2*a);let sum=0,wSum=0,covered=0,expected=0;for(let sy=7;sy<source.h-7;sy+=3)for(let sx=7;sx<source.w-7;sx+=3){const nx=(sx-midX)/(source.w/2),ny=(sy-midY)/(source.h/2),rr=Math.hypot(nx,ny);if(rr<.18||rr>.80)continue;expected++;const si=sy*source.w+sx,se=clamp(source.edge[si]/source.edgeP,0,1),sr=clamp(source.ridge[si]/source.ridgeP,0,1),sc=source.coast[si],sf=source.flat[si],rx=Math.round(cx+(nx*c-ny*s)*radius),ry=Math.round(cy+(nx*s+ny*c)*radius);if(rx<3||ry<3||rx>=field.w-3||ry>=field.h-3)continue;const ri=ry*field.w+rx,re=clamp(field.edge[ri]/field.edgeP,0,1),rridge=clamp(field.ridge[ri]/field.ridgeP,0,1),rc=field.coast[ri],rf=field.flat[ri],edgeSim=1-Math.abs(Math.sqrt(se)-Math.sqrt(re)),ridgeSim=1-Math.abs(Math.sqrt(sr)-Math.sqrt(rridge)),coastSim=1-Math.abs(Math.sqrt(sc)-Math.sqrt(rc)),flatSim=1-Math.abs(sf-rf),rc2=source.cos2[si]*ca-source.sin2[si]*sa,rs2=source.sin2[si]*ca+source.cos2[si]*sa,orient=.5+.5*(field.cos2[ri]*rc2+field.sin2[ri]*rs2),edgePresence=Math.max(se,re),quietSim=(1-Math.max(se,sr,sc))*(1-Math.max(re,rridge,rc)),weight=.30+.70*Math.max(edgePresence,sr,rridge,sc,rc,.35*(sf+rf)),shape=.30*edgeSim+.18*ridgeSim+.18*coastSim+.16*flatSim+.12*(edgePresence>.20?orient:.5)+.06*quietSim;sum+=weight*shape;wSum+=weight;covered++}const coverage=expected?covered/expected:0;return{score:coverage>=.78&&wSum?sum/wSum:-1,coverage}}
'''
          if 'function denseStructuralScore(' not in text:
              text = text.replace('function pushTop(', dense + 'function pushTop(', 1)

          coarse = r'''async function coarseMatch(info,cfg){const atlas=await coarseAtlas(cfg),field=atlas.field,samples=info.samples,stride=cfg.width===32768?7:4,radii=cfg.width===32768?[6,9,13,18,25,34]:[5,8,12,17,24],angles=[0,45,90,135,180,225,270,315],templates=[];for(const r of radii)for(const a of angles)templates.push({radius:r,angle:a,tpl:template(samples,r,a)});const topByRadius=new Map(radii.map(r=>[r,[]]));let bestSeen=0,rows=0;for(let y=stride;y<field.h-stride;y+=stride){for(let x=stride;x<field.w-stride;x+=stride){const target=pixelToGlobal(x*atlas.factor,y*atlas.factor,COARSE_Z,cfg);if(!inGlobalBounds(target))continue;for(const r of radii){let scaleBest=null;for(const t of templates){if(t.radius!==r)continue;const sc=scoreAt(field,x,y,t.tpl);if(sc.score<0)continue;if(!scaleBest||sc.score>scaleBest.score)scaleBest={x,y,radius:r,angle:t.angle,...sc}}if(scaleBest){pushTop(topByRadius.get(r),scaleBest,64);bestSeen=Math.max(bestSeen,scaleBest.score)}}}rows++;if(rows%5===0){state.coarseScore=bestSeen;setDiag('SEARCH',`global coarse ${Math.round(y/field.h*100)}%`,'coarse-global');await sleep(0)}}const seeds=[];for(const r of radii){const pool=topByRadius.get(r)||[];for(const item of pool.slice(0,32)){const dense=denseStructuralScore(info.field,field,item.x,item.y,item.radius,item.angle);item.denseScore=dense.score;item.rankScore=.48*item.score+.52*Math.max(0,dense.score)}pool.sort((a,b)=>(b.rankScore??b.score)-(a.rankScore??a.score));const chosen=[];for(const item of pool){if(chosen.every(seed=>Math.hypot(item.x-seed.x,item.y-seed.y)>=Math.max(14,r*.65))){chosen.push(item);seeds.push(item);if(chosen.length>=6)break}}}seeds.sort((a,b)=>(b.rankScore??b.score)-(a.rankScore??a.score));if(!seeds.length)return null;const hypotheses=[];for(const seed of seeds.slice(0,36)){const refineTop=[];for(let y=seed.y-stride*1.5;y<=seed.y+stride*1.5;y+=2)for(let x=seed.x-stride*1.5;x<=seed.x+stride*1.5;x+=2){const target=pixelToGlobal(x*atlas.factor,y*atlas.factor,COARSE_Z,cfg);if(!inGlobalBounds(target))continue;for(const rf of [.82,.90,.96,1,1.04,1.10,1.18])for(const da of [-22.5,-15,-7.5,0,7.5,15,22.5]){const radius=seed.radius*rf,angle=angleNorm(seed.angle+da),sc=scoreAt(field,x,y,template(samples,radius,angle));pushTop(refineTop,{x,y,radius,angle,...sc},28)}}for(const item of refineTop.slice(0,20)){const dense=denseStructuralScore(info.field,field,item.x,item.y,item.radius,item.angle);item.denseScore=dense.score;item.rankScore=.44*item.score+.56*Math.max(0,dense.score)}refineTop.sort((a,b)=>(b.rankScore??b.score)-(a.rankScore??a.score));hypotheses.push(refineTop[0]||seed);await sleep(0)}hypotheses.sort((a,b)=>(b.rankScore??b.score)-(a.rankScore??a.score));const best=hypotheses[0],second=hypotheses.find(x=>x!==best&&Math.hypot(x.x-best.x,x.y-best.y)>=Math.max(16,best.radius*.65)),margin=second?(best.rankScore??best.score)-(second.rankScore??second.score):(best.rankScore??best.score);return{...best,margin,atlas,hypotheses}}
'''
          text, n = re.subn(r'^async function coarseMatch\(info,cfg\)\{.*$', coarse.rstrip(), text, count=1, flags=re.M)
          assert n == 1, 'coarseMatch replacement failed'

          fine = r'''async function fineMatch(samples,cfg,pred,search=170,step=10,srcField=null){const atlasFactor=pred.atlas?.factor??(cfg.width===32768?4:2),scale=atlasFactor*(2**(FINE_Z-COARSE_Z)),centerX=pred.x*scale,centerY=pred.y*scale,radius=pred.radius*scale,fine=await fineFieldAround(cfg,centerX,centerY,radius,search),top=[];for(let y=fine.centerLocalY-search;y<=fine.centerLocalY+search;y+=step){for(let x=fine.centerLocalX-search;x<=fine.centerLocalX+search;x+=step)for(const rf of [.84,.91,.97,1,1.03,1.09,1.16])for(const da of [-15,-10,-5,0,5,10,15]){const rr=radius*rf,aa=angleNorm(pred.angle+da),sc=scoreAt(fine.field,x,y,template(samples,rr,aa));pushTop(top,{x,y,radius:rr,angle:aa,...sc},96)}await sleep(0)}if(!top.length)return null;for(const item of top.slice(0,36)){const dense=srcField?denseStructuralScore(srcField,fine.field,item.x,item.y,item.radius,item.angle):{score:-1};item.denseScore=dense.score;item.rankScore=srcField?.44*item.score+.56*Math.max(0,dense.score):item.score}top.sort((a,b)=>(b.rankScore??b.score)-(a.rankScore??a.score));let best=top[0],ref=[];for(let y=best.y-16;y<=best.y+16;y+=2)for(let x=best.x-16;x<=best.x+16;x+=2)for(const rf of [.94,.97,.99,1,1.01,1.03,1.06])for(const da of [-6,-3,-1.5,0,1.5,3,6]){const rr=best.radius*rf,aa=angleNorm(best.angle+da),sc=scoreAt(fine.field,x,y,template(samples,rr,aa));pushTop(ref,{x,y,radius:rr,angle:aa,...sc},48)}for(const item of ref.slice(0,36)){const dense=srcField?denseStructuralScore(srcField,fine.field,item.x,item.y,item.radius,item.angle):{score:-1};item.denseScore=dense.score;item.rankScore=srcField?.40*item.score+.60*Math.max(0,dense.score):item.score}ref.sort((a,b)=>(b.rankScore??b.score)-(a.rankScore??a.score));if(ref.length)best=ref[0];const all=(ref.length?ref:top),second=all.find(x=>x!==best&&Math.hypot(x.x-best.x,x.y-best.y)>=Math.max(24,best.radius*.13)),margin=second?(best.rankScore??best.score)-(second.rankScore??second.score):(best.rankScore??best.score),globalX=best.x+fine.minX*256,globalY=best.y+fine.minY*256;return{...best,globalX,globalY,margin,fieldGrid:fine,scaleFromCoarse:scale}}
'''
          text, n = re.subn(r'^async function fineMatch\(samples,cfg,pred,search=170,step=10\)\{.*$', fine.rstrip(), text, count=1, flags=re.M)
          assert n == 1, 'fineMatch replacement failed'

          global_match = r'''async function globalMatch(info,cfg){const coarseSearch=await coarseMatch(info,cfg);if(!coarseSearch)return{coarse:null,fine:null};state.coarseScore=coarseSearch.score;state.coarseMargin=coarseSearch.margin||0;setDiag('SEARCH','coarse candidates found; refining tiles','fine-global');const finals=[];for(const hypothesis of (coarseSearch.hypotheses||[coarseSearch]).slice(0,COARSE_BEAM)){const fine=await fineMatch(info.samples,cfg,{...hypothesis,atlas:coarseSearch.atlas},210,12,info.field);if(fine){const verify=verifyAt(fine.fieldGrid.field,fine.x,fine.y,fine.radius,fine.angle,info.verifySamples),dense=Number.isFinite(fine.denseScore)?fine.denseScore:denseStructuralScore(info.field,fine.fieldGrid.field,fine.x,fine.y,fine.radius,fine.angle).score,combined=.35*fine.score+.35*Math.max(0,dense)+.30*verify.score;finals.push({fine:{...fine,denseScore:dense},hypothesis,verify,combined})}await sleep(0)}if(!finals.length)return{coarse:coarseSearch,fine:null};finals.sort((a,b)=>b.combined-a.combined);const winner=finals[0],second=finals.find(item=>Math.hypot(item.fine.globalX-winner.fine.globalX,item.fine.globalY-winner.fine.globalY)>=Math.max(90,winner.fine.radius*.35)),beamMargin=second?winner.combined-second.combined:winner.combined,fine={...winner.fine,localMargin:winner.fine.margin,beamMargin,verifyScore:winner.verify.score,topologyScore:winner.verify.topology,combinedScore:winner.combined,margin:Math.min(winner.fine.margin,beamMargin)},coarse={...winner.hypothesis,margin:coarseSearch.margin,atlas:coarseSearch.atlas,beamResolved:true};return{coarse,fine,alternatives:finals.map(item=>({x:item.fine.globalX,y:item.fine.globalY,angle:item.fine.angle,structuralScore:item.fine.score,denseScore:item.fine.denseScore,verifyScore:item.verify.score,combinedScore:item.combined}))}}
'''
          text, n = re.subn(r'^async function globalMatch\(info,cfg\)\{.*$', global_match.rstrip(), text, count=1, flags=re.M)
          assert n == 1, 'globalMatch replacement failed'

          local = r'''async function localFineMatch(info,cfg,last,search=150){const pred={x:last.globalX/last.scaleFromCoarse,y:last.globalY/last.scaleFromCoarse,radius:last.radius/last.scaleFromCoarse,angle:last.angle,atlas:{factor:last.scaleFromCoarse/(2**(FINE_Z-COARSE_Z))}};return fineMatch(info.samples,cfg,pred,search,8,info.field)}'''
          text, n = re.subn(r'^async function localFineMatch\(samples,cfg,last,search=150\)\{.*$', local, text, count=1, flags=re.M)
          assert n == 1, 'localFineMatch replacement failed'

          gate = r'''function matchGate(coarse,fine,info,cfg){if(!cfg.geometryOk)return`geometry-residual p95=${cfg.p95.toFixed(6)}`;if(info.positiveCount<28)return`insufficient-structural-features ${info.positiveCount}`;if(info.contrast<.12)return`low-normalized-contrast ${info.contrast.toFixed(3)}`;if(!coarse)return'no-coarse-match';if(coarse.score<.34)return`coarse-structure ${coarse.score.toFixed(3)}`;if(!fine)return'no-fine-match';if(fine.score<.40)return`fine-structure ${fine.score.toFixed(3)}`;if(Number.isFinite(fine.denseScore)&&fine.denseScore<.48)return`dense-structure ${fine.denseScore.toFixed(3)}`;if(Number.isFinite(fine.verifyScore)&&fine.verifyScore<.47)return`verify-structure ${fine.verifyScore.toFixed(3)}`;if(Number.isFinite(fine.beamMargin)&&fine.beamMargin<.008)return`global-ambiguous ${fine.beamMargin.toFixed(3)}`;return''}'''
          text, n = re.subn(r'^function matchGate\(coarse,fine,info,cfg\)\{.*$', gate, text, count=1, flags=re.M)
          assert n == 1, 'matchGate replacement failed'

          register = r'''async function registerFrame(cfg,mapId){const roiCanvas=VISION.captureRoi(192);if(!roiCanvas)return{reason:'capture-frame-unavailable'};const info=roiSamples(roiCanvas);let coarse=null,fine=null;if(state.mode==='local'&&state.last){fine=await localFineMatch(info,cfg,state.last,160);if(fine){const verify=verifyAt(fine.fieldGrid.field,fine.x,fine.y,fine.radius,fine.angle,info.verifySamples);fine={...fine,verifyScore:verify.score,topologyScore:verify.topology,beamMargin:fine.margin};coarse={score:state.coarseScore,margin:state.coarseMargin,beamResolved:true}}}else if(state.mode==='confirm'&&state.pending?.match){fine=await localFineMatch(info,cfg,state.pending.match,140);if(fine){const verify=verifyAt(fine.fieldGrid.field,fine.x,fine.y,fine.radius,fine.angle,info.verifySamples);fine={...fine,verifyScore:verify.score,topologyScore:verify.topology,beamMargin:fine.margin};coarse={score:state.pending.coarseScore,margin:state.pending.coarseMargin,beamResolved:true}}}else{state.globalSearches++;const global=await globalMatch(info,cfg);coarse=global.coarse;fine=global.fine}if(coarse){state.coarseScore=coarse.score;state.coarseMargin=coarse.margin||0}if(fine){state.fineScore=fine.score;state.fineMargin=fine.margin||0;state.verifyScore=fine.verifyScore||0;state.topologyScore=fine.topologyScore||0;state.denseScore=fine.denseScore||0;state.angle=fine.angle;state.radius=fine.radius}const reason=matchGate(coarse,fine,info,cfg);if(reason)return{reason,coarse,fine,info};const target=pixelToGlobal(fine.globalX,fine.globalY,FINE_Z,cfg);if(!target||!inGlobalBounds(target))return{reason:'target-out-of-global-bounds',coarse,fine,info};return{reason:'',coarse,fine,info,target,mapId}}'''
          text, n = re.subn(r'^async function registerFrame\(cfg,mapId\)\{.*$', register, text, count=1, flags=re.M)
          assert n == 1, 'registerFrame replacement failed'

          text = text.replace("state.verifyScore=0;state.firstSearchAt=0", "state.verifyScore=0;state.denseScore=0;state.firstSearchAt=0")
          text = text.replace("verifyScore:state.verifyScore,topologyScore:state.topologyScore", "verifyScore:state.verifyScore,denseScore:state.denseScore,topologyScore:state.topologyScore")
          text = text.replace("score:fine?.score??-1,verifyScore:fine?.verifyScore??-1", "score:fine?.score??-1,denseScore:fine?.denseScore??-1,verifyScore:fine?.verifyScore??-1")

          path.write_text(text, 'utf-8')
      - name: Validate and commit patch
        shell: bash
        run: |
          set -euo pipefail
          node --check vision-sync.js
          grep -Fq 'ANCHOR_FREE_STRUCTURAL_V3' vision-sync.js
          grep -Fq 'denseStructuralScore' vision-sync.js
          grep -Fq 'dense-structure' vision-sync.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vision-sync.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: add dense structural verification to absolute matcher'
          git push origin HEAD:feature/wwm-native-sync-v2
