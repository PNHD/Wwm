name: Patch Vision Subpixel V11

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - .github/workflows/patch-vision-structural-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
          fetch-depth: 0
      - name: Patch structural-basin subpixel refine
        run: python tools/patch_vision_subpixel_v11.py
      - name: Validate JavaScript
        run: |
          node --check vision-sync.js
          grep -Fq 'ANCHOR_FREE_STRUCTURAL_V11' vision-sync.js
          grep -Fq 'photometricSubpixelRefine' vision-sync.js
          grep -Fq 'subpixelRefined' vision-sync.js
          grep -Fq 'injectMarkerDrift' vision-sync.js
      - name: Commit feature-only subpixel patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vision-sync.js
          if git diff --cached --quiet; then
            echo 'No subpixel changes needed.'
            exit 0
          fi
          git commit -m 'fix: refine accepted structural basin at subpixel precision'
          git push origin HEAD:feature/wwm-native-sync-v2
