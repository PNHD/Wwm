name: Patch WWMSync V3 CI Contract

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - .github/workflows/patch-vision-structural-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
          fetch-depth: 0
      - name: Patch deploy contract marker
        run: python tools/patch_ci_contract_v3.py
      - name: Validate deploy workflow marker
        run: |
          grep -Fq 'ANCHOR_FREE_STRUCTURAL_V3' .github/workflows/deploy-wwsync.yml
          if grep -Fq 'ANCHOR_FREE_STRUCTURAL_V2' .github/workflows/deploy-wwsync.yml; then exit 1; fi
      - name: Commit feature-only CI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-wwsync.yml
          if git diff --cached --quiet; then
            echo 'No CI patch changes needed.'
            exit 0
          fi
          git commit -m 'ci: validate structural V3 preview bundle'
          git push origin HEAD:feature/wwm-native-sync-v2
