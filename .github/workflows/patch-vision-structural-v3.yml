name: Patch Vision Runtime V7

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - .github/workflows/patch-vision-structural-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
          fetch-depth: 0
      - name: Patch runtime defaults and ROI invalidation
        run: python tools/patch_vision_runtime_v7.py
      - name: Validate JavaScript
        run: |
          node --check vision-sync.js
          grep -Fq 'ANCHOR_FREE_STRUCTURAL_V7' vision-sync.js
          grep -Fq "raw=localStorage.getItem(key)" vision-sync.js
          grep -Fq 'scaleAwareStructuralScore' vision-sync.js
          grep -Fq 'warpIntensityNccFast' vision-sync.js
      - name: Commit feature-only runtime patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vision-sync.js
          if git diff --cached --quiet; then
            echo 'No runtime changes needed.'
            exit 0
          fi
          git commit -m 'fix: restore real Vision defaults and invalidate stale auto lock'
          git push origin HEAD:feature/wwm-native-sync-v2
