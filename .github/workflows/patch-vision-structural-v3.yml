name: Patch Vision Structural V4 Retry

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - .github/workflows/patch-vision-structural-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
          fetch-depth: 0
      - name: Fix patch syntax and patch matcher V4
        run: |
          python tools/fix_patch_v4_syntax.py
          python tools/patch_vision_structural_v4.py
      - name: Validate JavaScript
        run: |
          node --check vision-sync.js
          grep -Fq 'ANCHOR_FREE_STRUCTURAL_V4' vision-sync.js
          grep -Fq 'bidirectionalContourScore' vision-sync.js
          grep -Fq 'structuralPhaseScore' vision-sync.js
      - name: Commit feature-only matcher patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vision-sync.js
          if git diff --cached --quiet; then
            echo 'No matcher changes needed.'
            exit 0
          fi
          git commit -m 'fix: use bidirectional structural registration'
          git push origin HEAD:feature/wwm-native-sync-v2
