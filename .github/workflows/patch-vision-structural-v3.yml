name: Patch Vision Structural V3

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - .github/workflows/patch-vision-structural-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
          fetch-depth: 0
      - name: Patch matcher
        run: python tools/patch_vision_structural_v3.py
      - name: Validate JavaScript
        run: |
          node --check vision-sync.js
          grep -Fq 'ANCHOR_FREE_STRUCTURAL_V3' vision-sync.js
          grep -Fq 'denseStructuralScore' vision-sync.js
          grep -Fq 'dense-structure' vision-sync.js
      - name: Commit feature-only patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vision-sync.js
          if git diff --cached --quiet; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git commit -m 'fix: add dense structural verification to absolute matcher'
          git push origin HEAD:feature/wwm-native-sync-v2
