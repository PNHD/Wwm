name: Fit Public POI Geometry Bridge

on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/fit-public-poi-geometry.yml']

permissions:
  contents: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install fitter dependency
        run: python -m pip install --disable-pip-version-check --quiet numpy

      - name: Fetch public Dashen and Global POI catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p poi-geometry/global
          UA='Mozilla/5.0 AppleWebKit/537.36 Chrome/131 Safari/537.36'
          for spec in \
            'map12|["1","2"]' \
            'map3|["3"]' \
            'map4|["4"]'; do
            zone="${spec%%|*}"; subs="${spec#*|}"
            curl -L -sS --compressed --connect-timeout 5 --max-time 25 -A "$UA" \
              -H 'Content-Type: application/json;charset=UTF-8' \
              -o "poi-geometry/dashen-${zone}.json" \
              --data "{\"mapId\":\"676d48a37d299d0811946ff1\",\"subTypes\":${subs},\"mapZone\":\"${zone}\"}" \
              'https://inf.ds.163.com/v1/web/game-map/point/list-by-sub-types'
          done
          for id in 1 2 3 4; do
            curl -L -sS --compressed --connect-timeout 5 --max-time 25 -A "$UA" \
              -o "poi-geometry/global/map-${id}-zh.json" \
              "https://s2.easebar.com/39f12eda6b86452b/api/map/points?mapId=${id}&lang=zh-CN"
            curl -L -sS --compressed --connect-timeout 5 --max-time 25 -A "$UA" \
              -o "poi-geometry/global/map-${id}-en.json" \
              "https://s2.easebar.com/39f12eda6b86452b/api/map/points?mapId=${id}&lang=en-US"
          done

      - name: Exact-name match and robust affine fit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from collections import defaultdict
          from pathlib import Path
          import numpy as np

          ROOT=Path('poi-geometry')
          DASHEN_FILES=[ROOT/'dashen-map12.json',ROOT/'dashen-map3.json',ROOT/'dashen-map4.json']
          # Current WWMSync map IDs -> Dashen map subtype. Dashen subtype 1 contains
          # the Qinghe+Kaifeng main atlas; subtype 2 is Hexi; subtype 4 is palace.
          SUBTYPE_FOR_GLOBAL={1:'1',2:'1',3:'2',4:'4'}

          dash=[]
          for file in DASHEN_FILES:
            j=json.loads(file.read_text('utf8'))
            for d in j.get('result',[]):
              try:
                dash.append({
                  'id':str(d['pointId']), 'name':str(d['name']).strip(),
                  'x':float(d['x']), 'y':float(d['y']),
                  'subtype':str(d.get('mapSubType','')), 'layer':str(d.get('layer','')),
                })
              except (KeyError,TypeError,ValueError):
                pass

          def walk_points(j):
            out=[]
            for parent in j.get('data',{}).get('categories',[]):
              for cat in parent.get('childCategories',[]):
                out.extend(cat.get('pointList',[]))
            return out

          def global_coord(value):
            return int(str(value),8)/1e5

          result={'maps':{},'dashenPointCount':len(dash)}
          for mapid in range(1,5):
            gj=json.loads((ROOT/'global'/f'map-{mapid}-zh.json').read_text('utf8'))
            global_points=[]
            for p in walk_points(gj):
              try:
                global_points.append({
                  'id':str(p['id']), 'name':str(p['name']).strip(),
                  'lng':global_coord(p['lng']), 'lat':global_coord(p['lat']),
                  'categoryId':p.get('categoryId'),
                })
              except (KeyError,TypeError,ValueError):
                pass

            dindex=defaultdict(list)
            for p in dash:
              if p['subtype']==SUBTYPE_FOR_GLOBAL[mapid] and p['name']:
                dindex[p['name']].append(p)
            gindex=defaultdict(list)
            for p in global_points:
              if p['name']:
                gindex[p['name']].append(p)

            pairs=[]
            for name in sorted(set(dindex)&set(gindex)):
              # Unique on each side removes ambiguous generic labels such as Boundary Stone.
              if len(dindex[name])==1 and len(gindex[name])==1:
                pairs.append((dindex[name][0],gindex[name][0]))

            rec={
              'dashenSubtype':SUBTYPE_FOR_GLOBAL[mapid],
              'globalPointCount':len(global_points),
              'uniqueExactNamePairs':len(pairs),
              'samplePairs':[{'name':d['name'],'dashenId':d['id'],'globalId':g['id']} for d,g in pairs[:20]],
            }
            if len(pairs)>=6:
              X=np.array([[d['x'],d['y'],1.] for d,g in pairs],dtype=float)
              Y=np.array([[g['lng'],g['lat']] for d,g in pairs],dtype=float)
              keep=np.ones(len(pairs),dtype=bool)
              B=None
              # Iteratively reject only geometric outliers. The retained model must be
              # validated by residuals; no guessed/manual coordinate pairs enter the fit.
              for _ in range(5):
                B,_,_,_=np.linalg.lstsq(X[keep],Y[keep],rcond=None)
                err=np.linalg.norm(X@B-Y,axis=1)
                base=err[keep]
                med=float(np.median(base)); mad=float(np.median(np.abs(base-med)))
                limit=max(5e-5, med + 6*1.4826*max(mad,1e-9))
                new_keep=err<=limit
                if new_keep.sum()<6 or np.array_equal(new_keep,keep): break
                keep=new_keep
              B,_,_,_=np.linalg.lstsq(X[keep],Y[keep],rcond=None)
              err=np.linalg.norm(X@B-Y,axis=1)
              inerr=err[keep]
              rec.update({
                'matrixRawXY1ToGlobalLngLat':B.tolist(),
                'inliers':int(keep.sum()),
                'outliers':int((~keep).sum()),
                'medianError':float(np.median(inerr)),
                'p95Error':float(np.percentile(inerr,95)),
                'maxInlierError':float(inerr.max()),
                'allPairMaxError':float(err.max()),
                'inlierPairs':[
                  {'name':d['name'],'dashenId':d['id'],'globalId':g['id'],'error':float(e)}
                  for (d,g),e,k in zip(pairs,err,keep) if k
                ],
              })
            result['maps'][str(mapid)]=rec

          (ROOT/'fit.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),'utf8')
          summary={k:{x:v for x,v in rec.items() if x not in ('inlierPairs','samplePairs')} for k,rec in result['maps'].items()}
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          # Gate: every currently exposed WWMSync map needs a geometry bridge with
          # at least six exact public POI correspondences. Residual quality is reported
          # and evaluated by the implementation separately.
          if any(rec.get('inliers',0)<6 for rec in result['maps'].values()):
            raise SystemExit('insufficient exact-name bridge pairs')
          PY

      - name: Upload POI geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-poi-geometry
          path: poi-geometry
          retention-days: 5
