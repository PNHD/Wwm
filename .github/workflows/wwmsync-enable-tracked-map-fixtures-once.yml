name: WWMSync Enable Tracked Map Fixtures Once

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: [.github/workflows/wwmsync-enable-tracked-map-fixtures-once.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
          fetch-depth: 0
      - name: Patch authoritative audit to tracked fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/wwmsync-same-session-gfn-diff-audit.yml')
          s = p.read_text()

          s = s.replace(
          "      - scripts/replay/wwmsync_same_session_gfn_diff_audit.py\n      - .github/workflows/wwmsync-same-session-gfn-diff-audit.yml\n",
          "      - scripts/replay/wwmsync_same_session_gfn_diff_audit.py\n      - .github/workflows/wwmsync-same-session-gfn-diff-audit.yml\n      - fixtures/same-session-gfn-diff/east-cross-world-map-roi.jpg\n      - fixtures/same-session-gfn-diff/general-shrine-world-map-roi.jpg\n")

          s = s.replace("      EAST_MAP_ROI_BLOB: 08302ab9044458ee0e58a07f1108973212942ac8\n", "")
          s = s.replace("      GENERAL_MAP_ROI_BLOB: 552eaff452e911b15f31a6609eddf695d39fd766\n", "")

          old_case = "              scripts/replay/wwmsync_same_session_gfn_diff_audit.py|.github/workflows/wwmsync-same-session-gfn-diff-audit.yml) ;;"
          new_case = "              scripts/replay/wwmsync_same_session_gfn_diff_audit.py|.github/workflows/wwmsync-same-session-gfn-diff-audit.yml|fixtures/same-session-gfn-diff/east-cross-world-map-roi.jpg|fixtures/same-session-gfn-diff/general-shrine-world-map-roi.jpg) ;;"
          assert old_case in s
          s = s.replace(old_case, new_case, 1)

          old_diff = "          if git diff \"${EXPECTED_START_HEAD}..HEAD\" -- ':!scripts/replay/wwmsync_same_session_gfn_diff_audit.py' ':!.github/workflows/wwmsync-same-session-gfn-diff-audit.yml' | grep -q .; then"
          new_diff = "          if git diff \"${EXPECTED_START_HEAD}..HEAD\" -- ':!scripts/replay/wwmsync_same_session_gfn_diff_audit.py' ':!.github/workflows/wwmsync-same-session-gfn-diff-audit.yml' ':!fixtures/same-session-gfn-diff/east-cross-world-map-roi.jpg' ':!fixtures/same-session-gfn-diff/general-shrine-world-map-roi.jpg' | grep -q .; then"
          assert old_diff in s
          s = s.replace(old_diff, new_diff, 1)

          start = s.index('      - name: Reconstruct replay carriers from exact owner provenance\n')
          end = s.index('      - name: Execute same-session world-map ↔ HUD differential audit\n', start)
          new_block = r'''      - name: Verify tracked exact map fixtures and reconstruct replay carriers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit-inputs/replay-sources
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image

          fixtures = {
              'east': (Path('fixtures/same-session-gfn-diff/east-cross-world-map-roi.jpg'), '48c1335583d1bf55d0251d55295ffcee02929e0f8840dfa0e5559cdeb5ca5bd6', (320,171)),
              'general': (Path('fixtures/same-session-gfn-diff/general-shrine-world-map-roi.jpg'), '73e275661e94a843807c5cae3c526e4fe23e5d4b7800104364bd36cc1d05bbba', (320,140)),
          }
          for stem,(path,expected_sha,dims) in fixtures.items():
              raw=path.read_bytes()
              got=hashlib.sha256(raw).hexdigest()
              assert got == expected_sha, (stem,got,expected_sha)
              assert raw[:2] == b'\xff\xd8' and raw[-2:] == b'\xff\xd9', f'{stem}: JPEG SOI/EOI failure'
              with Image.open(path) as im:
                  assert im.size == dims, (stem, im.size, dims)
                  im.verify()
              dec=cv2.imdecode(np.frombuffer(raw,dtype=np.uint8),cv2.IMREAD_GRAYSCALE)
              assert dec is not None, f'{stem}: OpenCV decode failed'
              assert (dec.shape[1],dec.shape[0]) == dims, (stem,dec.shape,dims)
              print(json.dumps({'fixture':str(path),'sha256':got,'bytes':len(raw),'dimensions':list(dims),'jpeg_soi_eoi':True,'pillow':True,'opencv':True}))

          W,H=2048,863
          out=Path('.audit-inputs/replay-sources')
          def map_carrier(src,norm,dst):
              g=cv2.imread(str(src),cv2.IMREAD_GRAYSCALE); assert g is not None
              ax,ay=norm[0]*W,norm[1]*H
              x0=max(0,int(ax-.30*W)); x1=min(W,int(ax+.30*W))
              y0=max(int(.09*H),int(ay-.34*H)); y1=min(int(.94*H),int(ay+.42*H))
              canvas=np.full((H,W),int(np.median(g)),np.uint8)
              canvas[y0:y1,x0:x1]=cv2.resize(g,(x1-x0,y1-y0),interpolation=cv2.INTER_LINEAR)
              assert cv2.imwrite(str(dst),canvas)
              return {'carrier_box':[x0,y0,x1,y1],'fixed_anchor_screen':[ax,ay],'fixture_dimensions':[g.shape[1],g.shape[0]]}
          def hud_carrier(src,dst):
              im=cv2.imread(str(src),cv2.IMREAD_COLOR); assert im is not None and im.shape[:2]==(192,192)
              med=np.median(im.reshape(-1,3),axis=0).astype(np.uint8)
              canvas=np.empty((H,W,3),np.uint8); canvas[:]=med
              canvas[:216,:216]=cv2.resize(im,(216,216),interpolation=cv2.INTER_LINEAR)
              assert cv2.imwrite(str(dst),canvas)
              return {'authoritative_work_canvas':[192,192],'carrier_semantic_roi':[0,0,216,216]}
          p={}
          p['east_map_carrier']=map_carrier(fixtures['east'][0],(.500,.505),out/'east-cross-world-map.png')
          p['general_map_carrier']=map_carrier(fixtures['general'][0],(.557,.288),out/'general-shrine-world-map.png')
          p['east_hud_carrier']=hud_carrier(Path(next(Path('.audit-inputs/exact/content').rglob('east-cross-roi-192.png'))),out/'east-cross-gameplay-hud.png')
          p['general_hud_carrier']=hud_carrier(Path(next(Path('.audit-inputs/exact/content').rglob('general-shrine-roi-192.png'))),out/'general-shrine-gameplay-hud.png')
          p['exact_owner_sources']={
            'east_cross_map':{'dimensions':[2048,863],'bytes':2728396,'sha256':'1dffb5a484be50d753e40472dc8ef9f84d22633fa6ef2a976a81aee6f1536e9e','derived_map_roi_original_box':[408,139,1637,795],'derived_map_anchor_local':[614.712146422629,293.783693843594],'derived_fixture_dimensions':[320,171],'derived_fixture_sha256':'48c1335583d1bf55d0251d55295ffcee02929e0f8840dfa0e5559cdeb5ca5bd6'},
            'east_cross_hud':{'dimensions':[2048,863],'bytes':3879098,'sha256':'c20d317a745b897b2d9cfb6d622521b2327afd961b8adae4649eaed23de256ad','authoritative_roi_sha256':'0551d584aec4df0fff3b6ccd115ddead1281be84e98239621148d3382c6e442c'},
            'general_shrine_map':{'dimensions':[2048,863],'bytes':3027787,'sha256':'99841c9b467a63299cded38d3598e5ef136e349f0896cc21d31275b9e7c88de7','derived_map_roi_original_box':[526,77,1755,615],'derived_map_anchor_local':[615.3446327683616,176.3050847457627],'derived_fixture_dimensions':[320,140],'derived_fixture_sha256':'73e275661e94a843807c5cae3c526e4fe23e5d4b7800104364bd36cc1d05bbba'},
            'general_shrine_hud':{'dimensions':[2048,863],'bytes':3879049,'sha256':'dd73ea17c9a269535b74eb7fd83bd491df2bdbba56dcd2f7d9be074068120378','authoritative_roi_sha256':'f0acddeef0e5d1c6f433e2e9347a48631bf7cbe84057f2c3adb1c8a01cc32999'}
          }
          p['tracked_map_fixtures']={stem:{'path':str(path),'sha256':sha,'dimensions':list(dims)} for stem,(path,sha,dims) in fixtures.items()}
          p['reconstruction_note']='Exact world-map JPEG derivatives are normal tracked repository files and are verified by SHA-256, JPEG SOI/EOI, Pillow, OpenCV and dimensions before any audit execution. HUD transport reconstructs the authoritative 192x192 work canvases from run 31666927302/artifact 9168284675. No runtime Git blob API, recovery artifact, legacy carrier, or conversation attachment is used by the authoritative audit.'
          for f in sorted(out.glob('*.png')):
              b=f.read_bytes(); p.setdefault('carrier_files',{})[f.name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          (out/'exact-owner-provenance.json').write_text(json.dumps(p,indent=2),encoding='utf-8')
          print(json.dumps(p,indent=2))
          PY

'''
          s = s[:start] + new_block + s[end:]

          s = s.replace(
              '- World-map carriers: fixed map-only derivatives from the exact owner bytes, deterministically grayscale + INTER_AREA width-320 + JPEG q92; each binary Git blob is decoded exactly once from GitHub JSON, then its expected SHA, JPEG validity, OpenCV decode and dimensions are verified before use.\\n',
              '- World-map inputs: exact derivative JPEGs are normal tracked repository files; SHA-256, JPEG SOI/EOI, Pillow/OpenCV decode and dimensions are verified before audit execution. Replay carriers are built only after that verification.\\n')
          s = s.replace(
              '- This replay transport does not change GT, the production gate, production code, or source provenance.\\n',
              '- The authoritative audit has no runtime dependency on recovery artifacts, legacy carriers, raw Git blob SHAs, or conversation attachments. GT, the production gate, production code, and source provenance remain unchanged.\\n')

          assert 'EAST_MAP_ROI_BLOB' not in s
          assert 'GENERAL_MAP_ROI_BLOB' not in s
          assert '/git/blobs/' not in s
          assert 'gh api "repos/${GITHUB_REPOSITORY}/git/blobs/' not in s
          assert 'fixtures/same-session-gfn-diff/east-cross-world-map-roi.jpg' in s
          assert 'fixtures/same-session-gfn-diff/general-shrine-world-map-roi.jpg' in s
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/wwmsync-same-session-gfn-diff-audit.yml')
          s=p.read_text()
          forbidden=('EAST_MAP_ROI_BLOB','GENERAL_MAP_ROI_BLOB','/git/blobs/')
          assert all(x not in s for x in forbidden)
          print('TRACKED-FIXTURE AUDIT PATCH PASS')
          PY

          rm -- .github/workflows/wwmsync-enable-tracked-map-fixtures-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows/wwmsync-same-session-gfn-diff-audit.yml .github/workflows/wwmsync-enable-tracked-map-fixtures-once.yml
          git diff --cached --check
          git commit -m 'ci(wwmsync): audit exact tracked map fixtures'
          git push origin HEAD:feature/wwm-native-sync-v2
