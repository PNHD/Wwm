name: Verify Official Map Bridge Exporter

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - official-sync.js
      - .github/workflows/verify-official-map-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exercise exact bookmarklet on official origin with mocked completion data
        shell: bash
        run: |
          set -euo pipefail
          node --check official-sync.js
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wwmsync-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          cat > /tmp/verify.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const TARGET='https://preview.wwmsync.pages.dev';
          const TOKEN='synthetic-token-never-export';
          const API='https://s2.easebar.com/39f12eda6b86452b';
          const decode=value=>JSON.parse(Buffer.from(value,'base64url').toString('utf8'));

          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:1280,height:800}});
            const builder=await context.newPage();
            await builder.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:30000});
            const bookmarklet=await builder.evaluate(async target=>{
              const mod=await import('/official-sync.js');
              return mod.buildOfficialMapBookmarklet(target);
            },TARGET);
            if(!bookmarklet.startsWith('javascript:'))throw new Error('bookmarklet was not generated');
            if(!bookmarklet.includes('h72na_map_accessToken'))throw new Error('bookmarklet missing first-party token lookup');

            const page=await context.newPage();
            const dialogs=[];
            page.on('dialog',async d=>{dialogs.push(d.message());await d.dismiss()});
            const res=await page.goto('https://www.wherewindsmeetgame.com/map/en/',{waitUntil:'domcontentloaded',timeout:60000});
            if(!res?.ok())throw new Error(`official map HTTP ${res?.status()}`);
            await page.evaluate(token=>{document.cookie=`h72na_map_accessToken=${encodeURIComponent(token)}; Path=/; SameSite=Lax`;},TOKEN);
            const visible=await page.evaluate(()=>document.cookie.includes('h72na_map_accessToken=synthetic-token-never-export'));
            if(!visible)throw new Error('synthetic JS-readable cookie could not be established');

            const observed=[];
            await context.route(`${API}/api/**`,async route=>{
              const req=route.request();
              const url=new URL(req.url());
              const header=req.headers()['h72_map_accesstoken'];
              if(header!==TOKEN)return route.continue();
              observed.push({path:url.pathname,header});
              if(url.pathname==='/39f12eda6b86452b/api/map/list'){
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,data:{maps:[{id:1},{id:2}]}})});
              }
              if(url.pathname==='/39f12eda6b86452b/api/map/points'){
                const mapId=Number(url.searchParams.get('mapId'));
                const pointList=mapId===1?[
                  {id:101,finished:true},{id:102,finished:1},{id:103,finished:false}
                ]:[{id:201,finished:false}];
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,data:{categories:[{childCategories:[{pointList}]}]}})});
              }
              return route.fulfill({status:404,contentType:'application/json',body:'{}'});
            });

            // Keep the fragment intact so it can be inspected before the real WWMSync receiver removes it.
            await context.route(`${TARGET}/**`,async route=>route.fulfill({status:200,contentType:'text/html',body:'<!doctype html><title>bridge sink</title>'}));
            const popupPromise=context.waitForEvent('page',{timeout:15000});
            await page.evaluate(code=>{location.href=code;},bookmarklet);
            const popup=await popupPromise;
            await popup.waitForLoadState('domcontentloaded',{timeout:15000});
            await popup.waitForFunction(()=>location.hash.startsWith('#wwmsync-import='),null,{timeout:15000});
            const targetUrl=popup.url();
            const fragment=new URL(targetUrl).hash.slice('#wwmsync-import='.length);
            const payload=decode(fragment);

            const serialized=JSON.stringify(payload);
            if(serialized.includes(TOKEN)||/token|cookie|session|password|pin/i.test(serialized))throw new Error(`credential material leaked into snapshot: ${serialized}`);
            if(payload.v!==1||payload.source!=='official-map'||!Number.isFinite(payload.at))throw new Error(`invalid payload envelope: ${serialized}`);
            if(JSON.stringify(payload.maps)!==JSON.stringify([[1,[101,102]],[2,[]]]))throw new Error(`wrong completion payload: ${serialized}`);
            if(observed.length!==3||observed.some(x=>x.header!==TOKEN))throw new Error(`unexpected authenticated calls: ${JSON.stringify(observed)}`);
            if(dialogs.length)throw new Error(`unexpected bridge alert: ${JSON.stringify(dialogs)}`);

            console.log('BRIDGE_EXPORT_PASS',JSON.stringify({targetOrigin:new URL(targetUrl).origin,maps:payload.maps,authenticatedOfficialCalls:observed.map(x=>x.path),credentialMaterialExported:false}));
            await browser.close();
          })().catch(e=>{console.error('BRIDGE_EXPORT_FATAL',e);process.exit(1)});
          NODE

          CHROME_PATH="$CHROME_PATH" node /tmp/verify.cjs
