name: Validate WWSync

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
      - production/wwsync
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime syntax
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          class Parser(HTMLParser): pass
          html=Path('index.html').read_text(encoding='utf-8')
          Parser().feed(html)
          assert '<title>WWSync — Where Winds Meet</title>' in html
          assert 'loginButton' in html
          assert 'languageSelect' in html
          print('runtime structure valid')
          PY
      - name: Enforce clean sync architecture
        run: |
          set -euo pipefail
          grep -F "MpayOSSDK" index.html app.js
          grep -F "https://s2.easebar.com/39f12eda6b86452b" app.js
          grep -F "/api/auth/ursRoles" app.js
          grep -F "/api/auth/ursLogin" app.js
          grep -F "/api/map/points" app.js
          grep -F "h72_map_accessToken" app.js
          if grep -RInE 'wwmmap\.pages\.dev|/service/gameauth|/service/call_client_method|start_game_sync|sangtacvietcdn|stv-appdomain|MapGenie|mapgenie|17173|default_server_password|localhost:63333|GET_GAME_STATE' index.html app.js styles.css sw.js manifest.webmanifest _headers; then
            echo 'Legacy/manual sync dependency leaked into WWSync runtime.' >&2
            exit 1
          fi
          if [ -d functions ]; then echo 'WWSync pure-web build must not ship legacy Pages Functions.' >&2; exit 1; fi
          test ! -f _routes.json
      - name: Validate privacy and deployment contract
        run: |
          set -euo pipefail
          grep -F "WWSync has no password field" README.md
          grep -F "does not inject code" README.md
          grep -Fx '/map /index.html 200' _redirects
          grep -F "X-Content-Type-Options: nosniff" _headers
          grep -F "Content-Security-Policy:" _headers
          if grep -RInE 'CLOUDFLARE_API_TOKEN=[A-Za-z0-9]|CLOUDFLARE_ACCOUNT_ID=[A-Za-z0-9]' index.html app.js sw.js README.md; then echo 'Potential committed Cloudflare secret detected.' >&2; exit 1; fi
