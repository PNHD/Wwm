name: Validate WWMSync

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
      - production/wwsync
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate runtime syntax and structure
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          python - <<'PY'
          import json,re
          from html.parser import HTMLParser
          from pathlib import Path
          manifest=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest['short_name']=='WWMSync'
          html=Path('index.html').read_text(encoding='utf-8')
          class Parser(HTMLParser): pass
          Parser().feed(html)
          assert '<title>WWMSync — Where Winds Meet</title>' in html
          assert 'id="characterUid"' in html
          assert 'id="syncButton"' in html
          assert 'id="languageSelect"' in html
          assert 'leaflet@1.9.4' in html
          assert not re.search(r'<input[^>]+type=["\']password["\']',html,re.I)
          assert 'syncPassword' not in html
          print('runtime structure valid')
          PY

      - name: Enforce clean sync boundary
        run: |
          set -euo pipefail
          grep -F "https://s2.easebar.com/39f12eda6b86452b" app.js
          grep -F "data/map/" app.js
          grep -F "wwmsync:uid" app.js
          grep -F "syncSaved" app.js
          grep -F "Game connector: chưa kết nối" app.js
          if grep -RInE 'syncBlocked|MpayOSSDK|sdk-os\.mpsdk|/api/mpay|/api/auth/ursRoles|/api/auth/ursLogin|h72_map_accessToken|wwmmap\.pages\.dev|/service/gameauth|/service/call_client_method|start_game_sync|sangtacvietcdn|stv-appdomain|MapGenie|mapgenie|17173|localhost:63333|GET_GAME_STATE' index.html app.js sw.js manifest.webmanifest; then
            echo 'Retired, misleading, or private sync dependency leaked into active runtime.' >&2
            exit 1
          fi

      - name: Validate privacy and deployment contract
        run: |
          set -euo pipefail
          grep -F "UID: stored locally in the browser only" README.md
          grep -F "does not bypass" README.md
          grep -F "private game-side/backend transport" README.md
          grep -Fx '/map /index.html 200' _redirects
          test "$(wc -l < _redirects)" -eq 1
          grep -F "X-Content-Type-Options: nosniff" _headers
          grep -F "Content-Security-Policy:" _headers
          if grep -RInE 'CLOUDFLARE_API_TOKEN=[A-Za-z0-9]|CLOUDFLARE_ACCOUNT_ID=[A-Za-z0-9]' index.html app.js sw.js README.md; then
            echo 'Potential committed Cloudflare secret detected.' >&2
            exit 1
          fi
