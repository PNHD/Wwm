name: Validate WWM Atlas

on:
  push:
    branches:
      - feature/wwm-map-m0-foundation
      - production/wwm-atlas
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          node --check bootstrap.mjs

      - name: Validate JSON and GeoJSON
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('data').glob('*.json')) + list(Path('data').glob('*.geojson'))
          for path in files:
              with path.open(encoding='utf-8') as handle:
                  doc = json.load(handle)
              if path.suffix == '.geojson':
                  assert doc.get('type') == 'FeatureCollection', f'{path}: expected FeatureCollection'
                  ids = [str(feature.get('id') or feature.get('properties', {}).get('id')) for feature in doc.get('features', [])]
                  assert len(ids) == len(set(ids)), f'{path}: duplicate POI ids'
              print('valid', path)
          PY

      - name: Validate source allowlist
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const sources = JSON.parse(fs.readFileSync('data/sources.json', 'utf8'));
          const expected = new Map([
            ['official', 'https://www.wherewindsmeetgame.com/map/en/'],
            ['17173', 'https://map.17173.com/yysls/maps/qinghe'],
            ['mapgenie', 'https://mapgenie.io/where-winds-meet/maps/world'],
            ['personal', null],
          ]);
          if (!Array.isArray(sources) || sources.length !== expected.size) throw new Error('Unexpected source registry shape');
          for (const source of sources) {
            if (!expected.has(source.id)) throw new Error(`Unexpected source: ${source.id}`);
            if (expected.get(source.id) !== (source.url || null)) throw new Error(`Unexpected URL for ${source.id}`);
          }
          NODE
          if grep -RInF 'wwmmap.pages.dev' index.html app.js bootstrap.mjs sw.js data assets; then
            echo 'Legacy WWM Map dependency detected.' >&2
            exit 1
          fi

      - name: Validate MapLibre v6 lazy ESM integration
        run: |
          set -euo pipefail
          grep -F "maplibre-gl@6.2.0/dist/maplibre-gl.mjs" app.js
          if grep -F "maplibre-gl@6.2.0/dist/maplibre-gl.js" app.js index.html bootstrap.mjs; then
            echo 'MapLibre v6 is ESM-only; UMD bundle reference is invalid.' >&2
            exit 1
          fi
          if grep -F "maplibre-gl@6.2.0" index.html bootstrap.mjs; then
            echo 'MapLibre must remain lazy-loaded from Personal Overlay only.' >&2
            exit 1
          fi

      - name: Validate routing and HTML
        run: |
          set -euo pipefail
          grep -Fx '/map /index.html 200' _redirects
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          parser = Parser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          print('valid index.html')
          PY
