name: Validate WWM Atlas

on:
  push:
    branches:
      - feature/wwm-map-m0-foundation
      - feature/wwm-auto-sync
      - production/wwm-atlas
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          node --check bootstrap.mjs
          find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate JSON
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('manifest.webmanifest'), Path('_routes.json')]:
              json.loads(path.read_text(encoding='utf-8'))
              print('valid', path)
          routes=json.loads(Path('_routes.json').read_text(encoding='utf-8'))
          assert routes == {'version': 1, 'include': ['/api/*'], 'exclude': []}
          PY

      - name: Validate sync architecture
        run: |
          set -euo pipefail
          grep -F "start_game_sync" app.js functions/api/sync/client-method.js
          grep -F "/api/sync/gameauth" app.js
          grep -F "/api/sync/relay-servers" app.js
          grep -F "/api/map/markers" app.js
          grep -F "wss://*.sangtacvietcdn.xyz" _headers
          grep -F "wwmmap.pages.dev/service/gameauth" functions/api/sync/gameauth.js
          grep -F "wwmmap.pages.dev/service/call_client_method" functions/api/sync/client-method.js
          if grep -RInE 'mapgenie|map\.17173\.com|17173 CN' index.html app.js styles.css sw.js manifest.webmanifest _headers; then
            echo 'Manual third-party provider leaked into runtime.' >&2
            exit 1
          fi
          if grep -RInF 'wwmmap.pages.dev' index.html app.js styles.css sw.js manifest.webmanifest _headers; then
            echo 'Frontend must not call the compatibility origin directly.' >&2
            exit 1
          fi

      - name: Validate routing and HTML
        run: |
          set -euo pipefail
          grep -Fx '/map /index.html 200' _redirects
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser): pass
          Parser().feed(Path('index.html').read_text(encoding='utf-8'))
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'language-select' in html
          assert 'sync-btn' in html
          assert 'marker-canvas' in html
          print('valid index.html')
          PY

      - name: Validate no secrets are committed
        run: |
          set -euo pipefail
          if grep -RInE 'CLOUDFLARE_API_TOKEN=[^$]|X-WWM-PASS["'"']?:[[:space:]]*["'"'][^"'"']+' --exclude-dir=.git .; then
            echo 'Potential committed secret detected.' >&2
            exit 1
          fi
