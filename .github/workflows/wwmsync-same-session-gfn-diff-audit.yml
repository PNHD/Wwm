name: Replay Same-Session GFN Differential Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - scripts/replay/wwmsync_same_session_gfn_diff_audit.py
      - .github/workflows/wwmsync-same-session-gfn-diff-audit.yml
      - fixtures/same-session-gfn-diff/east-cross-world-map-roi.jpg
      - fixtures/same-session-gfn-diff/general-shrine-world-map-roi.jpg

permissions:
  contents: write
  actions: read

concurrency:
  group: wwmsync-same-session-gfn-diff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Same-session GFN differential audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_START_HEAD: f199258d4abdebe8f3ae75d99b56442ef76e1e38
      AUTHORITATIVE_RUN: "31666927302"
      AUTHORITATIVE_ARTIFACT: "9168284675"
      PUBLIC_HUD_ARTIFACT: "9146646914"
      REPLAY_SITE_ARTIFACT: "9127953239"
      REAL_GFN_ASSET_ID: "511291145"
      REAL_GFN_SHA256: aa14ce0e703d0af5c4c86946f2932b465f8a7fd529001cd1900b3b99b501a216
      REPORT_PATH: docs/wwmsync/audits/same-session-gfn-worldmap-hud-differential-2026-08-13.md
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/wwm-native-sync-v2

      - name: Verify frozen starting HEAD and replay-only scope
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/replay/wwmsync_same_session_gfn_diff_audit.py
          python -m py_compile scripts/replay/wwmsync_same_session_gfn_diff_audit.py
          FIRST="$(git rev-list --first-parent --reverse "${EXPECTED_START_HEAD}..HEAD" | sed -n '1p')"
          test -n "$FIRST"
          test "$(git rev-parse "${FIRST}^")" = "$EXPECTED_START_HEAD"
          mapfile -t CHANGED < <(git diff --name-only "${EXPECTED_START_HEAD}..HEAD")
          printf '%s\n' "${CHANGED[@]}"
          for p in "${CHANGED[@]}"; do
            case "$p" in
              scripts/replay/wwmsync_same_session_gfn_diff_audit.py|.github/workflows/wwmsync-same-session-gfn-diff-audit.yml|fixtures/same-session-gfn-diff/east-cross-world-map-roi.jpg|fixtures/same-session-gfn-diff/general-shrine-world-map-roi.jpg) ;;
              *) echo "Unexpected pre-audit path: $p" >&2; exit 1 ;;
            esac
          done
          if git diff "${EXPECTED_START_HEAD}..HEAD" -- ':!scripts/replay/wwmsync_same_session_gfn_diff_audit.py' ':!.github/workflows/wwmsync-same-session-gfn-diff-audit.yml' ':!fixtures/same-session-gfn-diff/east-cross-world-map-roi.jpg' ':!fixtures/same-session-gfn-diff/general-shrine-world-map-roi.jpg' | grep -q .; then
            echo "Non replay/CI diff detected" >&2
            exit 1
          fi
          echo "Verified starting audit parent: ${EXPECTED_START_HEAD}"
          echo "Production structural gate remains 0.58; this job does not edit production."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install replay-only analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.1.3 \
            opencv-python-headless==4.10.0.84 \
            pillow==11.3.0 \
            scipy==1.15.3 \
            scikit-image==0.25.2
          python scripts/replay/wwmsync_same_session_gfn_diff_audit.py --help >/dev/null

      - name: Recover immutable authoritative HUD-control artifact pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit-inputs/authoritative-run .audit-inputs/exact .audit-inputs/aux
          META="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTHORITATIVE_ARTIFACT}")"
          test "$(jq -r '.expired' <<<"$META")" = "false"
          test "$(jq -r '.workflow_run.id' <<<"$META")" = "$AUTHORITATIVE_RUN"
          test "$(jq -r '.digest' <<<"$META")" = 'sha256:5ab08d0bf1745556b0b10d3f72cb70779fa65367afff6f057014f050a1d634d8'
          URL="$(jq -r '.archive_download_url' <<<"$META")"
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$URL" -o .audit-inputs/exact/artifact-${AUTHORITATIVE_ARTIFACT}.zip
          unzip -q .audit-inputs/exact/artifact-${AUTHORITATIVE_ARTIFACT}.zip -d .audit-inputs/exact/content
          gh run download "$AUTHORITATIVE_RUN" --repo "$GITHUB_REPOSITORY" -D .audit-inputs/authoritative-run
          gh run view "$AUTHORITATIVE_RUN" --repo "$GITHUB_REPOSITORY" --log > .audit-inputs/authoritative-run/authoritative-run.log
          echo '0551d584aec4df0fff3b6ccd115ddead1281be84e98239621148d3382c6e442c' "$(find .audit-inputs/exact/content -type f -name east-cross-roi-192.png -print -quit)" | sha256sum -c -
          echo 'f0acddeef0e5d1c6f433e2e9347a48631bf7cbe84057f2c3adb1c8a01cc32999' "$(find .audit-inputs/exact/content -type f -name general-shrine-roi-192.png -print -quit)" | sha256sum -c -

      - name: Recover deterministic prior cross-controls and Dashen replay cache
        shell: bash
        run: |
          set -euo pipefail
          fetch_artifact() {
            local aid="$1" expected="$2" dest="$3"
            mkdir -p "$dest"
            local meta url
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}")"
            test "$(jq -r '.expired' <<<"$meta")" = false
            test "$(jq -r '.digest' <<<"$meta")" = "sha256:${expected}"
            url="$(jq -r '.archive_download_url' <<<"$meta")"
            curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$url" -o "$dest/artifact.zip"
            unzip -q "$dest/artifact.zip" -d "$dest/content"
          }
          fetch_artifact "$PUBLIC_HUD_ARTIFACT" b305444dff3ac2db6a544020093bd64022ffef5406c246849499d6a96525c041 .audit-inputs/aux/public-hud
          fetch_artifact "$REPLAY_SITE_ARTIFACT" 1542e60310197707f892e7ee9ebbbdb65c3f58926fcedb4ec80454d4b9eaf8d3 .audit-inputs/aux/reference-site
          FANG_SRC="$(find .audit-inputs/aux/public-hud/content -type f -name 'steam-general-shrine-1-roi.png' -print -quit)"
          FANG_GT="$(find .audit-inputs/aux/public-hud/content -type f -name 'steam-general-shrine-ground-truth.json' -print -quit)"
          test -s "$FANG_SRC" && test -s "$FANG_GT"
          cp "$FANG_SRC" .audit-inputs/aux/public-hud/fang-xu-steam-hud.png
          cp "$FANG_GT" .audit-inputs/aux/public-hud/fang-xu-ground-truth.json
          mkdir -p .audit-inputs/aux/real-fixture
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${REAL_GFN_ASSET_ID}" > .audit-inputs/aux/real-fixture/wwmsync-gfn-motion-20260810-143835.zip
          echo "${REAL_GFN_SHA256}  .audit-inputs/aux/real-fixture/wwmsync-gfn-motion-20260810-143835.zip" | sha256sum -c -

      - name: Verify tracked exact map fixtures and reconstruct replay carriers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit-inputs/replay-sources
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image

          fixtures = {
              'east': (Path('fixtures/same-session-gfn-diff/east-cross-world-map-roi.jpg'), '48c1335583d1bf55d0251d55295ffcee02929e0f8840dfa0e5559cdeb5ca5bd6', (320,171)),
              'general': (Path('fixtures/same-session-gfn-diff/general-shrine-world-map-roi.jpg'), '73e275661e94a843807c5cae3c526e4fe23e5d4b7800104364bd36cc1d05bbba', (320,140)),
          }
          for stem,(path,expected_sha,dims) in fixtures.items():
              raw=path.read_bytes()
              got=hashlib.sha256(raw).hexdigest()
              assert got == expected_sha, (stem,got,expected_sha)
              assert raw[:2] == b'\xff\xd8' and raw[-2:] == b'\xff\xd9', f'{stem}: JPEG SOI/EOI failure'
              with Image.open(path) as pil:
                  assert pil.format == 'JPEG', (stem,pil.format)
                  pil.load()
                  assert pil.size == dims, (stem,pil.size,dims)
              dec=cv2.imdecode(np.frombuffer(raw,dtype=np.uint8),cv2.IMREAD_GRAYSCALE)
              assert dec is not None, f'{stem}: OpenCV decode failed'
              assert (dec.shape[1],dec.shape[0]) == dims, (stem,dec.shape,dims)
              print(json.dumps({'fixture':str(path),'sha256':got,'bytes':len(raw),'dimensions':list(dims),'jpeg_soi_eoi':True,'pillow_decode':True,'opencv_decode':True}))

          W,H=2048,863
          out=Path('.audit-inputs/replay-sources')
          def map_carrier(src,norm,dst):
              g=cv2.imread(str(src),cv2.IMREAD_GRAYSCALE); assert g is not None
              ax,ay=norm[0]*W,norm[1]*H
              x0=max(0,int(ax-.30*W)); x1=min(W,int(ax+.30*W))
              y0=max(int(.09*H),int(ay-.34*H)); y1=min(int(.94*H),int(ay+.42*H))
              canvas=np.full((H,W),int(np.median(g)),np.uint8)
              canvas[y0:y1,x0:x1]=cv2.resize(g,(x1-x0,y1-y0),interpolation=cv2.INTER_LINEAR)
              assert cv2.imwrite(str(dst),canvas)
              return {'carrier_box':[x0,y0,x1,y1],'fixed_anchor_screen':[ax,ay],'fixture_dimensions':[g.shape[1],g.shape[0]]}
          def hud_carrier(src,dst):
              im=cv2.imread(str(src),cv2.IMREAD_COLOR); assert im is not None and im.shape[:2]==(192,192)
              med=np.median(im.reshape(-1,3),axis=0).astype(np.uint8)
              canvas=np.empty((H,W,3),np.uint8); canvas[:]=med
              canvas[:216,:216]=cv2.resize(im,(216,216),interpolation=cv2.INTER_LINEAR)
              assert cv2.imwrite(str(dst),canvas)
              return {'authoritative_work_canvas':[192,192],'carrier_semantic_roi':[0,0,216,216]}
          p={}
          p['east_map_carrier']=map_carrier(fixtures['east'][0],(.500,.505),out/'east-cross-world-map.png')
          p['general_map_carrier']=map_carrier(fixtures['general'][0],(.557,.288),out/'general-shrine-world-map.png')
          p['east_hud_carrier']=hud_carrier(Path(next(Path('.audit-inputs/exact/content').rglob('east-cross-roi-192.png'))),out/'east-cross-gameplay-hud.png')
          p['general_hud_carrier']=hud_carrier(Path(next(Path('.audit-inputs/exact/content').rglob('general-shrine-roi-192.png'))),out/'general-shrine-gameplay-hud.png')
          p['exact_owner_sources']={
            'east_cross_map':{'dimensions':[2048,863],'bytes':2728396,'sha256':'1dffb5a484be50d753e40472dc8ef9f84d22633fa6ef2a976a81aee6f1536e9e','derived_map_roi_original_box':[408,139,1637,795],'derived_map_anchor_local':[614.712146422629,293.783693843594],'derived_fixture_dimensions':[320,171],'derived_fixture_sha256':'48c1335583d1bf55d0251d55295ffcee02929e0f8840dfa0e5559cdeb5ca5bd6'},
            'east_cross_hud':{'dimensions':[2048,863],'bytes':3879098,'sha256':'c20d317a745b897b2d9cfb6d622521b2327afd961b8adae4649eaed23de256ad','authoritative_roi_sha256':'0551d584aec4df0fff3b6ccd115ddead1281be84e98239621148d3382c6e442c'},
            'general_shrine_map':{'dimensions':[2048,863],'bytes':3027787,'sha256':'99841c9b467a63299cded38d3598e5ef136e349f0896cc21d31275b9e7c88de7','derived_map_roi_original_box':[526,77,1755,615],'derived_map_anchor_local':[615.3446327683616,176.3050847457627],'derived_fixture_dimensions':[320,140],'derived_fixture_sha256':'73e275661e94a843807c5cae3c526e4fe23e5d4b7800104364bd36cc1d05bbba'},
            'general_shrine_hud':{'dimensions':[2048,863],'bytes':3879049,'sha256':'dd73ea17c9a269535b74eb7fd83bd491df2bdbba56dcd2f7d9be074068120378','authoritative_roi_sha256':'f0acddeef0e5d1c6f433e2e9347a48631bf7cbe84057f2c3adb1c8a01cc32999'}
          }
          p['tracked_map_fixtures']={stem:{'path':str(path),'sha256':sha,'dimensions':list(dims)} for stem,(path,sha,dims) in fixtures.items()}
          p['reconstruction_note']='Exact world-map JPEG derivatives are normal tracked repository files and are verified by SHA-256, JPEG SOI/EOI, Pillow decode, OpenCV decode and dimensions before any audit execution. HUD transport reconstructs the authoritative 192x192 work canvases from run 31666927302/artifact 9168284675. No runtime Git blob API, recovery artifact, legacy carrier, or conversation attachment is used by the authoritative audit.'
          for f in sorted(out.glob('*.png')):
              b=f.read_bytes(); p.setdefault('carrier_files',{})[f.name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          (out/'exact-owner-provenance.json').write_text(json.dumps(p,indent=2),encoding='utf-8')
          print(json.dumps(p,indent=2))
          PY

      - name: Execute same-session world-map ↔ HUD differential audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-output
          mkdir -p .audit-output
          python scripts/replay/wwmsync_same_session_gfn_diff_audit.py \
            --repo . \
            --inputs .audit-inputs/replay-sources \
            --aux .audit-inputs/aux \
            --out .audit-output \
            --expected-start "$EXPECTED_START_HEAD"
          test -s .audit-output/final_report.md
          test -s .audit-output/audit.json

      - name: Bind exact owner provenance into authoritative report
        shell: bash
        run: |
          set -euo pipefail
          cp .audit-inputs/replay-sources/exact-owner-provenance.json .audit-output/exact-owner-provenance.json
          python - <<'PY'
          import json
          from pathlib import Path
          prov=json.loads(Path('.audit-output/exact-owner-provenance.json').read_text())
          ap=Path('.audit-output/audit.json'); audit=json.loads(ap.read_text())
          audit['exact_owner_provenance']=prov['exact_owner_sources']
          audit['input_reconstruction']={k:v for k,v in prov.items() if k!='exact_owner_sources'}
          ap.write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          rp=Path('.audit-output/final_report.md'); text=rp.read_text()
          needle='## 2–4. Commits and exact source provenance\n'
          exact=prov['exact_owner_sources']
          ins='## 2–4. Commits, exact owner-source provenance, and replay carriers\n'
          ins+='- **Exact original owner bytes remain authoritative provenance.** CI replay carriers below are transport derivatives only; they are not relabeled as original screenshots.\n'
          for k in ('east_cross_map','east_cross_hud','general_shrine_map','general_shrine_hud'):
              m=exact[k]; ins+=f"- **{k} ORIGINAL** — `{m['dimensions'][0]}×{m['dimensions'][1]}`, {m['bytes']} bytes, SHA-256 `{m['sha256']}`.\n"
          ins+='- World-map inputs: exact derivative JPEGs are normal tracked repository files; SHA-256, JPEG SOI/EOI, Pillow/OpenCV decode and dimensions are verified before audit execution. Replay carriers are built only after that verification.\n'
          ins+='- HUD carriers: reconstructed from the authoritative `192×192` work canvases in run `31666927302` / artifact `9168284675`; authoritative HUD matcher results are reused and are **not** rerun or redefined by these carriers.\n'
          ins+='- The authoritative audit has no runtime dependency on recovery artifacts, legacy carriers, raw Git blob SHAs, or conversation attachments. GT, the production gate, production code, and source provenance remain unchanged.\n'
          if needle not in text: raise SystemExit('report provenance heading not found')
          rp.write_text(text.replace(needle,ins,1),encoding='utf-8')
          PY
          cat .audit-output/final_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assert production remains untouched
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code -- . ':!scripts/replay/wwmsync_same_session_gfn_diff_audit.py' ':!.github/workflows/wwmsync-same-session-gfn-diff-audit.yml'
          if git diff "${EXPECTED_START_HEAD}..HEAD" -- production/wwsync | grep -q .; then
            echo "production/wwsync changed" >&2
            exit 1
          fi
          grep -Fq 'if(fine.scaleScore<.58)' vision-sync.js

      - name: Freeze evidence bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-stage
          mkdir -p .audit-stage
          find .audit-output -maxdepth 1 -type f -print0 | xargs -0 -I{} cp "{}" .audit-stage/
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -cf - -C .audit-stage . | gzip -n > .audit-evidence-bundle.tar.gz
          BUNDLE_SHA="$(sha256sum .audit-evidence-bundle.tar.gz | awk '{print $1}')"
          cp .audit-evidence-bundle.tar.gz .audit-stage/
          echo "sha256=${BUNDLE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Evidence bundle SHA-256: ${BUNDLE_SHA}"

      - name: Upload authoritative audit artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-same-session-gfn-differential-${{ github.run_id }}
          path: .audit-stage/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
          include-hidden-files: true

      - name: Append authoritative CI coordinates
        id: ci_meta
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          BUNDLE_SHA: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "Same-session GFN differential audit") | .id' | head -n1)"
          test -n "$JOB_ID"
          ARTIFACT_NAME="wwmsync-same-session-gfn-differential-${GITHUB_RUN_ID}"
          python scripts/replay/wwmsync_same_session_gfn_diff_audit.py --append-ci .audit-output/final_report.md --run-id "$GITHUB_RUN_ID" --job-id "$JOB_ID" --artifact-id "$ARTIFACT_ID" --artifact-name "$ARTIFACT_NAME" --artifact-digest "$ARTIFACT_DIGEST" --bundle-sha256 "$BUNDLE_SHA"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          cat .audit-output/final_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit replay audit report only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/wwm-native-sync-v2
          REMOTE="$(git rev-parse origin/feature/wwm-native-sync-v2)"
          test "$REMOTE" = "$GITHUB_SHA"
          mkdir -p "$(dirname "$REPORT_PATH")"
          cp .audit-output/final_report.md "$REPORT_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT_PATH"
          git diff --cached --check
          git diff --cached --name-only | grep -Fx "$REPORT_PATH"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "docs(wwmsync): record same-session GFN differential audit [skip ci]"
          git push origin HEAD:feature/wwm-native-sync-v2

      - name: Final acceptance marker
        shell: bash
        env:
          JOB_ID: ${{ steps.ci_meta.outputs.job_id }}
          ARTIFACT_ID: ${{ steps.ci_meta.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.ci_meta.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          echo "Authoritative run: ${GITHUB_RUN_ID}"
          echo "Authoritative job: ${JOB_ID}"
          echo "Authoritative artifact: ${ARTIFACT_ID}"
          echo "Artifact digest: ${ARTIFACT_DIGEST}"
          echo "Final branch HEAD: $(git rev-parse HEAD)"
          echo "Acceptance: CI ACCEPTED — replay/CI-only differential audit complete; production untouched."
