name: Replay Same-Session GFN Differential Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - scripts/replay/wwmsync_same_session_gfn_diff_audit.py
      - .github/workflows/wwmsync-same-session-gfn-diff-audit.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: wwmsync-same-session-gfn-diff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Same-session GFN differential audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_START_HEAD: f199258d4abdebe8f3ae75d99b56442ef76e1e38
      AUTHORITATIVE_RUN: "31666927302"
      AUTHORITATIVE_ARTIFACT: "9168284675"
      REPORT_PATH: docs/wwmsync/audits/same-session-gfn-worldmap-hud-differential-2026-08-13.md
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/wwm-native-sync-v2

      - name: Verify frozen starting HEAD and replay-only scope
        shell: bash
        run: |
          set -euo pipefail
          python scripts/replay/wwmsync_same_session_gfn_diff_audit.py --help >/dev/null
          FIRST="$(git rev-list --first-parent --reverse "${EXPECTED_START_HEAD}..HEAD" | head -n1)"
          test -n "$FIRST"
          test "$(git rev-parse "${FIRST}^")" = "$EXPECTED_START_HEAD"
          mapfile -t CHANGED < <(git diff --name-only "${EXPECTED_START_HEAD}..HEAD")
          printf '%s\n' "${CHANGED[@]}"
          for p in "${CHANGED[@]}"; do
            case "$p" in
              scripts/replay/wwmsync_same_session_gfn_diff_audit.py|.github/workflows/wwmsync-same-session-gfn-diff-audit.yml) ;;
              *) echo "Unexpected pre-audit path: $p" >&2; exit 1 ;;
            esac
          done
          if git diff "${EXPECTED_START_HEAD}..HEAD" -- ':!scripts/replay/wwmsync_same_session_gfn_diff_audit.py' ':!.github/workflows/wwmsync-same-session-gfn-diff-audit.yml' | grep -q .; then
            echo "Non replay/CI diff detected" >&2
            exit 1
          fi
          echo "Verified starting audit parent: ${EXPECTED_START_HEAD}"
          echo "Production structural gate remains 0.58; this job does not edit production."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install replay-only analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.1.3 \
            opencv-python-headless==4.10.0.84 \
            pillow==11.3.0 \
            scipy==1.15.3 \
            scikit-image==0.25.2

      - name: Recover immutable authoritative HUD-control artifact pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit-inputs/authoritative-run .audit-inputs/exact .audit-inputs/aux

          META="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTHORITATIVE_ARTIFACT}")"
          test "$(jq -r '.expired' <<<"$META")" = "false"
          test "$(jq -r '.workflow_run.id' <<<"$META")" = "$AUTHORITATIVE_RUN"
          URL="$(jq -r '.archive_download_url' <<<"$META")"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$URL" -o .audit-inputs/exact/artifact-${AUTHORITATIVE_ARTIFACT}.zip
          unzip -q .audit-inputs/exact/artifact-${AUTHORITATIVE_ARTIFACT}.zip -d .audit-inputs/exact/content

          gh run download "$AUTHORITATIVE_RUN" --repo "$GITHUB_REPOSITORY" -D .audit-inputs/authoritative-run
          gh run view "$AUTHORITATIVE_RUN" --repo "$GITHUB_REPOSITORY" --log > .audit-inputs/authoritative-run/authoritative-run.log

          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('.audit-inputs/exact')
          z=root/'artifact-9168284675.zip'
          print('authoritative artifact archive sha256',hashlib.sha256(z.read_bytes()).hexdigest())
          print('authoritative artifact files',sum(1 for p in (root/'content').rglob('*') if p.is_file()))
          PY

      - name: Recover auxiliary prior controls and exact 40-frame fixture when available
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id,.name,.size_in_bytes,.archive_download_url,.workflow_run.id] | @tsv' \
            > .audit-inputs/artifacts.tsv
          python - <<'PY'
          import pathlib,re
          src=pathlib.Path('.audit-inputs/artifacts.tsv').read_text().splitlines()
          tokens=re.compile(r'(wwm|gfn|owner|replay|control|fang|motion|absolute|localiz|audit|reference|dashen)',re.I)
          picked=[]
          for line in src:
              cols=line.split('\t')
              if len(cols)<5: continue
              aid,name,size,url,run=cols[:5]
              if aid=='9168284675': continue
              if int(size)>650_000_000: continue
              if tokens.search(name): picked.append(line)
              if len(picked)>=20: break
          pathlib.Path('.audit-inputs/selected-artifacts.tsv').write_text('\n'.join(picked)+('\n' if picked else ''))
          print('selected auxiliary artifacts',len(picked))
          PY
          while IFS=$'\t' read -r aid name size url run; do
            test -n "${aid:-}" || continue
            mkdir -p ".audit-inputs/aux/${aid}"
            if curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$url" -o ".audit-inputs/aux/${aid}/artifact.zip"; then
              unzip -q ".audit-inputs/aux/${aid}/artifact.zip" -d ".audit-inputs/aux/${aid}/content" || true
              printf '%s\t%s\t%s\n' "$aid" "$name" "$run" > ".audit-inputs/aux/${aid}/artifact-provenance.tsv"
            fi
          done < .audit-inputs/selected-artifacts.tsv

      - name: Execute same-session world-map ↔ HUD differential audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-output
          mkdir -p .audit-output
          python scripts/replay/wwmsync_same_session_gfn_diff_audit.py \
            --repo . \
            --inputs .audit-inputs \
            --aux .audit-inputs/aux \
            --out .audit-output \
            --expected-start "$EXPECTED_START_HEAD"
          test -s .audit-output/final_report.md
          test -s .audit-output/audit.json
          cat .audit-output/final_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assert production remains untouched
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code -- . ':!scripts/replay/wwmsync_same_session_gfn_diff_audit.py' ':!.github/workflows/wwmsync-same-session-gfn-diff-audit.yml'
          if git diff "${EXPECTED_START_HEAD}..HEAD" -- production/wwsync | grep -q .; then
            echo "production/wwsync changed" >&2
            exit 1
          fi

      - name: Freeze evidence bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-stage
          mkdir -p .audit-stage
          find .audit-output -maxdepth 1 -type f -print0 | xargs -0 -I{} cp "{}" .audit-stage/
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C .audit-stage . | gzip -n > .audit-evidence-bundle.tar.gz
          BUNDLE_SHA="$(sha256sum .audit-evidence-bundle.tar.gz | awk '{print $1}')"
          cp .audit-evidence-bundle.tar.gz .audit-stage/
          echo "sha256=${BUNDLE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Evidence bundle SHA-256: ${BUNDLE_SHA}"

      - name: Upload authoritative audit artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-same-session-gfn-differential-${{ github.run_id }}
          path: .audit-stage/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Append authoritative CI coordinates
        id: ci_meta
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          BUNDLE_SHA: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "Same-session GFN differential audit") | .id' | head -n1)"
          test -n "$JOB_ID"
          ARTIFACT_NAME="wwmsync-same-session-gfn-differential-${GITHUB_RUN_ID}"
          python scripts/replay/wwmsync_same_session_gfn_diff_audit.py \
            --append-ci .audit-output/final_report.md \
            --run-id "$GITHUB_RUN_ID" \
            --job-id "$JOB_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --bundle-sha256 "$BUNDLE_SHA"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          cat .audit-output/final_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit replay audit report only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/wwm-native-sync-v2
          REMOTE="$(git rev-parse origin/feature/wwm-native-sync-v2)"
          test "$REMOTE" = "$GITHUB_SHA"
          mkdir -p "$(dirname "$REPORT_PATH")"
          cp .audit-output/final_report.md "$REPORT_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT_PATH"
          git diff --cached --check
          git diff --cached --name-only | grep -Fx "$REPORT_PATH"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "docs(wwmsync): record same-session GFN differential audit [skip ci]"
          git push origin HEAD:feature/wwm-native-sync-v2

      - name: Final acceptance marker
        shell: bash
        env:
          JOB_ID: ${{ steps.ci_meta.outputs.job_id }}
          ARTIFACT_ID: ${{ steps.ci_meta.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.ci_meta.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          echo "Authoritative run: ${GITHUB_RUN_ID}"
          echo "Authoritative job: ${JOB_ID}"
          echo "Authoritative artifact: ${ARTIFACT_ID}"
          echo "Artifact digest: ${ARTIFACT_DIGEST}"
          echo "Final branch HEAD: $(git rev-parse HEAD)"
          echo "Acceptance: CI ACCEPTED — replay/CI-only differential audit complete; production untouched."
