name: Deploy City Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-city-flow.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hosted game
        uses: actions/checkout@v4
        with:
          ref: city-flow-host
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload City Flow
        uses: actions/upload-pages-artifact@v4
        with:
          path: city-flow-v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
