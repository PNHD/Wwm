name: WWMSync Domain-Invariant Structural Descriptor Audit

on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/wwmsync-domain-invariant-structural-descriptor-audit.yml'
      - 'tools/research/domain-invariant-descriptor/**'

permissions: {contents: read, actions: read}

env:
  GH_TOKEN: ${{ github.token }}
  DRIVER_SHA256: '576208a24909c49d9a2e9178185ee9ea3af98a09dae27b300a3c7784f0023350'

jobs:
  descriptor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: feature/wwm-native-sync-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Decode frozen harness for D0 input-plumbing diagnostic
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/research/domain-invariant-descriptor/driver.sh.gz.b64 | gzip -d > /tmp/descriptor-driver.sh
          test "$(sha256sum /tmp/descriptor-driver.sh|awk '{print $1}')" = "$DRIVER_SHA256"
          bash -n /tmp/descriptor-driver.sh
          base64 -d tools/research/domain-invariant-descriptor/run-local.mjs.gz.b64 | gzip -d > /tmp/descriptor-run-local.mjs
          base64 -d tools/research/domain-invariant-descriptor/instrument.mjs.gz.b64 | gzip -d > /tmp/descriptor-instrument.mjs
          printf 'DESCRIPTORS_EXECUTED=NO\nD0_DIAGNOSTIC_ONLY=YES\n' > /tmp/input-plumbing-status.txt
          sha256sum /tmp/descriptor-driver.sh /tmp/descriptor-run-local.mjs /tmp/descriptor-instrument.mjs
      - name: Upload frozen input-plumbing diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-domain-invariant-input-plumbing-${{ github.run_id }}
          path: |
            /tmp/descriptor-driver.sh
            /tmp/descriptor-run-local.mjs
            /tmp/descriptor-instrument.mjs
            /tmp/input-plumbing-status.txt
            docs/wwmsync/audits/domain-invariant-structural-descriptor-preregistration-2026-08-16.json
            docs/wwmsync/audits/owner-gfn-post-acquisition-evidence-2026-08-15.json
            docs/wwmsync/audits/owner-gfn-post-acquisition-identity-gt-freeze-2026-08-15.json
            fixtures/owner-gfn-center-hud/provenance.json
          if-no-files-found: error
          retention-days: 7
