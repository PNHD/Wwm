name: Forensic Official Map Protocol

on:
  push:
    branches:
      - forensic/wwm-sync-protocol
    paths:
      - .github/workflows/forensic-official-map.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deep probe official CN and Global map surfaces
        shell: bash
        run: |
          python - <<'PY'
          import json, re, ssl, urllib.request, urllib.error
          from pathlib import Path

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          ctx = ssl.create_default_context()

          ASSETS = {
            "global_pc": "https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js/pc-d3f0a0d4.js",
            "global_common": "https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js/common-a15f2132.js",
            "cn_yysls": "https://g.166.net/res/a19/p__g__yysls.8e3f9c6a.async.js",
            "cn_umi": "https://g.166.net/res/a19/umi.e9951072.js",
            "cn_vendor": "https://g.166.net/res/a19/chunk-vendors.9e331439.js",
            "cn_runtime": "https://g.166.net/res/a19/runtime~umi.683df681.js",
          }

          GLOBAL_GETS = [
            "https://www.wherewindsmeetgame.com/api/map/list",
            "https://www.wherewindsmeetgame.com/api/map/points",
            "https://www.wherewindsmeetgame.com/api/map/point",
          ]

          def fetch(url, max_bytes=12_000_000):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"}, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                      data = r.read(max_bytes + 1)
                      return {"status": getattr(r, "status", 200), "final_url": r.geturl(), "headers": dict(r.headers.items()), "body": data[:max_bytes], "truncated": len(data) > max_bytes}
              except urllib.error.HTTPError as e:
                  data = e.read(max_bytes + 1)
                  return {"status": e.code, "final_url": e.geturl(), "headers": dict(e.headers.items()), "body": data[:max_bytes], "truncated": len(data) > max_bytes}

          report = {"assets": {}, "contexts": {}, "global_gets": []}
          texts = {}
          for name, url in ASSETS.items():
              try:
                  r = fetch(url)
                  text = r["body"].decode("utf-8", "replace")
                  texts[name] = text
                  report["assets"][name] = {"url": url, "status": r["status"], "bytes": len(r["body"]), "truncated": r["truncated"], "content_type": r["headers"].get("Content-Type")}
              except Exception as e:
                  report["assets"][name] = {"url": url, "error": f"{type(e).__name__}: {e}"}

          needles = {
            "global_common": [
              "/api/map/list", "/api/map/points", "/api/map/point", "/api/map/point/finish", "/api/user/point/finish",
              "/api/auth/h72naLogin", "/api/auth/ursLogin", "/api/auth/ursRoles", "mapList", "mapPoints", "silentLogin",
              "Find my location", "Select character", "point_finished", "showPosition", "GAME_NAME", "JF_GAMEID", "CHANNEL_GAME_ID",
              "ntGameLoginSuccess", "NATIVE_EVENT_HANDLER", "baseURL", "axios.create"
            ],
            "global_pc": ["mapList", "mapPoints", "silentLogin", "finished", "Select character", "Find my location"],
            "cn_yysls": [
              "地图", "共创", "同步", "宝箱", "位置", "坐标", "PC", "pc", "download", "Download", ".exe", ".zip", ".msi",
              "yysls", "map", "plugin", "tool", "大神", "一键", "实时", "游戏", "启动", "overlay", "助手"
            ],
            "cn_umi": ["yysls", "地图", "download", "map", "plugin", "tool", "sync", "bridge", "native"],
          }

          def contexts(text, needle, radius=520, limit=8):
              out=[]; start=0
              while len(out) < limit:
                  i=text.find(needle, start)
                  if i < 0: break
                  lo=max(0, i-radius); hi=min(len(text), i+len(needle)+radius)
                  out.append(text[lo:hi].replace("\n", " "))
                  start=i+len(needle)
              return out

          for asset, ns in needles.items():
              text = texts.get(asset, "")
              report["contexts"][asset] = {}
              for n in ns:
                  c = contexts(text, n)
                  if c: report["contexts"][asset][n] = c

          # Extract absolute URLs and API-like paths from the CN game page bundle.
          cn = texts.get("cn_yysls", "")
          abs_urls = sorted(set(re.findall(r'https?://[^"\'<>\\\s]{4,260}', cn)))
          path_like = sorted(set(re.findall(r'/(?:api|activity|act|map|maps|game|tool|download|client|pc|yysls)[A-Za-z0-9_?&=./:%+\-]{1,240}', cn, re.I)))
          report["cn_urls"] = abs_urls[:500]
          report["cn_paths"] = path_like[:500]

          # Read-only GET probes only. Never call finish/login mutation endpoints.
          for url in GLOBAL_GETS:
              try:
                  r = fetch(url, 300_000)
                  body = r["body"].decode("utf-8", "replace")
                  report["global_gets"].append({"url": url, "status": r["status"], "content_type": r["headers"].get("Content-Type"), "allow_origin": r["headers"].get("Access-Control-Allow-Origin"), "body_prefix": body[:5000]})
              except Exception as e:
                  report["global_gets"].append({"url": url, "error": f"{type(e).__name__}: {e}"})

          Path("forensic-deep-summary.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")

          print("=== ASSET STATUS ===")
          for k,v in report["assets"].items(): print(k, json.dumps(v, ensure_ascii=False))
          print("=== GLOBAL READ-ONLY GETS ===")
          for v in report["global_gets"]: print(json.dumps(v, ensure_ascii=False))
          print("=== GLOBAL CONTEXTS ===")
          for asset in ("global_common", "global_pc"):
              for needle, arr in report["contexts"].get(asset, {}).items():
                  print(f"--- {asset} :: {needle} :: {len(arr)}")
                  for s in arr[:4]: print(s)
          print("=== CN YYSLS CONTEXTS ===")
          for needle, arr in report["contexts"].get("cn_yysls", {}).items():
              print(f"--- cn_yysls :: {needle} :: {len(arr)}")
              for s in arr[:5]: print(s)
          print("=== CN URLS ===")
          for u in report.get("cn_urls", []): print(u)
          print("=== CN PATHS ===")
          for p in report.get("cn_paths", []): print(p)
          PY

      - name: Upload deep forensic summary
        uses: actions/upload-artifact@v4
        with:
          name: official-map-forensic-deep-summary
          path: forensic-deep-summary.json
          if-no-files-found: error
          retention-days: 7
