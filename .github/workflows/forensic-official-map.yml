name: Forensic Official Map Protocol

on:
  push:
    branches:
      - forensic/wwm-sync-protocol
    paths:
      - .github/workflows/forensic-official-map.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe public Global backend and sync code
        shell: bash
        run: |
          python - <<'PY'
          import json, re, ssl, urllib.request, urllib.error, urllib.parse
          from pathlib import Path

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          BASE="https://s2.easebar.com/39f12eda6b86452b"
          JS="https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js/common-a15f2132.js"
          ctx=ssl.create_default_context()

          def get(url, headers=None, max_bytes=8_000_000):
              h={"User-Agent":UA,"Accept":"application/json,text/plain,*/*","Accept-Language":"en-US"}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h,method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
                      b=r.read(max_bytes+1)
                      return {"status":getattr(r,"status",200),"url":r.geturl(),"headers":dict(r.headers.items()),"body":b[:max_bytes]}
              except urllib.error.HTTPError as e:
                  b=e.read(max_bytes+1)
                  return {"status":e.code,"url":e.geturl(),"headers":dict(e.headers.items()),"body":b[:max_bytes]}

          def dec(r): return r["body"].decode("utf-8","replace")
          def probe(path, params=None):
              u=BASE+path
              if params: u += "?"+urllib.parse.urlencode(params)
              r=get(u,max_bytes=3_000_000)
              text=dec(r)
              try: data=json.loads(text)
              except Exception: data=None
              return {"request_url":u,"status":r["status"],"content_type":r["headers"].get("Content-Type"),"cors":r["headers"].get("Access-Control-Allow-Origin"),"set_cookie":r["headers"].get("Set-Cookie"),"json":data,"body_prefix":None if data is not None else text[:3000]}

          report={"public":[],"derived":{},"api_paths":[],"sync_contexts":{}}

          # Public read-only calls exactly as official map code uses them.
          ml=probe("/api/map/list")
          report["public"].append(ml)
          maps=[]
          if isinstance(ml.get("json"),dict):
              d=ml["json"].get("data")
              if isinstance(d,dict): maps=d.get("maps") or []
          report["derived"]["map_ids"]=[m.get("id") for m in maps if isinstance(m,dict)][:30]

          chosen=report["derived"]["map_ids"][0] if report["derived"]["map_ids"] else 1
          mp=probe("/api/map/points",{"mapId":chosen})
          report["public"].append(mp)

          # Derive one point id without mutating anything.
          point_id=None
          pdata=mp.get("json",{}).get("data") if isinstance(mp.get("json"),dict) else None
          cats=pdata.get("categories",[]) if isinstance(pdata,dict) else []
          for cat in cats:
              for child in (cat.get("childCategories",[]) if isinstance(cat,dict) else []):
                  pts=child.get("pointList",[]) if isinstance(child,dict) else []
                  if pts:
                      point_id=pts[0].get("id"); break
              if point_id is not None: break
          report["derived"]["point_id"]=point_id
          if point_id is not None:
              report["public"].append(probe("/api/map/point",{"pointId":point_id}))
          report["public"].append(probe("/api/user/info"))

          # Enumerate API routes from the official JS and preserve exact nearby code for sync/auth behavior.
          jr=get(JS,max_bytes=4_000_000); text=dec(jr)
          report["api_paths"]=sorted(set(re.findall(r'/api/[A-Za-z0-9_?&=./:%+\\-]{2,120}',text)))

          needles=[
              "async fetchRolesAndLogin", "async loginWithRole", "h72naSsoLogin", "updateToken(", "updateUserinfo(",
              "h72_map_accessToken", "/api/user/info", "/api/user/point/finish", "finished:", "point_finished",
              "roleList", "sauthParams", "SAUTH_JSON", "gameDataFailed", "Failed to Load Game Data", "sync", "Sync",
              "ntGameLoginSuccess", "ntUploadUserInfo", "USERINFO_ROLE", "GAME_NAME", "h72na"
          ]
          for n in needles:
              arr=[]; pos=0
              while len(arr)<12:
                  i=text.find(n,pos)
                  if i<0: break
                  arr.append(text[max(0,i-900):min(len(text),i+len(n)+1400)].replace("\n"," "))
                  pos=i+len(n)
              if arr: report["sync_contexts"][n]=arr

          Path("global-backend-sync.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("=== PUBLIC RESPONSES ===")
          for p in report["public"]:
              q=dict(p)
              if q.get("json") is not None:
                  raw=json.dumps(q["json"],ensure_ascii=False)
                  q["json_summary"]={"chars":len(raw),"prefix":raw[:12000]}; del q["json"]
              print(json.dumps(q,ensure_ascii=False))
          print("=== DERIVED ===")
          print(json.dumps(report["derived"],ensure_ascii=False))
          print("=== API PATHS ===")
          for p in report["api_paths"]: print(p)
          print("=== SYNC CONTEXTS ===")
          for n,arr in report["sync_contexts"].items():
              print("---",n,"::",len(arr))
              for s in arr[:6]: print(s)
          PY

      - name: Upload backend sync summary
        uses: actions/upload-artifact@v4
        with:
          name: global-backend-sync-summary
          path: global-backend-sync.json
          if-no-files-found: error
          retention-days: 7
