name: Forensic Official Map Protocol

on:
  push:
    branches:
      - forensic/wwm-sync-protocol
    paths:
      - .github/workflows/forensic-official-map.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trace Global PC bridge and personal link protocol
        shell: bash
        run: |
          python - <<'PY'
          import json, re, ssl, urllib.request, urllib.error
          from pathlib import Path

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          ctx=ssl.create_default_context()
          ASSETS={
            "common":"https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js/common-a15f2132.js",
            "pc":"https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js/pc-d3f0a0d4.js",
          }

          def get(url,max_bytes=10_000_000):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"},method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
                      return r.read(max_bytes).decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  return e.read(max_bytes).decode("utf-8","replace")

          texts={k:get(v) for k,v in ASSETS.items()}
          report={"assets":{k:{"url":ASSETS[k],"chars":len(v)} for k,v in texts.items()},"contexts":{},"urls":{},"protocol_strings":{}}

          needles=[
            "/api/personal/link","personal/link","personalLink","showBind","showServerSelect","officialAssistant","pcEntry",
            "quickLocate","Quick Locate","Find my location","Locate","location","geolocation","getCurrentPosition",
            "WebSocket","wss://","ws://","127.0.0.1","localhost","postMessage","addEventListener(\"message\"",
            "native","Native","bridge","Bridge","ipc","IPC","scheme","deeplink","deepLink","launch","launcher",
            "MShare","window.external","webkit.messageHandlers","cefQuery","chrome.webview","electron","openExternal",
            "tracking","trackPoint","showPosition","position","coordinate","coord","PC大地圖入口","官方助手","定位"
          ]

          for name,text in texts.items():
              report["contexts"][name]={}
              for needle in needles:
                  arr=[]; pos=0
                  while len(arr)<15:
                      i=text.find(needle,pos)
                      if i<0: break
                      arr.append(text[max(0,i-1000):min(len(text),i+len(needle)+1800)].replace("\n"," "))
                      pos=i+len(needle)
                  if arr: report["contexts"][name][needle]=arr

              urls=sorted(set(re.findall(r'https?://[^"\'<>\\\s]{4,300}',text)))
              report["urls"][name]=[u for u in urls if any(k in u.lower() for k in ("map","yysls","winds","easebar","163","netease","download","pc","assistant","link"))][:700]
              prot=sorted(set(re.findall(r'(?:[A-Za-z][A-Za-z0-9+.-]{1,30})://[^"\'<>\\\s]{1,260}',text)))
              report["protocol_strings"][name]=prot[:400]

          Path("global-pc-bridge.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("=== ASSETS ===")
          print(json.dumps(report["assets"],ensure_ascii=False))
          print("=== RELEVANT URLS ===")
          for name,vals in report["urls"].items():
              print("---",name)
              for v in vals: print(v)
          print("=== CUSTOM PROTOCOL STRINGS ===")
          for name,vals in report["protocol_strings"].items():
              print("---",name)
              for v in vals: print(v)
          print("=== CONTEXTS ===")
          for name,groups in report["contexts"].items():
              for needle,arr in groups.items():
                  print(f"--- {name} :: {needle} :: {len(arr)}")
                  for s in arr[:8]: print(s)
          PY

      - name: Upload PC bridge summary
        uses: actions/upload-artifact@v4
        with:
          name: global-pc-bridge-summary
          path: global-pc-bridge.json
          if-no-files-found: error
          retention-days: 7
