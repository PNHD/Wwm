name: Forensic Official Map Protocol

on:
  push:
    branches:
      - forensic/wwm-sync-protocol
    paths:
      - .github/workflows/forensic-official-map.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve official map renderer and account-link handlers
        shell: bash
        run: |
          python - <<'PY'
          import json, re, ssl, urllib.request, urllib.error
          from pathlib import Path

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          JS='https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js/common-a15f2132.js'
          ctx=ssl.create_default_context()

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'},method='GET')
              with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
                  return r.read(12_000_000).decode('utf-8','replace')

          text=fetch(JS)
          out={'contexts':{},'string_assets':[],'coord_candidates':[],'handler_candidates':[]}

          # Search around terms that are much closer to app code than library-only MapLibre symbols.
          needles=[
            '/api/map/list','/api/map/points','categoryId','markerType','data/icon/big/',
            'maxBounds:', 'raster-dem', 'type:"raster"', "type:'raster'", 'tiles:[', 'tileSize:',
            'fitBounds(', 'jumpTo(', 'flyTo(', 'setCenter(', 'LngLat(',
            '.lat)', '.lng)', '.lat,', '.lng,', 'parseInt(', 'Number(', '/1e6', '/1000000', '1e6', '1000000',
            'personalLink', '/personal.html#/link', 'officialAssistant', 'pcEntry',
            'window.open(', 'location.href=', 'location.assign(', 'copyPcSuccess', 'copy URL',
            'h72_map_accessToken', 'point_finished'
          ]
          for needle in needles:
              arr=[]; pos=0
              while len(arr)<20:
                  i=text.find(needle,pos)
                  if i<0: break
                  arr.append({'index':i,'context':text[max(0,i-2200):min(len(text),i+len(needle)+4200)].replace('\n',' ')})
                  pos=i+len(needle)
              if arr: out['contexts'][needle]=arr

          # Static/templated relative assets: map art often is not an absolute URL.
          string_pattern=re.compile(r'(["\'`])([^"\'`]{1,300}\.(?:png|jpg|jpeg|webp|avif|pbf)(?:\?[^"\'`]*)?)\1',re.I)
          assets=[]
          for _,s in string_pattern.findall(text):
              low=s.lower()
              if any(k in low for k in ('map','tile','background','bg','region','world','qing','kaifeng','hexi','palace','icon')):
                  assets.append(s)
          out['string_assets']=sorted(set(assets))[:1200]

          # Find direct property access patterns involving API point coordinate fields.
          coord_patterns=[
            r'.{0,500}\.(?:lat|lng).{0,900}',
            r'.{0,500}(?:lat|lng):.{0,900}',
          ]
          coord=[]
          for pat in coord_patterns:
              for m in re.finditer(pat,text,re.I|re.S):
                  s=m.group(0).replace('\n',' ')
                  if any(k in s for k in ('categoryId','marker','point','lng','lat')):
                      coord.append(s)
                      if len(coord)>=300: break
              if len(coord)>=300: break
          out['coord_candidates']=coord

          # Search for functional code around high-value labels/routes, not just localization definitions.
          for term in ('personalLink','officialAssistant','pcEntry','/personal.html#/link'):
              for m in re.finditer(re.escape(term),text):
                  s=text[max(0,m.start()-5000):min(len(text),m.end()+8000)].replace('\n',' ')
                  if any(k in s for k in ('onClick','click','window.open','href','router','push','personalLink','location')):
                      out['handler_candidates'].append({'term':term,'index':m.start(),'context':s})
          out['handler_candidates']=out['handler_candidates'][:100]

          Path('renderer-link-trace.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')

          print('=== HIGH VALUE CONTEXTS ===')
          order=['/api/map/list','/api/map/points','categoryId','markerType','data/icon/big/','type:"raster"','tiles:[','tileSize:','maxBounds:','fitBounds(','.lat)', '.lng)', '.lat,', '.lng,','/1e6','1000000','personalLink','/personal.html#/link','officialAssistant','pcEntry','window.open(','location.href=']
          for n in order:
              arr=out['contexts'].get(n,[])
              if not arr: continue
              print(f'--- {n} :: {len(arr)}')
              for h in arr[:10]:
                  print('INDEX',h['index'])
                  print(h['context'])
          print('=== RELATIVE MAP ASSETS ===')
          for s in out['string_assets']: print(s)
          print('=== COORD CANDIDATES ===')
          for s in out['coord_candidates'][:100]: print(s)
          print('=== HANDLER CANDIDATES ===')
          for h in out['handler_candidates'][:30]:
              print('---',h['term'],h['index'])
              print(h['context'])
          PY

      - name: Upload renderer/link trace
        uses: actions/upload-artifact@v4
        with:
          name: renderer-link-trace
          path: renderer-link-trace.json
          if-no-files-found: error
          retention-days: 7
