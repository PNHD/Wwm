name: WWMSync Phase-0 Canonical Fixture Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - .github/workflows/wwmsync-owner-center-hud-canonicalize.yml
      - fixtures/owner-gfn-center-hud/**
      - docs/wwmsync/audits/domain-invariant-structural-descriptor-preregistration-2026-08-16.json

permissions:
  contents: read

concurrency:
  group: wwmsync-phase0-${{ github.ref }}
  cancel-in-progress: false

env:
  RECOVERY_ROOT_HEAD: 2fe80538d7e04af9506baf513c996d5afc4367a9
  RECOVERY_START_HEAD: d2322ac8f56b420422319c7a2352f04b8b1e64ad
  DIR: fixtures/owner-gfn-center-hud
  PREREG: docs/wwmsync/audits/domain-invariant-structural-descriptor-preregistration-2026-08-16.json

jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0

      - name: Guard ancestry and production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RECOVERY_ROOT_HEAD" HEAD
          git merge-base --is-ancestor "$RECOVERY_START_HEAD" HEAD

          test "$(git rev-parse HEAD:vision-sync.js)" = 58b5a1babf6a12b944f9b745b8bf7f7df573bf9b
          test "$(git rev-parse HEAD:dashen-tile-cache.js)" = 9388960a8bff53a9cfc7471372af144b7a28c34f
          test "$(git rev-parse HEAD:tools/build_dashen_visual_cache.py)" = 1a227d06ae41660ea3e3b832e7f1921cc507c0d7
          test "$(git rev-parse HEAD:$DIR/provenance.json)" = 84123d70a0c7080e262be2902a30233f63782b26

          if git diff --name-only "$RECOVERY_START_HEAD"..HEAD -- \
            vision-sync.js dashen-tile-cache.js tools/build_dashen_visual_cache.py production/wwsync | grep -q .; then
            echo "Protected production path changed" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          src = Path("vision-sync.js").read_text(encoding="utf-8")
          required = [
              "COARSE_BEAM=8",
              "if(fine.scaleScore<.58)",
              "if(fine.intensityScore<.42)",
          ]
          missing = [s for s in required if s not in src]
          assert not missing, f"missing frozen production semantics: {missing}"
          print("PRODUCTION_BLOBS=PASS")
          print("STRUCTURAL_GATE=0.58")
          print("INTENSITY_GATE=0.42")
          print("COARSE_BEAM=8")
          PY

      - name: Verify bounded Phase-0 tree delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/wwmsync-owner-center-hud-canonicalize.yml",
              "docs/wwmsync/audits/domain-invariant-structural-descriptor-preregistration-2026-08-16.json",
              "fixtures/owner-gfn-center-hud/package.b64.00",
              "fixtures/owner-gfn-center-hud/package.b64.01",
              "fixtures/owner-gfn-center-hud/path-of-void.webp",
              "fixtures/owner-gfn-center-hud/buddha-fort.webp",
              "fixtures/owner-gfn-center-hud/general-shrine-repeat.webp",
              "fixtures/owner-gfn-center-hud/prosperity-haven.webp",
              "fixtures/owner-gfn-center-hud/ethereal-chamber.webp",
              "fixtures/owner-gfn-center-hud/dreamfall-cliff.webp",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{__import__('os').environ['RECOVERY_START_HEAD']}..HEAD"],
              text=True,
          ).splitlines())
          assert changed == allowed, f"unexpected Phase-0 delta: changed={sorted(changed)} allowed={sorted(allowed)}"
          print("BOUNDED_PHASE0_TREE_DELTA=PASS")
          PY

      - name: Verify canonical fixtures and pixel invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          d = Path("fixtures/owner-gfn-center-hud")
          expected_names = {
              "provenance.json",
              "path-of-void.webp",
              "buddha-fort.webp",
              "general-shrine-repeat.webp",
              "prosperity-haven.webp",
              "ethereal-chamber.webp",
              "dreamfall-cliff.webp",
          }
          actual_names = {p.name for p in d.iterdir() if p.is_file()}
          assert actual_names == expected_names, (sorted(actual_names), sorted(expected_names))
          assert not list(d.rglob("package.b64.*"))
          assert not list(d.rglob("package-tail.b64.*"))
          assert not (d / "transport-index.json").exists()
          assert not (d / "_tmp_should_not_create").exists()

          prov = json.loads((d / "provenance.json").read_text(encoding="utf-8"))
          assert prov["sourcePackage"]["zipSha256"] == "b4de207954132451ca720d0607a0af325e9606972c7b8882d1fe4a5fb041dcad"
          assert prov["sourcePackage"]["embeddedManifestSha256"] == "4b0d2ee684e68f9137ee336634d25473726659ba8529ee88fde2580d9c300bf0"
          assert prov["pixelTruth"]["dimensions"] == [270, 270]
          assert prov["pixelTruth"]["decodedMode"] == "RGB"
          assert prov["pixelTruth"]["decodedRgbBytes"] == 218700
          assert len(prov["fixtures"]) == 6

          expected_files = expected_names - {"provenance.json"}
          assert {r["file"] for r in prov["fixtures"]} == expected_files

          for r in prov["fixtures"]:
              f = d / r["file"]
              raw = f.read_bytes()
              webp_sha = hashlib.sha256(raw).hexdigest()
              git_blob_sha = hashlib.sha1(
                  f"blob {len(raw)}\0".encode("ascii") + raw
              ).hexdigest()
              assert webp_sha == r["webpSha256"], (r["file"], webp_sha)
              assert git_blob_sha == r["expectedCanonicalGitBlobSha1"], (r["file"], git_blob_sha)

              with Image.open(f) as im:
                  im.load()
                  assert im.size == (270, 270), (r["file"], im.size)
                  assert im.mode == "RGB", (r["file"], im.mode)
                  rgb = im.tobytes()
                  rgba = im.convert("RGBA").tobytes()

              assert len(rgb) == 218700, (r["file"], len(rgb))
              rgb_sha = hashlib.sha256(rgb).hexdigest()
              rgba_sha = hashlib.sha256(rgba).hexdigest()
              assert rgb_sha == r["rgb8Sha256"], (r["file"], rgb_sha)
              assert rgba_sha == r["taskPromptRgba255CompatibilitySha256"], (r["file"], rgba_sha)
              print(
                  "FIXTURE",
                  r["file"],
                  "WEBP", webp_sha,
                  "RGB8", rgb_sha,
                  "RGBA255", rgba_sha,
                  "GIT_BLOB", git_blob_sha,
              )

          print("CANONICAL_PIXEL_FIXTURES=PASS")
          print("CLEANUP=PASS")
          PY

      - name: Verify prereg arithmetic-only correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["PREREG"])
          old_text = subprocess.check_output(
              ["git", "show", f"{os.environ['RECOVERY_START_HEAD']}:{path.as_posix()}"],
              text=True,
          )
          new_text = path.read_text(encoding="utf-8")
          old = json.loads(old_text)
          new = json.loads(new_text)

          assert old["poseGrid"]["combinationsPerCandidate"] == 243
          assert "arithmeticCorrectionBeforeDescriptorOutcomes" not in old
          assert old_text.count("243-pose") == 3

          expected = copy.deepcopy(old)
          expected["poseGrid"]["combinationsPerCandidate"] = 81
          expected["phase3SymmetricPose"]["selection"] = expected["phase3SymmetricPose"]["selection"].replace("243-pose", "81-pose")
          expected["retrievalProxy"]["pose"] = expected["retrievalProxy"]["pose"].replace("243-pose", "81-pose")
          expected["stress40Frame"]["populationAndPose"] = expected["stress40Frame"]["populationAndPose"].replace("243-pose", "81-pose")
          expected["arithmeticCorrectionBeforeDescriptorOutcomes"] = {
              "from": 243,
              "to": 81,
              "reason": "3×3×3×3 = 81; no descriptor outcomes had run",
          }

          assert new == expected, "prereg changed beyond the frozen arithmetic-only correction"
          assert new_text.count("81-pose") == 3
          assert "243-pose" not in new_text

          for key in ("D1", "D2", "D3", "D4", "D5", "inputAndAlignment", "candidatePolicy", "survivorRule"):
              assert new[key] == old[key], key
          assert new["D5"]["enabled"] is False
          assert new["poseGrid"]["angleDeltaDeg"] == [-15, 0, 15]
          assert new["poseGrid"]["radiusFactor"] == [0.9, 1.0, 1.1]
          assert new["poseGrid"]["xOffsetPx"] == [-8, 0, 8]
          assert new["poseGrid"]["yOffsetPx"] == [-8, 0, 8]

          print("PREREG_COMBINATIONS_PER_CANDIDATE=81")
          print("PREREG_ARITHMETIC_ONLY_CORRECTION=PASS")
          print("DESCRIPTOR_DEFINITIONS_OTHERWISE_UNCHANGED=PASS")
          print("D1_D4_OUTCOMES=NOT_RUN")
          print("RD=PENDING")
          PY

      - name: Write machine-readable Phase-0 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase0
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from PIL import Image

          d = Path("fixtures/owner-gfn-center-hud")
          prov = json.loads((d / "provenance.json").read_text(encoding="utf-8"))
          rows = []
          for r in sorted(prov["fixtures"], key=lambda x: x["file"]):
              f = d / r["file"]
              raw = f.read_bytes()
              with Image.open(f) as im:
                  im.load()
                  rgb = im.tobytes()
                  rgba = im.convert("RGBA").tobytes()
              rows.append({
                  "file": r["file"],
                  "webpSha256": hashlib.sha256(raw).hexdigest(),
                  "rgb8Sha256": hashlib.sha256(rgb).hexdigest(),
                  "rgba255Sha256": hashlib.sha256(rgba).hexdigest(),
                  "gitBlobSha1": hashlib.sha1(f"blob {len(raw)}\0".encode("ascii") + raw).hexdigest(),
                  "dimensions": [270, 270],
                  "mode": "RGB",
                  "rgbByteLength": len(rgb),
              })

          evidence = {
              "phase": "PHASE-0 CANONICAL FIXTURE RECOVERY",
              "recoveryRootHead": os.environ["RECOVERY_ROOT_HEAD"],
              "recoveryStartingHead": os.environ["RECOVERY_START_HEAD"],
              "testedHead": os.environ["GITHUB_SHA"],
              "sourceZipSha256": "b4de207954132451ca720d0607a0af325e9606972c7b8882d1fe4a5fb041dcad",
              "embeddedManifestSha256": "4b0d2ee684e68f9137ee336634d25473726659ba8529ee88fde2580d9c300bf0",
              "sourceZipRole": "one-time agent recovery provenance only; not consumed by CI",
              "fixtures": rows,
              "cleanup": {
                  "packageB64Absent": True,
                  "transportIndexAbsent": True,
                  "temporaryCarriersAbsent": True,
              },
              "prereg": {
                  "combinationsPerCandidate": 81,
                  "arithmeticCorrectionBeforeDescriptorOutcomes": {
                      "from": 243,
                      "to": 81,
                      "reason": "3×3×3×3 = 81; no descriptor outcomes had run",
                  },
                  "descriptorDefinitionsOtherwiseUnchanged": True,
              },
              "production": {
                  "visionSyncBlobSha1": "58b5a1babf6a12b944f9b745b8bf7f7df573bf9b",
                  "dashenTileCacheBlobSha1": "9388960a8bff53a9cfc7471372af144b7a28c34f",
                  "dashenVisualCacheBuilderBlobSha1": "1a227d06ae41660ea3e3b832e7f1921cc507c0d7",
                  "structuralGate": 0.58,
                  "intensityGate": 0.42,
                  "coarseBeam": 8,
                  "productionChange": False,
              },
              "ci": {
                  "readOnly": True,
                  "runtimeFixtureTransportDependency": False,
              },
              "research": {
                  "D1-D4": "NOT_RUN",
                  "descriptorAudit": "STILL_PENDING_OUTCOMES",
                  "RD": "PENDING",
              },
          }
          Path("/tmp/phase0/evidence.json").write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Phase-0 evidence artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-owner-center-hud-phase0-${{ github.run_id }}
          path: /tmp/phase0
          if-no-files-found: error

      - name: Phase-0 acceptance marker
        shell: bash
        run: |
          set -euo pipefail
          echo "PHASE_0_ACCEPTANCE_MARKER=SUCCESS"
          echo "PHASE_0_CANONICAL_FIXTURE_RECOVERY=COMPLETE"
          echo "CANONICAL_PIXEL_FIXTURES=PASS"
          echo "PREREG_POSE_GRID=81"
          echo "D1_D4_OUTCOMES=NOT_RUN"
          echo "DESCRIPTOR_AUDIT=STILL_PENDING_OUTCOMES"
          echo "RD=PENDING"
          echo "RECOVERY_START_HEAD=$RECOVERY_START_HEAD"
          echo "TESTED_HEAD=$GITHUB_SHA"
          echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
          echo "ARTIFACT_DIGEST=${{ steps.upload.outputs.artifact-digest }}"
          echo "PRODUCTION_CHANGE=NO"
