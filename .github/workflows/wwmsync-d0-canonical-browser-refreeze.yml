name: WWMSync D0 Canonical Browser Re-freeze

on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/wwmsync-d0-canonical-browser-refreeze.yml'
      - 'tools/research/domain-invariant-descriptor/d0-baseline-*.mjs'
      - 'docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-candidate-geometry-lineage-2026-08-16.json'
      - 'docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-lineage-amendment-2026-08-16.json'

permissions: {contents: read, actions: read}

env:
  GH_TOKEN: ${{ github.token }}
  VISION_BLOB: '58b5a1babf6a12b944f9b745b8bf7f7df573bf9b'
  CACHE_BLOB: '9388960a8bff53a9cfc7471372af144b7a28c34f'
  CACHE_BUILDER_BLOB: '1a227d06ae41660ea3e3b832e7f1921cc507c0d7'
  PREREG_BLOB: '29540d6e9b4458cf4681a71351fdd2b0cdd5f423'
  GEOMETRY_LINEAGE_BLOB: '96d78bf0ab0573032798524b99cd63ecf5e6500c'
  SS0_RUN: '31889065856'
  SS0_JOB: '95022507549'
  SS0_ARTIFACT: '9248045962'
  SS0_DIGEST: '0c5cc8a788274b33892b8bfdced58b552f99f6716e54acec5c45487a5bf2e1a2'
  FANG_RUN: '31609680755'
  FANG_ARTIFACT: '9146646914'
  FANG_DIGEST: 'b305444dff3ac2db6a544020093bd64022ffef5406c246849499d6a96525c041'
  OWNER_RUN: '31872599823'
  OWNER_JOB: '94983436586'
  OWNER_ARTIFACT: '9243841549'
  OWNER_DIGEST: 'e7786742e2e355c0d16d42d94b383db2f2a489e818a61dd955420f1aa0072b7a'
  SOURCE_RUN: '31872161105'
  SOURCE_ARTIFACT: '9243725171'
  SOURCE_DIGEST: 'a8a8c7f347562502d5c2271dc86f99c47e3c671302a271ba569e80b6efa9fae8'
  PLAYWRIGHT_VERSION: '1.55.0'
  CHROME_VERSION: 'Google Chrome 151.0.7922.108'
  IMAGE_VERSION: '20260810.271.1'

jobs:
  canonical-d0:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: feature/wwm-native-sync-v2}

      - name: Guard immutable scope and D0-only closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:vision-sync.js)" = "$VISION_BLOB"
          test "$(git rev-parse HEAD:dashen-tile-cache.js)" = "$CACHE_BLOB"
          test "$(git rev-parse HEAD:tools/build_dashen_visual_cache.py)" = "$CACHE_BUILDER_BLOB"
          test "$(git rev-parse HEAD:docs/wwmsync/audits/domain-invariant-structural-descriptor-preregistration-2026-08-16.json)" = "$PREREG_BLOB"
          test "$(git rev-parse HEAD:docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-candidate-geometry-lineage-2026-08-16.json)" = "$GEOMETRY_LINEAGE_BLOB"
          grep -Fq 'if(fine.scaleScore<.58)' vision-sync.js
          grep -Fq 'if(fine.intensityScore<.42)' vision-sync.js
          grep -Fq 'COARSE_BEAM=8;' vision-sync.js
          ! grep -Eq '__diDescriptors|__diEvaluate|scoreCenter|D1|D2|D3|D4' tools/research/domain-invariant-descriptor/d0-baseline-instrument.mjs
          ! grep -Eq '__diDescriptors|__diEvaluate|scoreCenter|D1|D2|D3|D4' tools/research/domain-invariant-descriptor/d0-baseline-runner.mjs
          python - <<'PY'
          import json
          p=json.load(open('docs/wwmsync/audits/domain-invariant-structural-descriptor-preregistration-2026-08-16.json'))
          g=json.load(open('docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-candidate-geometry-lineage-2026-08-16.json'))
          assert p['frozenBeforeDescriptorOutcomes'] and not p['D5']['enabled'] and p['poseGrid']['combinationsPerCandidate']==81
          assert g['frozenBeforeCanonicalBrowserD0Outcomes'] and not g['descriptorOutcomesInspected'] and not g['D1D4Opened'] and g['RD']=='PENDING'
          PY
          mkdir -p d0-input/ss0 d0-input/fang d0-input/owner d0-site/controls d0-output lineage-search
          printf 'D0_ONLY=YES\nDESCRIPTOR_OUTCOMES_EXECUTED=NO\nRD=PENDING\n' > d0-output/status.txt

      - name: Reverify historical emulator is not preserved
        shell: bash
        run: |
          set -euo pipefail
          git rev-list --objects --all > lineage-search/all-reachable-objects.txt
          git log --all --full-history --name-status --pretty='format:COMMIT %H %cI %s' > lineage-search/all-history-name-status.txt
          grep -Ei 'owner|post-acquisition|replay|tracer|canvas|emulat' lineage-search/all-reachable-objects.txt > lineage-search/relevant-object-paths.txt || true
          python - <<'PY'
          import pathlib,subprocess,re,json
          hits=[]
          for line in pathlib.Path('lineage-search/relevant-object-paths.txt').read_text(errors='ignore').splitlines():
            a=line.split(' ',1); oid=a[0]; path=a[1] if len(a)>1 else ''
            try: b=subprocess.check_output(['git','cat-file','-p',oid],stderr=subprocess.DEVNULL,timeout=3)
            except Exception: continue
            if len(b)>2_000_000 or b'\0' in b[:4096]: continue
            t=b.decode('utf-8','ignore')
            pats=[p for p in [r'raw Canvas emulation',r'Canvas emulat',r'emulat.{0,40}Canvas',r'createCanvas',r'CanvasRenderingContext2D'] if re.search(p,t,re.I|re.S)]
            if pats:hits.append({'object':oid,'path':path,'hits':pats})
          pathlib.Path('lineage-search/text-hit-inventory.json').write_text(json.dumps(hits,indent=2)+'\n')
          PY
          for spec in "$SOURCE_ARTIFACT:$SOURCE_RUN:$SOURCE_DIGEST:source" "$OWNER_ARTIFACT:$OWNER_RUN:$OWNER_DIGEST:acceptance"; do
            IFS=: read -r aid rid dig label <<<"$spec"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid" > "lineage-search/$label-meta.json"
            test "$(jq -r '.workflow_run.id' lineage-search/$label-meta.json)" = "$rid"
            test "$(jq -r '.digest' lineage-search/$label-meta.json)" = "sha256:$dig"
            gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > "lineage-search/$label.zip"
            unzip -l "lineage-search/$label.zip" > "lineage-search/$label-archive-list.txt"
          done
          cat > lineage-search/emulator-adjudication.json <<'JSON'
          {"outcome":"EMULATOR_NOT_PRESERVED","implementationRecovered":false,"legacyOwnerD0Classification":"HISTORICAL_NON_REPRODUCIBLE_RUNTIME_BASELINE","descriptorOutcomesInspected":false,"RD":"PENDING"}
          JSON

      - name: Fetch frozen evidence inputs
        shell: bash
        run: |
          set -euo pipefail
          for spec in "$SS0_ARTIFACT:$SS0_RUN:$SS0_DIGEST:ss0" "$FANG_ARTIFACT:$FANG_RUN:$FANG_DIGEST:fang"; do
            IFS=: read -r aid rid dig label <<<"$spec"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid" > "d0-input/$label-meta.json"
            test "$(jq -r '.workflow_run.id' d0-input/$label-meta.json)" = "$rid"
            test "$(jq -r '.digest' d0-input/$label-meta.json)" = "sha256:$dig"
            gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > "d0-input/$label.zip"
            unzip -q "d0-input/$label.zip" -d "d0-input/$label"
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SS0_RUN/jobs" --jq ".jobs[]|select(.id==$SS0_JOB)|.conclusion")" = success
          test -s d0-input/ss0/candidate-table.json; test -s d0-input/ss0/evidence.json
          cp lineage-search/acceptance.zip d0-input/owner.zip; unzip -q d0-input/owner.zip -d d0-input/owner
          find d0-input/owner -name 'owner-gfn-post-acquisition-evidence-2026-08-15.json' -print -quit > d0-input/owner-evidence-path.txt
          test -s d0-input/owner-evidence-path.txt

      - name: Hydrate preserved winner poses only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('d0-input/ss0/candidate-table.json'); rows=json.loads(p.read_text()); by={r['candidateId']:r for r in rows}
          g=json.load(open('docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-candidate-geometry-lineage-2026-08-16.json'))
          for cid,v in g['historicalFinalistPoseOverrides'].items():
            r=by[cid]; assert r['x']==v['x'] and r['y']==v['y'] and abs(r['gtDistance']-v['gtDistance'])<1e-9
            r['angle']=v['angle']; r['radius']=v['radius']; r['scale']=v['scale']
          p.write_text(json.dumps(rows,indent=2)+'\n')
          PY

      - name: Freeze browser runtime before scoring
        shell: bash
        run: |
          set -euo pipefail
          test "${ImageOS:-}" = ubuntu24
          test "${ImageVersion:-}" = "$IMAGE_VERSION"
          npm install --no-save --no-package-lock "playwright-core@$PLAYWRIGHT_VERSION" >/dev/null 2>&1
          test "$(node -p "require('playwright-core/package.json').version")" = "$PLAYWRIGHT_VERSION"
          CHROME_BIN="$(command -v google-chrome)"; export CHROME_BIN
          test "$("$CHROME_BIN" --version | sed 's/[[:space:]]*$//')" = "$CHROME_VERSION"
          printf '%s\n' "$CHROME_BIN" > d0-output/chrome-bin.txt
          printf '%s\n' "$CHROME_VERSION" > d0-output/chrome-version.txt
          printf '%s\n' "$PLAYWRIGHT_VERSION" > d0-output/playwright-version.txt
          printf '%s\n' "$ImageOS" > d0-output/image-os.txt
          printf '%s\n' "$ImageVersion" > d0-output/image-version.txt

      - name: Prepare exact controls
        shell: bash
        run: |
          set -euo pipefail
          cat fixtures/owner-gfn-controls/base64/east-cross-top-left-216.webp.b64.* | base64 -d > d0-site/controls/east-cross.webp
          cat fixtures/owner-gfn-controls/base64/general-shrine-top-left-216.webp.b64.* | base64 -d > d0-site/controls/general-shrine.webp
          test "$(sha256sum d0-site/controls/east-cross.webp|awk '{print $1}')" = 144ff5c7ad8f9c788f69cec049d58bad79d8390abdca7d28bde62fdc8c609792
          test "$(sha256sum d0-site/controls/general-shrine.webp|awk '{print $1}')" = 261f910e416028b272f58abcf31f0bf3ac09e19d65490daf7acf6004e89b0d55
          cp d0-input/fang/steam-general-shrine-1-roi.png d0-site/controls/fang-xu.png
          cp fixtures/owner-gfn-center-hud/{path-of-void,buddha-fort,general-shrine-repeat,prosperity-haven,dreamfall-cliff}.webp d0-site/controls/
          python - <<'PY'
          import json
          fang=json.load(open('d0-input/fang/steam-general-shrine-ground-truth.json'))
          C=[
          ['east-cross','East Cross',1,'controls/east-cross.webp',215.75,[5219.931321637427,4648.817136173768],'OWNER_UNIQUE','Qinghe',True],
          ['general-shrine','General Shrine historical',1,'controls/general-shrine.webp',215.75,[6015.017126148705,3889.360588972433],'OWNER_UNIQUE','Qinghe',True],
          ['path-of-void','Path of Void',1,'controls/path-of-void.webp',None,[5662.35270309106,3599.42210726817],'OWNER_UNIQUE','Qinghe',False],
          ['buddha-fort','Buddha Fort',1,'controls/buddha-fort.webp',None,[6150.319157894736,3719.750105931495],'OWNER_UNIQUE','Qinghe',False],
          ['prosperity-haven','Prosperity Haven',2,'controls/prosperity-haven.webp',None,[4959.193804824561,4487.057644110276],'OWNER_UNIQUE','Kaifeng',False],
          ['dreamfall-cliff','Dreamfall Cliff',2,'controls/dreamfall-cliff.webp',None,[5054.117319966583,5032.292689055973],'OWNER_UNIQUE','Kaifeng',False],
          ['fang-xu','Steam Fang Xu Global-PC HUD',1,'controls/fang-xu.png',None,fang['expected']['dashenZ5'],'INDEPENDENT_VALIDATION','Qinghe',True],
          ['general-shrine-repeat','General Shrine repeat',1,'controls/general-shrine-repeat.webp',None,[6015.017126148705,3889.360588972433],'SAME_LOCATION_DRIFT_CONTROL','Qinghe',False]]
          keys=['id','name','mapId','image','sourceCropSize','expected','role','region','historical']
          json.dump({'controls':[dict(zip(keys,x)) for x in C]},open('d0-input/controls.json','w'),indent=2)
          PY

      - name: Execute canonical browser D0 only
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(cat d0-output/chrome-bin.txt)"
          cp index.html styles.css vision-sync.css app.js vision-sync.js dashen-tile-cache.js official-sync.js sw.js manifest.webmanifest _redirects _headers robots.txt d0-site/
          python tools/build_dashen_reference_audit_cache.py d0-site/dashen-cache --workers 24
          find d0-site/dashen-cache -type f -print0 | sort -z | xargs -0 sha256sum > d0-output/reference-cache-sha256.txt
          node tools/instrument-real-gfn-production-replay.mjs d0-site/vision-sync.js
          node tools/research/domain-invariant-descriptor/d0-baseline-instrument.mjs d0-site/vision-sync.js
          node tools/research/domain-invariant-descriptor/d0-baseline-runner.mjs --site d0-site --controls d0-input/controls.json --ss0-table d0-input/ss0/candidate-table.json --ss0-evidence d0-input/ss0/evidence.json --output d0-output | tee d0-output/runner.log
          jq -e '.descriptorOutcomesExecuted==false and .rd=="PENDING" and (.controls|length)==8' d0-output/canonical-d0.json >/dev/null

      - name: Verify exact owner work canvases and finalize runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          OWNER_EVIDENCE="$(cat d0-input/owner-evidence-path.txt)"; export OWNER_EVIDENCE
          python - <<'PY'
          import json,os,pathlib,hashlib,subprocess
          c=json.load(open('d0-output/canonical-d0.json')); e=json.load(open(os.environ['OWNER_EVIDENCE']))
          for cid in ['path-of-void','buddha-fort','general-shrine-repeat','prosperity-haven','dreamfall-cliff']:
            h=c['controls'][cid]['input']['hashes']; old=e['controls'][cid]['roiSha']; assert h['pngSha256']==old[1] and h['rgb8Sha256']==old[2]
          runtime={'runner':'ubuntu-24.04','imageOS':'ubuntu24','imageVersion':'20260810.271.1','browserEngine':'Google Chrome/Chromium','browserVersion':'Google Chrome 151.0.7922.108','playwrightCoreVersion':'1.55.0','canvasApi':'HTMLCanvasElement 2D','alpha':False,'destination':[192,192],'productionJsBlob':'58b5a1babf6a12b944f9b745b8bf7f7df573bf9b','referenceCacheBuilderBlob':subprocess.check_output(['git','rev-parse','HEAD:tools/build_dashen_reference_audit_cache.py'],text=True).strip(),'referenceCacheTreeSha256':hashlib.sha256(pathlib.Path('d0-output/reference-cache-sha256.txt').read_bytes()).hexdigest(),'descriptorOutcomesExecuted':False,'RD':'PENDING'}
          c['canonicalRuntimeFreeze']=runtime; pathlib.Path('d0-output/canonical-d0.json').write_text(json.dumps(c,indent=2)+'\n'); pathlib.Path('d0-output/runtime-freeze.json').write_text(json.dumps(runtime,indent=2)+'\n')
          PY
          git diff --exit-code -- vision-sync.js dashen-tile-cache.js tools/build_dashen_visual_cache.py production/wwsync

      - name: Upload D0 adjudication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-d0-canonical-browser-refreeze-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            d0-output/
            lineage-search/emulator-adjudication.json
            lineage-search/text-hit-inventory.json
            lineage-search/source-archive-list.txt
            lineage-search/acceptance-archive-list.txt
            d0-input/controls.json
            docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-candidate-geometry-lineage-2026-08-16.json
          if-no-files-found: warn
          retention-days: 30
