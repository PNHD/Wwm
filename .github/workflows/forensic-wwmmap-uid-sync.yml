name: Forensic WWMMAP UID Sync

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-wwmmap-uid-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace live map resources without submitting sync
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/trace.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const resources=[]; const js=[];
            page.on('request',r=>resources.push(`${r.method()} ${r.resourceType()} ${r.url()}`));
            page.on('response',async r=>{
              const u=r.url();
              if(/\.js(?:\?|$)|_next\/static\/chunks/i.test(u)){
                try{const body=await r.text(); if(body.length>200 && !/^\s*<!doctype html/i.test(body)) js.push({u,body});}catch{}
              }
            });
            page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            let resp=await page.goto('https://wwmmap.pages.dev/map',{waitUntil:'domcontentloaded',timeout:60000}).catch(e=>null);
            console.log('NAV',resp?.status(),page.url());
            await page.waitForTimeout(10000);
            console.log('TITLE',await page.title());
            console.log('BODY',JSON.stringify((await page.locator('body').innerText().catch(()=>'' )).slice(0,10000)));
            const buttons=await page.locator('button').evaluateAll(bs=>bs.map((b,i)=>({i,text:(b.innerText||'').trim(),id:b.id,cls:b.className})).filter(x=>x.text||x.id));
            const inputs=await page.locator('input').evaluateAll(xs=>xs.map((x,i)=>({i,type:x.type,id:x.id,name:x.name,placeholder:x.placeholder,autocomplete:x.autocomplete}))); 
            console.log('BUTTONS',JSON.stringify(buttons));
            console.log('INPUTS',JSON.stringify(inputs));
            console.log('RESOURCES_BEGIN'); for(const x of [...new Set(resources)])console.log(x); console.log('RESOURCES_END');
            for(let i=0;i<js.length;i++)fs.writeFileSync(`/tmp/live-${i}.js`,js[i].body);
            console.log('JS_CAPTURED',js.length); js.forEach((x,i)=>console.log('JS_URL',i,x.u,'BYTES',x.body.length));
            await browser.close();
          })().catch(e=>{console.error('FATAL',e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/trace.cjs
          echo '=== CAPTURED JS SYNC CONTEXT ==='
          python - <<'PY'
          from pathlib import Path
          import re
          terms=['sync.wwm-map.com','receiver_msg_privilege','friend_only_restriction','sync_success','start_game_sync','gameauth','hawk sync','websocket url','account id','verify','verification','uid','confirmation timed out','only accept messages from friends']
          for p in sorted(Path('/tmp').glob('live-*.js')):
              t=p.read_text('utf-8',errors='ignore'); low=t.lower(); hits=[x for x in terms if x in low]
              if not hits: continue
              print('\nFILE',p.name,'BYTES',len(t.encode()),'HITS',hits)
              centers=[]
              for term in hits:
                  pos=0
                  while True:
                      i=low.find(term,pos)
                      if i<0: break
                      if not any(abs(i-c)<2500 for c in centers):
                          centers.append(i); print('\n---',term,'@',i,'---'); print(t[max(0,i-3500):min(len(t),i+8500)].replace('\n',' ')[:12500])
                      pos=i+len(term)
              urls=sorted(set(re.findall(r'(?:https?|wss?)://[^"\'`<>\\\s)]+',t)))
              for u in urls:
                  if any(k in u.lower() for k in ['wwm','sync','game','api','relay']):print('URL',u[:1000])
          PY
