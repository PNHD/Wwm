name: Forensic WWMMAP UID Sync

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-wwmmap-uid-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract public sync API and websocket contract
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location 'https://wwmmap.pages.dev/' -o /tmp/root.html
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urljoin
          t=Path('/tmp/root.html').read_text('utf-8',errors='ignore')
          assets=[]
          for u in re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I):
              assets.append(urljoin('https://wwmmap.pages.dev/',u))
          Path('/tmp/assets.txt').write_text('\n'.join(dict.fromkeys(assets)))
          print('ASSET_COUNT',len(dict.fromkeys(assets)))
          PY
          mkdir -p /tmp/js
          i=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            out="/tmp/js/$(printf '%03d' "$i").js"
            curl --silent --show-error --location "$url" -o "$out" || true
            echo "JS $(basename "$out") $(wc -c < "$out" 2>/dev/null || echo 0) $url"
            i=$((i+1))
          done < /tmp/assets.txt

          python - <<'PY'
          from pathlib import Path
          import re
          needles=[
            'sync.wwm-map.com','9521','receiver_msg_privilege','friend_only_restriction','sync_success',
            'start_game_sync','stop_game_sync','game_sync','gameauth','verify','verification','link character',
            'accountId','account_id','uid','roleId','role_id','characterId','character_id',
            'WebSocket','new WebSocket','messageType','message_type','eventType','event_type',
            'position','coordinates','marker','finished','completion','progress','permission','confirm'
          ]
          api_re=re.compile(r'(?:(?:https?|wss?)://[^"\'`<>\\\s)]+|/[A-Za-z0-9_.~!$&()*+,;=:@%/-]*(?:api|sync|auth|verify|account|game|character|relay|ws)[A-Za-z0-9_.~!$&()*+,;=:@%/?-]*)',re.I)
          for p in sorted(Path('/tmp/js').glob('*.js')):
              text=p.read_text('utf-8',errors='ignore')
              low=text.lower()
              hits=[n for n in needles if n.lower() in low]
              if not hits: continue
              print(f'\n===== FILE {p.name} BYTES {len(text.encode())} HITS {hits} =====')
              printed=[]
              for n in hits:
                  pos=0; count=0
                  while count<8:
                      at=low.find(n.lower(),pos)
                      if at<0: break
                      key=(max(0,at-1800)//500)
                      if key not in printed:
                          printed.append(key)
                          lo=max(0,at-1800); hi=min(len(text),at+4200)
                          print(f'\n--- CONTEXT {n} @{at} ---')
                          print(text[lo:hi].replace('\n',' ')[:6500])
                      pos=at+len(n); count+=1
              print('\n--- URL_AND_ROUTE_LITERALS ---')
              vals=[]
              for m in api_re.finditer(text):
                  v=m.group(0)
                  if 2 < len(v) < 1200: vals.append(v)
              for v in sorted(set(vals)):
                  print(v)
          PY
