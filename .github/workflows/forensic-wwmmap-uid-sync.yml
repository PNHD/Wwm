name: Forensic WWMMAP UID Sync

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-wwmmap-uid-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Print current map-only implementation contexts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path('app.js').read_text('utf-8')
          terms=['MAP_ASSET_ROOT','function initMap','L.tileLayer','function renderPoints','function renderCategories','function updateProgressUI','async function bootstrap','async function boot','loadActiveMapPoints','function flattenPoints','function pointToLayer']
          for term in terms:
              start=0
              while True:
                  i=t.find(term,start)
                  if i<0: break
                  lo=max(0,i-1800); hi=min(len(t),i+9000)
                  print('\n===',term,'@',i,'===')
                  print(t[lo:hi])
                  start=i+len(term)
                  if term not in ['MAP_ASSET_ROOT','L.tileLayer']: break
          PY
