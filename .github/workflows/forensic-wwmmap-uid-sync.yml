name: Forensic WWMMAP UID Sync

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-wwmmap-uid-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract public sync API and websocket contract
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location 'https://wwmmap.pages.dev/' -o /tmp/root.html
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urljoin
          t=Path('/tmp/root.html').read_text('utf-8',errors='ignore')
          raw=[]
          raw += re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I)
          raw += re.findall(r'<link[^>]+href=["\']([^"\']+)',t,re.I)
          raw += re.findall(r'(/_next/static/[^"\'<>\\\s]+?\.js(?:\?[^"\'<>\\\s]*)?)',t,re.I)
          assets=[]
          for u in raw:
              u=u.replace('\\u0026','&').replace('&amp;','&')
              full=urljoin('https://wwmmap.pages.dev/',u)
              if '_next/static/' in full and '.js' in full: assets.append(full)
          assets=list(dict.fromkeys(assets))
          Path('/tmp/assets.txt').write_text('\n'.join(assets))
          print('NEXT_JS_ASSET_COUNT',len(assets))
          for u in assets: print('ASSET',u)
          PY
          mkdir -p /tmp/js
          i=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            out="/tmp/js/$(printf '%03d' "$i").js"
            status="$(curl --silent --show-error --location --output "$out" --write-out '%{http_code}' "$url" || true)"
            echo "JS $(basename "$out") HTTP $status BYTES $(wc -c < "$out" 2>/dev/null || echo 0) $url"
            i=$((i+1))
          done < /tmp/assets.txt

          python - <<'PY'
          from pathlib import Path
          import re
          needles=[
            'sync.wwm-map.com','9521','receiver_msg_privilege','friend_only_restriction','sync_success',
            'start_game_sync','stop_game_sync','game_sync','gameauth','verify','verification','link character',
            'Account ID','WebSocket URL','Relay Servers','This Machine','Hawk Sync',
            'accountId','account_id','uid','roleId','role_id','characterId','character_id',
            'new WebSocket','onmessage','send(JSON.stringify','messageType','message_type','eventType','event_type',
            'position','coordinates','marker','finished','completion','progress','permission','confirmation timed out'
          ]
          route_re=re.compile(r'(?:(?:https?|wss?)://[^"\'`<>\\\s)]+|/[A-Za-z0-9_.~!$&()*+,;=:@%/-]*(?:api|sync|auth|verify|account|game|character|relay|ws)[A-Za-z0-9_.~!$&()*+,;=:@%/?-]*)',re.I)
          for p in sorted(Path('/tmp/js').glob('*.js')):
              text=p.read_text('utf-8',errors='ignore')
              low=text.lower()
              hits=[n for n in needles if n.lower() in low]
              app_hits=[n for n in hits if n not in ['uid','position','progress','permission','messageType']]
              if not app_hits: continue
              print(f'\n===== FILE {p.name} BYTES {len(text.encode())} HITS {hits} =====')
              intervals=[]
              for n in app_hits:
                  pos=0; count=0
                  while count<12:
                      at=low.find(n.lower(),pos)
                      if at<0: break
                      lo=max(0,at-2600); hi=min(len(text),at+6500)
                      if not any(abs(at-a)<1500 for a in intervals):
                          intervals.append(at)
                          print(f'\n--- CONTEXT {n} @{at} ---')
                          print(text[lo:hi].replace('\n',' ')[:9500])
                      pos=at+len(n); count+=1
              print('\n--- URL_AND_ROUTE_LITERALS ---')
              vals=[]
              for m in route_re.finditer(text):
                  v=m.group(0)
                  if 2 < len(v) < 1200: vals.append(v)
              for v in sorted(set(vals)):
                  print(v)
          PY
