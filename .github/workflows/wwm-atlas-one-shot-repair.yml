name: WWM Atlas one-shot repair

on:
  push:
    branches:
      - repair/wwm-atlas-production-qa-20260808

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/wwm-atlas-production-qa-20260808
          fetch-depth: 0

      - name: Apply repair
        run: python .github/wwm-atlas-repair.py

      - name: Validate candidate
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          node --check bootstrap.mjs
          grep -F "maplibre-gl@6.2.0/dist/maplibre-gl.mjs" app.js
          ! grep -F "maplibre-gl@6.2.0/dist/maplibre-gl.js" app.js index.html bootstrap.mjs
          ! grep -RInF 'wwmmap.pages.dev' index.html app.js bootstrap.mjs sw.js data assets
          grep -Fx '/map /index.html 200' _redirects
          grep -F "Content-Security-Policy:" _headers
          grep -F "const CACHE = 'wwm-atlas-shell-v3'" sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          regions = json.loads(Path('data/regions.json').read_text())
          categories = json.loads(Path('data/categories.json').read_text())
          sources = json.loads(Path('data/sources.json').read_text())
          assert isinstance(regions.get('regions'), list) and regions['regions']
          assert isinstance(categories.get('categories'), list) and categories['categories']
          assert isinstance(sources, list) and sources
          PY
          rm -rf dist
          mkdir -p dist
          cp index.html styles.css app.js bootstrap.mjs sw.js manifest.webmanifest _redirects _headers robots.txt dist/
          cp -R assets data dist/
          ! find dist -type f -path '*/.github/*' | grep -q .
          rm -rf dist

      - name: Commit runtime repair
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/validate-wwm-map.yml .github/workflows/deploy-cloudflare-pages.yml
          git config user.name "WWM Atlas Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js sw.js _headers README.md docs/DATA_CONTRACT.md
          git diff --cached --check
          git commit -m "Fix WWM Atlas runtime and production QA"
          git push origin HEAD:repair/wwm-atlas-production-qa-20260808
