name: WWMSync Candidate Recall Forensic Authoritative

on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/wwmsync-candidate-recall-forensic-authoritative.yml'

permissions:
  contents: write
  actions: read

env:
  START_HEAD: '3251202f001755c7bda957a0b329b9f862c0cfcf'
  VISION_BLOB: '58b5a1babf6a12b944f9b745b8bf7f7df573bf9b'
  CACHE_BLOB: '9388960a8bff53a9cfc7471372af144b7a28c34f'
  CACHE_BUILDER_BLOB: '1a227d06ae41660ea3e3b832e7f1921cc507c0d7'
  STRESS_SHA: 'aa14ce0e703d0af5c4c86946f2932b465f8a7fd529001cd1900b3b99b501a216'
  REPORT_PATH: 'docs/wwmsync/audits/candidate-recall-surfacing-forensic-2026-08-14.md'
  STAGE_SPEC: '31768033881,94667864485,9207047835,sha256:460caa92a0af8c457d65e3fafed40ba01009d5895a09359c1fd81c215dd960da,2e28bfeecf9a830df2850f8706182222e3113754'
  FINE_SPEC: '31768239431,94668491244,9207148249,sha256:ce858250c81ee3adf6efa9704a9cd22f87e7ffa2dde0c5c2ae9d9b9f9ee1ac39,2c17d8101e64cb1701dd7423bec114fcb8df9981'
  ORACLE_SPEC: '31768741916,94670010602,9207338781,sha256:51576651e60f3d8d00564a34b33e4d3283f864acc233ef43ce02afe1e4ac78d9,71ce6030da8713698bfe49b6a70695ef44aaf0e2'
  LANDSCAPE_SPEC: '31768871389,94670389528,9207360521,sha256:a5a4a131080174875862ee663989400b3ca741a0316e1677bf0c3a7e5a964181,5e468101db8f28ef4511d64bbc022422a89b7923'
  CORR_SPEC: '31768986105,94670727831,9207485537,sha256:bbf9d3cd6df7c845eef1a70e35104ef03e1208e9aefd13d5003fe7e5377735ff,13cf66d9d79215ad293a33d56633f1fa8785164e'
  SENS_SPEC: '31769121780,94671141315,9207561481,sha256:efea908f914b80ce940691858379c1da996125f38119b09e9d0b6d512ab4bd95,d4c2bac0a8167b8368e3b3899c4763bd27b94050'
  GH_TOKEN: ${{ github.token }}

jobs:
  authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: feature/wwm-native-sync-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Verify frozen production and lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$START_HEAD" "$GITHUB_SHA"
          test "$(git rev-parse HEAD:vision-sync.js)" = "$VISION_BLOB"
          test "$(git rev-parse HEAD:dashen-tile-cache.js)" = "$CACHE_BLOB"
          test "$(git rev-parse HEAD:tools/build_dashen_visual_cache.py)" = "$CACHE_BUILDER_BLOB"
          grep -Fq "const CONTRACT='ANCHOR_FREE_STRUCTURAL_V11'" vision-sync.js
          grep -Fq "if(fine.scaleScore<.58)" vision-sync.js
          grep -Fq "if(fine.intensityScore<.42)" vision-sync.js
          grep -Fq "fine.beamMargin<.010" vision-sync.js
          git diff --exit-code "$START_HEAD..$GITHUB_SHA" -- vision-sync.js dashen-tile-cache.js tools/build_dashen_visual_cache.py production/wwsync
          python -m py_compile tools/summarize-candidate-recall-forensic.py

      - name: Verify and recover immutable component evidence
        run: |
          set -euo pipefail
          rm -rf final-input final-output; mkdir -p final-input final-output
          python - <<'PY'
          import json,os,subprocess,zipfile,pathlib
          specs={k:os.environ[k+'_SPEC'] for k in ['STAGE','FINE','ORACLE','LANDSCAPE','CORR','SENS']}
          provenance={}
          for key,spec in specs.items():
              run,job,artifact,digest,head=spec.split(','); lower=key.lower(); job=int(job); artifact=int(artifact)
              jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run}/jobs'],text=True))['jobs']
              hit=[j for j in jobs if j['id']==job]; assert len(hit)==1 and hit[0]['conclusion']=='success',(key,hit)
              meta=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{artifact}'],text=True))
              assert str(meta['workflow_run']['id'])==run and meta['workflow_run']['head_sha']==head
              assert meta['digest']==digest and meta['expired'] is False
              z=pathlib.Path('final-input')/(lower+'.zip')
              with z.open('wb') as f: subprocess.run(['gh','api','-H','Accept: application/vnd.github+json',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{artifact}/zip'],stdout=f,check=True)
              dest=pathlib.Path('final-input')/lower; dest.mkdir(); zipfile.ZipFile(z).extractall(dest)
              provenance[lower]={'run':int(run),'job':job,'artifact':artifact,'digest':digest,'head':head}
          json.dump(provenance,open('final-input/component-provenance.json','w'),indent=2)
          PY
          test -s final-input/stage/stage-output/summary.json
          test -s final-input/stage/stage-output/east-cross.json
          test -s final-input/fine/fine-output/summary.json
          test -s final-input/oracle/oracle-output/summary.json
          test -s final-input/landscape/landscape-output/summary.json
          test -s final-input/corr/correlation-output/full-correlation.json
          test -s final-input/sens/variant-output/variants.json

      - name: Revalidate required causal findings
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          L=lambda p:json.load(open(p,encoding='utf8'))
          st={x['id']:x for x in L('final-input/stage/stage-output/summary.json')['controls']}
          assert 'TOP-36' in st['east-cross']['firstLossStage']
          assert 'NMS' in st['general-shrine']['firstLossStage']
          assert st['fang-xu']['firstLossStage']=='NONE'
          fi={x['id']:x for x in L('final-input/fine/fine-output/summary.json')['controls']}
          assert 'refine' in fi['fang-xu']['firstLossStage'].lower()
          assert all(not x['oracleAnyGlobalExpectedAccept'] for x in L('final-input/oracle/oracle-output/summary.json')['controls'])
          la={x['id']:x['landscape']['expectedCoordinateBestPose'] for x in L('final-input/landscape/landscape-output/summary.json')['controls']}
          assert la['east-cross']['scaleAwareStructure'] < .58
          assert la['general-shrine']['scaleAwareStructure'] >= .58 and la['general-shrine']['intensity'] < .42
          assert la['fang-xu']['scaleAwareStructure'] >= .58 and la['fang-xu']['intensity'] >= .42
          co={x['id']:x['correlation'] for x in L('final-input/corr/correlation-output/full-correlation.json')['controls']}
          assert all(x['sampleCount']>=30 for x in co.values())
          se=L('final-input/sens/variant-output/variants.json')['reports']
          for n in (2,4):
              rows=[r for r in se if r['variant']['perSeedHypotheses']==n]
              assert len(rows)==3 and all(not r['expectedBasinRecalled'] for r in rows)
              assert all(r['candidateCountMultiplier']==n for r in rows)
          print('authoritative causal gates PASS')
          PY

      - name: Build final JSON and 20-section report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          raw=subprocess.check_output(['git','log','--reverse','--format=%H%x09%s',os.environ['START_HEAD']+'..'+os.environ['GITHUB_SHA']],text=True)
          json.dump([{'sha':x.split('\t',1)[0],'subject':x.split('\t',1)[1]} for x in raw.splitlines()],open('final-input/commits.json','w'),indent=2)
          PY
          GEN_AT_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" python tools/summarize-candidate-recall-forensic.py \
            --stage final-input/stage/stage-output/summary.json --fine final-input/fine/fine-output/summary.json \
            --oracle final-input/oracle/oracle-output/summary.json --landscape final-input/landscape/landscape-output/summary.json \
            --correlation final-input/corr/correlation-output/full-correlation.json --sensitivity final-input/sens/variant-output/variants.json \
            --provenance final-input/component-provenance.json --commits final-input/commits.json \
            --output-json final-output/evidence.json --output-report "$REPORT_PATH" \
            --start-head "$START_HEAD" --evidence-head "$GITHUB_SHA" --stress-sha "$STRESS_SHA"
          python - <<'PY'
          import json,os
          p='final-output/evidence.json'; d=json.load(open(p,encoding='utf8'))
          d['actualProductionSearchGraph']=json.load(open('final-input/stage/stage-output/east-cross.json',encoding='utf8'))['searchGraph']
          d['authoritativeAggregation']={'run':int(os.environ['GITHUB_RUN_ID']),'job':None,'sourceHead':os.environ['GITHUB_SHA']}
          assert d['verdict'].startswith('CR0') and d['stress']['executed'] is False
          assert d['independentFangGeneralization']['pairSurvivingVariants']==[]
          assert d['productionGuards']['structuralGate']==.58 and d['actualProductionSearchGraph']['coarseBeam']==8
          json.dump(d,open(p,'w',encoding='utf8'),ensure_ascii=False,indent=2)
          PY
          test -s final-output/evidence.json; test -s "$REPORT_PATH"

      - name: Resolve job ID and upload authoritative evidence
        id: uploadprep
        run: |
          set -euo pipefail
          export JOB_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name=="authoritative") | .id' | head -n1)"
          test -n "$JOB_ID"; echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os
          p='final-output/evidence.json'; d=json.load(open(p,encoding='utf8')); d['authoritativeAggregation']['job']=int(os.environ['JOB_ID']); json.dump(d,open(p,'w',encoding='utf8'),ensure_ascii=False,indent=2)
          PY

      - name: Upload structured evidence artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-candidate-recall-forensic-authoritative-${{ github.run_id }}
          path: |
            final-output/evidence.json
            final-input/component-provenance.json
            final-input/commits.json
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact digest and commit report only
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['REPORT_PATH']); s=p.read_text(encoding='utf8')
          for a,b in {'@@RUN_ID@@':os.environ['GITHUB_RUN_ID'],'@@JOB_ID@@':os.environ['JOB_ID'],'@@ARTIFACT_ID@@':os.environ['ARTIFACT_ID'],'@@ARTIFACT_DIGEST@@':os.environ['ARTIFACT_DIGEST']}.items(): s=s.replace(a,b)
          assert '@@' not in s; p.write_text(s,encoding='utf8')
          PY
          git fetch origin feature/wwm-native-sync-v2
          test "$(git rev-parse origin/feature/wwm-native-sync-v2)" = "$GITHUB_SHA"
          git diff --exit-code "$START_HEAD..$GITHUB_SHA" -- vision-sync.js dashen-tile-cache.js tools/build_dashen_visual_cache.py production/wwsync
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT_PATH"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$REPORT_PATH"
          git commit -m 'docs(wwmsync): record candidate recall forensic audit [skip ci]'
          git push origin HEAD:feature/wwm-native-sync-v2
