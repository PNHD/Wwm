name: Patch Scale-Bucket Typo
on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: [.github/workflows/patch-scale-bucket-typo.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
      - name: Fix runtime typo
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('vision-sync.js'); s=p.read_text(); assert 'const seebs=[];' in s; p.write_text(s.replace('const seebs=[];','const seeds=[];',1))"
          node --check vision-sync.js
          grep -Fq 'const seeds=[];' vision-sync.js
          ! grep -Fq 'const seebs=[];' vision-sync.js
          git config user.name 'WWMSync CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vision-sync.js
          git commit -m 'fix: repair scale-bucket seed runtime typo'
          git push origin HEAD:feature/wwm-native-sync-v2
