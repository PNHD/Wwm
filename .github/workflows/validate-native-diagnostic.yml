name: Validate WWMSync Native Diagnostic

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - wwmsync-diagnostic.ps1
      - wwmsync-diagnostic-v5.ps1
      - wwmsync-diagnostic-v6.ps1
      - wwmsync-diagnostic-v7.ps1
      - wwmsync-diagnostic-v8.ps1
      - wwmsync-diagnostic-v9.ps1
      - wwmsync-diagnostic-v10.ps1
      - .github/workflows/validate-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run db_mp static schema diagnostic in safe CI environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'LocalDB'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $db = Join-Path $dir 'db_mp'
          $out = Join-Path $env:RUNNER_TEMP 'wwmsync-diagnostic-v10.json'
          $payload = [Text.Encoding]::UTF8.GetBytes('CUSTOMDB prefix mapId=1 pointId=42 finished=true playerPosition x=123 y=0 z=456 sceneId=9 suffix')
          [IO.File]::WriteAllBytes($db, $payload)
          [IO.File]::WriteAllText((Join-Path $dir 'db_user'),'sibling')
          .\wwmsync-diagnostic-v10.ps1 -DbPath $db -OutputPath $out
          if (-not (Test-Path $out)) { throw 'Diagnostic did not produce JSON.' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          if ($j.schema -ne 'wwmsync-native-diagnostic-v10') { throw "Unexpected schema: $($j.schema)" }
          if ($j.status -ne 'complete') { throw "Unexpected status: $($j.status)" }
          if ($j.safety.memoryRead -ne $false) { throw 'memoryRead boundary failed' }
          if ($j.safety.injection -ne $false) { throw 'injection boundary failed' }
          if ($j.safety.packetCapture -ne $false) { throw 'packetCapture boundary failed' }
          if ($j.safety.activeNetworkProbe -ne $false) { throw 'activeNetworkProbe boundary failed' }
          if ($j.safety.pipeConnect -ne $false) { throw 'pipeConnect boundary failed' }
          if ($j.safety.pipeWrite -ne $false) { throw 'pipeWrite boundary failed' }
          if ($j.safety.gameFileWrite -ne $false) { throw 'gameFileWrite boundary failed' }
          if ($j.safety.databaseWrite -ne $false) { throw 'databaseWrite boundary failed' }
          if ($j.safety.fileContentRead -ne $true) { throw 'fileContentRead contract failed' }
          if ($j.safety.fileContentExport -ne $false) { throw 'fileContentExport boundary failed' }
          if ($j.summary.siblingFiles -lt 2) { throw 'Expected sibling metadata missing' }
          if ($j.summary.keywordHits -lt 4) { throw 'Expected semantic keyword hits missing' }
          Write-Host "VALID diagnostic schema=$($j.schema) siblings=$($j.summary.siblingFiles) hits=$($j.summary.keywordHits)"
