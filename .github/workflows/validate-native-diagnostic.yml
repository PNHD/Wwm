name: Validate WWMSync Native Diagnostic

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - wwmsync-diagnostic.ps1
      - wwmsync-diagnostic-v5.ps1
      - wwmsync-diagnostic-v6.ps1
      - wwmsync-diagnostic-v7.ps1
      - wwmsync-diagnostic-v8.ps1
      - wwmsync-diagnostic-v9.ps1
      - wwmsync-diagnostic-v10.ps1
      - wwmsync-diagnostic-v11.ps1
      - wwmsync-diagnostic-v12.ps1
      - wwmsync-diagnostic-v13.ps1
      - wwmsync-diagnostic-v14.ps1
      - wwmsync-diagnostic-v15.ps1
      - wwmsync-diagnostic-v16.ps1
      - wwmsync-diagnostic-v17.ps1
      - .github/workflows/validate-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run active LuaText index scan in safe CI environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'wwm_lite'
          $patch = Join-Path $root 'LocalData\Patch'
          New-Item -ItemType Directory -Force -Path $patch | Out-Null

          $mk = Join-Path $env:RUNNER_TEMP 'make-v17-fixture.py'
          @'
          import os,struct,sys
          p=sys.argv[1]
          def entry(payload):
              # Active record: first 4 bytes are an arbitrary logical length,
              # then the observed 3-byte prefix + LuaT marker.
              return struct.pack('<I',len(payload)+100)+b'\xF6\x03\x1B'+b'LuaT'+payload
          blobs=[
              entry(b'Sunshine/RpcDebug/remote_sync.lua\x00 start_game_sync connectionKey relayServerId waiting_for_approval'),
              entry(b'Sunshine/Map/map_state.lua\x00 stable data'),
              entry(b'Sunshine/Network/client_notify.lua\x00 client_notify websocket position')
          ]
          # Put physical entries in one order, but index records deliberately
          # point to them out of order to validate index-directed reads.
          offsets=[];off=0
          with open(os.path.join(p,'LT1.mpk'),'wb') as f:
              for b in blobs:
                  offsets.append(off);f.write(b);off+=len(b)
              # stale/unindexed entry that must not count
              f.write(entry(b'stale start_game_sync SHOULD_NOT_BE_ACTIVE'))
          info=struct.pack('<II',3,3)
          order=[2,0,1]
          for i,k in enumerate(order):
              info+=struct.pack('<IIIII',1000+i,2000+i,offsets[k],len(blobs[k]),2)
          info+=b'F'*16
          open(os.path.join(p,'LT1.mpkinfo'),'wb').write(info)
          '@ | Set-Content -LiteralPath $mk -Encoding UTF8
          python $mk $patch

          $out = Join-Path $env:RUNNER_TEMP 'wwmsync-diagnostic-v17.json'
          .\wwmsync-diagnostic-v17.ps1 -GameRoot $root -OutputPath $out

          if (-not (Test-Path $out)) { throw 'Diagnostic did not produce JSON.' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          if ($j.schema -ne 'wwmsync-native-diagnostic-v17') { throw "Unexpected schema: $($j.schema)" }
          if ($j.status -ne 'complete') { throw "Unexpected status: $($j.status)" }
          if ($j.safety.staticFileRead -ne $true -or $j.safety.indexedEntryRead -ne $true) { throw 'Read contract failed' }
          if ($j.safety.extractionWrite -ne $false -or $j.safety.memoryRead -ne $false -or $j.safety.injection -ne $false -or $j.safety.packetCapture -ne $false) { throw 'Safety boundary failed' }
          if ($j.safety.activeNetworkProbe -ne $false -or $j.safety.pipeConnect -ne $false -or $j.safety.gameFileWrite -ne $false) { throw 'Safety boundary failed' }
          if ($j.summary.ltPairCount -ne 1) { throw "Expected one LT pair, got $($j.summary.ltPairCount)" }
          if ($j.summary.activeEntries -ne 3 -or $j.summary.inBoundsEntries -ne 3) { throw 'Active index count mismatch' }
          if ($j.summary.luaTAtPlus7Entries -ne 3) { throw "Expected LuaT+7=3, got $($j.summary.luaTAtPlus7Entries)" }
          if ($j.summary.primaryHitCount -lt 4) { throw "Expected primary protocol hits, got $($j.summary.primaryHitCount)" }
          $needles=@($j.summary.hitNeedles) -join "`n"
          if ($needles -notmatch 'start_game_sync' -or $needles -notmatch 'connectionKey' -or $needles -notmatch 'relayServerId') { throw 'Primary protocol literals missing' }
          if (@($j.result.hits | Where-Object { $_.context -match 'SHOULD_NOT_BE_ACTIVE' }).Count -ne 0) { throw 'Unindexed stale entry was scanned' }
          Write-Host "VALID v17 active=$($j.summary.activeEntries) LuaT+7=$($j.summary.luaTAtPlus7Entries) hits=$($j.summary.hitCount) primary=$($j.summary.primaryHitCount)"
