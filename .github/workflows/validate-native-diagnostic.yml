name: Validate WWMSync Native Diagnostic

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - wwmsync-diagnostic.ps1
      - wwmsync-diagnostic-v5.ps1
      - wwmsync-diagnostic-v6.ps1
      - wwmsync-diagnostic-v7.ps1
      - wwmsync-diagnostic-v8.ps1
      - wwmsync-diagnostic-v9.ps1
      - wwmsync-diagnostic-v10.ps1
      - wwmsync-diagnostic-v11.ps1
      - wwmsync-diagnostic-v12.ps1
      - wwmsync-diagnostic-v13.ps1
      - wwmsync-diagnostic-v14.ps1
      - wwmsync-diagnostic-v15.ps1
      - wwmsync-diagnostic-v16.ps1
      - .github/workflows/validate-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run LuaText archive/index diagnostic in safe CI environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'wwm_lite'
          $patch = Join-Path $root 'LocalData\Patch'
          New-Item -ItemType Directory -Force -Path $patch,(Join-Path $patch 'Other'),(Join-Path $patch 'LuaText\patch') | Out-Null

          $mk = Join-Path $env:RUNNER_TEMP 'make-v16-fixture.py'
          @'
          import os,sqlite3,struct,sys
          p=sys.argv[1]
          def entry(payload):
              # v16 boundary fixture: u32 length, 3 flag bytes, then LuaT marker.
              body=b'\xF6\x03\x1B'+b'LuaT'+payload
              return struct.pack('<I',len(body))+body
          mpk=os.path.join(p,'LT1.mpk')
          blobs=[entry(b'alpha'),entry(b'beta'),entry(b'gamma')]
          open(mpk,'wb').write(b''.join(blobs))
          # version=3, count=3, three 20-byte records + 16-byte footer.
          info=struct.pack('<II',3,3)
          off=0
          for i,b in enumerate(blobs):
              info+=struct.pack('<IIIII',100+i,len(b),off,1,0); off+=len(b)
          info+=b'F'*16
          open(os.path.join(p,'LT1.mpkinfo'),'wb').write(info)
          open(os.path.join(p,'Other','lua_zstd.dict'),'wb').write(b'EZST-fixture')
          open(os.path.join(p,'LuaText','patch','patch_patcher.lua'),'wb').write(entry(b'patch'))
          open(os.path.join(p,'Other','lua_config.json'),'w',encoding='utf8').write('{"fixture":true}')
          db=os.path.join(p,'Patch.mpkdb')
          c=sqlite3.connect(db)
          c.execute('create table assets(id integer primary key, path text, mpk text, offset integer, size integer)')
          c.execute('insert into assets(path,mpk,offset,size) values (?,?,?,?)',('LuaText/client/remote_sync.lua','LT1.mpk',0,len(blobs[0])))
          c.commit();c.close()
          '@ | Set-Content -LiteralPath $mk -Encoding UTF8
          python $mk $patch

          $out = Join-Path $env:RUNNER_TEMP 'wwmsync-diagnostic-v16.json'
          .\wwmsync-diagnostic-v16.ps1 -GameRoot $root -OutputPath $out

          if (-not (Test-Path $out)) { throw 'Diagnostic did not produce JSON.' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          if ($j.schema -ne 'wwmsync-native-diagnostic-v16') { throw "Unexpected schema: $($j.schema)" }
          if ($j.status -ne 'complete') { throw "Unexpected status: $($j.status)" }
          if ($j.safety.staticFileRead -ne $true) { throw 'staticFileRead contract failed' }
          if ($j.safety.sqliteReadOnly -ne $true -or $j.safety.sqliteQueryOnly -ne $true) { throw 'SQLite safety contract failed' }
          if ($j.safety.memoryRead -ne $false -or $j.safety.injection -ne $false -or $j.safety.packetCapture -ne $false) { throw 'Unsafe boundary failed' }
          if ($j.safety.gameFileWrite -ne $false -or $j.safety.databaseWrite -ne $false -or $j.safety.extractionWrite -ne $false) { throw 'Write boundary failed' }
          if ($j.summary.ltPairCount -ne 1) { throw "Expected LT pair=1, got $($j.summary.ltPairCount)" }
          if ($j.summary.exactIndexLayoutCount -ne 1) { throw 'Expected exact mpkinfo layout' }
          if ($j.summary.totalIndexedEntries -ne 3) { throw "Expected indexed=3, got $($j.summary.totalIndexedEntries)" }
          if ($j.summary.totalLuaTMarkers -ne 3) { throw "Expected LuaT=3, got $($j.summary.totalLuaTMarkers)" }
          if ($j.summary.lengthPlus4BoundaryMatches -lt 2) { throw "Expected record boundary matches, got $($j.summary.lengthPlus4BoundaryMatches)" }
          if ($j.summary.patchDbQueryOnly -ne $true) { throw 'Patch DB query_only failed' }
          if ($j.summary.patchDbTargetRowCount -lt 1) { throw 'Expected LuaText target row' }
          Write-Host "VALID v16 LT=$($j.summary.ltPairCount) entries=$($j.summary.totalIndexedEntries) LuaT=$($j.summary.totalLuaTMarkers) DBhits=$($j.summary.patchDbTargetRowCount)"
