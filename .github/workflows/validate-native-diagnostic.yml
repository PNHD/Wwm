name: Validate WWMSync Native Diagnostic

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - wwmsync-diagnostic.ps1
      - wwmsync-diagnostic-v5.ps1
      - wwmsync-diagnostic-v6.ps1
      - wwmsync-diagnostic-v7.ps1
      - wwmsync-diagnostic-v8.ps1
      - wwmsync-diagnostic-v9.ps1
      - wwmsync-diagnostic-v10.ps1
      - wwmsync-diagnostic-v11.ps1
      - wwmsync-diagnostic-v12.ps1
      - wwmsync-diagnostic-v13.ps1
      - .github/workflows/validate-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run candidate BLOB diff diagnostic in safe CI environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'LocalDB'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $db = Join-Path $dir 'db_mp'
          $out = Join-Path $env:RUNNER_TEMP 'wwmsync-diagnostic-v13.json'
          $mk = Join-Path $env:RUNNER_TEMP 'make-v13-fixture.py'
          $mut = Join-Path $env:RUNNER_TEMP 'mutate-v13-fixture.py'
          @'
          import sqlite3, sys
          p=sys.argv[1]
          c=sqlite3.connect(p)
          c.execute('create table localdb (id varchar primary key, key varchar, scope varchar, content blob)')
          c.executemany('insert into localdb(id,key,scope,content) values (?,?,?,?)', [
            ('stable-id','unrelated_setting','local',b'STABLE'),
            ('candidate-id','red_list_cache_10000Bag','role',bytes.fromhex('0102030405060708090A0B0C0D0E0F101112'))
          ])
          c.commit(); c.close()
          '@ | Set-Content -LiteralPath $mk -Encoding UTF8
          @'
          import sqlite3, sys
          p=sys.argv[1]
          extra=bytes.fromhex('A1A2A3A4A5A6A7A8A9AAABACADAEAFB0B1')
          c=sqlite3.connect(p)
          old=c.execute("select content from localdb where id='candidate-id'").fetchone()[0]
          c.execute("update localdb set content=? where id='candidate-id'",(old+extra,))
          c.commit(); c.close()
          '@ | Set-Content -LiteralPath $mut -Encoding UTF8
          python $mk $db

          $job = Start-Job -ScriptBlock {
            param($repo,$p,$o)
            Set-Location $repo
            .\wwmsync-diagnostic-v13.ps1 -DbPath $p -AutoPhaseSeconds 8 -OutputPath $o
          } -ArgumentList $PWD.Path,$db,$out

          $deadline=(Get-Date).AddSeconds(30)
          while(-not (Test-Path $out)){
            if((Get-Date) -gt $deadline){throw 'V13 did not start in time'}
            Start-Sleep -Milliseconds 200
          }
          Start-Sleep -Seconds 3
          python $mut $db

          Receive-Job $job -Wait
          Remove-Job $job -Force
          if (-not (Test-Path $out)) { throw 'Diagnostic did not produce JSON.' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          if ($j.schema -ne 'wwmsync-native-diagnostic-v13') { throw "Unexpected schema: $($j.schema)" }
          if ($j.status -ne 'complete') { throw "Unexpected status: $($j.status)" }
          if ($j.safety.memoryRead -ne $false) { throw 'memoryRead boundary failed' }
          if ($j.safety.injection -ne $false) { throw 'injection boundary failed' }
          if ($j.safety.packetCapture -ne $false) { throw 'packetCapture boundary failed' }
          if ($j.safety.pipeConnect -ne $false) { throw 'pipeConnect boundary failed' }
          if ($j.safety.databaseWrite -ne $false) { throw 'databaseWrite boundary failed' }
          if ($j.safety.sqliteReadOnly -ne $true) { throw 'sqliteReadOnly contract failed' }
          if ($j.safety.sqliteQueryOnly -ne $true) { throw 'sqliteQueryOnly contract failed' }
          if ($j.summary.queryOnlyAll -ne $true) { throw 'Not all SQLite snapshots were query_only' }
          if ($j.summary.changedRowCount -ne 1) { throw "Expected changedRows=1, got $($j.summary.changedRowCount)" }
          if ($j.summary.candidateChangedCount -ne 1) { throw "Expected candidateChanged=1, got $($j.summary.candidateChangedCount)" }
          if ($j.summary.otherChangedRowCount -ne 0) { throw "Expected otherChanged=0, got $($j.summary.otherChangedRowCount)" }
          if ($j.summary.appendOnlyCandidateCount -ne 1) { throw "Expected appendOnly=1, got $($j.summary.appendOnlyCandidateCount)" }
          $d=@($j.candidateDiffs)[0]
          if ($d.appendedBytes -ne 17) { throw "Expected appendedBytes=17, got $($d.appendedBytes)" }
          if ($d.appendedHex -ne 'A1A2A3A4A5A6A7A8A9AAABACADAEAFB0B1') { throw "Unexpected appended hex: $($d.appendedHex)" }
          if ($d.beforeLength -ne 18 -or $d.afterLength -ne 35) { throw 'Unexpected candidate lengths' }
          Write-Host "VALID diagnostic schema=$($j.schema) changed=$($j.summary.changedRowCount) appended=$($d.appendedBytes)"
