name: Validate WWMSync Native Diagnostic

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - wwmsync-diagnostic.ps1
      - wwmsync-diagnostic-v5.ps1
      - wwmsync-diagnostic-v6.ps1
      - wwmsync-diagnostic-v7.ps1
      - wwmsync-diagnostic-v8.ps1
      - wwmsync-diagnostic-v9.ps1
      - wwmsync-diagnostic-v10.ps1
      - wwmsync-diagnostic-v11.ps1
      - wwmsync-diagnostic-v12.ps1
      - .github/workflows/validate-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run SQLite row-delta diagnostic in safe CI environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'LocalDB'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $db = Join-Path $dir 'db_mp'
          $out = Join-Path $env:RUNNER_TEMP 'wwmsync-diagnostic-v12.json'
          $mk = Join-Path $env:RUNNER_TEMP 'make-v12-fixture.py'
          $mut = Join-Path $env:RUNNER_TEMP 'mutate-v12-fixture.py'
          @'
          import sqlite3, sys
          p=sys.argv[1]
          c=sqlite3.connect(p)
          c.execute('create table localdb (id varchar primary key, key varchar, scope varchar, content blob)')
          c.executemany('insert into localdb(id,key,scope,content) values (?,?,?,?)', [
            ('stable-id','unrelated_setting','local',b'A'),
            ('collect-id','map_collect_candidate','role',b'0'),
            ('map-id','map_show_collections','role',b'0')
          ])
          c.commit(); c.close()
          '@ | Set-Content -LiteralPath $mk -Encoding UTF8
          @'
          import sqlite3, sys, time
          p=sys.argv[1]
          time.sleep(3.0)
          c=sqlite3.connect(p); c.execute("update localdb set content=? where id='collect-id'",(b'1',)); c.commit(); c.close()
          time.sleep(2.0)
          c=sqlite3.connect(p); c.execute("update localdb set content=? where id='map-id'",(b'1',)); c.commit(); c.close()
          '@ | Set-Content -LiteralPath $mut -Encoding UTF8
          python $mk $db
          $job = Start-Job -ScriptBlock { param($py,$script,$p) & $py $script $p } -ArgumentList (Get-Command python).Source,$mut,$db
          .\wwmsync-diagnostic-v12.ps1 -DbPath $db -StillSeconds 2 -AutoPhaseSeconds 2 -OutputPath $out
          Receive-Job $job -Wait | Out-Null
          Remove-Job $job -Force
          if (-not (Test-Path $out)) { throw 'Diagnostic did not produce JSON.' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          if ($j.schema -ne 'wwmsync-native-diagnostic-v12') { throw "Unexpected schema: $($j.schema)" }
          if ($j.status -ne 'complete') { throw "Unexpected status: $($j.status)" }
          if ($j.safety.memoryRead -ne $false) { throw 'memoryRead boundary failed' }
          if ($j.safety.injection -ne $false) { throw 'injection boundary failed' }
          if ($j.safety.packetCapture -ne $false) { throw 'packetCapture boundary failed' }
          if ($j.safety.pipeConnect -ne $false) { throw 'pipeConnect boundary failed' }
          if ($j.safety.databaseWrite -ne $false) { throw 'databaseWrite boundary failed' }
          if ($j.safety.sqliteReadOnly -ne $true) { throw 'sqliteReadOnly contract failed' }
          if ($j.safety.sqliteQueryOnly -ne $true) { throw 'sqliteQueryOnly contract failed' }
          if ($j.safety.blobContentExport -ne $false) { throw 'blobContentExport boundary failed' }
          if ($j.summary.queryOnlyAll -ne $true) { throw 'Not all SQLite snapshots were query_only' }
          if ($j.summary.stillChangedRows -ne 0) { throw "Expected still=0, got $($j.summary.stillChangedRows)" }
          if ($j.summary.collectChangedRows -ne 1) { throw "Expected collect=1, got $($j.summary.collectChangedRows)" }
          if ($j.summary.mapControlChangedRows -ne 1) { throw "Expected map=1, got $($j.summary.mapControlChangedRows)" }
          if ($j.summary.collectExclusiveRowCount -ne 1) { throw "Expected exclusive=1, got $($j.summary.collectExclusiveRowCount)" }
          if ($j.summary.interestingCollectExclusiveRowCount -ne 1) { throw "Expected interestingExclusive=1, got $($j.summary.interestingCollectExclusiveRowCount)" }
          if (@($j.collectExclusiveRows)[0].key -ne 'map_collect_candidate') { throw 'Wrong collection-exclusive row detected' }
          Write-Host "VALID diagnostic schema=$($j.schema) still=$($j.summary.stillChangedRows) collect=$($j.summary.collectChangedRows) map=$($j.summary.mapControlChangedRows) exclusive=$($j.summary.collectExclusiveRowCount)"
