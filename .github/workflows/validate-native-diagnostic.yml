name: Validate WWMSync Native Diagnostic

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - wwmsync-diagnostic.ps1
      - wwmsync-diagnostic-v5.ps1
      - wwmsync-diagnostic-v6.ps1
      - wwmsync-diagnostic-v7.ps1
      - wwmsync-diagnostic-v8.ps1
      - wwmsync-diagnostic-v9.ps1
      - .github/workflows/validate-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run db_mp movement correlation diagnostic in safe CI environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $db = Join-Path $env:RUNNER_TEMP 'db_mp'
          $out = Join-Path $env:RUNNER_TEMP 'wwmsync-diagnostic-v9.json'
          [IO.File]::WriteAllBytes($db, (New-Object byte[] 262144))
          $job = Start-Job -ScriptBlock {
            param($p)
            Start-Sleep -Milliseconds 5500
            $fs = New-Object System.IO.FileStream($p,[System.IO.FileMode]::Open,[System.IO.FileAccess]::Write,[System.IO.FileShare]::ReadWrite)
            try {
              $fs.Position = 70000
              $fs.WriteByte(123)
              $fs.Flush()
            } finally { $fs.Dispose() }
          } -ArgumentList $db
          .\wwmsync-diagnostic-v9.ps1 -DbPath $db -PhaseSeconds 4 -SampleSeconds 1 -ChunkSize 65536 -OutputPath $out
          Receive-Job $job -Wait | Out-Null
          Remove-Job $job -Force
          if (-not (Test-Path $out)) { throw 'Diagnostic did not produce JSON.' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          if ($j.schema -ne 'wwmsync-native-diagnostic-v9') { throw "Unexpected schema: $($j.schema)" }
          if ($j.status -ne 'complete') { throw "Unexpected status: $($j.status)" }
          if ($j.safety.memoryRead -ne $false) { throw 'memoryRead boundary failed' }
          if ($j.safety.injection -ne $false) { throw 'injection boundary failed' }
          if ($j.safety.packetCapture -ne $false) { throw 'packetCapture boundary failed' }
          if ($j.safety.activeNetworkProbe -ne $false) { throw 'activeNetworkProbe boundary failed' }
          if ($j.safety.pipeConnect -ne $false) { throw 'pipeConnect boundary failed' }
          if ($j.safety.pipeWrite -ne $false) { throw 'pipeWrite boundary failed' }
          if ($j.safety.gameFileWrite -ne $false) { throw 'gameFileWrite boundary failed' }
          if ($j.safety.databaseWrite -ne $false) { throw 'databaseWrite boundary failed' }
          if ($j.safety.fileContentExport -ne $false) { throw 'fileContentExport boundary failed' }
          if ($j.safety.fileContentHashRead -ne $true) { throw 'fileContentHashRead contract failed' }
          if ($j.summary.movementExclusiveChunkCount -lt 1) { throw 'Expected movement-exclusive chunk was not detected' }
          Write-Host "VALID diagnostic schema=$($j.schema) snapshots=$($j.summary.snapshots) move=$($j.summary.moveChangedChunks) exclusive=$($j.summary.movementExclusiveChunkCount)"
