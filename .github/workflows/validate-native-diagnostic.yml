name: Validate WWMSync Native Diagnostic

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - wwmsync-diagnostic.ps1
      - wwmsync-diagnostic-v5.ps1
      - wwmsync-diagnostic-v6.ps1
      - wwmsync-diagnostic-v7.ps1
      - wwmsync-diagnostic-v8.ps1
      - wwmsync-diagnostic-v9.ps1
      - wwmsync-diagnostic-v10.ps1
      - wwmsync-diagnostic-v11.ps1
      - wwmsync-diagnostic-v12.ps1
      - wwmsync-diagnostic-v13.ps1
      - wwmsync-diagnostic-v14.ps1
      - .github/workflows/validate-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run static remote-method receiver diagnostic in safe CI environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'wwm_lite'
          $scriptDir = Join-Path $root 'Content\Scripts'
          $binDir = Join-Path $root 'Engine\Binaries\Win64rh'
          New-Item -ItemType Directory -Force -Path $scriptDir,$binDir | Out-Null

          @'
          -- synthetic interoperability fixture only
          local rpc_name = "call_client_method"
          local method = "start_game_sync"
          local approval = "waiting_for_approval"
          local remote = "remote_method"
          '@ | Set-Content -LiteralPath (Join-Path $scriptDir 'remote_bridge.lua') -Encoding UTF8

          [IO.File]::WriteAllBytes((Join-Path $binDir 'protocol.data'), [Text.Encoding]::ASCII.GetBytes('prefix invokeClientMethod connectionKey relayServerId suffix'))

          $out = Join-Path $env:RUNNER_TEMP 'wwmsync-diagnostic-v14.json'
          .\wwmsync-diagnostic-v14.ps1 -GameRoot $root -MaxFileMB 64 -OutputPath $out

          if (-not (Test-Path $out)) { throw 'Diagnostic did not produce JSON.' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          if ($j.schema -ne 'wwmsync-native-diagnostic-v14') { throw "Unexpected schema: $($j.schema)" }
          if ($j.status -ne 'complete') { throw "Unexpected status: $($j.status)" }
          if ($j.safety.staticFileRead -ne $true) { throw 'staticFileRead contract failed' }
          if ($j.safety.fileMetadataRead -ne $true) { throw 'fileMetadataRead contract failed' }
          if ($j.safety.memoryRead -ne $false) { throw 'memoryRead boundary failed' }
          if ($j.safety.processHandleRead -ne $false) { throw 'processHandleRead boundary failed' }
          if ($j.safety.injection -ne $false) { throw 'injection boundary failed' }
          if ($j.safety.packetCapture -ne $false) { throw 'packetCapture boundary failed' }
          if ($j.safety.activeNetworkProbe -ne $false) { throw 'activeNetworkProbe boundary failed' }
          if ($j.safety.pipeConnect -ne $false) { throw 'pipeConnect boundary failed' }
          if ($j.safety.gameFileWrite -ne $false) { throw 'gameFileWrite boundary failed' }
          if ($j.summary.scannedFiles -lt 2) { throw 'Expected fixture files were not scanned' }
          if ($j.summary.primaryHits -lt 5) { throw "Expected high-signal hits missing: $($j.summary.primaryHits)" }
          $needles=@($j.summary.hitNeedles) -join "`n"
          if ($needles -notmatch 'start_game_sync') { throw 'start_game_sync fixture missing' }
          if ($needles -notmatch 'call_client_method') { throw 'call_client_method fixture missing' }
          if ($needles -notmatch 'invokeClientMethod') { throw 'invokeClientMethod fixture missing' }
          Write-Host "VALID diagnostic schema=$($j.schema) scanned=$($j.summary.scannedFiles) hits=$($j.summary.totalHits)"
