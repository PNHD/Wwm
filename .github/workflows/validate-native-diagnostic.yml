name: Validate WWMSync Native Diagnostic

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - wwmsync-diagnostic.ps1
      - wwmsync-diagnostic-v5.ps1
      - wwmsync-diagnostic-v6.ps1
      - wwmsync-diagnostic-v7.ps1
      - wwmsync-diagnostic-v8.ps1
      - wwmsync-diagnostic-v9.ps1
      - wwmsync-diagnostic-v10.ps1
      - wwmsync-diagnostic-v11.ps1
      - wwmsync-diagnostic-v12.ps1
      - wwmsync-diagnostic-v13.ps1
      - wwmsync-diagnostic-v14.ps1
      - wwmsync-diagnostic-v15.ps1
      - .github/workflows/validate-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run full package inventory diagnostic in safe CI environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'wwm_lite'
          $content = Join-Path $root 'Content\Packs'
          $bin = Join-Path $root 'Engine\Binaries\Win64rh'
          New-Item -ItemType Directory -Force -Path $content,$bin | Out-Null

          # Opaque game-like package with an uncommon extension.
          [IO.File]::WriteAllBytes((Join-Path $content 'game_scripts.npk'), [byte[]](0x4E,0x50,0x4B,0x30,0x01,0x02,0x03,0x04))
          # ZIP magic under a non-obvious extension.
          [IO.File]::WriteAllBytes((Join-Path $content 'resource.blk'), [byte[]](0x50,0x4B,0x03,0x04,0x00,0x00,0x00,0x00))
          # No-extension opaque file.
          [IO.File]::WriteAllBytes((Join-Path $content 'manifest_blob'), [Text.Encoding]::ASCII.GetBytes('MANIFEST'))
          # PE magic fixture.
          [IO.File]::WriteAllBytes((Join-Path $bin 'fixture.dll'), [byte[]](0x4D,0x5A,0x90,0x00,0x03,0x00))

          $out = Join-Path $env:RUNNER_TEMP 'wwmsync-diagnostic-v15.json'
          .\wwmsync-diagnostic-v15.ps1 -GameRoot $root -OutputPath $out

          if (-not (Test-Path $out)) { throw 'Diagnostic did not produce JSON.' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          if ($j.schema -ne 'wwmsync-native-diagnostic-v15') { throw "Unexpected schema: $($j.schema)" }
          if ($j.status -ne 'complete') { throw "Unexpected status: $($j.status)" }
          if ($j.safety.fileMetadataRead -ne $true) { throw 'fileMetadataRead contract failed' }
          if ($j.safety.first32BytesRead -ne $true) { throw 'first32BytesRead contract failed' }
          if ($j.safety.fullFileContentRead -ne $false) { throw 'fullFileContentRead boundary failed' }
          if ($j.safety.memoryRead -ne $false) { throw 'memoryRead boundary failed' }
          if ($j.safety.processHandleRead -ne $false) { throw 'processHandleRead boundary failed' }
          if ($j.safety.injection -ne $false) { throw 'injection boundary failed' }
          if ($j.safety.packetCapture -ne $false) { throw 'packetCapture boundary failed' }
          if ($j.safety.activeNetworkProbe -ne $false) { throw 'activeNetworkProbe boundary failed' }
          if ($j.safety.pipeConnect -ne $false) { throw 'pipeConnect boundary failed' }
          if ($j.safety.gameFileWrite -ne $false) { throw 'gameFileWrite boundary failed' }
          if ($j.summary.fileCount -ne 4) { throw "Expected 4 fixture files, got $($j.summary.fileCount)" }
          if ($j.summary.uniqueExtensionCount -lt 4) { throw 'Expected uncommon/no-extension inventory' }
          $files=@($j.result.files)
          if (-not ($files | Where-Object { $_.extension -eq '.npk' -and $_.magic -eq 'UNKNOWN' })) { throw 'NPK opaque fixture missing' }
          if (-not ($files | Where-Object { $_.extension -eq '.blk' -and $_.magic -eq 'ZIP' })) { throw 'ZIP magic fixture missing' }
          if (-not ($files | Where-Object { $_.extension -eq '<none>' })) { throw 'No-extension fixture missing' }
          if (-not ($files | Where-Object { $_.extension -eq '.dll' -and $_.magic -eq 'PE' })) { throw 'PE fixture missing' }
          if ($j.summary.packageCandidateCount -lt 2) { throw "Expected package candidates, got $($j.summary.packageCandidateCount)" }
          Write-Host "VALID diagnostic schema=$($j.schema) files=$($j.summary.fileCount) extensions=$($j.summary.uniqueExtensionCount) packages=$($j.summary.packageCandidateCount)"
