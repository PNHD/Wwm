name: Validate WWMSync Native Diagnostic

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - wwmsync-diagnostic.ps1
      - wwmsync-diagnostic-v5.ps1
      - wwmsync-diagnostic-v6.ps1
      - wwmsync-diagnostic-v7.ps1
      - .github/workflows/validate-native-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run targeted launcher IPC diagnostic in safe CI environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Join-Path $env:RUNNER_TEMP 'launcher.exe'
          $out = Join-Path $env:RUNNER_TEMP 'wwmsync-diagnostic-v7.json'
          [IO.File]::WriteAllBytes($launcher, [Text.Encoding]::ASCII.GetBytes('prefix wwm_launcher_server wwm_launcher_mutex QLocalServer QLocalSocket onNewConnection newConnection readAll arguments QUrl openUrl suffix'))
          .\wwmsync-diagnostic-v7.ps1 -LauncherExe $launcher -OutputPath $out
          if (-not (Test-Path $out)) { throw 'Diagnostic did not produce JSON.' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          if ($j.schema -ne 'wwmsync-native-diagnostic-v7') { throw "Unexpected schema: $($j.schema)" }
          if ($j.status -ne 'complete') { throw "Unexpected status: $($j.status)" }
          if ($j.safety.memoryRead -ne $false) { throw 'memoryRead boundary failed' }
          if ($j.safety.injection -ne $false) { throw 'injection boundary failed' }
          if ($j.safety.packetCapture -ne $false) { throw 'packetCapture boundary failed' }
          if ($j.safety.activeNetworkProbe -ne $false) { throw 'activeNetworkProbe boundary failed' }
          if ($j.safety.pipeConnect -ne $false) { throw 'pipeConnect boundary failed' }
          if ($j.safety.pipeWrite -ne $false) { throw 'pipeWrite boundary failed' }
          if ($j.safety.registryWrite -ne $false) { throw 'registryWrite boundary failed' }
          if ($j.safety.gameFileWrite -ne $false) { throw 'gameFileWrite boundary failed' }
          if ($j.safety.staticFileRead -ne $true) { throw 'staticFileRead contract failed' }
          if ($j.summary.pipeHits -lt 1) { throw 'Expected launcher pipe hit missing' }
          if ($j.summary.localServerHits -lt 1) { throw 'Expected QLocalServer hit missing' }
          if ($j.summary.localSocketHits -lt 1) { throw 'Expected QLocalSocket hit missing' }
          if ($j.summary.readHits -lt 1) { throw 'Expected read hit missing' }
          if ($j.summary.argumentHits -lt 1) { throw 'Expected argument hit missing' }
          Write-Host "VALID diagnostic schema=$($j.schema) exact=$($j.summary.totalExactHits) pipe=$($j.summary.pipeHits) localServer=$($j.summary.localServerHits) localSocket=$($j.summary.localSocketHits)"
