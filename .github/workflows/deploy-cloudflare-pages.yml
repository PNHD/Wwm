name: Deploy WWM Atlas to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [production/wwm-atlas]

permissions:
  contents: read

env:
  CLOUDFLARE_PROJECT_NAME: wwm-atlas-pnhd
  PRODUCTION_BRANCH: production/wwm-atlas

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }

      - name: Validate static site
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          node --check bootstrap.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          for path in list(Path('data').glob('*.json')) + list(Path('data').glob('*.geojson')):
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print('valid', path)
          PY

      - name: Prepare static bundle
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html styles.css app.js bootstrap.mjs sw.js manifest.webmanifest _redirects _headers robots.txt dist/
          cp -R assets data dist/
          test -f dist/index.html
          test -f dist/data/sources.json
          if find dist -type f -path '*/.github/*' | grep -q .; then
            echo 'Internal GitHub files leaked into dist.' >&2
            exit 1
          fi

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages project list --json > /tmp/pages.json
          if ! node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/pages.json', 'utf8'));
          const projects = Array.isArray(raw) ? raw : (raw.result || raw.projects || []);
          process.exit(projects.some((project) => project.name === process.env.CLOUDFLARE_PROJECT_NAME) ? 0 : 1);
          NODE
          then
            npx --yes wrangler@latest pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch "$PRODUCTION_BRANCH"
          fi

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$PRODUCTION_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "WWM Atlas ${GITHUB_SHA::7}"
