name: Deploy WWM Atlas to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [production/wwm-atlas]

permissions:
  contents: read

env:
  CLOUDFLARE_PROJECT_NAME: wwm-atlas-pnhd
  PRODUCTION_BRANCH: production/wwm-atlas

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }

      - name: Validate production source
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          node --check bootstrap.mjs
          find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json
          for path in ['manifest.webmanifest', '_routes.json']:
              json.load(open(path, encoding='utf-8'))
              print('valid', path)
          PY

      - name: Prepare static bundle
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html styles.css app.js bootstrap.mjs sw.js manifest.webmanifest _redirects _headers _routes.json robots.txt dist/
          test -f dist/index.html
          test -f dist/_routes.json
          test -d functions/api/sync
          if find dist -type f -path '*/.github/*' | grep -q .; then
            echo 'Internal GitHub files leaked into dist.' >&2
            exit 1
          fi

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          status="$(curl --silent --show-error --output /tmp/cloudflare-project.json --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$project_url")"
          case "$status" in
            200) echo "Cloudflare Pages project exists: ${CLOUDFLARE_PROJECT_NAME}" ;;
            404) npx --yes wrangler@latest pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch "$PRODUCTION_BRANCH" ;;
            *) echo "Cloudflare project lookup failed with HTTP ${status}" >&2; cat /tmp/cloudflare-project.json >&2; exit 1 ;;
          esac

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$PRODUCTION_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "WWM Atlas ${GITHUB_SHA::7}"

      - name: Smoke test production
        run: |
          set -euo pipefail
          base_url="https://${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          fetch() {
            local path="$1" output="$2"
            echo "SMOKE fetch ${path}"
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 60 "${base_url}${path}" -o "$output"
            test -s "$output" || { echo "Empty response for ${path}" >&2; exit 1; }
          }
          assert_contains() {
            local file="$1" needle="$2" label="$3"
            grep -Fq "$needle" "$file" || { echo "SMOKE FAIL ${label}: missing ${needle}" >&2; head -c 600 "$file" >&2 || true; echo >&2; exit 1; }
            echo "SMOKE PASS ${label}"
          }

          fetch "/" /tmp/root.html
          fetch "/map" /tmp/map.html
          fetch "/styles.css" /tmp/styles.css
          fetch "/app.js" /tmp/app.js
          fetch "/bootstrap.mjs" /tmp/bootstrap.mjs
          fetch "/manifest.webmanifest" /tmp/manifest.webmanifest
          fetch "/api/sync/relay-servers" /tmp/relays.json
          fetch "/api/map/markers" /tmp/markers.json

          assert_contains /tmp/root.html 'WWM Atlas — Auto Sync Map' 'root title'
          assert_contains /tmp/map.html 'WWM Atlas — Auto Sync Map' 'map title'
          assert_contains /tmp/app.js '/api/sync/gameauth' 'sync client'
          node -e "JSON.parse(require('fs').readFileSync('/tmp/manifest.webmanifest','utf8')); console.log('SMOKE PASS manifest JSON')"
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/relays.json','utf8')); if(!Array.isArray(x.servers)||!x.servers.length){console.error(x);process.exit(1)}; console.log('SMOKE PASS relay registry', x.servers.length)"
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/markers.json','utf8')); if(!Array.isArray(x.markers)||x.markers.length<15000){console.error('marker count',x.markers?.length);process.exit(1)}; console.log('SMOKE PASS marker dataset',x.markers.length)"

          echo 'SMOKE POST invalid auth payload'
          status="$(curl --silent --show-error --output /tmp/auth-invalid.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$base_url/api/sync/gameauth")"
          if [ "$status" != "400" ]; then echo "SMOKE FAIL gameauth expected 400 got ${status}" >&2; cat /tmp/auth-invalid.json >&2 || true; exit 1; fi
          echo 'SMOKE PASS gameauth function routing'

          echo 'SMOKE HEAD security headers'
          curl --fail --silent --show-error --location --head --retry 8 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$base_url/" > /tmp/root.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/root.headers || { echo 'Missing nosniff' >&2; cat /tmp/root.headers >&2; exit 1; }
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/root.headers || { echo 'Missing referrer-policy' >&2; cat /tmp/root.headers >&2; exit 1; }
          grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=()' /tmp/root.headers || { echo 'Missing permissions-policy' >&2; cat /tmp/root.headers >&2; exit 1; }
          echo "Production auto-sync smoke test passed: $base_url"
