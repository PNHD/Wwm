name: Forensic NetEase DD Distribution

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - .github/workflows/forensic-netease-dd-distribution.yml
      - tools/forensics/netease_dd_static.py
      - tools/forensics/netease_dd_resolver.py

permissions:
  contents: read

jobs:
  static-dd-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DD_ROOT: https://dd.163.com/
      DD_FORENSIC_OUT: dd-forensic
    steps:
      - name: Checkout investigation branch
        uses: actions/checkout@v4

      - name: Install static extraction tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full innoextract cabextract binutils file unzip python3-pip
          python3 -m pip install --disable-pip-version-check --break-system-packages xdis
          python3 --version
          7z | head -n 3 || true
          innoextract --version || true
          pydisasm --version || true
          node --version || true
          npx --version || true

      - name: Resolve official DD installer and inspect statically
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/forensics/netease_dd_resolver.py

      - name: Preserve and disassemble targeted YanYun resource
        if: always()
        shell: bash
        run: |
          set -u
          target='dd-forensic/extracted/root/100129/ccvoicehub.res'
          out='dd-forensic/report/targeted'
          mkdir -p "$out"
          if [ -f "$target" ]; then
            cp "$target" "$out/ccvoicehub.res"
            sha256sum "$target" > "$out/ccvoicehub.sha256.txt"
            file "$target" > "$out/ccvoicehub.file.txt" || true
            xxd -l 512 "$target" > "$out/ccvoicehub.head.hex.txt" || true
            7z l "$target" > "$out/ccvoicehub.7z-list.txt" 2>&1 || true
            strings -a -n 4 "$target" > "$out/ccvoicehub.strings-ascii.txt" || true
            strings -el -n 4 "$target" > "$out/ccvoicehub.strings-utf16le.txt" || true
            grep -Ein -C 12 'YanYun|yanyun|QLocalServer|QLocalSocket|WM_COPYDATA|127\.0\.0\.1|localhost|WebSocket|wss://|ws://|position|coordinate|coords|map[_-]?id|scene[_-]?id|ocr|game.?process|pipe|ipc|remote.?cmd' "$out/ccvoicehub.strings-ascii.txt" > "$out/ccvoicehub.focus.txt" || true

            extracted="$out/ccvoicehub-extracted"
            disasm="$out/disasm"
            mkdir -p "$extracted" "$disasm"
            unzip -q -o "$target" -d "$extracted" || true

            while IFS= read -r -d '' f; do
              rel="${f#${extracted}/}"
              safe="${rel//\//__}"
              pydisasm "$f" > "$disasm/${safe}.txt" 2>&1 || true
            done < <(
              find "$extracted/components/yanyun" -type f -name '*.pyc' -print0 2>/dev/null
            )

            for rel in \
              components/net_server/messagecenter.pyc \
              components/net_server/protocol_v2.pyc \
              util/ipc/local_server.pyc \
              util/ipc/ipc_server.pyc \
              web/common/web_interface_base_depends.pyc \
              web/web_widget_factory.pyc \
              components/game_box/game_box_controller.pyc \
              components/class_helper/voice_live_interface.pyc \
              datacenter/constants/basic_constants.pyc
            do
              f="$extracted/$rel"
              if [ -f "$f" ]; then
                safe="${rel//\//__}"
                pydisasm "$f" > "$disasm/${safe}.txt" 2>&1 || true
              fi
            done

            grep -RniE -C 10 'ReadTargetMemory|getMapData|sendMapPos2Web|WEB_DF_CallWebEvent|eventName|eventParams|YanYunProtocols|CID_BC|CID|SID|sendJson2server|addJsonHandler|QLocalServer|QLocalSocket|127\.0\.0\.1|localhost|WebSocket|listen|serverName|pipe|ipc|roleId|map_pos|x[^A-Za-z0-9_].*y[^A-Za-z0-9_].*z' "$disasm" > "$out/yanyun-disasm.focus.txt" || true
          fi

      - name: Print decisive evidence in job log
        if: always()
        shell: bash
        run: |
          set -u
          echo '===== RESOLVER ====='
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('dd-forensic/report/resolver.json')
          if p.exists():
              d = json.loads(p.read_text(encoding='utf-8'))
              print('api_base=', d.get('api_base'))
              print('download_api=', json.dumps(d.get('download_api', {}), ensure_ascii=False))
              print('selected_probe=', json.dumps(d.get('selected_probe', {}), ensure_ascii=False))
              print('-- high_signal_contexts --')
              wanted = {'90111','75609','baseURL','get_channel_download_link','appapi.cc.163.com','http://localhost','https://localhost','127.0.0.1','ws://','wss://','WebSocket','QLocalSocket','QLocalServer','NamedPipe','CreateNamedPipe','ipcRenderer','ipcMain','contextBridge','cefQuery','chrome.webview','WebView2','position','coordinate','coords','map_id','scene_id','Where Winds Meet','wherewindsmeet','燕云十六声','Yanyun','yysl'}
              for row in d.get('contexts', []):
                  if row.get('token') in wanted:
                      print(json.dumps(row, ensure_ascii=False))
          PY
          echo '===== SUMMARY ====='
          cat dd-forensic/report/summary.md 2>/dev/null || true
          echo '===== DISTRIBUTION ====='
          cat dd-forensic/report/distribution.json 2>/dev/null || true
          echo '===== EXTRACTION ====='
          cat dd-forensic/report/extraction.json 2>/dev/null || true
          echo '===== TOP COOCCURRENCE ====='
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('dd-forensic/report/scan.json')
          if not p.exists():
              raise SystemExit(0)
          d = json.loads(p.read_text(encoding='utf-8'))
          for key in ('game_transport_state_files', 'transport_state_files'):
              print(f'-- {key} --')
              for row in d.get(key, [])[:100]:
                  print(json.dumps(row, ensure_ascii=False))
          print('-- exact_loopback_urls --')
          for x in d.get('exact_loopback_urls', [])[:200]: print(x)
          print('-- named_pipes --')
          for x in d.get('named_pipes', [])[:200]: print(x)
          print('-- custom_schemes --')
          for x in d.get('custom_schemes', [])[:200]: print(x)
          PY
          echo '===== FOCUSED HITS ====='
          if [ -f dd-forensic/report/hits.tsv ]; then
            grep -Ei 'Where Winds Meet|wherewindsmeet|燕云十六声|Yanyun|yysl|127\.0\.0\.1|localhost|ws://|wss://|WebSocket|pipe|QLocal|ipcRenderer|contextBridge|cefQuery|webview|position|coordinate|coords|map[_-]?id|scene[_-]?id' dd-forensic/report/hits.tsv | head -n 300 || true
          fi
          echo '===== YANYUN TARGET HEADER ====='
          cat dd-forensic/report/targeted/ccvoicehub.file.txt 2>/dev/null || true
          cat dd-forensic/report/targeted/ccvoicehub.sha256.txt 2>/dev/null || true
          cat dd-forensic/report/targeted/ccvoicehub.head.hex.txt 2>/dev/null || true
          echo '===== YANYUN DISASSEMBLY FOCUS ====='
          head -n 1200 dd-forensic/report/targeted/yanyun-disasm.focus.txt 2>/dev/null || true

      - name: Upload forensic reports and targeted static resource
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netease-dd-static-forensic
          path: dd-forensic/report/
          if-no-files-found: warn
          retention-days: 7
