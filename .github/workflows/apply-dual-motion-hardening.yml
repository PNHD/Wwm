name: Apply Dual Motion Hardening

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - 'tools/apply_dual_motion_hardening.py'
      - '.github/workflows/apply-dual-motion-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
          fetch-depth: 0
      - name: Apply dual source-agnostic motion representation
        run: |
          set -euo pipefail
          python tools/apply_dual_motion_hardening.py
          node --check vision-sync.js
          grep -Fq 'REAL_FIXTURE_V2_DUAL_MOTION' vision-sync.js
          grep -Fq "'rawData','rawEnergy','raw-gradient'" vision-sync.js
          grep -Fq "best.score<.82" vision-sync.js
          grep -Fq "energy<5.5" vision-sync.js
          grep -Fq "magnitude>5.5" vision-sync.js
      - name: Commit direct runtime patch
        run: |
          set -euo pipefail
          if git diff --quiet -- vision-sync.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vision-sync.js
          git commit -m 'fix(vision): preserve raw motion fallback'
          git push origin HEAD:feature/wwm-native-sync-v2
