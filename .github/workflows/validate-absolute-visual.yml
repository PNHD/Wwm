name: Validate Structural Absolute Matcher

on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/validate-absolute-visual.yml'
      - 'vision-sync.js'

permissions:
  contents: read

env:
  PREVIEW_URL: https://preview.wwmsync.pages.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for structural V4 absolute bundle on preview
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            if curl --fail --silent --show-error --location --max-time 20 "$PREVIEW_URL/vision-sync.js" -o /tmp/vision-sync.js \
              && grep -Fq 'ANCHOR_FREE_STRUCTURAL_V4' /tmp/vision-sync.js \
              && grep -Fq '__WWMSYNC_ABSOLUTE_SELFTEST__' /tmp/vision-sync.js \
              && grep -Fq 'bidirectionalContourScore' /tmp/vision-sync.js \
              && grep -Fq 'structuralPhaseScore' /tmp/vision-sync.js; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Run source-normalized bidirectional structural matcher tests
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/absolute-smoke.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const base=process.env.PREVIEW_URL.replace(/\/$/,'');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:900}}),fatal=[];
            page.on('pageerror',e=>fatal.push(`pageerror:${e.message}`));
            const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000});
            if(!response?.ok())fatal.push(`HTTP:${response?.status()}`);
            await page.waitForFunction(()=>typeof window.__WWMSYNC_ABSOLUTE_SELFTEST__==='function'&&window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__?.().contract==='ANCHOR_FREE_STRUCTURAL_V4',null,{timeout:30000});
            for(const profile of ['gfn','local']){
              const result=await page.evaluate(p=>window.__WWMSYNC_ABSOLUTE_SELFTEST__(p),profile);
              console.log('STRUCTURAL_SELFTEST',JSON.stringify(result));
              if(!result?.ok)fatal.push(`${profile}:selftest=${JSON.stringify(result)}`);
              if(!(result.positiveFeatures>=28))fatal.push(`${profile}:features=${result.positiveFeatures}`);
              if(!(result.error<=10))fatal.push(`${profile}:position=${result.error}`);
              if(!(result.rotationError<=28))fatal.push(`${profile}:rotation=${result.rotationError}`);
              if(!(result.score>=.36))fatal.push(`${profile}:fine=${result.score}`);
              if(!(result.contourScore>=.43))fatal.push(`${profile}:contour=${result.contourScore}`);
              if(!(result.phaseScore>=.53))fatal.push(`${profile}:phase=${result.phaseScore}`);
              if(!(result.verifyScore>=.43))fatal.push(`${profile}:verify=${result.verifyScore}`);
            }
            const unlocked=await page.evaluate(()=>({diag:window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__(),status:document.querySelector('#visionAbsoluteStatus')?.textContent,position:document.querySelector('#visionAbsolutePosition')?.textContent,motion:window.__WWMSYNC_VISION_DIAGNOSTICS__()}));
            if(!String(unlocked.status).includes('ABSOLUTE NOT LOCKED'))fatal.push(`unlocked-status=${unlocked.status}`);
            if(!String(unlocked.position).includes('ABSOLUTE NOT LOCKED'))fatal.push(`unlocked-position=${unlocked.position}`);
            if(unlocked.motion.motionCalibration!=='manual')fatal.push(`premature-auto=${unlocked.motion.motionCalibration}`);
            console.log('FATAL',JSON.stringify(fatal));
            await browser.close();if(fatal.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/absolute-smoke.cjs
