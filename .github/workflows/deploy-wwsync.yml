name: Deploy WWMSync to Cloudflare Pages

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
      - production/wwsync
  pull_request:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - '.github/workflows/deploy-wwsync.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CLOUDFLARE_PROJECT_NAME: wwmsync
  PRODUCTION_BRANCH: production/wwsync
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate direct runtime sources
        run: |
          set -euo pipefail
          node --check app.js
          node --check official-sync.js
          node --check vision-sync.js
          node --check dashen-tile-cache.js
          node --check gt-motion-fixture-core.js
          node --check gt-motion-fixture.js
          node --check gt-poi-calibration-core.js
          node --check gt-poi-calibration.js
          node --check sw.js
          node --test tools/test-gt-poi-calibration.mjs
          python -m py_compile tools/build_dashen_visual_cache.py
          grep -Fq 'getDisplayMedia' vision-sync.js
          grep -Fq 'M1_MANUAL_RELATIVE_V1' vision-sync.js
          grep -Fq "implementation:'EXISTING_REUSED'" vision-sync.js
          grep -Fq 'dual-source-agnostic' vision-sync.js
          grep -Fq 'absoluteLocalization:false' vision-sync.js
          grep -Fq 'manualSeed' vision-sync.js
          grep -Fq 'trackingState' vision-sync.js
          ! grep -Fq 'ANCHOR_FREE_STRUCTURAL_' vision-sync.js
          ! grep -Fq '__WWMSYNC_ABSOLUTE_REPLAY__' vision-sync.js
          ! grep -Fq 'applyAbsoluteFix' vision-sync.js
          grep -Fq '<script src="/vision-sync.js"></script>' index.html
          grep -Fq '<script src="/gt-motion-fixture-core.js"></script>' index.html
          grep -Fq '<script src="/gt-motion-fixture.js"></script>' index.html
          grep -Fq '<script src="/gt-poi-calibration-core.js"></script>' index.html
          grep -Fq '<script src="/gt-poi-calibration.js"></script>' index.html
          grep -Fq 'WWMSyncPoiCalibrationCore' gt-poi-calibration-core.js
          grep -Fq "params.get('gt-poi-calibration')!=='1'" gt-poi-calibration.js
          grep -Fq "coordinateSpace:'raw-roi-source-pixels'" gt-poi-calibration-core.js
          grep -Fq 'trackerUsedForTruth:false' gt-poi-calibration-core.js
          grep -Fq 'walkOutcomeUsed:false' gt-poi-calibration-core.js
          grep -Fq 'scaleAppliedToRuntime:false' gt-poi-calibration-core.js
          grep -Fq 'orientationAppliedToRuntime:false' gt-poi-calibration-core.js
          grep -Fq 'absoluteLocalization:false' gt-poi-calibration-core.js
          ! grep -Fq '<script src="/vision-sync-loader.js"></script>' index.html
          grep -Fq 'display-capture=(self)' _headers

      - name: Build clean static bundle
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          cp index.html styles.css vision-sync.css app.js vision-sync.js dashen-tile-cache.js official-sync.js gt-motion-fixture-core.js gt-motion-fixture.js gt-poi-calibration-core.js gt-poi-calibration.js sw.js manifest.webmanifest _redirects _headers robots.txt dist/
          test -s dist/gt-motion-fixture-core.js
          test -s dist/gt-motion-fixture.js
          test -s dist/gt-poi-calibration-core.js
          test -s dist/gt-poi-calibration.js
          python tools/build_dashen_visual_cache.py dist/dashen-cache
          test -s dist/dashen-cache/manifest.json
          test -s dist/dashen-cache/main/3/0_0.png
          test -s dist/dashen-cache/main/5/20_15.png
          test -s dist/dashen-cache/sub4/5/3_3.png

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          status="$(curl --silent --show-error --output /tmp/project.json --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$project_url")"
          case "$status" in
            200) ;;
            404) npx --yes wrangler@latest pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch "$PRODUCTION_BRANCH" ;;
            *) cat /tmp/project.json >&2; exit 1 ;;
          esac

      - name: Deploy preview or production branch
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "$PRODUCTION_BRANCH" ]; then branch="$PRODUCTION_BRANCH"; else branch="preview"; fi
          npx --yes wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch "$branch" --commit-hash "$SOURCE_SHA" --commit-message "WWMSync ${SOURCE_SHA::7}" | tee /tmp/deploy.log
          exact_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' /tmp/deploy.log | head -n1)"
          test -n "$exact_url"
          echo "exact_url=$exact_url" >> "$GITHUB_OUTPUT"

      - name: HTTP smoke
        env:
          EXACT_URL: ${{ steps.deploy.outputs.exact_url }}
        run: |
          set -euo pipefail
          base="${EXACT_URL%/}"
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors "$base/" -o /tmp/root.html
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors "$base/vision-sync.js" -o /tmp/vision-sync.js
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors "$base/gt-motion-fixture-core.js" -o /tmp/gt-motion-fixture-core.js
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors "$base/gt-motion-fixture.js" -o /tmp/gt-motion-fixture.js
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors "$base/gt-poi-calibration-core.js" -o /tmp/gt-poi-calibration-core.js
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors "$base/gt-poi-calibration.js" -o /tmp/gt-poi-calibration.js
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors "$base/dashen-cache/manifest.json" -o /tmp/cache.json
          grep -Fq '<script src="/vision-sync.js"></script>' /tmp/root.html
          grep -Fq '<script src="/gt-motion-fixture-core.js"></script>' /tmp/root.html
          grep -Fq '<script src="/gt-motion-fixture.js"></script>' /tmp/root.html
          grep -Fq '<script src="/gt-poi-calibration-core.js"></script>' /tmp/root.html
          grep -Fq '<script src="/gt-poi-calibration.js"></script>' /tmp/root.html
          grep -Fq 'WWMSyncGroundTruthFixtureCore' /tmp/gt-motion-fixture-core.js
          grep -Fq "params.get('gt-motion-fixture')==='1'" /tmp/gt-motion-fixture.js
          grep -Fq 'WWMSyncPoiCalibrationCore' /tmp/gt-poi-calibration-core.js
          grep -Fq "params.get('gt-poi-calibration')!=='1'" /tmp/gt-poi-calibration.js
          grep -Fq 'M1_MANUAL_RELATIVE_V1' /tmp/vision-sync.js
          grep -Fq "implementation:'EXISTING_REUSED'" /tmp/vision-sync.js
          grep -Fq 'absoluteLocalization:false' /tmp/vision-sync.js
          ! grep -Fq 'ANCHOR_FREE_STRUCTURAL_' /tmp/vision-sync.js
          ! grep -Fq '__WWMSYNC_ABSOLUTE_REPLAY__' /tmp/vision-sync.js
          grep -Fq '"tilesFetched"' /tmp/cache.json

      - name: Browser smoke direct runtime
        env:
          EXACT_URL: ${{ steps.deploy.outputs.exact_url }}
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/smoke.cjs <<'NODE'
          const { chromium }=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const b=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            async function load(url, mode){
              const p=await b.newPage({viewport:{width:1440,height:900}}),errors=[];
              p.on('pageerror',e=>errors.push(e.message));
              const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              if(!r?.ok())throw new Error(`HTTP ${r?.status()}`);
              await p.waitForFunction(()=>window.__WWMSYNC_VISION_HARDENING__?.version==='M1_MANUAL_RELATIVE_V1'&&window.__WWMSYNC_VISION_HARDENING__?.implementation==='EXISTING_REUSED'&&window.__WWMSYNC_VISION_HARDENING__?.absoluteLocalization===false&&typeof window.__WWMSYNC_VISION_DIAGNOSTICS__==='function'&&typeof window.L?.map==='function',null,{timeout:30000});
              if(mode==='motion')await p.waitForFunction(()=>document.getElementById('gtMotionFixturePanel')?.hidden===false,null,{timeout:30000});
              if(mode==='poi')await p.waitForFunction(()=>document.getElementById('gtPoiCalibrationPanel')?.hidden===false,null,{timeout:30000});
              const s=await p.evaluate(()=>({hardening:window.__WWMSYNC_VISION_HARDENING__,vision:window.__WWMSYNC_VISION_DIAGNOSTICS__(),absoluteReplayType:typeof window.__WWMSYNC_ABSOLUTE_REPLAY__,absoluteDiagnosticsType:typeof window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__,leafletMapType:typeof window.L?.map,hasMapShell:!!document.getElementById('map'),hasSeedAction:!!document.getElementById('visionAnchorButton'),hasStartVision:!!document.getElementById('visionStartButton'),gtPanelHidden:document.getElementById('gtMotionFixturePanel')?.hidden,poiPanelHidden:document.getElementById('gtPoiCalibrationPanel')?.hidden,poiRecorderType:typeof window.WWMSyncPoiCalibrationCore?.PoiCalibrationRecorder,mapOptions:document.querySelectorAll('#mapSelect option').length}));
              console.log(`${mode.toUpperCase()}_RUNTIME`,JSON.stringify(s));
              console.log(`${mode.toUpperCase()}_PAGE_ERRORS`,JSON.stringify(errors));
              await p.close();
              const commonBad=errors.length||s.leafletMapType!=='function'||!s.hasMapShell||!s.hasSeedAction||!s.hasStartVision||s.absoluteReplayType!=='undefined'||s.absoluteDiagnosticsType!=='undefined'||s.poiRecorderType!=='function';
              const modeBad=mode==='ordinary'?(s.gtPanelHidden!==true||s.poiPanelHidden!==true):mode==='motion'?(s.gtPanelHidden!==false||s.poiPanelHidden!==true):(s.gtPanelHidden!==true||s.poiPanelHidden!==false);
              if(commonBad||modeBad)process.exit(1);
            }
            const base=process.env.EXACT_URL.replace(/\/$/,'');
            await load(process.env.EXACT_URL,'ordinary');
            await load(`${base}?gt-motion-fixture=1&app-commit=${process.env.SOURCE_SHA}`,'motion');
            await load(`${base}?gt-poi-calibration=1&app-commit=${process.env.SOURCE_SHA}`,'poi');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/smoke.cjs

      - name: Publish feature preview evidence status
        if: github.event_name == 'push' && github.ref_name == 'feature/wwm-native-sync-v2'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXACT_URL: ${{ steps.deploy.outputs.exact_url }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg state success \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "Preview ${EXACT_URL}" \
            --arg context 'wwmsync/cloudflare-preview' \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -d "$payload" >/dev/null
