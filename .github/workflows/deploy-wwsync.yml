name: Deploy WWSync to Cloudflare Pages

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
      - production/wwsync
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_PROJECT_NAME: wwsync-pnhd
  PRODUCTION_BRANCH: production/wwsync

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build clean static bundle
        run: |
          set -euo pipefail
          node --check app.js
          node --check mpay-shim.js
          node --check sw.js
          node --check functions/api/mpay/device-init.js
          node --check functions/api/mpay/oauth-config.js
          rm -rf dist && mkdir dist
          cp index.html styles.css app.js mpay-shim.js sw.js manifest.webmanifest _redirects _headers robots.txt dist/
          test ! -d dist/.github
          test ! -d dist/functions

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          status="$(curl --silent --show-error --output /tmp/project.json --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$project_url")"
          case "$status" in
            200) echo "Project exists: ${CLOUDFLARE_PROJECT_NAME}" ;;
            404) npx --yes wrangler@latest pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch "$PRODUCTION_BRANCH" ;;
            *) echo "Project lookup failed: HTTP ${status}" >&2; cat /tmp/project.json >&2; exit 1 ;;
          esac

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "$PRODUCTION_BRANCH" ]; then
            branch="$PRODUCTION_BRANCH"
            runtime_url="https://${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          else
            branch="preview"
            runtime_url="https://preview.${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          fi
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$branch" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "WWSync ${GITHUB_SHA::7}" | tee /tmp/wrangler-deploy.log
          exact_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' /tmp/wrangler-deploy.log | head -n1)"
          test -n "$exact_url"
          echo "exact_url=$exact_url" >> "$GITHUB_OUTPUT"
          echo "runtime_url=$runtime_url" >> "$GITHUB_OUTPUT"
          echo "Exact deployment URL: $exact_url"
          echo "Runtime alias: $runtime_url"

      - name: Smoke test deployment
        env:
          EXACT_URL: ${{ steps.deploy.outputs.exact_url }}
          RUNTIME_URL: ${{ steps.deploy.outputs.runtime_url }}
        run: |
          set -euo pipefail
          exact="${EXACT_URL%/}"
          base="${RUNTIME_URL%/}"
          fetch(){ curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors --max-time 45 "$1" -o "$2"; }

          fetch "$exact/" /tmp/root.html
          fetch "$exact/map" /tmp/map.html
          fetch "$exact/app.js" /tmp/app.js
          fetch "$exact/mpay-shim.js" /tmp/mpay-shim.js
          fetch "$exact/manifest.webmanifest" /tmp/manifest.json
          grep -Fq 'WWSync — Where Winds Meet' /tmp/root.html
          grep -Fq 'WWSync — Where Winds Meet' /tmp/map.html
          grep -Fq 'leaflet@1.9.4' /tmp/root.html
          grep -Fq '/mpay-shim.js' /tmp/root.html
          grep -Fq 'MpayOSSDK' /tmp/app.js
          node -e "const m=JSON.parse(require('fs').readFileSync('/tmp/manifest.json','utf8')); if(m.short_name!=='WWSync') process.exit(1)"

          fetch 'https://s2.easebar.com/39f12eda6b86452b/api/map/list?lang=en-US' /tmp/official.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/official.json','utf8')); if(!x.success||!Array.isArray(x.data?.maps)||x.data.maps.length<3) process.exit(1)"

          ci='00000000-0000-4000-8000-000000000001'
          device_payload="uuid=${ci}&resolution=300*150&device_brand=&device_name=&device_type=4&device_model=unknown&system_name=Linux&system_version=CI&game_id=398&cp=w&cv=3.1.5&gv=1.0.0&ci=${ci}&app_channel=netease_global.h5activity&lang=en_US&debug_mode=0&package_name="
          device_ok=0
          for attempt in $(seq 1 20); do
            status="$(curl --silent --show-error --output /tmp/device.json --write-out '%{http_code}' -X POST -H "Origin: $base" -H 'content-type: application/x-www-form-urlencoded; charset=utf-8' --data "$device_payload" "$base/api/mpay/device-init" || true)"
            if [ "$status" = '200' ]; then device_ok=1; break; fi
            echo "device-init not ready (HTTP $status), attempt $attempt/20"
            sleep 3
          done
          test "$device_ok" = '1' || { cat /tmp/device.json >&2 || true; exit 1; }
          device_id="$(node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/device.json','utf8')); const id=x?.device?.id; if(!id) process.exit(1); process.stdout.write(String(id))")"
          config_query="game_id=398&cp=w&cv=3.1.5&gv=1.0.0&ci=${ci}&app_channel=netease_global.h5activity&lang=en_US&device_id=${device_id}&debug_mode=0&package_name=&qrcode_app_id=&version=v2"
          oauth_ok=0
          for attempt in $(seq 1 20); do
            status="$(curl --silent --show-error --output /tmp/oauth.json --write-out '%{http_code}' -H "Origin: $base" "$base/api/mpay/oauth-config?${config_query}" || true)"
            if [ "$status" = '200' ] && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/oauth.json','utf8')); process.exit(x?.data?.login_methods?.length ? 0 : 1)"; then oauth_ok=1; break; fi
            echo "oauth-config not ready (HTTP $status), attempt $attempt/20"
            sleep 3
          done
          test "$oauth_ok" = '1' || { cat /tmp/oauth.json >&2 || true; exit 1; }

          curl --silent --show-error -X OPTIONS -D /tmp/cors.headers -o /tmp/cors.body \
            -H "Origin: $base" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' \
            'https://s2.easebar.com/39f12eda6b86452b/api/auth/ursRoles'
          grep -qi '^access-control-allow-origin:' /tmp/cors.headers
          grep -qi '^access-control-allow-methods:.*POST' /tmp/cors.headers
          echo "WWSync HTTP smoke passed: exact=$exact runtime=$base"

      - name: Browser smoke official map and login shell
        env:
          RUNTIME_URL: ${{ steps.deploy.outputs.runtime_url }}
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/smoke.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const fatal=[]; const csp=[];
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            page.on('console',m=>{const text=m.text();console.log('CONSOLE',m.type(),text);if(/content security policy|violates.*directive|refused to.*content security policy/i.test(text))csp.push(text)});
            const response=await page.goto(process.env.RUNTIME_URL,{waitUntil:'domcontentloaded',timeout:60000});
            if(!response?.ok())throw new Error(`navigation HTTP ${response?.status()}`);
            await page.waitForFunction(()=>document.querySelectorAll('#mapSelect option').length>=3,null,{timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('#categoryList button').length>0,null,{timeout:30000});
            await page.waitForSelector('.leaflet-container',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('img.leaflet-tile-loaded').length>0,null,{timeout:30000});
            const s=await page.evaluate(()=>({title:document.title,sdk:typeof window.MpayOSSDK,shim:Boolean(window.MpayOSSDK?.prototype?.__wwsyncCorsShim),leaflet:typeof window.L,maps:document.querySelectorAll('#mapSelect option').length,categories:document.querySelectorAll('#categoryList button').length,tiles:document.querySelectorAll('img.leaflet-tile-loaded').length,pointCanvases:document.querySelectorAll('.leaflet-overlay-pane canvas').length,passwordInputs:document.querySelectorAll('input[type=password]').length,legacyControls:Boolean(document.querySelector('#relay-select,#password-step,#password-input,[name="syncPassword"]'))}));
            if(s.title!=='WWSync — Where Winds Meet')fatal.push(`title=${s.title}`);
            if(s.sdk!=='function'||!s.shim)fatal.push(`sdk/shim=${s.sdk}/${s.shim}`);
            if(s.leaflet!=='object'||s.maps<3||s.categories<1||s.tiles<1||s.pointCanvases<1)fatal.push(`map=${JSON.stringify(s)}`);
            if(s.passwordInputs||s.legacyControls)fatal.push('legacy credential controls leaked');
            await page.selectOption('#languageSelect','en');
            if(!/sync/i.test(await page.locator('[data-i18n="syncTitle"]').textContent()))fatal.push('English switch failed');
            await page.selectOption('#languageSelect','vi');
            await page.click('#loginButton');
            await page.waitForSelector('#mosdk__dialog-container',{state:'visible',timeout:30000}).catch(e=>fatal.push(`official login UI missing: ${e.message}`));
            const loginMethods=await page.locator('.mosdk__login-method-item').count().catch(()=>0);
            if(loginMethods<2)fatal.push(`login methods=${loginMethods}`);
            console.log('BROWSER_STATE',JSON.stringify({...s,loginMethods}));
            console.log('FATAL',JSON.stringify(fatal));
            await browser.close();
            if(csp.length||fatal.length)process.exit(1);
          })().catch(e=>{console.error('BROWSER_FATAL',e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/smoke.cjs
          echo "WWSync browser smoke passed: $RUNTIME_URL"
