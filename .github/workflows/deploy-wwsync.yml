name: Deploy WWSync to Cloudflare Pages

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
      - production/wwsync
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_PROJECT_NAME: wwsync-pnhd
  PRODUCTION_BRANCH: production/wwsync

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }

      - name: Build clean static bundle
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          rm -rf dist && mkdir dist
          cp index.html styles.css app.js sw.js manifest.webmanifest _redirects _headers robots.txt dist/
          test ! -d dist/.github
          test ! -d dist/functions

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          status="$(curl --silent --show-error --output /tmp/project.json --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$project_url")"
          case "$status" in
            200) echo "Project exists: ${CLOUDFLARE_PROJECT_NAME}" ;;
            404) npx --yes wrangler@latest pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch "$PRODUCTION_BRANCH" ;;
            *) echo "Project lookup failed: HTTP ${status}" >&2; cat /tmp/project.json >&2; exit 1 ;;
          esac

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "$PRODUCTION_BRANCH" ]; then branch="$PRODUCTION_BRANCH"; else branch="preview"; fi
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$branch" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "WWSync ${GITHUB_SHA::7}" | tee /tmp/wrangler-deploy.log
          url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' /tmp/wrangler-deploy.log | head -n1)"
          test -n "$url" || { echo 'Could not determine exact deployment URL.' >&2; cat /tmp/wrangler-deploy.log >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Exact deployment URL: $url"

      - name: Smoke test exact deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          test -n "$base"
          fetch(){ curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors --max-time 45 "$base$1" -o "$2"; }
          fetch / /tmp/root.html
          fetch /map /tmp/map.html
          fetch /app.js /tmp/app.js
          fetch /manifest.webmanifest /tmp/manifest.json
          grep -Fq 'WWSync — Where Winds Meet' /tmp/root.html
          grep -Fq 'WWSync — Where Winds Meet' /tmp/map.html
          grep -Fq 'leaflet@1.9.4' /tmp/root.html
          grep -Fq 'sdk-os.mpsdk.easebar.com/gzip_static/h5/v1.3.1/js/mpay-h5-sdk-oversea.umd.js' /tmp/root.html
          grep -Fq 'MpayOSSDK' /tmp/app.js
          node -e "const m=JSON.parse(require('fs').readFileSync('/tmp/manifest.json','utf8')); if(m.short_name!=='WWSync') process.exit(1)"
          curl --fail --silent --show-error --location 'https://s2.easebar.com/39f12eda6b86452b/api/map/list?lang=en-US' -o /tmp/official.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/official.json','utf8')); if(!x.success||!Array.isArray(x.data?.maps)||x.data.maps.length<3) process.exit(1)"
          curl --silent --show-error -X OPTIONS -D /tmp/cors.headers -o /tmp/cors.body \
            -H "Origin: $base" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            'https://s2.easebar.com/39f12eda6b86452b/api/auth/ursRoles'
          grep -qi '^access-control-allow-origin:' /tmp/cors.headers
          grep -qi '^access-control-allow-methods:.*POST' /tmp/cors.headers
          echo "WWSync HTTP smoke passed: $base"

      - name: Browser smoke official map and login shell
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH" || { echo 'No Chrome/Chromium available on runner.' >&2; exit 1; }
          npm install --no-save --no-package-lock playwright-core@latest >/tmp/npm-playwright.log 2>&1
          cat > /tmp/wwsync-browser-smoke.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const url = process.env.DEPLOYMENT_URL;
          const executablePath = process.env.CHROME_PATH;
          (async () => {
            const browser = await chromium.launch({executablePath, headless:true, args:['--no-sandbox','--disable-dev-shm-usage']});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const events = [];
            page.on('pageerror', e => { events.push(`PAGEERROR ${e.message}`); console.log('PAGEERROR', e.message); });
            page.on('console', msg => { const s=`CONSOLE ${msg.type()} ${msg.text()}`; events.push(s); console.log('PAGE_CONSOLE', msg.type(), msg.text()); });
            page.on('requestfailed', req => { const x=`REQUEST_FAILED ${req.url()} ${req.failure()?.errorText||''}`; events.push(x); console.log(x); });
            const response = await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});
            if (!response || !response.ok()) throw new Error(`navigation HTTP ${response?.status()}`);
            await page.waitForFunction(() => document.querySelectorAll('#mapSelect option').length >= 3, null, {timeout:30000});
            await page.waitForFunction(() => document.querySelectorAll('#categoryList button').length > 0, null, {timeout:30000});
            await page.waitForSelector('.leaflet-container', {state:'visible', timeout:30000});
            await page.waitForFunction(() => document.querySelectorAll('img.leaflet-tile-loaded').length > 0, null, {timeout:30000});
            const state = await page.evaluate(async () => {
              const probe = async u => { try { const r=await fetch(u); return {ok:r.ok,status:r.status}; } catch(e){ return {ok:false,error:String(e)}; } };
              return {
                title: document.title,
                sdk: typeof window.MpayOSSDK,
                leaflet: typeof window.L,
                mapOptions: document.querySelectorAll('#mapSelect option').length,
                categories: document.querySelectorAll('#categoryList button').length,
                tileCount: document.querySelectorAll('img.leaflet-tile-loaded').length,
                pointCanvases: document.querySelectorAll('.leaflet-overlay-pane canvas').length,
                loading: document.querySelector('#mapLoading')?.className||'',
                listProbe: await probe('https://s2.easebar.com/39f12eda6b86452b/api/map/list?lang=en-US'),
                pointsProbe: await probe('https://s2.easebar.com/39f12eda6b86452b/api/map/points?mapId=1&lang=en-US')
              };
            });
            console.log('BROWSER_STATE', JSON.stringify(state));
            const fatal=[];
            if(state.sdk!=='function')fatal.push(`MpayOSSDK=${state.sdk}`);
            if(state.leaflet!=='object')fatal.push(`Leaflet=${state.leaflet}`);
            if(!state.listProbe.ok||state.listProbe.status!==200)fatal.push(`map/list=${JSON.stringify(state.listProbe)}`);
            if(!state.pointsProbe.ok||state.pointsProbe.status!==200)fatal.push(`map/points=${JSON.stringify(state.pointsProbe)}`);
            if(state.mapOptions<3)fatal.push(`map options=${state.mapOptions}`);
            if(state.categories<1)fatal.push(`categories=${state.categories}`);
            if(state.tileCount<1)fatal.push(`tiles=${state.tileCount}`);
            if(state.pointCanvases<1)fatal.push(`point canvases=${state.pointCanvases}`);
            if(!fatal.length){
              await page.click('#loginButton');
              await page.waitForFunction(() => { const n=document.querySelector('#mosdk__container'); return !!n && (n.childElementCount>0||n.innerHTML.length>0); }, null, {timeout:15000}).catch(async e=>fatal.push(`official login UI did not open: ${e.message}; status=${await page.locator('#authStatus').textContent().catch(()=> '')}`));
            }
            const csp=events.filter(x=>/content security policy|refused to.*content security policy|violates.*directive/i.test(x));
            console.log('CSP_EVENTS',JSON.stringify(csp));
            console.log('FATAL_EVENTS',JSON.stringify(fatal));
            await page.screenshot({path:'/tmp/wwsync-browser.png',fullPage:true}).catch(()=>{});
            await browser.close();
            if(csp.length||fatal.length)process.exit(1);
          })().catch(e=>{console.error('BROWSER_FATAL',e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/wwsync-browser-smoke.cjs
          echo "WWSync browser smoke passed: $DEPLOYMENT_URL"
