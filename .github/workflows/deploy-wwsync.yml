name: Deploy WWMSync to Cloudflare Pages

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
      - production/wwsync
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_PROJECT_NAME: wwmsync
  PRODUCTION_BRANCH: production/wwsync

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static sources
        run: |
          set -euo pipefail
          node --check app.js
          node --check official-sync.js
          node --check vision-sync.js
          node --check sw.js
          grep -Fq 'getDisplayMedia' vision-sync.js
          grep -Fq 'state.referenceZoom=Number.isFinite(map.getZoom())' vision-sync.js
          grep -Fq 'state.marker.setLatLng(latlng)' vision-sync.js
          grep -Fq 'if(result.moved){state.accepted++' vision-sync.js
          grep -Fq '__WWMSYNC_VISION_DIAGNOSTICS__' vision-sync.js
          grep -Fq 'visionAnchorButton' index.html
          grep -Fq 'visionRawDelta' index.html
          grep -Fq 'visionMarkerDelta' index.html
          grep -Fq 'vision-sync.css' index.html
          grep -Fq 'display-capture=(self)' _headers

      - name: Build clean static bundle
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          cp index.html styles.css vision-sync.css app.js vision-sync.js official-sync.js sw.js manifest.webmanifest _redirects _headers robots.txt dist/
          test ! -d dist/.github
          test ! -d dist/functions

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          status="$(curl --silent --show-error --output /tmp/project.json --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$project_url")"
          case "$status" in
            200) echo "Project exists: ${CLOUDFLARE_PROJECT_NAME}" ;;
            404) npx --yes wrangler@latest pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch "$PRODUCTION_BRANCH" ;;
            *) echo "Project lookup failed: HTTP ${status}" >&2; cat /tmp/project.json >&2; exit 1 ;;
          esac

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "$PRODUCTION_BRANCH" ]; then
            branch="$PRODUCTION_BRANCH"
            runtime_url="https://${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          else
            branch="preview"
            runtime_url="https://preview.${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          fi
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$branch" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "WWMSync ${GITHUB_SHA::7}" | tee /tmp/wrangler-deploy.log
          exact_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' /tmp/wrangler-deploy.log | head -n1)"
          test -n "$exact_url"
          echo "exact_url=$exact_url" >> "$GITHUB_OUTPUT"
          echo "runtime_url=$runtime_url" >> "$GITHUB_OUTPUT"
          echo "Exact deployment URL: $exact_url"
          echo "Runtime alias: $runtime_url"

      - name: HTTP smoke test
        env:
          EXACT_URL: ${{ steps.deploy.outputs.exact_url }}
        run: |
          set -euo pipefail
          base="${EXACT_URL%/}"
          fetch(){ curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors --max-time 45 "$1" -o "$2"; }
          fetch "$base/" /tmp/root.html
          fetch "$base/app.js" /tmp/app.js
          fetch "$base/vision-sync.js" /tmp/vision-sync.js
          fetch "$base/vision-sync.css" /tmp/vision-sync.css
          fetch "$base/official-sync.js" /tmp/official-sync.js
          grep -Fq 'WWMSync — Where Winds Meet' /tmp/root.html
          grep -Fq 'visionStartButton' /tmp/root.html
          grep -Fq 'visionRawDelta' /tmp/root.html
          grep -Fq 'visionMarkerDelta' /tmp/root.html
          grep -Fq 'getDisplayMedia' /tmp/vision-sync.js
          grep -Fq 'state.referenceZoom=Number.isFinite(map.getZoom())' /tmp/vision-sync.js
          grep -Fq 'state.marker.setLatLng(latlng)' /tmp/vision-sync.js
          grep -Fq 'if(result.moved){state.accepted++' /tmp/vision-sync.js
          grep -Fq '__WWMSYNC_VISION_DIAGNOSTICS__' /tmp/vision-sync.js
          grep -Fq 'vision-player-marker' /tmp/vision-sync.css
          grep -Fq "https://s2.easebar.com/39f12eda6b86452b" /tmp/app.js
          grep -Fq 'h72na_map_accessToken' /tmp/official-sync.js
          echo "WWMSync Vision propagation HTTP smoke passed: $base"

      - name: Browser smoke map and Vision UI
        env:
          EXACT_URL: ${{ steps.deploy.outputs.exact_url }}
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/smoke.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const base=process.env.EXACT_URL.replace(/\/$/,'');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const fatal=[];
            page.on('pageerror',e=>fatal.push(e.message));
            const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000});
            if(!response?.ok())fatal.push(`HTTP ${response?.status()}`);
            await page.waitForFunction(()=>document.querySelectorAll('#mapSelect option').length>=3,null,{timeout:30000});
            await page.waitForSelector('.leaflet-container',{state:'visible',timeout:30000});
            const s=await page.evaluate(()=>({
              title:document.title,
              visionStart:!!document.querySelector('#visionStartButton'),
              visionStop:!!document.querySelector('#visionStopButton'),
              visionAnchor:!!document.querySelector('#visionAnchorButton'),
              preview:!!document.querySelector('#visionPreview'),
              rawDelta:!!document.querySelector('#visionRawDelta'),
              correctedDelta:!!document.querySelector('#visionCorrectedDelta'),
              cumulative:!!document.querySelector('#visionCumulative'),
              markerDelta:!!document.querySelector('#visionMarkerDelta'),
              holdReason:!!document.querySelector('#visionHoldReason'),
              diagnosticsApi:typeof window.__WWMSYNC_VISION_DIAGNOSTICS__,
              displayCapture:typeof navigator.mediaDevices?.getDisplayMedia,
              maps:document.querySelectorAll('#mapSelect option').length,
              leaflet:typeof window.L
            }));
            if(s.title!=='WWMSync — Where Winds Meet'||!s.visionStart||!s.visionStop||!s.visionAnchor||!s.preview||!s.rawDelta||!s.correctedDelta||!s.cumulative||!s.markerDelta||!s.holdReason||s.maps<3||s.leaflet!=='object')fatal.push(JSON.stringify(s));
            if(s.displayCapture!=='function')fatal.push(`getDisplayMedia=${s.displayCapture}`);
            if(s.diagnosticsApi!=='function')fatal.push(`diagnosticsApi=${s.diagnosticsApi}`);
            const d=await page.evaluate(()=>window.__WWMSYNC_VISION_DIAGNOSTICS__());
            if(!d||d.accepted!==0||d.held!==0||typeof d.referenceZoom!=='number')fatal.push(`diagnostics=${JSON.stringify(d)}`);
            await page.selectOption('#languageSelect','en');
            const visionTitle=(await page.locator('[data-vision-i18n="title"]').textContent()).trim();
            if(visionTitle!=='GFN Vision Sync')fatal.push(`vision title=${visionTitle}`);
            console.log('VISION_BROWSER_STATE',JSON.stringify({...s,diagnostics:d}));
            console.log('FATAL',JSON.stringify(fatal));
            await browser.close();
            if(fatal.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/smoke.cjs
          echo "WWMSync Vision browser smoke passed: $EXACT_URL"