name: Deploy WWMSync to Cloudflare Pages

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
      - production/wwsync
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_PROJECT_NAME: wwmsync
  PRODUCTION_BRANCH: production/wwsync

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build clean static bundle
        run: |
          set -euo pipefail
          node --check app.js
          node --check official-sync.js
          node --check sw.js
          rm -rf dist && mkdir dist
          cp index.html styles.css app.js official-sync.js sw.js manifest.webmanifest _redirects _headers robots.txt dist/
          test ! -d dist/.github
          test ! -d dist/functions

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          status="$(curl --silent --show-error --output /tmp/project.json --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$project_url")"
          case "$status" in
            200) echo "Project exists: ${CLOUDFLARE_PROJECT_NAME}" ;;
            404) npx --yes wrangler@latest pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch "$PRODUCTION_BRANCH" ;;
            *) echo "Project lookup failed: HTTP ${status}" >&2; cat /tmp/project.json >&2; exit 1 ;;
          esac

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "$PRODUCTION_BRANCH" ]; then
            branch="$PRODUCTION_BRANCH"
            runtime_url="https://${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          else
            branch="preview"
            runtime_url="https://preview.${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          fi
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$branch" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "WWMSync ${GITHUB_SHA::7}" | tee /tmp/wrangler-deploy.log
          exact_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' /tmp/wrangler-deploy.log | head -n1)"
          test -n "$exact_url"
          echo "exact_url=$exact_url" >> "$GITHUB_OUTPUT"
          echo "runtime_url=$runtime_url" >> "$GITHUB_OUTPUT"
          echo "Exact deployment URL: $exact_url"
          echo "Runtime alias: $runtime_url"

      - name: Smoke test deployment
        env:
          EXACT_URL: ${{ steps.deploy.outputs.exact_url }}
          RUNTIME_URL: ${{ steps.deploy.outputs.runtime_url }}
        run: |
          set -euo pipefail
          exact="${EXACT_URL%/}"
          base="${RUNTIME_URL%/}"
          fetch(){ curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors --max-time 45 "$1" -o "$2"; }

          fetch "$exact/" /tmp/root.html
          fetch "$exact/map" /tmp/map.html
          fetch "$exact/app.js" /tmp/app.js
          fetch "$exact/official-sync.js" /tmp/official-sync.js
          fetch "$exact/manifest.webmanifest" /tmp/manifest.json
          grep -Fq 'WWMSync — Where Winds Meet' /tmp/root.html
          grep -Fq 'WWMSync — Where Winds Meet' /tmp/map.html
          grep -Fq 'leaflet@1.9.4' /tmp/root.html
          grep -Fq 'characterUid' /tmp/root.html
          grep -Fq 'syncButton' /tmp/root.html
          grep -Fq 'officialBridgeBookmarklet' /tmp/root.html
          grep -Fq "https://s2.easebar.com/39f12eda6b86452b" /tmp/app.js
          grep -Fq "syncSaved" /tmp/app.js
          grep -Fq "h72na_map_accessToken" /tmp/official-sync.js
          grep -Fq "wwmsync-import" /tmp/official-sync.js
          ! grep -Eq 'syncBlocked|MpayOSSDK|sdk-os\.mpsdk|/api/mpay|/service/gameauth|/service/call_client_method|start_game_sync|wwmmap\.pages\.dev' /tmp/root.html /tmp/app.js /tmp/official-sync.js
          node -e "const m=JSON.parse(require('fs').readFileSync('/tmp/manifest.json','utf8')); if(m.short_name!=='WWMSync') process.exit(1)"

          fetch 'https://s2.easebar.com/39f12eda6b86452b/api/map/list?lang=en-US' /tmp/official.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/official.json','utf8')); if(!x.success||!Array.isArray(x.data?.maps)||x.data.maps.length<3) process.exit(1)"
          echo "WWMSync HTTP smoke passed: exact=$exact runtime=$base"

      - name: Browser smoke map, UID boundary, and sanitized snapshot import
        env:
          RUNTIME_URL: ${{ steps.deploy.outputs.runtime_url }}
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/smoke.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const base=process.env.RUNTIME_URL.replace(/\/$/,'');
          const enc=o=>Buffer.from(JSON.stringify(o),'utf8').toString('base64url');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:1440,height:900}});
            const page=await context.newPage();
            const fatal=[]; const csp=[]; const requests=[];
            page.on('request',r=>requests.push(r.url()));
            page.on('pageerror',e=>{console.log('PAGEERROR',e.message);fatal.push(`pageerror=${e.message}`)});
            page.on('console',m=>{const text=m.text();console.log('CONSOLE',m.type(),text);if(/content security policy|violates.*directive|refused to.*content security policy/i.test(text))csp.push(text)});
            const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000});
            if(!response?.ok())throw new Error(`navigation HTTP ${response?.status()}`);
            await page.waitForFunction(()=>document.querySelectorAll('#mapSelect option').length>=3,null,{timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('#categoryList button').length>0,null,{timeout:30000});
            await page.waitForSelector('.leaflet-container',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('img.leaflet-tile-loaded').length>0,null,{timeout:30000});
            const before=page.url();
            const s=await page.evaluate(()=>({title:document.title,mpay:typeof window.MpayOSSDK,leaflet:typeof window.L,maps:document.querySelectorAll('#mapSelect option').length,categories:document.querySelectorAll('#categoryList button').length,tiles:document.querySelectorAll('img.leaflet-tile-loaded').length,pointCanvases:document.querySelectorAll('.leaflet-overlay-pane canvas').length,passwordInputs:document.querySelectorAll('input[type=password]').length,uidInputs:document.querySelectorAll('#characterUid').length,syncButtons:document.querySelectorAll('#syncButton').length,bookmarklet:document.querySelector('#officialBridgeBookmarklet')?.href||''}));
            if(s.title!=='WWMSync — Where Winds Meet')fatal.push(`title=${s.title}`);
            if(s.mpay!=='undefined')fatal.push(`MpayOSSDK=${s.mpay}`);
            if(s.leaflet!=='object'||s.maps<3||s.categories<1||s.tiles<1||s.pointCanvases<1)fatal.push(`map=${JSON.stringify(s)}`);
            if(s.passwordInputs!==0||s.uidInputs!==1||s.syncButtons!==1)fatal.push(`sync UI=${JSON.stringify(s)}`);
            if(!s.bookmarklet.startsWith('javascript:')||!s.bookmarklet.includes('h72na_map_accessToken'))fatal.push('bookmarklet not configured');
            await page.selectOption('#languageSelect','en');
            if(!/game sync/i.test(await page.locator('[data-i18n="syncTitle"]').textContent()))fatal.push('English switch failed');
            await page.selectOption('#languageSelect','vi');
            await page.fill('#characterUid','1234567890');
            await page.click('#syncButton');
            const status=(await page.locator('#syncStatus').textContent()).trim();
            const stored=await page.evaluate(()=>localStorage.getItem('wwmsync:uid'));
            if(!/đã được lưu cục bộ/i.test(status)||!/không có kết nối|không có.*handshake/i.test(status))fatal.push(`UID-only status=${status}`);
            if(/allow|game đang chạy|đã kết nối/i.test(status))fatal.push(`misleading game-state claim=${status}`);
            if(stored!=='1234567890')fatal.push(`stored uid=${stored}`);
            if(page.url()!==before)fatal.push(`unexpected navigation ${before} -> ${page.url()}`);
            const forbidden=requests.filter(u=>/sdk-os\.mpsdk|wwmmap\.pages\.dev|sangtacviet|stv-appdomain|\/service\/(gameauth|call_client_method)/i.test(u));
            if(forbidden.length)fatal.push(`forbidden requests=${forbidden.join(',')}`);

            // Synthetic sanitized snapshot exercises only WWMSync's receiver. No auth token is present.
            const payload={v:1,source:'official-map',at:Date.now(),maps:[[1,[1,2,3]],[2,[]],[3,[]],[4,[]]]};
            await page.goto(`${base}/#wwmsync-import=${enc(payload)}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>Number(document.querySelector('#totalCount')?.textContent.replace(/\D/g,''))>1000,null,{timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#completedCount')?.textContent.trim()==='3',null,{timeout:30000});
            const imported=await page.evaluate(()=>({hash:location.hash,done:document.querySelector('#completedCount')?.textContent.trim(),badge:document.querySelector('#syncStateBadge')?.textContent.trim(),stored:localStorage.getItem('wwmsync:official-completion:v1'),cookieKeys:Object.keys(localStorage).filter(k=>/token|cookie|session/i.test(k))}));
            if(imported.hash!=='')fatal.push(`import hash retained=${imported.hash}`);
            if(imported.done!=='3')fatal.push(`import done=${imported.done}`);
            if(!/official map snapshot/i.test(imported.badge))fatal.push(`import badge=${imported.badge}`);
            if(!imported.stored||/token|cookie|sessionid|access_token/i.test(imported.stored))fatal.push('sanitized snapshot persistence failed');
            if(imported.cookieKeys.length)fatal.push(`unexpected credential-like localStorage keys=${imported.cookieKeys.join(',')}`);

            console.log('BROWSER_STATE',JSON.stringify({...s,status,stored,forbiddenRequests:forbidden.length,imported}));
            console.log('FATAL',JSON.stringify(fatal));
            await browser.close();
            if(csp.length||fatal.length)process.exit(1);
          })().catch(e=>{console.error('BROWSER_FATAL',e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/smoke.cjs
          echo "WWMSync browser smoke passed: $RUNTIME_URL"
