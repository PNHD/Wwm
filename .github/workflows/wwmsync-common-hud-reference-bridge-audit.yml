name: WWMSync Common HUD Reference Bridge Audit
on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/wwmsync-common-hud-reference-bridge-audit.yml'
      - 'scripts/replay/wwmsync-common-hud-reference-bridge.payload.b64.00'
      - 'scripts/replay/wwmsync-common-hud-reference-bridge.payload.b64.01'
      - 'scripts/replay/wwmsync-common-hud-reference-bridge.payload.b64.02'
permissions: {contents: write, actions: read}
concurrency:
  group: wwmsync-common-hud-reference-bridge-${{ github.ref }}
  cancel-in-progress: false
env:
  START_HEAD: 22f0dbc131756bffd7082a0b2358624d158463f8
  VISION_BLOB: 58b5a1babf6a12b944f9b745b8bf7f7df573bf9b
  CACHE_BLOB: 9388960a8bff53a9cfc7471372af144b7a28c34f
  CACHE_BUILDER_BLOB: 1a227d06ae41660ea3e3b832e7f1921cc507c0d7
  OWNER_RUN: '31666927302'
  OWNER_ARTIFACT: '9168284675'
  OWNER_DIGEST: 5ab08d0bf1745556b0b10d3f72cb70779fa65367afff6f057014f050a1d634d8
  SAME_SESSION_RUN: '31759922863'
  SAME_SESSION_ARTIFACT: '9204236942'
  SAME_SESSION_DIGEST: ddafa809bee15cbe7da2c0f7e8d3354ca9a4e834022e6fb7d13cb643d4762793
  GENERAL_R1_RUN: '31761799973'
  GENERAL_R1_ARTIFACT: '9204882854'
  GENERAL_R1_DIGEST: 6233d52dbd710380a5650793817130536544e6dffeb9c5a32a6ef8e807d80026
  REFERENCE_RUN: '31561669741'
  REFERENCE_ARTIFACT: '9127953239'
  REFERENCE_DIGEST: 1542e60310197707f892e7ee9ebbbdb65c3f58926fcedb4ec80454d4b9eaf8d3
  FANG_RUN: '31609680755'
  FANG_ARTIFACT: '9146646914'
  FANG_DIGEST: b305444dff3ac2db6a544020093bd64022ffef5406c246849499d6a96525c041
  RAW_STRESS_RUN: '31579421905'
  RAW_STRESS_ARTIFACT: '9134573961'
  RAW_STRESS_DIGEST: a4ad4a4fc9caee79732099c1e643f14dbbbae3c80c22a8fcb7b1fe309874760c
  FIXTURE_NAME: wwmsync-gfn-motion-20260810-143835.zip
  FIXTURE_SHA256: aa14ce0e703d0af5c4c86946f2932b465f8a7fd529001cd1900b3b99b501a216
  FIXTURE_ASSET_ID: '511291145'
  EAST_FIXTURE_SHA: 144ff5c7ad8f9c788f69cec049d58bad79d8390abdca7d28bde62fdc8c609792
  GENERAL_FIXTURE_SHA: 261f910e416028b272f58abcf31f0bf3ac09e19d65490daf7acf6004e89b0d55
  PAYLOAD_TGZ_SHA256: ae88a803960afb9c947b11152ff2c3de2c7920fc65f2a9b6877883dc35e57d1c
  REPORT_PATH: docs/wwmsync/audits/common-hud-reference-representation-bridge-2026-08-14.md
  GH_TOKEN: ${{ github.token }}
jobs:
  audit:
    name: Common HUD reference bridge audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: feature/wwm-native-sync-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore pinned replay-only audit harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge-harness"
          cat scripts/replay/wwmsync-common-hud-reference-bridge.payload.b64.{00,01,02} | base64 -d > "$RUNNER_TEMP/bridge-harness.tgz"
          echo "$PAYLOAD_TGZ_SHA256  $RUNNER_TEMP/bridge-harness.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bridge-harness.tgz" -C "$RUNNER_TEMP/bridge-harness"
          python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.1.3 opencv-python-headless==4.10.0.84 pillow==11.3.0
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          chmod +x "$RUNNER_TEMP/bridge-harness/run_common_bridge_audit.sh"
      - name: Execute bounded common representation bridge audit
        shell: bash
        run: "$RUNNER_TEMP/bridge-harness/run_common_bridge_audit.sh"
      - name: Upload authoritative bridge evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-common-hud-reference-bridge-${{ github.run_id }}
          path: bridge-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Record CI coordinates and commit report only
        id: final
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "Common HUD reference bridge audit") | .id' | head -n1)"
          test -n "$JOB_ID"
          { echo; echo '## Authoritative CI'; echo "- run: ${GITHUB_RUN_ID}"; echo "- job: ${JOB_ID}"; echo "- artifact: ${ARTIFACT_ID}"; echo "- artifact digest: ${ARTIFACT_DIGEST}"; echo '- acceptance: CI ACCEPTED — bounded replay/CI-only common representation bridge audit; production untouched.'; } >> bridge-output/final-report.md
          git fetch origin feature/wwm-native-sync-v2
          test "$(git rev-parse origin/feature/wwm-native-sync-v2)" = "$GITHUB_SHA"
          mkdir -p "$(dirname "$REPORT_PATH")"; cp bridge-output/final-report.md "$REPORT_PATH"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT_PATH"; git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1; test "$(git diff --cached --name-only)" = "$REPORT_PATH"
          git commit -m 'docs(wwmsync): record common HUD reference bridge audit [skip ci]'
          git push origin HEAD:feature/wwm-native-sync-v2
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"; echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"; echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"; echo "final_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cat bridge-output/final-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Final acceptance marker
        shell: bash
        run: |
          echo "Authoritative run: ${GITHUB_RUN_ID}"
          echo "Authoritative job: ${{ steps.final.outputs.job_id }}"
          echo "Authoritative artifact: ${{ steps.final.outputs.artifact_id }}"
          echo "Artifact digest: ${{ steps.final.outputs.artifact_digest }}"
          echo "Final branch HEAD: ${{ steps.final.outputs.final_head }}"
          echo 'Acceptance: CI ACCEPTED — common HUD→reference representation bridge audit complete; production unchanged.'
