name: Forensic WWM Local Sync

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-official-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public Windows tool without executing it
        shell: bash
        run: |
          set -euo pipefail
          url='https://pub-ee98fd25126f446ea56002b8ed7ca418.r2.dev/VietHoaAIWhereWindsMeet336.zip'
          curl --fail --silent --show-error --location --retry 3 "$url" -o tool.zip
          unzip -l tool.zip > tool-files.txt
          rm -rf extracted && mkdir extracted
          unzip -q tool.zip -d extracted
          {
            echo '=== ZIP SHA256 ==='
            sha256sum tool.zip
            echo '=== FILE TYPES ==='
            find extracted -type f -maxdepth 4 -print0 | xargs -0 file
            echo '=== SYNC-RELATED STRINGS ==='
            while IFS= read -r -d '' f; do
              echo "--- $f ---"
              strings -a -n 5 "$f" | grep -Ei -m 400 '63333|GET_GAME_STATE|game.?state|sync|localhost|127\.0\.0\.1|websocket|bridge|relay|wwmmap|map_2026|server_password|http.?server|TcpListener|HttpListener|Kestrel|Flask|FastAPI|aiohttp|lua|client.?method' || true
            done < <(find extracted -type f -print0)
          } > local-sync-evidence.txt

      - name: Upload textual evidence only
        uses: actions/upload-artifact@v4
        with:
          name: wwm-local-sync-evidence
          path: |
            tool-files.txt
            local-sync-evidence.txt
          if-no-files-found: error
          retention-days: 1
