name: Inspect Official Mpay SDK

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-official-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public SDK transport and config
        shell: bash
        run: |
          set -euo pipefail
          sdk='https://sdk-os.mpsdk.easebar.com/gzip_static/h5/v1.3.1/js/mpay-h5-sdk-oversea.umd.js'
          curl --fail --silent --show-error --location --compressed "$sdk" -o mpay.js
          python - <<'PY' > mpay-transport.txt
          from pathlib import Path
          import re
          text=Path('mpay.js').read_text('utf-8',errors='ignore')
          print('BYTES',len(text.encode()))
          terms=[
            'https://sdk-os.mpsdk.easebar.com',
            '/api/devices/init',
            '/api/users/login/v2/oauth/config',
            'baseURL','baseUrl','apiBase','apiHost','host','domain','server',
            'showLogin','gameRedirectUrl','redirectUrl','redirect_uri','callback',
            'fetch(','XMLHttpRequest','axios','credentials','withCredentials',
            'iframe','postMessage','window.open','location.href','oauth'
          ]
          for term in terms:
            start=0; count=0
            while True:
              i=text.lower().find(term.lower(),start)
              if i<0 or count>=40: break
              lo=max(0,i-3200); hi=min(len(text),i+7800)
              print(f'\n=== {term} @ {i} ===')
              print(text[lo:hi])
              start=i+len(term); count+=1
          print('\n=== URL LITERALS ===')
          for u in sorted(set(re.findall(r'https?://[^\"\'<>\\\s)]+',text))):
            if any(k in u.lower() for k in ['mpsdk','easebar','netease','oauth','login','passport','account']):
              print(u[:1500])
          print('\n=== CONFIG-LIKE STRING KEYS ===')
          strings=sorted(set(m.group(2) for m in re.finditer(r'(["\'])([A-Za-z_$][A-Za-z0-9_$.-]{2,80})\1',text)))
          for s in strings:
            low=s.lower()
            if any(k in low for k in ['url','host','domain','base','redirect','callback','oauth','login','api','origin','channel']):
              print(s)
          PY
          sha256sum mpay.js > mpay.sha256

      - name: Upload textual SDK evidence
        uses: actions/upload-artifact@v4
        with:
          name: mpay-sdk-transport
          path: |
            mpay-transport.txt
            mpay.sha256
          if-no-files-found: error
          retention-days: 1
