name: Forensic Official WWM Sync

on:
  push:
    branches: [feature/wwmsync-native-official]
    paths: ['.github/workflows/forensic-official-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Extract exact Global auth contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js'
          API='https://s2.easebar.com/39f12eda6b86452b'
          mkdir -p /tmp/g
          curl -fsSL --max-time 30 "$ROOT/common-a15f2132.js" -o /tmp/g/common.js
          curl -fsSL --max-time 30 "$ROOT/pc-d3f0a0d4.js" -o /tmp/g/pc.js

          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/g/common.js').read_text('utf-8','ignore')
          print('COMMON_BYTES',len(s))
          needles=[
            '/api/auth/ursRoles','/api/auth/ursLogin','/api/auth/h72naLogin',
            '/api/user/info','/api/user/point/finish','silentLogin','loginWithRole',
            'updateToken','withCredentials','Authorization','MpayOSSDK'
          ]
          for needle in needles:
              hits=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
              print('\nKEY',needle,'COUNT',len(hits))
              for i in hits[:3]:
                  a=max(0,i-1800); b=min(len(s),i+2600)
                  print('SNIP',' '.join(s[a:b].split())[:4500])
          # Extract compact route literals, object keys and probable endpoint wrappers.
          print('\nAUTH_ROUTE_LITERALS')
          for x in sorted(set(re.findall(r'["\']([^"\']*/api/auth/[^"\']+)["\']',s))): print(x[:500])
          print('\nUSER_ROUTE_LITERALS')
          for x in sorted(set(re.findall(r'["\']([^"\']*/api/user/[^"\']+)["\']',s))): print(x[:500])
          PY

          echo '===== VALIDATION RESPONSES ====='
          while IFS='|' read -r path body; do
            echo "CASE $path BODY $body"
            curl -sS --max-time 15 -X POST "$API$path?lang=en-US" \
              -H 'Origin: https://wwmsync.pages.dev' \
              -H 'Content-Type: application/json' \
              --data "$body" | python3 -c 'import sys,json; raw=sys.stdin.read(); print(raw[:1600])'
          done <<'EOF'
          /api/auth/ursRoles|{}
          /api/auth/ursRoles|{"token":"x"}
          /api/auth/ursRoles|{"unisdkToken":"x"}
          /api/auth/ursRoles|{"loginToken":"x"}
          /api/auth/ursLogin|{}
          /api/auth/ursLogin|{"roleId":"x"}
          /api/auth/ursLogin|{"serverId":"x","roleId":"x"}
          /api/auth/h72naLogin|{}
          /api/auth/h72naLogin|{"ticket":"x"}
          /api/user/info|{}
          EOF

      - name: Resolve official DD client metadata and bridge signals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dd
          CHUNK='https://static.dd.163.com/frontendddwebsitenext/_next/static/chunks/1733-eab8b6d336eae216.js'
          curl -fsSL --max-time 30 "$CHUNK" -o /tmp/dd/chunk.js

          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/dd/chunk.js').read_text('utf-8','ignore')
          print('DD_CHUNK_BYTES',len(s))
          for needle in ['get_channel_download_link','setDownloadContext','baseURL','x64_download_link','x32_download_link','75609:']:
              hits=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
              print('\nKEY',needle,'COUNT',len(hits))
              for i in hits[:4]:
                  print('SNIP',' '.join(s[max(0,i-1800):min(len(s),i+3000)].split())[:5000])
          for u in sorted(set(re.findall(r'https?://[^"\'<>\\\s]+',s))):
              if any(k in u.lower() for k in ('163.com','netease','download','api.')):
                  print('URL',u[:800])
          PY

          echo '===== DD PUBLIC API ROOT PROBES ====='
          for host in 'https://api.cc.163.com' 'https://api.dd.163.com' 'https://dd.163.com' 'https://cc.163.com'; do
            for path in '/v1/teamchannelpkg/get_channel_download_link' '/v1/mixteamversion/setDownloadContext'; do
              echo "CASE $host$path"
              code=$(curl -sS --max-time 15 -D /tmp/dd/h -o /tmp/dd/b -w '%{http_code}' "$host$path" || true)
              echo "HTTP $code"
              grep -iE '^(content-type:|location:|server:|access-control-)' /tmp/dd/h | tail -n 15 || true
              head -c 1200 /tmp/dd/b; echo
            done
          done

          echo '===== CN YYSLS BRIDGE SIGNALS ====='
          Y='https://g.166.net/res/a19/p__g__yysls.8e3f9c6a.async.js'
          curl -fsSL --max-time 30 "$Y" -o /tmp/dd/yysls.js
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/dd/yysls.js').read_text('utf-8','ignore')
          for needle in ['实时地图','共创大地图','gm://','UniSDKJSBridge','postMsgToNative','isGodWebGame','getUserTicket','WebSocket','wss://','127.0.0.1','localhost','position','sync','yysls']:
              hits=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
              print('\nKEY',needle,'COUNT',len(hits))
              for i in hits[:5]:
                  print('SNIP',' '.join(s[max(0,i-1400):min(len(s),i+2400)].split())[:4000])
          PY
