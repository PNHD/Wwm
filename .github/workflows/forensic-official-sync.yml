name: Forensic Official WWM Sync Surface

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-official-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace public official map store endpoints
        shell: bash
        run: |
          set -euo pipefail
          root='https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js'
          for f in common-a15f2132.js pc-d3f0a0d4.js index-1d9774f9.js index-be137abf.js; do
            curl --fail --silent --show-error --location --compressed "$root/$f" -o "/tmp/$f"
          done

          python - <<'PY' > official-sync-store.txt
          from pathlib import Path
          import re
          files=[Path('/tmp/common-a15f2132.js'),Path('/tmp/pc-d3f0a0d4.js'),Path('/tmp/index-1d9774f9.js'),Path('/tmp/index-be137abf.js')]
          terms=['silentLogin','loginWithRole','mapPoints','mapList','roleList','updateToken','userinfo','uuid','nickName','token','role_id','roleId','point','collect','complete','login','bind']
          for p in files:
              text=p.read_text('utf-8',errors='ignore')
              print(f'=== {p.name} BYTES {len(text.encode())} ===')
              for term in terms:
                  start=0; n=0
                  while True:
                      i=text.find(term,start)
                      if i<0 or n>=8: break
                      lo=max(0,i-1400); hi=min(len(text),i+3000)
                      print(f'--- {term} @ {i} ---')
                      print(' '.join(text[lo:hi].split())[:6200])
                      start=i+len(term); n+=1
              print('--- URL/ROUTE LITERALS ---')
              lits=[]
              for m in re.finditer(r'(["\'])(.{1,420}?)\1',text,re.S):
                  s=' '.join(m.group(2).split()); low=s.lower()
                  if ('/' in s or 'http' in low) and any(k in low for k in ['api','map','role','login','user','point','collect','token','bind','server','sdk']):
                      lits.append(s)
              for s in sorted(set(lits))[:500]: print(s[:900])
          PY
          echo "SUMMARY_BYTES $(wc -c < official-sync-store.txt)"

      - name: Upload compact forensic artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-wwm-sync-store
          path: official-sync-store.txt
          if-no-files-found: error
          retention-days: 1
