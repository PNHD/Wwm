name: Probe Official WWM API

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-official-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe public official map API and CORS
        shell: bash
        run: |
          set -euo pipefail
          base='https://s2.easebar.com/39f12eda6b86452b'
          origin='https://wwm-atlas-pnhd.pages.dev'
          : > probe.txt
          probe_get() {
            local path="$1"
            echo "=== GET $path ===" >> probe.txt
            curl --silent --show-error --location --compressed -D - "$base$path" -o /tmp/body >> probe.txt || true
            echo '--- BODY ---' >> probe.txt
            head -c 12000 /tmp/body >> probe.txt || true
            echo >> probe.txt
          }
          probe_options() {
            local path="$1" method="$2" headers="$3"
            echo "=== OPTIONS $path ===" >> probe.txt
            curl --silent --show-error -X OPTIONS -D - \
              -H "Origin: $origin" \
              -H "Access-Control-Request-Method: $method" \
              -H "Access-Control-Request-Headers: $headers" \
              "$base$path" -o /tmp/options >> probe.txt || true
            echo '--- BODY ---' >> probe.txt
            head -c 4000 /tmp/options >> probe.txt || true
            echo >> probe.txt
          }
          probe_get '/api/map/list?lang=en-US'
          probe_get '/api/map/points?mapId=1&lang=en-US'
          probe_options '/api/map/list' GET 'accept-language'
          probe_options '/api/auth/ursRoles' POST 'content-type'
          echo '=== POST ursRoles invalid fixture ===' >> probe.txt
          curl --silent --show-error --location --compressed -D - \
            -H 'content-type: application/json' \
            --data '{"loginChannel":"netease_global","appChannel":"netease_global.h5activity","platform":"web","sdkuid":"0","sessionid":"invalid","sdkVersion":"1.0.0","udid":"00000000-0000-4000-8000-000000000000","deviceid":"0","access_token":""}' \
            "$base/api/auth/ursRoles" -o /tmp/roles >> probe.txt || true
          echo '--- BODY ---' >> probe.txt
          head -c 8000 /tmp/roles >> probe.txt || true
          echo >> probe.txt

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: official-api-probe
          path: probe.txt
          if-no-files-found: error
          retention-days: 1
