name: Forensic WWM Sync Surfaces

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-official-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace public sync surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --compressed \
            'https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js/common-a15f2132.js' \
            -o /tmp/official-common.js
          curl --fail --silent --show-error --location --compressed \
            'https://sdk-os.mpsdk.easebar.com/gzip_static/h5/v1.3.1/js/mpay-h5-sdk-oversea.umd.js' \
            -o /tmp/mpay.js
          curl --fail --silent --show-error --location --compressed \
            'https://wwmmap.pages.dev/js/map_2026/app.js?v=5' \
            -o /tmp/legacy-app.js

          python - <<'PY' > sync-surfaces.txt
          from pathlib import Path
          import re
          files=[Path('/tmp/official-common.js'),Path('/tmp/mpay.js'),Path('/tmp/legacy-app.js')]
          terms=['127.0.0.1:3030','localhost','start_game_sync','call_client_method','gameauth','WebSocket','wss://','ws://','relay','invokeClientMethod','getSauthJson','h72naLogin','ursRoles','ursLogin','ticket','bridge']
          for p in files:
              text=p.read_text('utf-8',errors='ignore')
              print(f'=== {p.name} BYTES {len(text.encode())} ===')
              for term in terms:
                  start=0; n=0
                  while True:
                      i=text.lower().find(term.lower(),start)
                      if i<0 or n>=16: break
                      lo=max(0,i-1800); hi=min(len(text),i+4200)
                      print(f'--- {term} @ {i} ---')
                      print(' '.join(text[lo:hi].split())[:8200])
                      start=i+len(term); n+=1
              print('--- NETWORK LITERALS ---')
              urls=sorted(set(re.findall(r'https?://[^\"\'<>\\\s)]+|wss?://[^\"\'<>\\\s)]+',text)))
              for u in urls:
                  low=u.lower()
                  if any(k in low for k in ['127.0.0.1','localhost','sync','relay','gameauth','client','easebar','wherewindsmeet','wwmmap']):
                      print(u[:1200])
          PY

          # Keep complete public assets in the short-lived artifact so protocol context is inspectable.
          cp /tmp/official-common.js ./official-common.js
          cp /tmp/mpay.js ./mpay.js
          cp /tmp/legacy-app.js ./legacy-app.js

      - name: Upload forensic artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwm-sync-surfaces
          path: |
            sync-surfaces.txt
            official-common.js
            mpay.js
            legacy-app.js
          if-no-files-found: error
          retention-days: 1
