name: Forensic Official WWM Sync

on:
  push:
    branches: [feature/wwmsync-native-official]
    paths: ['.github/workflows/forensic-official-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe public official surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wwm
          probe() {
            name="$1"; url="$2"
            echo "===== ${name} ====="
            code=$(curl -L --max-time 30 --connect-timeout 10 -sS -D "/tmp/wwm/${name}.headers" -o "/tmp/wwm/${name}.body" -w '%{http_code}' "$url" || true)
            echo "HTTP ${code} URL ${url}"
            grep -iE '^(HTTP/|location:|content-type:|server:|access-control-|set-cookie:)' "/tmp/wwm/${name}.headers" | sed -E 's/(set-cookie:).*/\1 [redacted]/I' | tail -n 30 || true
            echo "BODY_BYTES $(wc -c < "/tmp/wwm/${name}.body" 2>/dev/null || echo 0)"
          }

          probe global_map 'https://www.wherewindsmeetgame.com/map/en/'
          probe global_api_list 'https://s2.easebar.com/39f12eda6b86452b/api/map/list?lang=en-US'
          probe global_api_points 'https://s2.easebar.com/39f12eda6b86452b/api/map/points?mapId=1&lang=en-US'
          probe global_user_info 'https://s2.easebar.com/39f12eda6b86452b/api/user/info?lang=en-US'
          probe global_auth_roles 'https://s2.easebar.com/39f12eda6b86452b/api/auth/ursRoles?lang=en-US'
          probe cn_ds 'https://ds.163.com/g/yysls'
          probe cn_dd 'https://dd.163.com/'
          probe cn_game 'https://www.yysls.cn/'

          echo '===== Unauthenticated Global API bodies ====='
          for n in global_user_info global_auth_roles; do
            echo "-- $n"
            cat "/tmp/wwm/${n}.body" | head -c 1200; echo
          done

          echo '===== Global bundle route/auth contract ====='
          python3 - <<'PY'
          import re, pathlib, urllib.parse, urllib.request, json
          html=pathlib.Path('/tmp/wwm/global_map.body').read_text('utf-8','ignore')
          urls=[]
          for s in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I):
              u=urllib.parse.urljoin('https://www.wherewindsmeetgame.com/map/en/', s)
              if u.startswith('https://www.wherewindsmeetgame.com/'):
                  urls.append(u)
          needles=['/api/auth/','/api/user/','/api/map/','ursRoles','ursLogin','h72naLogin','user/point/finish','finished','roleList','roleId','token','cookie','Mpay','login','logout','position','WebSocket','localStorage','sessionStorage']
          for u in urls[:12]:
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=20).read(10_000_000).decode('utf-8','ignore')
              except Exception as e:
                  print('FETCH_ERR',u,type(e).__name__); continue
              print('SCRIPT',u,'BYTES',len(data))
              routes=sorted(set(re.findall(r'["\'](/api/(?:auth|user|map)/[^"\']+)["\']',data)))
              for r in routes: print('ROUTE',r[:300])
              for needle in needles:
                  start=0; hits=0
                  while hits<6:
                      i=data.find(needle,start)
                      if i<0: break
                      print('CTX',needle, data[max(0,i-260):i+420].replace('\n',' ')[:900])
                      start=i+len(needle); hits+=1
          PY

          echo '===== Global API point schema sample ====='
          python3 - <<'PY'
          import json, pathlib
          for n in ('global_api_list','global_api_points'):
              x=json.loads(pathlib.Path('/tmp/wwm/'+n+'.body').read_text('utf-8','ignore'))
              print('API',n,'TOP_KEYS',list(x)[:12])
              d=x.get('data')
              if isinstance(d,dict): print('DATA_KEYS',list(d)[:30])
          x=json.loads(pathlib.Path('/tmp/wwm/global_api_points.body').read_text('utf-8','ignore'))
          cats=(x.get('data') or {}).get('categories') or []
          for g in cats[:1]:
              print('GROUP_KEYS',list(g)[:30])
              for c in (g.get('childCategories') or [])[:1]:
                  print('CATEGORY_KEYS',list(c)[:30])
                  p=(c.get('pointList') or [{}])[0]
                  print('POINT_SAMPLE_KEYS',list(p)[:50])
                  print('POINT_SAMPLE',json.dumps(p,ensure_ascii=False)[:1800])
          PY

          echo '===== CN DS/DD public bundle discovery ====='
          python3 - <<'PY'
          import re, pathlib, urllib.parse, urllib.request
          sources=[('ds','https://ds.163.com/g/yysls','/tmp/wwm/cn_ds.body'),('dd','https://dd.163.com/','/tmp/wwm/cn_dd.body')]
          needles=['yysls','燕云','实时地图','共创大地图','地图','同步','位置','position','progress','sync','WebSocket','wss://','ws://','localhost','127.0.0.1','ipc','native','bridge','download','exe','setup','role','game']
          fetched=[]
          for label,base,path in sources:
              html=pathlib.Path(path).read_text('utf-8','ignore')
              refs=[]
              for pat in [r'<script[^>]+src=["\']([^"\']+)', r'https?://[^"\'<>\s]+\.js(?:\?[^"\'<>\s]*)?']:
                  for s in re.findall(pat,html,re.I):
                      u=urllib.parse.urljoin(base,s).rstrip('\\')
                      if u not in refs: refs.append(u)
              print('SOURCE',label,'SCRIPT_COUNT',len(refs))
              for u in refs[:30]:
                  print('SCRIPT_REF',u)
                  if not any(h in u for h in ('g.166.net','static.dd.163.com','ds.res.netease.com','ds.163.com','dd.163.com')): continue
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                      data=urllib.request.urlopen(req,timeout=20).read(12_000_000).decode('utf-8','ignore')
                  except Exception as e:
                      print('FETCH_ERR',u,type(e).__name__); continue
                  fetched.append((u,data)); print('FETCHED',u,'BYTES',len(data))
          seen=set()
          for u,data in fetched:
              if not any(k.lower() in data.lower() for k in ('yysls','燕云','实时地图','共创大地图')): continue
              print('RELEVANT_SCRIPT',u)
              for needle in needles:
                  low=data.lower(); nlow=needle.lower(); start=0; hits=0
                  while hits<8:
                      i=low.find(nlow,start)
                      if i<0: break
                      ctx=' '.join(data[max(0,i-320):i+520].split())
                      key=(needle,ctx[:500])
                      if key not in seen:
                          seen.add(key); print('CNCTX',needle,ctx[:1000])
                      start=i+len(needle); hits+=1
          PY

          echo '===== Public Global API method/CORS probes ====='
          for path in \
            '/api/user/point/finish' \
            '/api/map/point' \
            '/api/auth/ursRoles' \
            '/api/auth/ursLogin' \
            '/api/auth/h72naLogin'; do
            echo "-- $path"
            curl -sS --max-time 15 -o /dev/null -D - -X OPTIONS \
              -H 'Origin: https://wwmsync.pages.dev' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type' \
              "https://s2.easebar.com/39f12eda6b86452b${path}" \
              | grep -iE '^(HTTP/|allow:|access-control-|server:)' || true
          done
