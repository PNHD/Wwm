name: Forensic Official WWM Sync

on:
  push:
    branches: [feature/wwmsync-native-official]
    paths: ['.github/workflows/forensic-official-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trace Global official shared auth/store chunks
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js'
          mkdir -p /tmp/g
          for f in common-a15f2132.js index-1d9774f9.js index-be137abf.js vue.runtime.esm-bundler-11d7002a.js pc-d3f0a0d4.js; do
            curl -fsSL --max-time 30 "$ROOT/$f" -o "/tmp/g/$f"
            echo "$f $(wc -c < /tmp/g/$f)"
          done

          python3 - <<'PY'
          import pathlib,re
          needles=['silentLogin','loginWithRole','updateToken','mapPoints','mapList','ursRoles','ursLogin','h72naLogin','/api/auth/','/api/user/','/api/map/','MpayOSSDK','mpay','unisdk_token','token','roleList','Authorization','withCredentials','credentials','X-','headers','finished','finishPointsNum']
          for p in pathlib.Path('/tmp/g').glob('*.js'):
              s=p.read_text('utf-8','ignore')
              hits=[n for n in needles if n.lower() in s.lower()]
              if not hits: continue
              print('\n===== FILE',p.name,'HITS',','.join(hits),'=====')
              for n in hits:
                  pos=0; count=0
                  while count<10:
                      i=s.lower().find(n.lower(),pos)
                      if i<0: break
                      print('CTX',n,' '.join(s[max(0,i-1200):i+2200].split())[:3500])
                      pos=i+len(n); count+=1
              routes=sorted(set(re.findall(r'["\']([^"\']*(?:/api/(?:auth|user|map)/)[^"\']*)["\']',s)))
              for r in routes: print('ROUTE_LITERAL',r[:800])
          PY

          echo '===== INVALID FIELD PROBES ====='
          API='https://s2.easebar.com/39f12eda6b86452b'
          for spec in \
            'ursRoles:{"token":"x"}' \
            'ursRoles:{"unisdkToken":"x"}' \
            'ursLogin:{"roleId":"x"}' \
            'ursLogin:{"server":"x","roleId":"x"}' \
            'h72naLogin:{"ticket":"x"}'; do
            name=${spec%%:*}; body=${spec#*:}
            echo "-- $name $body"
            curl -sS --max-time 15 -X POST "$API/api/auth/$name?lang=en-US" -H 'Content-Type: application/json' -H 'Origin: https://wwmsync.pages.dev' --data "$body" | head -c 1200; echo
          done

      - name: Resolve official DD Windows client and inspect package statically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dd
          CHUNK='https://static.dd.163.com/frontendddwebsitenext/_next/static/chunks/1733-eab8b6d336eae216.js'
          curl -fsSL --max-time 30 "$CHUNK" -o /tmp/dd/chunk.js
          echo '===== DD API CONSTANTS / DOWNLOAD METHOD ====='
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('/tmp/dd/chunk.js').read_text('utf-8','ignore')
          for n in ['75609:function','get_channel_download_link','setDownloadContext','baseURL','cc.163.com','api.cc','x64_download_link','x32_download_link']:
              pos=0; c=0
              while c<8:
                  i=s.find(n,pos)
                  if i<0: break
                  print('DDCTX',n,' '.join(s[max(0,i-1400):i+2600].split())[:4200])
                  pos=i+len(n); c+=1
          PY

          # Probe likely official API roots without credentials; endpoint is the public website's own download resolver.
          for host in 'https://api.cc.163.com' 'https://api.dd.163.com' 'https://dd.163.com'; do
            echo "===== HOST $host ====="
            for path in '/v1/teamchannelpkg/get_channel_download_link' '/v1/mixteamversion/setDownloadContext'; do
              echo "-- $path GET"
              curl -sS --max-time 15 -D /tmp/dd/h -o /tmp/dd/b -w 'HTTP_%{http_code}\n' "$host$path" || true
              grep -iE '^(content-type:|location:|server:)' /tmp/dd/h | tail -n 10 || true
              head -c 1000 /tmp/dd/b; echo
              echo "-- $path POST {}"
              curl -sS --max-time 15 -X POST -H 'Content-Type: application/json' --data '{}' -D /tmp/dd/h -o /tmp/dd/b -w 'HTTP_%{http_code}\n' "$host$path" || true
              head -c 1000 /tmp/dd/b; echo
            done
          done
