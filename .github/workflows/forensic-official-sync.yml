name: Forensic Official WWM Sync Surface

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-official-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract public official map API route strings
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.wherewindsmeetgame.com/map/en/'
          bundle='https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js/pc-d3f0a0d4.js'
          curl --fail --silent --show-error --location --compressed "$page" -o /tmp/page.html
          curl --fail --silent --show-error --location --compressed "$bundle" -o /tmp/app.js

          python - <<'PY' > official-sync-routes.txt
          from pathlib import Path
          import re
          text=Path('/tmp/app.js').read_text('utf-8',errors='ignore')
          print('BUNDLE_BYTES',len(text.encode()))

          # Public string literals likely to describe API routes, login/binding, roles or map point state.
          strings=[]
          for m in re.finditer(r'(["\'])(.{1,500}?)\1', text, re.S):
              s=m.group(2)
              low=s.lower()
              if any(k in low for k in ['api','login','bind','role','point','map','token','user','uuid','collect','complete','progress','signin','silent']) and ('/' in s or len(s)<120):
                  strings.append((m.start(),s))
          seen=set()
          print('=== RELEVANT STRING LITERALS ===')
          for pos,s in strings:
              clean=' '.join(s.split())
              if clean in seen: continue
              seen.add(clean)
              print(f'{pos}: {clean[:500]}')

          print('\n=== FUNCTION CONTEXTS ===')
          for term in ['silentLogin','loginWithRole','mapPoints','roleList','updateToken','userinfo','showBind','isLogin']:
              start=0; n=0
              while True:
                  i=text.find(term,start)
                  if i<0 or n>=12: break
                  lo=max(0,i-900); hi=min(len(text),i+1800)
                  print(f'--- {term} @ {i} ---')
                  print(' '.join(text[lo:hi].split())[:4000])
                  start=i+len(term); n+=1

          print('\n=== RELATIVE ROUTE CANDIDATES ===')
          routes=sorted(set(re.findall(r'["\'](\/[A-Za-z0-9_?=&.%:{}${}\-\/+]{3,220})["\']',text)))
          for r in routes:
              if any(k in r.lower() for k in ['api','login','role','map','point','user','bind','token','data','collect','progress']):
                  print(r)
          PY

          echo "SUMMARY_BYTES $(wc -c < official-sync-routes.txt)"

      - name: Upload compact forensic artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-wwm-sync-routes
          path: official-sync-routes.txt
          if-no-files-found: error
          retention-days: 1
