name: Forensic WWM Sync Protocol

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-official-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public legacy sync modules
        shell: bash
        run: |
          set -euo pipefail
          root='https://wwmmap.pages.dev/js/map_2026'
          for spec in \
            'gamesync.js?v=4|gamesync.js' \
            'auth_modal.js|auth_modal.js' \
            'tracking.js|tracking.js' \
            'map_config.js|map_config.js' \
            'corellator.js|corellator.js'; do
            url="${spec%%|*}"; out="${spec##*|}"
            curl --fail --silent --show-error --location --compressed "$root/$url" -o "$out"
          done

          python - <<'PY' > legacy-sync-protocol.txt
          from pathlib import Path
          import re
          files=[Path('gamesync.js'),Path('auth_modal.js'),Path('tracking.js')]
          terms=['start_game_sync','invokeClientMethod','call_client_method','gameauth','WebSocket','relay','connectionKey','playerId','password','packet','chunk','full','museum','knowledge','beings','position','permission','server']
          for p in files:
              text=p.read_text('utf-8',errors='ignore')
              print(f'=== {p.name} BYTES {len(text.encode())} ===')
              for term in terms:
                  start=0; n=0
                  while True:
                      i=text.lower().find(term.lower(),start)
                      if i<0 or n>=30: break
                      lo=max(0,i-2400); hi=min(len(text),i+6200)
                      print(f'--- {term} @ {i} ---')
                      print(text[lo:hi])
                      start=i+len(term); n+=1
              print('--- NETWORK / ROUTE LITERALS ---')
              for q,s in re.findall(r'(["\'])(.{1,700}?)\1',text,re.S):
                  low=s.lower()
                  if any(k in low for k in ['/service/','/api/','wss://','ws://','game_sync','client_method','relay','websocket']):
                      print(' '.join(s.split())[:1000])
          PY

      - name: Upload protocol artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwm-legacy-sync-protocol
          path: |
            legacy-sync-protocol.txt
            gamesync.js
            auth_modal.js
            tracking.js
            map_config.js
            corellator.js
          if-no-files-found: error
          retention-days: 1
