name: Forensic Official Global Data API

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract first-party API routes and map linkage
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.wherewindsmeetgame.com/m/zt/20251121182818/js'
          curl --fail --silent --show-error --location "$base/index-67f2100d.js" -o /tmp/index.js
          curl --fail --silent --show-error --location "$base/app-9b07739a.js" -o /tmp/app.js
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['index','app']:
              t=Path('/tmp/'+name+'.js').read_text('utf-8',errors='ignore')
              print('FILE',name,'BYTES',len(t.encode()))
              routes=set()
              for pat in [r'url:\s*["\'`]([^"\'`]+)["\'`]',r'["\'`](/(?:login|logout|role|rank|map|point|progress|explore|exploration|record|data|profile|battle|combat|score|user|player|character|collect|finish)[^"\'`]*)["\'`]']:
                  for m in re.finditer(pat,t,re.I):
                      v=m.group(1)
                      if len(v)<220: routes.add(v)
              print('ROUTES_BEGIN')
              for x in sorted(routes): print(x)
              print('ROUTES_END')
              for term in ['https://s2.easebar.com/78ae9d90792a3e9b','/login/roleList','/login/roleLogin','qinghe','hexi','kaifeng','exploration','map/${','wherewindsmeetgame.com/map','access_token','roleInfo','score','rank','play_time','martial','elegance']:
                  i=t.lower().find(term.lower())
                  if i>=0:
                      print('CTX',term,'::',t[max(0,i-500):min(len(t),i+1600)].replace('\n',' ')[:2100])
          PY
