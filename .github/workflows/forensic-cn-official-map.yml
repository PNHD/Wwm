name: Trace Official CN And Global Map Sync APIs

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trace official public map and data-tool surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wwm/{cn,global}

          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import html, re, subprocess

          targets = [
            ('global-map', 'https://www.wherewindsmeetgame.com/map/en/', Path('/tmp/wwm/global')),
            ('global-data', 'https://www.wherewindsmeetgame.com/m/2025h5sjgj/en/', Path('/tmp/wwm/global')),
            ('cn-dd', 'https://dd.163.com/?utm_source=yyslsjingling&auto=1', Path('/tmp/wwm/cn')),
            ('cn-helper', 'https://act.ds.163.com/7cf1cfa6a9edf833/', Path('/tmp/wwm/cn')),
          ]

          for name, url, root in targets:
            root.mkdir(parents=True, exist_ok=True)
            html_path = root / f'{name}.html'
            print(f'=== FETCH PAGE {name} {url} ===')
            r = subprocess.run(['curl','-LfsS','--compressed','-A','Mozilla/5.0',url,'-o',str(html_path)])
            print('PAGE_RC', r.returncode, 'BYTES', html_path.stat().st_size if html_path.exists() else 0)
            if not html_path.exists():
              continue
            text = html_path.read_text('utf8', errors='ignore')
            refs = []
            for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)', text, re.I):
              u = urljoin(url, html.unescape(m.group(1)))
              if u not in refs:
                refs.append(u)
            print('SCRIPTS', len(refs))
            for i, u in enumerate(refs[:120]):
              fn = root / f'{name}-{i:03}.js'
              rr = subprocess.run(['curl','-LfsS','--compressed','-A','Mozilla/5.0',u,'-o',str(fn)])
              print('SCRIPT', i, 'RC', rr.returncode, 'BYTES', fn.stat().st_size if fn.exists() else 0, u)

          dd = Path('/tmp/wwm/cn/dd-link.js')
          u = 'https://cc.res.netease.com/act/sdk/dd-link/v1.2.0/index.js'
          rr = subprocess.run(['curl','-LfsS','--compressed','-A','Mozilla/5.0',u,'-o',str(dd)])
          print('DD_LINK_RC', rr.returncode, 'BYTES', dd.stat().st_size if dd.exists() else 0, u)
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          roots = [('GLOBAL', Path('/tmp/wwm/global')), ('CN', Path('/tmp/wwm/cn'))]
          terms = [
            'api/', '/api', 'axios', 'baseURL', 'fetch(', 'XMLHttpRequest',
            'login', 'logout', 'account', 'auth', 'token', 'session', 'cookie', 'passport',
            'role', 'character', 'uid', 'server', 'gameRole', 'bind',
            'map', 'point', 'marker', 'collect', 'finish', 'finished', 'complete', 'completed',
            'progress', 'explore', 'treasure', 'chest', 'achievement', 'sync', 'realtime',
            'websocket', 'wss://', 'ws://', 'EventSource', 'SSE', 'poll', 'interval',
            'dd-link', 'openApp', 'openGame', 'bridge', 'native', 'postMessage',
            'localhost', '127.0.0.1', 'scheme', 'invoke'
          ]
          url_re = re.compile(r'https?://[^"\'`<>\\\s]+|wss?://[^"\'`<>\\\s]+', re.I)
          endpoint_re = re.compile(r'["\']((?:/|https?://)[^"\']{2,240})["\']')

          for label, root in roots:
            files = sorted([p for p in root.rglob('*') if p.is_file() and p.stat().st_size < 20_000_000])
            print(f'\n===== {label} FILES {len(files)} =====')
            for p in files:
              print('FILE', p.name, p.stat().st_size)

            urls=[]
            endpoints=[]
            for p in files:
              text=p.read_text('utf8',errors='ignore')
              for m in url_re.finditer(text):
                v=m.group(0).rstrip('),;}')
                if v not in urls: urls.append(v)
              for m in endpoint_re.finditer(text):
                v=m.group(1)
                lv=v.lower()
                if any(k in lv for k in ['api','login','auth','role','character','map','point','collect','finish','progress','sync','server','user','profile']):
                  if v not in endpoints: endpoints.append(v)

            print(f'\n===== {label} URLS =====')
            for v in urls[:500]: print(v)
            print(f'\n===== {label} ENDPOINT CANDIDATES =====')
            for v in endpoints[:700]: print(v)

            print(f'\n===== {label} FOCUSED CONTEXTS =====')
            seen=set()
            for term in terms:
              shown=0
              for p in files:
                text=p.read_text('utf8',errors='ignore')
                for m in re.finditer(re.escape(term), text, re.I):
                  ctx=text[max(0,m.start()-650):min(len(text),m.start()+1500)].replace('\n',' ')
                  key=(term,ctx[:300])
                  if key in seen: continue
                  seen.add(key)
                  low=ctx.lower()
                  if term.lower() in {'map','point','login','auth','token','role','uid','progress','sync','finished','complete','websocket','poll'}:
                    if not any(k in low for k in ['api','http','request','fetch','axios','server','user','game','map','role','account','token','session','socket']):
                      continue
                  print('TERM', term, 'FILE', p.name)
                  print(ctx[:2100])
                  shown += 1
                  if shown >= 8: break
                if shown >= 8: break
          PY

          echo '=== PUBLIC GLOBAL API PROBES ==='
          for url in \
            'https://s2.easebar.com/39f12eda6b86452b/api/map/list?lang=en-US' \
            'https://s2.easebar.com/39f12eda6b86452b/api/user/info?lang=en-US' \
            'https://s2.easebar.com/39f12eda6b86452b/api/user/profile?lang=en-US' \
            'https://s2.easebar.com/39f12eda6b86452b/api/role/list?lang=en-US' \
            'https://s2.easebar.com/39f12eda6b86452b/api/map/progress?lang=en-US' \
            'https://s2.easebar.com/39f12eda6b86452b/api/map/finish?lang=en-US'; do
            code=$(curl -L -sS --compressed -A 'Mozilla/5.0' -o /tmp/wwm/probe.body -w '%{http_code}' "$url" || true)
            echo "PROBE $code $url BYTES $(wc -c < /tmp/wwm/probe.body 2>/dev/null || echo 0)"
            head -c 700 /tmp/wwm/probe.body 2>/dev/null | tr '\n' ' '; echo
          done
