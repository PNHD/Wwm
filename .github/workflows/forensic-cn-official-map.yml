name: Forensic Official CN Map Interop

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect public official CN map/tool surfaces
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/probe.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const fs=require('fs');
          const urls=[
            'https://ds.163.com/g/yysls',
            'https://act.ds.163.com/6edef85118d3037a/?mapLevel=0&zoom=3'
          ];
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            let allJs=[];
            for(const target of urls){
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              const reqs=[]; const resps=[]; const js=[];
              page.on('request',r=>reqs.push(`${r.method()} ${r.resourceType()} ${r.url()}`));
              page.on('response',async r=>{
                const u=r.url(); resps.push(`${r.status()} ${u}`);
                if(/\.js(?:\?|$)|\.mjs(?:\?|$)/i.test(u)){
                  try{const body=await r.text(); if(body.length>200 && !/^\s*<!doctype html/i.test(body))js.push({u,body});}catch{}
                }
              });
              page.on('console',m=>console.log('CONSOLE',target,m.type(),m.text()));
              const nav=await page.goto(target,{waitUntil:'domcontentloaded',timeout:60000}).catch(e=>null);
              console.log('\n=== PAGE',target,'NAV',nav?.status(),page.url(),'===');
              await page.waitForTimeout(12000);
              console.log('TITLE',await page.title().catch(()=>''));
              console.log('BODY',JSON.stringify((await page.locator('body').innerText().catch(()=>'' )).slice(0,12000)));
              const links=(await page.locator('a').evaluateAll(as=>as.map(a=>({text:(a.innerText||'').trim().slice(0,120),href:a.href})).filter(x=>x.href))).slice(0,200);
              console.log('LINKS',JSON.stringify(links));
              console.log('IFRAMES',JSON.stringify(await page.locator('iframe').evaluateAll(xs=>xs.map(x=>x.src))));
              console.log('REQUESTS_BEGIN'); for(const x of [...new Set(reqs)]) console.log(x); console.log('REQUESTS_END');
              console.log('RESPONSES_BEGIN'); for(const x of [...new Set(resps)]) if(/ds\.163|163\.com|netease|yysl|map|api|ws|socket|plugin|download/i.test(x)) console.log(x); console.log('RESPONSES_END');
              allJs.push(...js);
              await page.close();
            }
            const unique=new Map(); for(const x of allJs) if(!unique.has(x.u)) unique.set(x.u,x.body);
            let i=0; for(const [u,body] of unique){fs.writeFileSync(`/tmp/cn-${i}.js`,body); console.log('JS_URL',i,u,'BYTES',body.length); i++;}
            await browser.close();
          })().catch(e=>{console.error('FATAL',e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/probe.cjs
          echo '=== JS INTEROP CONTEXT ==='
          python - <<'PY'
          from pathlib import Path
          import re
          terms=['websocket','ws://','wss://','127.0.0.1','localhost','postmessage','native','bridge','plugin','ipc','position','coordinate','location','collect','finish','finished','treasure','chest','player','roleid','serverid','gameid','yysls','com.netease.yysls','api/','graphql','socket','大神','大地图','同步','实时','坐标','宝箱','已采集']
          for p in sorted(Path('/tmp').glob('cn-*.js')):
              t=p.read_text('utf-8',errors='ignore'); low=t.lower(); hits=[x for x in terms if x.lower() in low]
              if not hits: continue
              print('\nFILE',p.name,'BYTES',len(t.encode()),'HITS',hits)
              centers=[]
              for term in hits:
                  needle=term.lower(); pos=0
                  while True:
                      i=low.find(needle,pos)
                      if i<0: break
                      if not any(abs(i-c)<1800 for c in centers):
                          centers.append(i)
                          print('\n---',term,'@',i,'---')
                          print(t[max(0,i-2200):min(len(t),i+5200)].replace('\n',' ')[:7600])
                      pos=i+len(needle)
                      if len(centers)>=35: break
                  if len(centers)>=35: break
              for u in sorted(set(re.findall(r'https?://[^\s"<>]+|wss?://[^\s"<>]+',t))):
                  if any(k in u.lower() for k in ['163','netease','yysl','map','api','socket','ws']): print('URL',u[:1200])
          PY
