name: Resolve Official Data Tool Token Persistence

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve token persistence
        shell: bash
        run: |
          set -euo pipefail
          root='https://www.wherewindsmeetgame.com/m/zt/20251121182818/js'
          curl -fsSL "$root/index-67f2100d.js" -o /tmp/i.js
          curl -fsSL "$root/app-9b07739a.js" -o /tmp/a.js
          python - <<'PY'
          from pathlib import Path
          import re
          for fn in ['i.js','a.js']:
            t=Path('/tmp/'+fn).read_text('utf8',errors='ignore')
            print('\nFILE',fn)
            pats=[r'state\s*:\s*\(\)\s*=>\s*\(\{[^}]{0,1200}token[^}]{0,1200}\}\)',r'updateToken[^,}]{0,800}',r'defineStore[^;]{0,2200}',r'persist[^;]{0,1800}',r'["\'][^"\']{0,50}token[^"\']{0,50}["\']']
            for pat in pats:
              ms=list(re.finditer(pat,t,re.I|re.S))
              print('PAT',pat,'COUNT',len(ms))
              for m in ms[:8]: print(t[max(0,m.start()-350):min(len(t),m.start()+1900)].replace('\n',' ')[:2250])
          PY
