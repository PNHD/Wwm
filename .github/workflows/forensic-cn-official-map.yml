name: Forensic Official Global Data Tool

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect Global Official Data Tool without submitting credentials
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/probe.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const fs=require('fs');
          const TARGET='https://www.wherewindsmeetgame.com/m/2025h5sjgj/en/';
          const interesting=/(api|auth|login|role|player|character|account|map|point|finish|collect|progress|position|rating|stat|bind|token|device|user|mine)/i;
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:430,height:932},isMobile:true});
            const reqs=[]; const resps=[]; const js=[];
            page.on('request',r=>{const u=r.url();if(['xhr','fetch','websocket'].includes(r.resourceType())||interesting.test(u))reqs.push(`${r.method()} ${r.resourceType()} ${u}`)});
            page.on('response',async r=>{const u=r.url();if(['xhr','fetch'].includes(r.request().resourceType()))resps.push(`${r.status()} ${r.request().resourceType()} ${u}`);if(/\.(?:m?js)(?:\?|$)/i.test(u)){try{const body=await r.text();if(body.length>500&&!/^\s*<!doctype html/i.test(body))js.push({u,body})}catch{}}});
            const nav=await page.goto(TARGET,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(10000);
            console.log(`PAGE HTTP=${nav.status()} FINAL=${page.url()} TITLE=${JSON.stringify(await page.title())}`);
            console.log('BODY',JSON.stringify((await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').slice(0,2500)));
            const controls=await page.locator('button,a,[role=button]').evaluateAll(xs=>xs.map((x,i)=>({i,t:(x.innerText||x.textContent||'').trim().replace(/\s+/g,' ').slice(0,100),tag:x.tagName,href:x.href||''})).filter(x=>x.t||x.href));
            for(const x of controls.slice(0,80))console.log('CONTROL',JSON.stringify(x));
            console.log('REQUESTS_INITIAL');for(const x of [...new Set(reqs)].filter(x=>interesting.test(x)).slice(0,80))console.log(x);
            const login=page.getByText(/^Log In$/i).first();
            if(await login.count()){
              console.log('LOGIN_CLICK target found');
              const before=reqs.length;
              await login.click({timeout:10000}).catch(e=>console.log('LOGIN_CLICK_ERR',e.message));
              await page.waitForTimeout(8000);
              console.log(`AFTER_LOGIN URL=${page.url()} BODY=${JSON.stringify((await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').slice(0,1800))}`);
              for(const x of [...new Set(reqs.slice(before))].filter(x=>interesting.test(x)).slice(0,60))console.log('REQ_AFTER_LOGIN',x);
            }
            const unique=new Map();for(const x of js)if(!unique.has(x.u))unique.set(x.u,x.body);
            console.log('JS_COUNT',unique.size);
            let n=0;
            const terms=['api/','/api','s2.easebar.com','h72_map_accessToken','ursRoles','ursLogin','finished','finishPointsNum','pointList','mapId','roleId','serverId','gameId','playerId','character','bind','progress','position','combat','rating','access_token','session','login'];
            for(const [u,body] of unique){
              const low=body.toLowerCase();
              const hits=[];
              for(const term of terms){const i=low.indexOf(term.toLowerCase());if(i>=0)hits.push([term,i])}
              if(!hits.length)continue;
              console.log('JS',u,'BYTES',body.length,'TERMS',hits.map(x=>x[0]).join(','));
              for(const [term,i] of hits.slice(0,8)){
                const s=body.slice(Math.max(0,i-250),Math.min(body.length,i+600)).replace(/\s+/g,' ').slice(0,850);
                console.log(`HIT ${term} :: ${s}`); if(++n>=60)break;
              }
              if(n>=60)break;
              const urls=[...new Set(body.match(/https?:\/\/[^\s"'<>\\)]+/g)||[])].filter(x=>interesting.test(x));
              for(const x of urls.slice(0,20))console.log('URL',x);
            }
            console.log('XHR_RESPONSES');for(const x of [...new Set(resps)].slice(0,80))console.log(x);
            await browser.close();
          })().catch(e=>{console.error('FATAL',e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/probe.cjs | tee /tmp/report.txt
          echo REPORT_BYTES=$(wc -c </tmp/report.txt)
          test $(wc -c </tmp/report.txt) -lt 70000
