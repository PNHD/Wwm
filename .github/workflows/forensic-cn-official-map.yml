name: Forensic Official CN Map Interop

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Distill first-party CN and Global sync surfaces
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/probe.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const fs=require('fs');
          const pages=[
            ['CN_GAME','https://ds.163.com/g/yysls'],
            ['CN_MAP','https://act.ds.163.com/6edef85118d3037a/?mapLevel=0&zoom=3'],
            ['GLOBAL_MAP','https://www.wherewindsmeetgame.com/map/en/'],
            ['GLOBAL_EVENT','https://www.wherewindsmeetgame.com/m/202604/qcrlr/en/']
          ];
          const reqRe=/(api|graphql|socket|websocket|\bws\b|sync|position|coordinate|role|player|game|bind|login|account|finish|collect|map|download|plugin|bridge|native|localhost|127\.0\.0\.1)/i;
          const linkRe=/(download|pc|windows|map|helper|tool|game|client|plugin|游戏|工具|地图|下载|大神)/i;
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const allJs=[];
            for(const [label,target] of pages){
              const page=await browser.newPage({viewport:{width:1280,height:800}});
              const reqs=[]; const js=[];
              page.on('request',r=>{const u=r.url(); if(reqRe.test(u))reqs.push(`${r.method()} ${r.resourceType()} ${u}`)});
              page.on('response',async r=>{const u=r.url(); if(/\.(?:m?js)(?:\?|$)/i.test(u)){try{const body=await r.text();if(body.length>500&&!/^\s*<!doctype html/i.test(body))js.push({u,body})}catch{}}});
              const nav=await page.goto(target,{waitUntil:'domcontentloaded',timeout:60000}).catch(()=>null);
              await page.waitForTimeout(8000);
              console.log(`PAGE ${label} HTTP=${nav?.status()||0} FINAL=${page.url()} TITLE=${JSON.stringify(await page.title().catch(()=>''))}`);
              const links=await page.locator('a').evaluateAll((as)=>as.map(a=>({t:(a.innerText||a.textContent||'').trim().replace(/\s+/g,' ').slice(0,100),h:a.href})).filter(x=>x.h));
              for(const x of links.filter(x=>linkRe.test(`${x.t} ${x.h}`)).slice(0,12))console.log(`LINK ${label} ${JSON.stringify(x.t)} ${x.h}`);
              for(const x of [...new Set(reqs)].slice(0,30))console.log(`REQ ${label} ${x}`);
              for(const x of js.slice(0,12)){console.log(`JS ${label} ${x.u}`);allJs.push({label,...x})}
              await page.close();
            }
            const terms=['127.0.0.1','localhost','websocket','wss://','postmessage','native','bridge','plugin','ipc','position','coordinate','roleid','serverid','gameid','finished','finishpointsnum','collect','treasure','chest','sync','bind','大神','大地图','同步','实时','坐标','宝箱','已采集'];
            let n=0;
            for(const x of allJs){
              const low=x.body.toLowerCase();
              for(const term of terms){
                const i=low.indexOf(term.toLowerCase()); if(i<0)continue;
                const s=x.body.slice(Math.max(0,i-180),Math.min(x.body.length,i+420)).replace(/\s+/g,' ').slice(0,600);
                console.log(`HIT ${x.label} ${term} ${x.u} :: ${s}`);
                if(++n>=45)break;
              }
              if(n>=45)break;
            }
            await browser.close();
          })().catch(e=>{console.error('FATAL',e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/probe.cjs | tee /tmp/report.txt
          echo REPORT_LINES=$(wc -l </tmp/report.txt)
          test $(wc -c </tmp/report.txt) -lt 60000
