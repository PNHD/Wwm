name: Trace Official Global Map Auth Store

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch map chunks and extract auth/progress contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wwm/chunks
          root='https://www.wherewindsmeetgame.com/pc/zt/20260526175803'
          curl -fsSL "$root/js/pc-d3f0a0d4.js" -o /tmp/wwm/chunks/pc-d3f0a0d4.js

          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          root='https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js/'
          out=Path('/tmp/wwm/chunks')
          seen={p.name for p in out.glob('*.js')}
          for round_no in range(4):
            names=[]
            for p in list(out.glob('*.js')):
              t=p.read_text('utf8',errors='ignore')
              pats=[
                r'["\']\./([A-Za-z0-9_.-]+\.js)["\']',
                r'import\(["\']\./([A-Za-z0-9_.-]+\.js)["\']\)',
                r'["\']js/([A-Za-z0-9_.-]+\.js)["\']',
              ]
              for pat in pats:
                for m in re.finditer(pat,t):
                  n=m.group(1)
                  if n not in seen and n not in names: names.append(n)
            if not names: break
            print('ROUND',round_no,'DISCOVERED',len(names))
            for n in names[:160]:
              r=subprocess.run(['curl','-fsSL',root+n,'-o',str(out/n)])
              print('FETCH',r.returncode,n)
              if r.returncode==0: seen.add(n)
          print('TOTAL_JS',len(list(out.glob('*.js'))))
          print('FILES')
          for p in sorted(out.glob('*.js')):
            print(p.name,p.stat().st_size)
          PY

          python - <<'PY'
          from pathlib import Path
          import re, json
          files=list(Path('/tmp/wwm/chunks').glob('*.js'))
          terms=['mapPoints','silentLogin','loginWithRole','roleList','updateToken','userinfo','finished','point/finish','user/point','map/points','map/list','ticket','h72na','access_token','pointFinish','finishPoint','toggleFinish','finish']
          api_like=re.compile(r'["\'](/(?:api/)?[^"\']{1,150})["\']')
          url_re=re.compile(r'https?://[^"\'`<>\\ ]+',re.I)

          routes=[]; urls=[]
          for p in files:
            t=p.read_text('utf8',errors='ignore')
            for m in api_like.finditer(t):
              v=m.group(1)
              if any(k in v.lower() for k in ['map','point','user','role','login','auth','ticket','finish','token']):
                if v not in routes: routes.append(v)
            for m in url_re.finditer(t):
              v=m.group(0).rstrip('),;')
              if any(k in v.lower() for k in ['s2.easebar','wherewindsmeet','mpsdk','api']):
                if v not in urls: urls.append(v)
          print('\n=== ROUTES ===')
          for v in routes[:400]: print(v)
          print('\n=== URLS ===')
          for v in urls[:200]: print(v)

          for term in terms:
            hits=[]
            for p in files:
              t=p.read_text('utf8',errors='ignore')
              for m in re.finditer(re.escape(term),t,re.I):
                s=t[max(0,m.start()-850):min(len(t),m.start()+1800)].replace('\n',' ')
                # focus noisy generic "finish" only when map/point/user context appears
                if term.lower()=='finish' and not any(k in s.lower() for k in ['point','map','user','finished']):
                  continue
                hits.append((p.name,s[:2650]))
                if len(hits)>=10: break
              if len(hits)>=10: break
            if hits:
              print('\n=== TERM',term,'===')
              for name,s in hits:
                print('FILE',name)
                print(s)

          # Find likely API wrappers: s2.easebar base +/- 1200 chars.
          print('\n=== API BASE CONTEXTS ===')
          for p in files:
            t=p.read_text('utf8',errors='ignore')
            for m in re.finditer(r's2\.easebar\.com',t,re.I):
              print('FILE',p.name)
              print(t[max(0,m.start()-1000):min(len(t),m.start()+2200)].replace('\n',' ')[:3200])

          # Find exact property constructions containing finished.
          print('\n=== FINISHED OBJECT CONTEXTS ===')
          for p in files:
            t=p.read_text('utf8',errors='ignore')
            for m in re.finditer(r'finished',t,re.I):
              s=t[max(0,m.start()-1400):min(len(t),m.start()+2600)].replace('\n',' ')
              if any(k in s.lower() for k in ['map/points','point/finish','pointlist','mappoint','categorypoints','request','axios']):
                print('FILE',p.name)
                print(s[:4000])
          PY
