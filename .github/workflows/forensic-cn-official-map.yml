name: Locate Official NetEase DD WWM Client Assets

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect public DD landing and client asset references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dd/js
          for u in \
            'https://dd.163.com/?utm_source=yyslsjingling&auto=1' \
            'https://dd.163.com/' \
            'http://dd.163.com/?utm_source=yyslsjingling&auto=1'; do
            echo "=== GET $u ==="
            curl -LfsS -D /tmp/dd/headers "$u" -o /tmp/dd/index.html && break || true
          done
          sed -n '1,40p' /tmp/dd/headers || true
          echo "HTML_BYTES $(wc -c < /tmp/dd/index.html 2>/dev/null || echo 0)"

          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import re, html, subprocess
          p=Path('/tmp/dd/index.html')
          t=p.read_text('utf8',errors='ignore') if p.exists() else ''
          base='https://dd.163.com/'
          refs=[]
          for m in re.finditer(r'(?:src|href)=["\']([^"\']+)',t,re.I):
            u=urljoin(base,html.unescape(m.group(1)))
            if u not in refs: refs.append(u)
          print('=== REFS ===')
          for u in refs: print(u)
          scripts=[u for u in refs if '.js' in u.lower()]
          for i,u in enumerate(scripts[:80]):
            r=subprocess.run(['curl','-LfsS',u,'-o',f'/tmp/dd/js/{i}.js'])
            print('FETCH_JS',i,r.returncode,u)
          print('=== INLINE URL/EXE CANDIDATES ===')
          pats=[r'https?://[^"\'<> ]+',r'[^"\'<> ]+\.exe(?:\?[^"\'<> ]*)?',r'[^"\'<> ]+\.msi(?:\?[^"\'<> ]*)?']
          for pat in pats:
            vals=[]
            for m in re.finditer(pat,t,re.I):
              v=html.unescape(m.group(0))
              if v not in vals: vals.append(v)
            for v in vals[:120]: print(v)
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('/tmp/dd/js').glob('*.js'))+[Path('/tmp/dd/index.html')]
          terms=['download','installer','setup','version','update','yysls','燕云','地图','实时','map','plugin','game','tool','auto=1','utm_source']
          url_re=re.compile(r'https?://[^"\'`<>\\ ]+',re.I)
          print('=== ALL INTERESTING URLS ===')
          urls=[]
          for p in files:
            if not p.exists(): continue
            t=p.read_text('utf8',errors='ignore')
            for m in url_re.finditer(t):
              u=m.group(0).rstrip('),;}')
              if any(k in u.lower() for k in ['download','update','patch','client','setup','dd.163','166.net','163.com','exe','msi']):
                if u not in urls: urls.append(u)
          for u in urls[:300]: print(u)
          print('=== CONTEXTS ===')
          for term in terms:
            shown=0
            for p in files:
              if not p.exists(): continue
              t=p.read_text('utf8',errors='ignore')
              for m in re.finditer(re.escape(term),t,re.I):
                ctx=t[max(0,m.start()-600):min(len(t),m.start()+1300)].replace('\n',' ')
                if term.lower() in {'map','game','tool'} and not any(k in ctx.lower() for k in ['yysls','燕云','download','plugin','dd.163','实时','地图']): continue
                print('TERM',term,'FILE',p.name)
                print(ctx[:1900])
                shown+=1
                if shown>=8: break
              if shown>=8: break
          PY
