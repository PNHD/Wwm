name: Trace Official CN And Global Map Sync APIs

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Build targeted forensic report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forensic/raw
          cat > /tmp/trace.py <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import html,json,re,subprocess

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          targets={
            'global-map':'https://www.wherewindsmeetgame.com/map/en/',
            'global-data':'https://www.wherewindsmeetgame.com/m/2025h5sjgj/en/',
            'cn-dd':'https://dd.163.com/?utm_source=yyslsjingling&auto=1',
            'cn-helper':'https://act.ds.163.com/7cf1cfa6a9edf833/'
          }
          extras={'cn-dd':['https://cc.res.netease.com/act/sdk/dd-link/v1.2.0/index.js']}
          root=Path('forensic/raw')
          root.mkdir(parents=True,exist_ok=True)

          def get(url,path):
            h=str(path)+'.headers'
            p=subprocess.run(['curl','-L','-sS','--compressed','--connect-timeout','5','--max-time','12','-A',UA,'-D',h,'-o',str(path),'-w','%{http_code}\t%{url_effective}',url],capture_output=True,text=True)
            status,_,effective=p.stdout.partition('\t')
            return {'url':url,'effective':effective.strip(),'http':status.strip(),'rc':p.returncode,'bytes':path.stat().st_size if path.exists() else 0}

          script_re=re.compile(r'<script[^>]+src=["\']([^"\']+)',re.I)
          js_url_re=re.compile(r'https?://[^"\'`<>\\\s]+\.js(?:\?[^"\'`<>\\\s]*)?',re.I)
          allmeta=[]; files={}
          for name,url in targets.items():
            d=root/name; d.mkdir(exist_ok=True)
            page=d/'page.html'; meta=get(url,page); meta.update(surface=name,kind='page'); allmeta.append(meta)
            files[name]=[page] if page.exists() else []
            text=page.read_text('utf8',errors='ignore') if page.exists() else ''
            refs=[]
            for m in script_re.finditer(text):
              u=urljoin(meta['effective'] or url,html.unescape(m.group(1)).replace('\\/','/'))
              if u not in refs: refs.append(u)
            for m in js_url_re.finditer(text):
              u=m.group(0).replace('\\/','/')
              if u not in refs: refs.append(u)
            refs += [x for x in extras.get(name,[]) if x not in refs]
            for i,u in enumerate(refs[:45]):
              p=d/f'{i:02d}.js'; m=get(u,p); m.update(surface=name,kind='script'); allmeta.append(m)
              if p.exists() and 0<p.stat().st_size<20_000_000: files[name].append(p)

          api_pat=re.compile(r'(?:https?|wss?)://[^"\'`<>\\\s]+|["\'](/[^"\']{2,220})["\']',re.I)
          needles=['/api','api/','login','auth','token','session','passport','role','character','uid','server','bind','player','progress','complete','finish','collect','marker','sync','websocket','wss://','ws://','eventsource','poll','dd-link','postmessage','localhost','127.0.0.1','openapp','opengame','native','bridge','scheme','invoke']
          relation=['fetch(','axios','xmlhttprequest','request(','/api','http://','https://','ws://','wss://','postmessage','localhost','127.0.0.1']
          out={'fetches':allmeta,'surface':{},'probes':[]}
          lines=['WWMSYNC OFFICIAL SYNC FORENSIC — TARGETED','===========================================']
          for m in allmeta:
            lines.append(f"FETCH {m['surface']} {m['kind']} HTTP={m['http']} rc={m['rc']} bytes={m['bytes']} {m['effective'] or m['url']}")

          for name,paths in files.items():
            candidates=[]; contexts=[]; seen=set()
            for p in paths:
              text=p.read_text('utf8',errors='ignore')
              for m in api_pat.finditer(text):
                v=(m.group(0) if m.group(0).startswith(('http://','https://','ws://','wss://')) else (m.group(1) or '')).replace('\\/','/')
                lv=v.lower()
                if v and any(n in lv for n in needles) and v not in candidates:
                  candidates.append(v)
              for term in needles:
                for m in list(re.finditer(re.escape(term),text,re.I))[:40]:
                  ctx=' '.join(text[max(0,m.start()-300):min(len(text),m.start()+650)].split())
                  lc=ctx.lower()
                  if not any(r in lc for r in relation): continue
                  if not (any(x in lc for x in ['login','auth','token','session','role','character','uid','player','bind']) or any(x in lc for x in ['progress','complete','finish','collect','marker','sync']) or any(x in lc for x in ['dd-link','postmessage','localhost','127.0.0.1','websocket','wss://','openapp','native','bridge'])): continue
                  key=ctx[:240]
                  if key in seen: continue
                  seen.add(key); contexts.append({'file':p.name,'term':term,'ctx':ctx[:950]})
                  if len(contexts)>=80: break
                if len(contexts)>=80: break
              if len(contexts)>=80: break
            out['surface'][name]={'candidates':candidates[:180],'contexts':contexts[:80]}
            lines += ['',f'### {name.upper()}','CANDIDATES']+[f'CAND {x}' for x in candidates[:180]]+['CONTEXTS']
            lines += [f"CTX {x['file']} [{x['term']}] {x['ctx']}" for x in contexts[:80]]

          for i,u in enumerate([
            'https://s2.easebar.com/39f12eda6b86452b/api/map/list?lang=en-US',
            'https://s2.easebar.com/39f12eda6b86452b/api/user/info?lang=en-US',
            'https://s2.easebar.com/39f12eda6b86452b/api/user/profile?lang=en-US',
            'https://s2.easebar.com/39f12eda6b86452b/api/role/list?lang=en-US',
            'https://s2.easebar.com/39f12eda6b86452b/api/map/progress?lang=en-US']):
            p=Path(f'/tmp/probe{i}.txt'); m=get(u,p); body=' '.join(p.read_text('utf8',errors='ignore')[:800].split()) if p.exists() else ''
            out['probes'].append({**m,'body':body}); lines.append(f"PROBE HTTP={m['http']} bytes={m['bytes']} {u} :: {body}")

          Path('forensic/evidence.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),'utf8')
          Path('forensic/report.txt').write_text('\n'.join(lines),'utf8')
          print('\n'.join(lines[:180]))
          print('REPORT_LINES',len(lines),'REPORT_BYTES',Path('forensic/report.txt').stat().st_size)
          PY
          python /tmp/trace.py

      - name: Upload forensic evidence
        uses: actions/upload-artifact@v4
        with:
          name: official-sync-forensic
          path: |
            forensic/report.txt
            forensic/evidence.json
          if-no-files-found: error
          retention-days: 7
