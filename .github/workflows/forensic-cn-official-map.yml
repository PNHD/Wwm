name: Find Official Data Tool Session Contract

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract token storage and SSO request contract
        shell: bash
        run: |
          set -euo pipefail
          src='https://www.wherewindsmeetgame.com/m/zt/20251121182818/js/index-67f2100d.js'
          curl --fail --silent --show-error --location "$src" -o /tmp/i.js
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/i.js').read_text('utf-8',errors='ignore')
          for term in ['updateToken(e)','updateToken(t.data)','token:', 'access_token', 'VueBase.cookie', 'cookie.get', 'cookie.set', '/sso/ticket', 'h72na_map']:
              print('\nTERM',term)
              pos=0
              while True:
                  i=t.find(term,pos)
                  if i<0: break
                  print(t[max(0,i-900):min(len(t),i+2300)].replace('\n',' ')[:3200])
                  pos=i+len(term)
                  if pos>i+len(term) and pos>0: break
          keys=sorted(set(re.findall(r'["\']([A-Za-z0-9_:-]{3,60}(?:token|Token|access|login)[A-Za-z0-9_:-]{0,30})["\']',t)))
          print('\nKEYS',keys[:120])
          PY
