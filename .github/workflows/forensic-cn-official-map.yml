name: Forensic Official Global Map SSO

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace first-party login config and map ticket exchange
        shell: bash
        run: |
          set -euo pipefail
          data='https://www.wherewindsmeetgame.com/m/zt/20251121182818/js'
          map='https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js'
          curl --fail --silent --show-error --location "$data/uniLogin-422132ba.js" -o /tmp/unilogin.js
          curl --fail --silent --show-error --location "$data/index-67f2100d.js" -o /tmp/data-index.js
          for f in pc-d3f0a0d4.js common-a15f2132.js index-be137abf.js index-1d9774f9.js; do curl --fail --silent --show-error --location "$map/$f" -o "/tmp/$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          files=['unilogin.js','data-index.js','pc-d3f0a0d4.js','common-a15f2132.js','index-be137abf.js','index-1d9774f9.js']
          terms=['MpayOSSDK','gameId','game_id','appChannel','app_channel','loginChannel','login_channel','enableLoginType','showLogin','gameRedirectUrl','JF_GAMEID','SAUTH_JSON','h72na_map','?ticket=','ticket','sso','h72_map_accessToken','accessToken','access_token','roleList','roleLogin','map/points','map/list','finished','finishPointsNum','pointList','s2.easebar.com']
          for fn in files:
              t=Path('/tmp/'+fn).read_text('utf-8',errors='ignore')
              print('\nFILE',fn,'BYTES',len(t.encode()))
              low=t.lower(); seen=[]
              for term in terms:
                  i=low.find(term.lower())
                  if i<0: continue
                  s=t[max(0,i-420):min(len(t),i+1300)].replace('\n',' ')[:1720]
                  print('CTX',term,'::',s)
              routes=set()
              for m in re.finditer(r'["\'`](/(?:api/)?(?:auth|login|logout|role|map|sso|ticket|point|progress)[^"\'`]*)["\'`]',t,re.I):
                  if len(m.group(1))<180: routes.add(m.group(1))
              if routes:
                  print('ROUTES',*sorted(routes),sep='\n')
              urls=sorted(set(re.findall(r'https://[^\s"\'`<>\\)]+',t)))
              for u in urls:
                  if any(k in u.lower() for k in ['s2.easebar','mpsdk','wherewindsmeetgame.com/map']): print('URL',u[:600])
          PY
