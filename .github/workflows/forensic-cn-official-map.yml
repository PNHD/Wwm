name: Trace Global Map Ticket And Completion Session

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace official Global role to map ticket flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wwm/mapjs

          tool='https://www.wherewindsmeetgame.com/m/zt/20251121182818'
          curl -fsSL "$tool/js/index-67f2100d.js" -o /tmp/wwm/global-index.js
          curl -fsSL "$tool/js/app-9b07739a.js" -o /tmp/wwm/global-app.js
          curl -fsSL "$tool/js/uniLogin-422132ba.js" -o /tmp/wwm/global-unilogin.js || true

          map='https://www.wherewindsmeetgame.com/map/en/'
          curl -fsSL -D /tmp/wwm/map.headers "$map" -o /tmp/wwm/map.html
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import re, html, subprocess
          base='https://www.wherewindsmeetgame.com/map/en/'
          t=Path('/tmp/wwm/map.html').read_text('utf8',errors='ignore')
          print('MAP_HTML_BYTES',len(t))
          assets=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)',t,re.I):
            u=urljoin(base,html.unescape(m.group(1)))
            if u not in assets: assets.append(u)
          print('MAP_SCRIPTS')
          for i,u in enumerate(assets):
            print(i,u)
            subprocess.run(['curl','-fsSL',u,'-o',f'/tmp/wwm/mapjs/{i}.js'],check=False)
          PY

          python - <<'PY'
          from pathlib import Path
          import re, json

          groups={
            'GLOBAL_TOOL':[Path('/tmp/wwm/global-index.js'),Path('/tmp/wwm/global-app.js'),Path('/tmp/wwm/global-unilogin.js')],
            'OFFICIAL_MAP':list(Path('/tmp/wwm/mapjs').glob('*.js')),
          }
          terms=['ticket','goToMap','roleList','roleLogin','roleInfo','access_token','finished','finish','point/finish','map/points','map/list','ursLogin','h72naLogin','auth','login','sdkuid','sessionid']
          route_re=re.compile(r'["\'](/[^"\']{1,180})["\']')
          url_re=re.compile(r'https?://[^"\'`<>\\ ]+',re.I)

          for label,files in groups.items():
            files=[p for p in files if p.exists()]
            print('\n==========',label,'FILES',[(p.name,p.stat().st_size) for p in files],'==========')
            routes=[]; urls=[]
            for p in files:
              t=p.read_text('utf8',errors='ignore')
              for m in route_re.finditer(t):
                v=m.group(1)
                if any(k in v.lower() for k in ['ticket','map','role','user','point','auth','login','finish','token']):
                  if v not in routes: routes.append(v)
              for m in url_re.finditer(t):
                v=m.group(0).rstrip('),;')
                if any(k in v.lower() for k in ['easebar','wherewindsmeet','unisdk','map']):
                  if v not in urls: urls.append(v)
            print('ROUTES',json.dumps(routes[:300],ensure_ascii=False))
            print('URLS',json.dumps(urls[:120],ensure_ascii=False))

            for term in terms:
              hits=[]
              for p in files:
                t=p.read_text('utf8',errors='ignore')
                for m in re.finditer(re.escape(term),t,re.I):
                  s=t[max(0,m.start()-700):min(len(t),m.start()+1500)].replace('\n',' ')
                  hits.append((p.name,s[:2200]))
                  if len(hits)>=12: break
                if len(hits)>=12: break
              if hits:
                print('\nTERM',term,'COUNT_SHOWN',len(hits))
                for name,s in hits:
                  print('FILE',name)
                  print(s)

          # Pull out every short route near the API wrapper in Global tool.
          gt=Path('/tmp/wwm/global-index.js').read_text('utf8',errors='ignore')
          print('\n========== GLOBAL TOOL API STRINGS =========')
          vals=[]
          for m in re.finditer(r'["\'](/[^"\']{1,100})["\']',gt):
            v=m.group(1)
            if v not in vals and re.match(r'^/[A-Za-z0-9_./-]+$',v): vals.append(v)
          for v in vals: print(v)
          PY
