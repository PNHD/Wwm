name: Locate Official Data Tool Access Token

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find token state implementation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location 'https://www.wherewindsmeetgame.com/m/zt/20251121182818/js/index-67f2100d.js' -o /tmp/i.js
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/i.js').read_text('utf-8',errors='ignore')
          for pat in [r'updateToken\s*\([^)]*\)\s*\{',r'token\s*:\s*[^,]{1,250}',r'localStorage\.getItem\([^)]{0,120}\)',r'localStorage\.setItem\([^)]{0,180}\)',r'cookie\.get\([^)]{0,120}\)',r'cookie\.set\([^)]{0,180}\)']:
              print('\nPATTERN',pat)
              for m in list(re.finditer(pat,t))[:15]:
                  i=m.start();print(t[max(0,i-500):min(len(t),i+1200)].replace('\n',' ')[:1700])
          PY
