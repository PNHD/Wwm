name: Verify Official Global Map SSO Contract

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/forensic-cn-official-map.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract h72na SSO exchange and test public boundary
        shell: bash
        run: |
          set -euo pipefail
          src='https://www.wherewindsmeetgame.com/pc/zt/20260526175803/js/common-a15f2132.js'
          curl --fail --silent --show-error --location "$src" -o /tmp/map.js
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/map.js').read_text('utf-8',errors='ignore')
          terms=['h72naSsoLogin','new URLSearchParams(window.location.search).get("ticket")',"new URLSearchParams(window.location.search).get('ticket')",'vN(','/api/auth/h72naLogin','history.replaceState','ticket=','updateToken','nickName']
          for term in terms:
              print('\nTERM',term)
              pos=0; count=0
              while True:
                  i=t.find(term,pos)
                  if i<0: break
                  print('CTX',t[max(0,i-900):min(len(t),i+2600)].replace('\n',' ')[:3500])
                  pos=i+len(term); count+=1
                  if count>=4: break
              print('COUNT',count)
          for m in re.finditer(r'h72naSsoLogin\s*\([^)]*\)\s*\{',t):
              i=m.start(); print('\nMETHOD_CTX',t[max(0,i-500):min(len(t),i+5000)].replace('\n',' ')[:5500])
          PY

          echo '=== CORS PREFLIGHT ==='
          curl --silent --show-error -X OPTIONS -D /tmp/cors.headers -o /tmp/cors.body \
            -H 'Origin: https://wwmsync.pages.dev' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            'https://s2.easebar.com/39f12eda6b86452b/api/auth/h72naLogin'
          awk 'BEGIN{IGNORECASE=1}/^HTTP\//||/^access-control-/{print}' /tmp/cors.headers

          echo '=== SYNTHETIC INVALID TICKET ==='
          status="$(curl --silent --show-error --output /tmp/invalid.json --write-out '%{http_code}' \
            -H 'Origin: https://wwmsync.pages.dev' \
            -H 'Content-Type: application/json' \
            --data '{"ticket":"wwmsync-invalid-synthetic-ticket"}' \
            'https://s2.easebar.com/39f12eda6b86452b/api/auth/h72naLogin' || true)"
          echo "HTTP $status"
          python - <<'PY'
          import json
          try:
              x=json.load(open('/tmp/invalid.json'))
              print(json.dumps({k:x.get(k) for k in ('success','code','msg','message') if k in x},ensure_ascii=False))
          except Exception as e:
              print('BODY_PARSE_ERROR',e)
          PY
