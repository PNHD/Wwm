name: WWMSync D0 Baseline Lineage Adjudication

on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/wwmsync-d0-baseline-lineage-adjudication.yml'
      - 'docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-lineage-amendment-2026-08-16.json'

permissions: {contents: read, actions: read}

env:
  GH_TOKEN: ${{ github.token }}
  VISION_BLOB: '58b5a1babf6a12b944f9b745b8bf7f7df573bf9b'
  CACHE_BLOB: '9388960a8bff53a9cfc7471372af144b7a28c34f'
  CACHE_BUILDER_BLOB: '1a227d06ae41660ea3e3b832e7f1921cc507c0d7'
  PREREG_BLOB: '29540d6e9b4458cf4681a71351fdd2b0cdd5f423'
  EMULATOR_RUN: '31984112126'
  EMULATOR_JOB: '95256000125'
  EMULATOR_ARTIFACT: '9273275377'
  EMULATOR_DIGEST: 'f75462e343b78d6764f2415fda32317d39bd4a667b389a119a64382d929c114f'
  GEOMETRY_RUN: '31984520812'
  GEOMETRY_ARTIFACT: '9273363651'
  GEOMETRY_DIGEST: '9c715dc7d21f50eca036a2422e7507511bcfd51ae431580a4d56d58177a1a258'

jobs:
  d0-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: feature/wwm-native-sync-v2}

      - name: Guard production, prereg, and strict D0-only closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:vision-sync.js)" = "$VISION_BLOB"
          test "$(git rev-parse HEAD:dashen-tile-cache.js)" = "$CACHE_BLOB"
          test "$(git rev-parse HEAD:tools/build_dashen_visual_cache.py)" = "$CACHE_BUILDER_BLOB"
          test "$(git rev-parse HEAD:docs/wwmsync/audits/domain-invariant-structural-descriptor-preregistration-2026-08-16.json)" = "$PREREG_BLOB"
          grep -Fq 'if(fine.scaleScore<.58)' vision-sync.js
          grep -Fq 'if(fine.intensityScore<.42)' vision-sync.js
          grep -Fq 'COARSE_BEAM=8;' vision-sync.js
          git diff --exit-code HEAD^ -- vision-sync.js dashen-tile-cache.js tools/build_dashen_visual_cache.py production/wwsync || true
          mkdir -p evidence/emulator evidence/geometry evidence/final
          printf 'MATCHER_EXECUTED=NO\nCANONICAL_D0_SCORED=NO\nDESCRIPTOR_OUTCOMES_EXECUTED=NO\nD1_D4_OPENED=NO\nRD=PENDING\n' > evidence/final/status.txt

      - name: Verify historical emulator adjudication evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EMULATOR_ARTIFACT" > evidence/emulator/meta.json
          test "$(jq -r '.workflow_run.id' evidence/emulator/meta.json)" = "$EMULATOR_RUN"
          test "$(jq -r '.digest' evidence/emulator/meta.json)" = "sha256:$EMULATOR_DIGEST"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EMULATOR_RUN/jobs" --jq ".jobs[]|select(.id==$EMULATOR_JOB)|.conclusion")" = failure
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$EMULATOR_ARTIFACT/zip" > evidence/emulator/evidence.zip
          unzip -q evidence/emulator/evidence.zip -d evidence/emulator/unpacked
          jq -e '.outcome=="EMULATOR_NOT_PRESERVED" and .implementationRecovered==false' evidence/emulator/unpacked/lineage-search/emulator-adjudication.json >/dev/null

      - name: Verify frozen candidate geometry lineage blocker
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$GEOMETRY_ARTIFACT" > evidence/geometry/meta.json
          test "$(jq -r '.workflow_run.id' evidence/geometry/meta.json)" = "$GEOMETRY_RUN"
          test "$(jq -r '.digest' evidence/geometry/meta.json)" = "sha256:$GEOMETRY_DIGEST"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$GEOMETRY_ARTIFACT/zip" > evidence/geometry/evidence.zip
          unzip -q evidence/geometry/evidence.zip -d evidence/geometry/unpacked
          jq -e '.descriptorOutcomesExecuted==false and .D1D4Opened==false and .RD=="PENDING"' evidence/geometry/unpacked/report/adjudication.json >/dev/null
          python - <<'PY'
          import json
          p='evidence/geometry/unpacked/report/adjudication.json'
          d=json.load(open(p))
          required=['path-of-void','buddha-fort','general-shrine-repeat','prosperity-haven','dreamfall-cliff']
          assert set(d['result'])==set(required)
          for cid in required:
              r=d['result'][cid]
              assert r['contextsFound']>0
              assert r['contextsWithXYSyntax']==0
              assert r['xyContexts']==[]
          PY

      - name: Validate explicit amendment and stop before canonical scoring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          p=pathlib.Path('docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-lineage-amendment-2026-08-16.json')
          d=json.loads(p.read_text())
          assert d['effectiveStatus']=='BLOCKED_NO_NUMERIC_SUPERSESSION'
          assert d['classification'].startswith('BL2')
          assert d['legacyD0Classification']=='HISTORICAL_NON_REPRODUCIBLE_RUNTIME_BASELINE'
          assert d['legacyEvidencePreserved'] is True and d['legacySuperseded'] is False
          assert d['emulatorRecovery']['outcome']=='EMULATOR_NOT_PRESERVED'
          assert d['candidateIdentityContract']['identityChanged'] is False
          assert d['candidateGeometryLineage']['status']=='INCOMPLETE_UPSTREAM_BLOCKER'
          assert len(d['candidateGeometryLineage']['missingHistoricalXY'])==5
          assert d['candidateGeometryLineage']['geometryRegenerationAuthorized'] is False
          assert d['canonicalBrowserRuntimeCandidate']['selectedBeforeDescriptorOutcomes'] is True
          assert d['canonicalBrowserRuntimeCandidate']['acceptedAsNumericBaseline'] is False
          assert d['canonicalD0']['status']=='NOT_FROZEN' and d['canonicalD0']['completeTableAvailable'] is False
          assert d['repeatabilityContract']['status']=='NOT_ESTABLISHED' and d['repeatabilityContract']['canonicalBrowserD0RunsExecuted']==0
          assert d['descriptorOutcomesInspected'] is False and d['D1D4Opened'] is False and d['D5Enabled'] is False
          assert d['descriptorAuditStatus']=='PENDING' and d['RD']=='PENDING'
          g=d['productionGuards']
          assert g['vision-sync.js']=='58b5a1babf6a12b944f9b745b8bf7f7df573bf9b'
          assert g['dashen-tile-cache.js']=='9388960a8bff53a9cfc7471372af144b7a28c34f'
          assert g['tools/build_dashen_visual_cache.py']=='1a227d06ae41660ea3e3b832e7f1921cc507c0d7'
          assert g['structural']==.58 and g['intensity']==.42 and g['coarseBeam']==8 and g['productionWwsyncUntouched'] is True
          out={
            'schema':'wwmsync-d0-lineage-adjudication-ci-v1',
            'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'verdict':'BL2 — CANONICAL RUNTIME NOT REPRODUCIBLE',
            'emulator':'EMULATOR_NOT_PRESERVED',
            'canonicalD0Frozen':False,
            'blockedBy':'five preregistered owner historical final-WRONG candidates have no preserved x/y; regeneration from canonical browser would mutate candidate identity/geometry after runtime change',
            'canonicalBrowserScoringExecuted':False,
            'descriptorOutcomesExecuted':False,
            'D1D4Opened':False,
            'descriptorAuditStatus':'PENDING',
            'RD':'PENDING'
          }
          pathlib.Path('evidence/final/adjudication.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Upload authoritative D0 lineage adjudication
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-d0-lineage-adjudication-${{ github.run_id }}
          path: |
            evidence/final/
            evidence/emulator/meta.json
            evidence/emulator/unpacked/lineage-search/emulator-adjudication.json
            evidence/geometry/meta.json
            evidence/geometry/unpacked/report/adjudication.json
            docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-lineage-amendment-2026-08-16.json
            docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-candidate-geometry-lineage-2026-08-16.json
          if-no-files-found: error
          retention-days: 30
