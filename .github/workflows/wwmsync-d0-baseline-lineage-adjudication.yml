name: WWMSync D0 Baseline Lineage Adjudication

on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/wwmsync-d0-baseline-lineage-adjudication.yml'
      - 'tools/research/domain-invariant-descriptor/d0-baseline-*.mjs'
      - 'docs/wwmsync/audits/domain-invariant-structural-descriptor-d0-lineage-amendment-2026-08-16.json'

permissions: {contents: read, actions: read}

env:
  VISION_BLOB: '58b5a1babf6a12b944f9b745b8bf7f7df573bf9b'
  CACHE_BLOB: '9388960a8bff53a9cfc7471372af144b7a28c34f'
  CACHE_BUILDER_BLOB: '1a227d06ae41660ea3e3b832e7f1921cc507c0d7'
  PREREG_BLOB: '29540d6e9b4458cf4681a71351fdd2b0cdd5f423'
  SS0_RUN: '31889065856'
  SS0_JOB: '95022507549'
  SS0_ARTIFACT: '9248045962'
  SS0_DIGEST: '0c5cc8a788274b33892b8bfdced58b552f99f6716e54acec5c45487a5bf2e1a2'
  FANG_RUN: '31609680755'
  FANG_ARTIFACT: '9146646914'
  FANG_DIGEST: 'b305444dff3ac2db6a544020093bd64022ffef5406c246849499d6a96525c041'
  OWNER_RUN: '31872599823'
  OWNER_JOB: '94983436586'
  OWNER_ARTIFACT: '9243841549'
  OWNER_DIGEST: 'e7786742e2e355c0d16d42d94b383db2f2a489e818a61dd955420f1aa0072b7a'
  SOURCE_RUN: '31872161105'
  SOURCE_ARTIFACT: '9243725171'
  SOURCE_DIGEST: 'a8a8c7f347562502d5c2271dc86f99c47e3c671302a271ba569e80b6efa9fae8'

jobs:
  d0-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: feature/wwm-native-sync-v2}

      - name: Guard production, prereg, and strict D0-only closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:vision-sync.js)" = "$VISION_BLOB"
          test "$(git rev-parse HEAD:dashen-tile-cache.js)" = "$CACHE_BLOB"
          test "$(git rev-parse HEAD:tools/build_dashen_visual_cache.py)" = "$CACHE_BUILDER_BLOB"
          test "$(git rev-parse HEAD:docs/wwmsync/audits/domain-invariant-structural-descriptor-preregistration-2026-08-16.json)" = "$PREREG_BLOB"
          grep -Fq 'if(fine.scaleScore<.58)' vision-sync.js
          grep -Fq 'if(fine.intensityScore<.42)' vision-sync.js
          grep -Fq 'COARSE_BEAM=8;' vision-sync.js
          ! grep -Eq '__diDescriptors|__diEvaluate|scoreCenter|D1|D2|D3|D4' tools/research/domain-invariant-descriptor/d0-baseline-instrument.mjs
          ! grep -Eq '__diDescriptors|__diEvaluate|scoreCenter|D1|D2|D3|D4' tools/research/domain-invariant-descriptor/d0-baseline-runner.mjs
          python - <<'PY'
          import json
          p=json.load(open('docs/wwmsync/audits/domain-invariant-structural-descriptor-preregistration-2026-08-16.json'))
          assert p['frozenBeforeDescriptorOutcomes'] is True and p['D5']['enabled'] is False
          assert p['poseGrid']['combinationsPerCandidate']==81
          assert p['productionGuards']['structuralGate']==.58 and p['productionGuards']['intensityGate']==.42 and p['productionGuards']['coarseBeam']==8
          PY
          mkdir -p d0-output d0-input d0-site/controls lineage-search
          printf 'DESCRIPTOR_OUTCOMES_EXECUTED=NO\nD0_ONLY=YES\nRD=PENDING\n' > d0-output/status.txt

      - name: Exhaust preserved historical emulator lineage once
        shell: bash
        run: |
          set -euo pipefail
          git rev-list --objects --all > lineage-search/all-reachable-objects.txt
          git log --all --full-history --name-status --pretty='format:COMMIT %H %cI %s' > lineage-search/all-history-name-status.txt
          grep -Ei 'owner|post-acquisition|replay|tracer|canvas|emulat' lineage-search/all-reachable-objects.txt > lineage-search/relevant-object-paths.txt || true
          python - <<'PY'
          import json,subprocess,pathlib,re
          rows=[]
          for line in pathlib.Path('lineage-search/relevant-object-paths.txt').read_text(errors='ignore').splitlines():
              parts=line.split(' ',1); oid=parts[0]; p=parts[1] if len(parts)>1 else ''
              try:
                  b=subprocess.check_output(['git','cat-file','-p',oid],stderr=subprocess.DEVNULL,timeout=3)
              except Exception: continue
              if len(b)>2_000_000 or b'\0' in b[:4096]: continue
              text=b.decode('utf-8','ignore')
              hits=[]
              for pat in [r'raw Canvas emulation',r'Canvas emulat',r'emulat.{0,40}Canvas',r'Canvas.{0,40}emulat',r'createCanvas',r'CanvasRenderingContext2D']:
                  if re.search(pat,text,re.I|re.S): hits.append(pat)
              if hits: rows.append({'object':oid,'path':p,'hits':hits})
          pathlib.Path('lineage-search/text-hit-inventory.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          for spec in \
            "$SOURCE_ARTIFACT:$SOURCE_RUN:$SOURCE_DIGEST:source" \
            "$OWNER_ARTIFACT:$OWNER_RUN:$OWNER_DIGEST:acceptance"; do
            IFS=: read -r aid rid dig label <<<"$spec"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid" > "lineage-search/$label-meta.json"
            test "$(jq -r '.workflow_run.id' lineage-search/$label-meta.json)" = "$rid"
            test "$(jq -r '.digest' lineage-search/$label-meta.json)" = "sha256:$dig"
            gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > "lineage-search/$label.zip"
            unzip -l "lineage-search/$label.zip" > "lineage-search/$label-archive-list.txt"
          done
          python - <<'PY'
          import json,pathlib
          out={
            'schema':'wwmsync-historical-emulator-search-v1',
            'outcome':'EMULATOR_NOT_PRESERVED',
            'boundedSearchScope':['all reachable git objects/paths across all fetched refs','deleted/history name-status inventory','owner post-acquisition commit lineage','authoritative replay-source snapshot artifact','authoritative post-acquisition acceptance artifact','workflow inline/generated scripts','tracer packages/source','provenance-relevant compressed/base64 payload paths'],
            'historicalExecutionNote':'sandbox Chromium localhost/file:// unavailable; exact production matcher/search/gate JS ran with unchanged pixels through raw Canvas emulation; GitHub acceptance did not assert browser-raster bit identity',
            'sourceSnapshot':{'run':31872161105,'artifact':9243725171,'digest':'sha256:a8a8c7f347562502d5c2271dc86f99c47e3c671302a271ba569e80b6efa9fae8'},
            'acceptance':{'run':31872599823,'job':94983436586,'artifact':9243841549,'digest':'sha256:e7786742e2e355c0d16d42d94b383db2f2a489e818a61dd955420f1aa0072b7a'},
            'implementationRecovered':False,
            'reason':'Preserved source/tracer/acceptance packages and reachable history contain the execution note and browser/tracer code, but no provenance-linked executable raw-Canvas emulator implementation capable of reproducing owner-recording D0.'
          }
          pathlib.Path('lineage-search/emulator-adjudication.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Fetch authoritative SS0, Fang, and owner evidence inputs
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SS0_ARTIFACT" > d0-input/ss0-meta.json
          test "$(jq -r '.workflow_run.id' d0-input/ss0-meta.json)" = "$SS0_RUN"
          test "$(jq -r '.digest' d0-input/ss0-meta.json)" = "sha256:$SS0_DIGEST"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SS0_RUN/jobs" --jq ".jobs[]|select(.id==$SS0_JOB)|.conclusion")" = success
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$SS0_ARTIFACT/zip" > d0-input/ss0.zip
          mkdir d0-input/ss0; unzip -q d0-input/ss0.zip -d d0-input/ss0
          test -s d0-input/ss0/candidate-table.json; test -s d0-input/ss0/evidence.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FANG_ARTIFACT" > d0-input/fang-meta.json
          test "$(jq -r '.workflow_run.id' d0-input/fang-meta.json)" = "$FANG_RUN"
          test "$(jq -r '.digest' d0-input/fang-meta.json)" = "sha256:$FANG_DIGEST"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$FANG_ARTIFACT/zip" > d0-input/fang.zip
          mkdir d0-input/fang; unzip -q d0-input/fang.zip -d d0-input/fang
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OWNER_RUN/jobs" --jq ".jobs[]|select(.id==$OWNER_JOB)|.conclusion")" = success
          cp lineage-search/acceptance.zip d0-input/owner.zip
          mkdir d0-input/owner; unzip -q d0-input/owner.zip -d d0-input/owner
          find d0-input/owner -name 'owner-gfn-post-acquisition-evidence-2026-08-15.json' -print -quit > d0-input/owner-evidence-path.txt
          test -s d0-input/owner-evidence-path.txt

      - name: Prepare exact controls and canonical browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; test -x "$CHROME_BIN"; export CHROME_BIN
          echo "$CHROME_BIN" > d0-output/chrome-bin.txt
          "$CHROME_BIN" --version > d0-output/chrome-version.txt
          node -p "require('playwright-core/package.json').version" > d0-output/playwright-version.txt
          printf '%s\n' "${ImageOS:-unknown}" > d0-output/image-os.txt
          printf '%s\n' "${ImageVersion:-unknown}" > d0-output/image-version.txt
          cat fixtures/owner-gfn-controls/base64/east-cross-top-left-216.webp.b64.* | base64 -d > d0-site/controls/east-cross.webp
          cat fixtures/owner-gfn-controls/base64/general-shrine-top-left-216.webp.b64.* | base64 -d > d0-site/controls/general-shrine.webp
          test "$(sha256sum d0-site/controls/east-cross.webp|awk '{print $1}')" = 144ff5c7ad8f9c788f69cec049d58bad79d8390abdca7d28bde62fdc8c609792
          test "$(sha256sum d0-site/controls/general-shrine.webp|awk '{print $1}')" = 261f910e416028b272f58abcf31f0bf3ac09e19d65490daf7acf6004e89b0d55
          cp d0-input/fang/steam-general-shrine-1-roi.png d0-site/controls/fang-xu.png
          cp fixtures/owner-gfn-center-hud/{path-of-void,buddha-fort,general-shrine-repeat,prosperity-haven,dreamfall-cliff}.webp d0-site/controls/
          python - <<'PY'
          import json
          fang=json.load(open('d0-input/fang/steam-general-shrine-ground-truth.json'))
          c=[
           dict(id='east-cross',name='East Cross',mapId=1,image='controls/east-cross.webp',sourceCropSize=215.75,expected=[5219.931321637427,4648.817136173768],role='OWNER_UNIQUE',region='Qinghe',historical=True),
           dict(id='general-shrine',name="General Shrine historical",mapId=1,image='controls/general-shrine.webp',sourceCropSize=215.75,expected=[6015.017126148705,3889.360588972433],role='OWNER_UNIQUE',region='Qinghe',historical=True),
           dict(id='path-of-void',name='Path of Void',mapId=1,image='controls/path-of-void.webp',sourceCropSize=None,expected=[5662.35270309106,3599.42210726817],role='OWNER_UNIQUE',region='Qinghe',historical=False),
           dict(id='buddha-fort',name='Buddha Fort',mapId=1,image='controls/buddha-fort.webp',sourceCropSize=None,expected=[6150.319157894736,3719.750105931495],role='OWNER_UNIQUE',region='Qinghe',historical=False),
           dict(id='prosperity-haven',name='Prosperity Haven',mapId=2,image='controls/prosperity-haven.webp',sourceCropSize=None,expected=[4959.193804824561,4487.057644110276],role='OWNER_UNIQUE',region='Kaifeng',historical=False),
           dict(id='dreamfall-cliff',name='Dreamfall Cliff',mapId=2,image='controls/dreamfall-cliff.webp',sourceCropSize=None,expected=[5054.117319966583,5032.292689055973],role='OWNER_UNIQUE',region='Kaifeng',historical=False),
           dict(id='fang-xu',name='Steam Fang Xu Global-PC HUD',mapId=1,image='controls/fang-xu.png',sourceCropSize=None,expected=fang['expected']['dashenZ5'],role='INDEPENDENT_VALIDATION',region='Qinghe',historical=True),
           dict(id='general-shrine-repeat',name='General Shrine repeat',mapId=1,image='controls/general-shrine-repeat.webp',sourceCropSize=None,expected=[6015.017126148705,3889.360588972433],role='SAME_LOCATION_DRIFT_CONTROL',region='Qinghe',historical=False)]
          json.dump({'controls':c},open('d0-input/controls.json','w'),indent=2)
          PY

      - name: Build reference cache and execute D0-only browser scoring
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(cat d0-output/chrome-bin.txt)"; export CHROME_BIN
          cp index.html styles.css vision-sync.css app.js vision-sync.js dashen-tile-cache.js official-sync.js sw.js manifest.webmanifest _redirects _headers robots.txt d0-site/
          python tools/build_dashen_reference_audit_cache.py d0-site/dashen-cache --workers 24
          find d0-site/dashen-cache -type f -print0 | sort -z | xargs -0 sha256sum > d0-output/reference-cache-sha256.txt
          node tools/instrument-real-gfn-production-replay.mjs d0-site/vision-sync.js
          node tools/research/domain-invariant-descriptor/d0-baseline-instrument.mjs d0-site/vision-sync.js
          node --check d0-site/vision-sync.js
          node tools/research/domain-invariant-descriptor/d0-baseline-runner.mjs --site d0-site --controls d0-input/controls.json --ss0-table d0-input/ss0/candidate-table.json --ss0-evidence d0-input/ss0/evidence.json --output d0-output | tee d0-output/runner.log
          test -s d0-output/canonical-d0.json
          jq -e '.descriptorOutcomesExecuted==false and .rd=="PENDING"' d0-output/canonical-d0.json >/dev/null
          test "$(jq '.controls|length' d0-output/canonical-d0.json)" = 8

      - name: Verify byte-exact owner work canvases and record runtime freeze
        shell: bash
        run: |
          set -euo pipefail
          OWNER_EVIDENCE="$(cat d0-input/owner-evidence-path.txt)"; export OWNER_EVIDENCE
          python - <<'PY'
          import json,os,pathlib,hashlib,subprocess
          c=json.load(open('d0-output/canonical-d0.json')); e=json.load(open(os.environ['OWNER_EVIDENCE']))
          for cid in ['path-of-void','buddha-fort','general-shrine-repeat','prosperity-haven','dreamfall-cliff']:
              h=c['controls'][cid]['input']['hashes']; old=e['controls'][cid]['roiSha']
              assert h['pngSha256']==old[1], (cid,h['pngSha256'],old[1])
              assert h['rgb8Sha256']==old[2], (cid,h['rgb8Sha256'],old[2])
          refblob=subprocess.check_output(['git','rev-parse','HEAD:tools/build_dashen_reference_audit_cache.py'],text=True).strip()
          refmanifest=pathlib.Path('d0-output/reference-cache-sha256.txt').read_bytes()
          runtime={
            'runner':'ubuntu-24.04','imageOS':pathlib.Path('d0-output/image-os.txt').read_text().strip(),'imageVersion':pathlib.Path('d0-output/image-version.txt').read_text().strip(),
            'browserEngine':'Chromium/Google Chrome system channel on GitHub hosted ubuntu-24.04','browserVersion':pathlib.Path('d0-output/chrome-version.txt').read_text().strip(),'playwrightCoreVersion':pathlib.Path('d0-output/playwright-version.txt').read_text().strip(),
            'canvasApi':'HTMLCanvasElement 2D','workCanvasAlpha':False,'workCanvasDestination':[192,192],'productionCanonicalImageSmoothingEnabled':True,'productionCanonicalImageSmoothingQuality':'high',
            'productionJsBlob':'58b5a1babf6a12b944f9b745b8bf7f7df573bf9b','referenceCacheBuilderBlob':refblob,'referenceCacheTreeSha256':hashlib.sha256(refmanifest).hexdigest(),
            'pixelReadback':'ImageData Uint8ClampedArray RGBA8; RGB8 hash derived by dropping alpha','descriptorOutcomesExecuted':False,'rd':'PENDING'
          }
          c['canonicalRuntimeFreeze']=runtime
          pathlib.Path('d0-output/canonical-d0.json').write_text(json.dumps(c,indent=2)+'\n')
          pathlib.Path('d0-output/runtime-freeze.json').write_text(json.dumps(runtime,indent=2)+'\n')
          PY
          git diff --exit-code -- vision-sync.js dashen-tile-cache.js tools/build_dashen_visual_cache.py production/wwsync

      - name: Upload D0 adjudication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-d0-lineage-adjudication-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            d0-output/
            lineage-search/emulator-adjudication.json
            lineage-search/relevant-object-paths.txt
            lineage-search/text-hit-inventory.json
            lineage-search/source-archive-list.txt
            lineage-search/acceptance-archive-list.txt
            d0-input/controls.json
            d0-input/ss0-meta.json
            d0-input/fang-meta.json
          if-no-files-found: warn
          retention-days: 30
