name: Validate Anchor-Free Vision Integration

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/validate-vision-integration.yml'
      - 'vision-sync.js'
      - 'index.html'
      - 'dashen-tile-cache.js'
      - 'tools/build_dashen_visual_cache.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Build local production bundle
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          cp index.html styles.css vision-sync.css app.js vision-sync.js dashen-tile-cache.js official-sync.js sw.js manifest.webmanifest _redirects _headers robots.txt dist/
          python tools/build_dashen_visual_cache.py dist/dashen-cache
          grep -Fq 'REAL_FIXTURE_V2_DUAL_MOTION' dist/vision-sync.js
          grep -Fq 'dual-source-agnostic' dist/vision-sync.js
          grep -Fq '<script src="/vision-sync.js"></script>' dist/index.html
      - name: Run synthetic cold-state browser E2E
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          (cd dist && python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wwm-http.log 2>&1 & echo $! >/tmp/wwm-http.pid)
          trap 'kill $(cat /tmp/wwm-http.pid) 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cat > /tmp/e2e.cjs <<'NODE'
          const { chromium }=require(process.cwd()+'/node_modules/playwright-core');
          const base='http://127.0.0.1:4173';
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
            const fatal=[];
            async function profile(kind,viewport){
              const context=await browser.newContext({viewport:{width:1440,height:900}}),page=await context.newPage();
              page.on('pageerror',e=>fatal.push(`${kind}:pageerror:${e.message}`));
              await page.addInitScript(()=>{
                const install=()=>{
                  if(!navigator.mediaDevices)return false;
                  Object.defineProperty(navigator.mediaDevices,'getDisplayMedia',{configurable:true,value:async()=>{
                    const c=document.createElement('canvas');c.width=1280;c.height=720;
                    const x=c.getContext('2d',{alpha:false});x.fillStyle='#202020';x.fillRect(0,0,c.width,c.height);
                    window.__WWM_TEST_CANVAS__=c;
                    window.__WWM_TEST_EXPECTED__=await window.__WWMSYNC_ABSOLUTE_DRAW_TEST_CAPTURE__(c,window.__WWM_TEST_PROFILE__||'gfn',0,0);
                    const stream=c.captureStream(30),track=stream.getVideoTracks()[0];
                    window.__WWM_TEST_DRAW__=async(profile,dx=0,dy=0)=>{const r=await window.__WWMSYNC_ABSOLUTE_DRAW_TEST_CAPTURE__(c,profile,dx,dy);track?.requestFrame?.();return r};
                    track?.requestFrame?.();return stream;
                  }});return true;
                };
                if(!install())document.addEventListener('DOMContentLoaded',install,{once:true});
              });
              const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000});if(!response?.ok())fatal.push(`${kind}:http=${response?.status()}`);
              await page.waitForFunction(()=>window.__WWMSYNC_VISION_HARDENING__?.implementation==='REAL_FIXTURE_V2_DUAL_MOTION'&&typeof window.__WWMSYNC_VISION_TEST__?.setViewport==='function'&&Number.isFinite(window.__WWMSYNC_VISION_BRIDGE__?.state?.().mapZoom),null,{timeout:30000});
              await page.evaluate(({kind,viewport})=>{window.__WWM_TEST_PROFILE__=kind;window.__WWMSYNC_VISION_TEST__.setViewport(viewport.lat,viewport.lng,viewport.zoom)},{kind,viewport});
              const cold=await page.evaluate(()=>({v:window.__WWMSYNC_VISION_BRIDGE__.state(),a:window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__()}));
              if(cold.v.hasAnchor||cold.v.hasMarker||cold.v.tracking)fatal.push(`${kind}:not-cold=${JSON.stringify(cold.v)}`);
              await page.click('#visionStartButton');
              await page.waitForFunction(()=>window.__WWMSYNC_VISION_BRIDGE__.state().active===true&&window.__WWM_TEST_EXPECTED__?.expectedGlobal,null,{timeout:30000});
              const started=await page.evaluate(()=>window.__WWMSYNC_VISION_BRIDGE__.state());
              if(Math.abs((started.roi?.size||0)-180)>1)fatal.push(`${kind}:roi=${started.roi?.size}`);
              await page.waitForFunction(()=>window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__().fixes>=1&&window.__WWMSYNC_VISION_DIAGNOSTICS__().motionCalibration==='absolute-matrix',null,{timeout:360000});
              const locked=await page.evaluate(()=>({v:window.__WWMSYNC_VISION_BRIDGE__.state(),m:window.__WWMSYNC_VISION_DIAGNOSTICS__(),a:window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__()}));
              if(!locked.a.searchStartedWithoutAnchor||!locked.a.searchStartedWithoutMarker||!locked.m.markerLatLng)fatal.push(`${kind}:lock=${JSON.stringify(locked)}`);
              const before=locked.m.accepted||0;await page.evaluate(k=>window.__WWM_TEST_DRAW__(k,2,1),kind);
              await page.waitForFunction(n=>window.__WWMSYNC_VISION_DIAGNOSTICS__().accepted>n,before,{timeout:12000});
              const moved=await page.evaluate(()=>window.__WWMSYNC_VISION_DIAGNOSTICS__());
              if(!moved.markerLatLng||Math.hypot(moved.markerDeltaLat,moved.markerDeltaLng)<=0)fatal.push(`${kind}:marker-not-moved=${JSON.stringify(moved)}`);
              await page.evaluate(k=>window.__WWM_TEST_DRAW__(k,0,0),kind);await page.waitForTimeout(1000);
              const fixes=await page.evaluate(()=>window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__().fixes);
              const drift=await page.evaluate(()=>window.__WWMSYNC_VISION_TEST__.injectMarkerDrift(48,36));if(!drift)fatal.push(`${kind}:drift-inject-failed`);
              await page.waitForFunction(n=>window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__().fixes>n,fixes,{timeout:90000});
              const corrected=await page.evaluate(()=>({m:window.__WWMSYNC_VISION_DIAGNOSTICS__(),a:window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__()}));
              console.log('SYNTHETIC_PROFILE',JSON.stringify({kind,viewport,cold,started,locked,moved,corrected}));
              await context.close();
            }
            await profile('gfn',{lat:2.55,lng:-.20,zoom:15});
            await profile('local',{lat:.20,lng:-2.55,zoom:9});
            console.log('SYNTHETIC_FATAL',JSON.stringify(fatal));await browser.close();if(fatal.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/e2e.cjs
