name: Validate Anchor-Free Vision Integration

on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/validate-vision-integration.yml'
      - 'vision-sync.js'
      - 'dashen-tile-cache.js'
      - 'tools/build_dashen_visual_cache.py'

permissions:
  contents: read

env:
  PREVIEW_URL: https://preview.wwmsync.pages.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for scale-aware anchor-free bundle on preview
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 140); do
            if curl --fail --silent --show-error --location --max-time 20 "$PREVIEW_URL/vision-sync.js" -o /tmp/vision-sync.js \
              && grep -Fq 'ANCHOR_FREE_STRUCTURAL_' /tmp/vision-sync.js \
              && grep -Fq 'ABSOLUTE NOT LOCKED' /tmp/vision-sync.js \
              && grep -Fq 'scaleAwareStructuralScore' /tmp/vision-sync.js \
              && grep -Fq 'warpIntensityNccFast' /tmp/vision-sync.js \
              && grep -Fq "raw=localStorage.getItem(key)" /tmp/vision-sync.js; then
              exit 0
            fi
            sleep 3
          done
          echo 'Preview did not surface the scale-aware anchor-free bundle.' >&2
          exit 1

      - name: Prove capture-to-absolute lock without anchor or viewport seed
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/vision-integration.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const base=process.env.PREVIEW_URL.replace(/\/$/,'');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
            const fatal=[];
            async function runProfile(profile, viewport){
              const context=await browser.newContext({viewport:{width:1440,height:900}});
              const page=await context.newPage();
              page.on('pageerror',e=>fatal.push(`${profile}:pageerror:${e.message}`));
              page.on('console',m=>{if(['error','warning'].includes(m.type()))console.log(`${profile}:BROWSER_${m.type().toUpperCase()}`,m.text())});
              await page.addInitScript(()=>{
                const install=()=>{
                  if(!navigator.mediaDevices)return false;
                  Object.defineProperty(navigator.mediaDevices,'getDisplayMedia',{configurable:true,value:async()=>{
                    const c=document.createElement('canvas');c.width=1280;c.height=720;
                    const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#202020';ctx.fillRect(0,0,c.width,c.height);
                    window.__WWM_TEST_CANVAS__=c;
                    if(typeof window.__WWMSYNC_ABSOLUTE_DRAW_TEST_CAPTURE__==='function')await window.__WWMSYNC_ABSOLUTE_DRAW_TEST_CAPTURE__(c,window.__WWM_TEST_PROFILE__||'gfn',0,0);
                    const stream=c.captureStream(30),track=stream.getVideoTracks()[0];
                    window.__WWM_TEST_TRACK__=track;
                    window.__WWM_TEST_DRAW__=async(profile,dx=0,dy=0)=>{
                      const result=await window.__WWMSYNC_ABSOLUTE_DRAW_TEST_CAPTURE__(c,profile,dx,dy);
                      track?.requestFrame?.();
                      return result;
                    };
                    track?.requestFrame?.();
                    return stream;
                  }});return true;
                };
                if(!install())document.addEventListener('DOMContentLoaded',install,{once:true});
              });
              const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000});
              if(!response?.ok())fatal.push(`${profile}:HTTP:${response?.status()}`);
              await page.waitForFunction(()=>typeof window.__WWMSYNC_ABSOLUTE_DRAW_TEST_CAPTURE__==='function'&&typeof window.__WWMSYNC_VISION_TEST__==='object'&&Number.isFinite(window.__WWMSYNC_VISION_BRIDGE__?.state?.().mapZoom),null,{timeout:30000});
              const boot=await page.evaluate(()=>({contract:window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__().contract,roi:Number(document.querySelector('#visionRoiSize')?.value),scale:Number(document.querySelector('#visionScale')?.value),orientation:Number(document.querySelector('#visionOrientation')?.value)}));
              if(!String(boot.contract).startsWith('ANCHOR_FREE_STRUCTURAL_'))fatal.push(`${profile}:contract=${boot.contract}`);
              if(Math.abs(boot.roi-.20)>1e-6)fatal.push(`${profile}:default-roi=${boot.roi}`);
              if(Math.abs(boot.scale-1)>1e-6)fatal.push(`${profile}:default-scale=${boot.scale}`);
              if(Math.abs(boot.orientation)>1e-6)fatal.push(`${profile}:default-orientation=${boot.orientation}`);
              const viewportSet=await page.evaluate(v=>window.__WWMSYNC_VISION_TEST__.setViewport(v.lat,v.lng,v.zoom),viewport);
              if(!viewportSet)fatal.push(`${profile}:viewport-not-set`);
              await page.evaluate(p=>{window.__WWM_TEST_PROFILE__=p},profile);
              const before=await page.evaluate(()=>({vision:window.__WWMSYNC_VISION_BRIDGE__.state(),motion:window.__WWMSYNC_VISION_DIAGNOSTICS__(),absolute:window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__()}));
              if(before.vision.tracking||before.vision.hasAnchor||before.vision.hasMarker)fatal.push(`${profile}:pre-seeded=${JSON.stringify(before.vision)}`);
              await page.click('#visionStartButton');
              await page.waitForFunction(()=>window.__WWMSYNC_VISION_BRIDGE__.state().active===true,null,{timeout:30000});
              const started=await page.evaluate(()=>({vision:window.__WWMSYNC_VISION_BRIDGE__.state(),absolute:window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__()}));
              console.log('CAPTURE_STARTED',profile,JSON.stringify({boot,started}));
              if(Math.abs((started.vision.roi?.size||0)-144)>1)fatal.push(`${profile}:runtime-roi=${started.vision.roi?.size}`);
              await page.waitForFunction(()=>window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__().globalSearches>=1,null,{timeout:30000});
              await page.waitForFunction(()=>window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__().fixes>=1&&window.__WWMSYNC_VISION_DIAGNOSTICS__().motionCalibration==='absolute-matrix',null,{timeout:360000});
              const locked=await page.evaluate(()=>({vision:window.__WWMSYNC_VISION_BRIDGE__.state(),motion:window.__WWMSYNC_VISION_DIAGNOSTICS__(),absolute:window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__(),ui:{status:document.querySelector('#visionAbsoluteStatus')?.textContent,position:document.querySelector('#visionAbsolutePosition')?.textContent}}));
              if(!locked.absolute.searchStartedWithoutAnchor)fatal.push(`${profile}:search-used-anchor`);
              if(!locked.absolute.searchStartedWithoutMarker)fatal.push(`${profile}:search-used-marker`);
              if(locked.absolute.viewportAtSearch?.zoom!==before.vision.mapZoom)fatal.push(`${profile}:viewport-proof=${JSON.stringify({requested:viewport,actualBefore:before.vision.mapZoom,atSearch:locked.absolute.viewportAtSearch})}`);
              if(!locked.motion.markerLatLng)fatal.push(`${profile}:marker-missing-after-lock`);
              if(locked.motion.motionCalibration!=='absolute-matrix')fatal.push(`${profile}:matrix=${locked.motion.motionCalibration}`);
              if(locked.motion.absoluteSource!=='structural-global-registration')fatal.push(`${profile}:absoluteSource=${locked.motion.absoluteSource}`);
              if(String(locked.ui.position||'').includes('ABSOLUTE NOT LOCKED'))fatal.push(`${profile}:ui-not-locked=${JSON.stringify(locked.ui)}`);
              await page.waitForTimeout(900);
              const synthetic=await page.evaluate(async p=>window.__WWM_TEST_DRAW__(p,2,1),profile);
              await page.waitForFunction(()=>window.__WWMSYNC_VISION_DIAGNOSTICS__().accepted>=1,null,{timeout:12000});
              const moved=await page.evaluate(()=>window.__WWMSYNC_VISION_DIAGNOSTICS__());
              const markerMovement=locked.motion.markerLatLng&&moved.markerLatLng?Math.hypot(moved.markerLatLng.lat-locked.motion.markerLatLng.lat,moved.markerLatLng.lng-locked.motion.markerLatLng.lng):0;
              if(!(markerMovement>0))fatal.push(`${profile}:markerMovement=${markerMovement}`);
              console.log('ANCHOR_FREE_PROFILE',JSON.stringify({profile,viewport,synthetic,before,started,locked,moved,markerMovement}));
              await context.close();
            }
            await runProfile('gfn',{lat:2.55,lng:-.20,zoom:15});
            await runProfile('local',{lat:.20,lng:-2.55,zoom:9});
            console.log('INTEGRATION_FATAL',JSON.stringify(fatal));
            await browser.close();
            if(fatal.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/vision-integration.cjs
