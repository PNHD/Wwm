name: Patch Absolute Global Refine Window

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/patch-absolute-refine-window.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2

      - name: Expand global fine search without weakening gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('vision-sync.js')
          s=p.read_text('utf8')
          old='async function fineMatch(samples,cfg,pred,search=120){'
          new='async function fineMatch(samples,cfg,pred,search=120,step=8){'
          assert old in s
          s=s.replace(old,new,1)
          old='for(let y=fine.centerLocalY-search;y<=fine.centerLocalY+search;y+=8){for(let x=fine.centerLocalX-search;x<=fine.centerLocalX+search;x+=8)'
          new='for(let y=fine.centerLocalY-search;y<=fine.centerLocalY+search;y+=step){for(let x=fine.centerLocalX-search;x<=fine.centerLocalX+search;x+=step)'
          assert old in s
          s=s.replace(old,new,1)
          old="const fine=await fineMatch(samples,cfg,{...hypothesis,atlas:coarseSearch.atlas},120);"
          new="const fine=await fineMatch(samples,cfg,{...hypothesis,atlas:coarseSearch.atlas},220,12);"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,'utf8')
          PY
          node --check vision-sync.js
          grep -Fq 'search=120,step=8' vision-sync.js
          grep -Fq '},220,12)' vision-sync.js
          git config user.name 'WWMSync CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vision-sync.js
          git commit -m 'fix: widen global absolute refinement window'
          git push origin HEAD:feature/wwm-native-sync-v2
