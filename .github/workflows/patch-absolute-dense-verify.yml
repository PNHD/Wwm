name: Patch Absolute Dense Verification

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/patch-absolute-dense-verify.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2

      - name: Add dense structural final verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path('vision-sync.js')
          s=p.read_text('utf8')
          s=s.replace('NEGATIVE_SAMPLES=20,COARSE_BEAM=4;','NEGATIVE_SAMPLES=20,COARSE_BEAM=8;',1)
          blocks={
            'roi':('function roiSamples(canvas){','function template(samples,radius,angle){',''),
            'global':('async function globalMatch(','async function localFineMatch',''),
            'gate':('function matchGate(coarse,fine,roiInfo,cfg){','async function registerFrame',''),
            'register':('async function registerFrame(cfg,mapId){','function confirmDistance',''),
            'self':('async function selfTest(){','window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__','')
          }
          for name,(start,end,data) in blocks.items():
            i=s.find(start);j=s.find(end,i)
            if i<0 or j<0: raise SystemExit(f'marker missing: {name}')
            s=s[:i]+base64.b64decode(data).decode('utf8')+'\n'+s[j:]
          insert='function verifyAt(field,cx,cy,radius,angle,samples){'
          if insert not in s:
            marker='async function globalMatch('
            i=s.find(marker)
            verify=base64.b64decode('').decode('utf8')
            s=s[:i]+verify+'\n'+s[i:]
          p.write_text(s,'utf8')
          PY
          node --check vision-sync.js
          grep -Fq 'COARSE_BEAM=8' vision-sync.js
          grep -Fq 'verifySamples' vision-sync.js
          grep -Fq 'verifyAt' vision-sync.js
          git config user.name 'WWMSync CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vision-sync.js
          git commit -m 'fix: verify absolute hypotheses with dense structure'
          git push origin HEAD:feature/wwm-native-sync-v2
