name: Build WWMSync Replay Cache

on:
  push:
    branches:
      - feature/wwm-native-sync-v2
    paths:
      - 'vision-sync-loader.js'
      - 'vision-sync.js'
      - 'dashen-tile-cache.js'
      - 'tools/build_dashen_visual_cache.py'
      - 'tools/replay-real-capture.mjs'
      - '.github/workflows/validate-real-fixture-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate replay tooling
        run: |
          set -euo pipefail
          node --check vision-sync-loader.js
          node --check tools/replay-real-capture.mjs
          python -m py_compile tools/build_dashen_visual_cache.py
      - name: Build same-origin Dashen replay cache
        run: |
          set -euo pipefail
          rm -rf replay-cache
          python tools/build_dashen_visual_cache.py replay-cache
          test -s replay-cache/manifest.json
          test -s replay-cache/main/3/0_0.png
          test -s replay-cache/main/5/20_15.png
          test -s replay-cache/sub4/5/3_3.png
      - name: Upload replay cache
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-real-replay-cache
          path: replay-cache/
          retention-days: 2
