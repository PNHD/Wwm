name: Diagnose WWSync Login

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/diagnose-wwsync-login.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace official login bootstrap
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          cat > /tmp/diag.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            page.on('response',async r=>{if(r.status()>=400){let body='';try{body=(await r.text()).slice(0,300).replace(/\s+/g,' ')}catch{}console.log('HTTP_ERROR',r.status(),r.url(),body)}});
            page.on('request',r=>{if(/mpsdk|easebar|\/api\/mpay|mosdk/i.test(r.url()))console.log('REQUEST',r.method(),r.url())});
            page.on('requestfailed',r=>console.log('FAILED',r.url(),r.failure()?.errorText||''));
            page.on('pageerror',e=>console.log('PAGEERROR',e.message,e.stack||''));
            page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
            await page.goto('https://preview.wwsync-pnhd.pages.dev',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>typeof window.MpayOSSDK==='function'&&Boolean(window.MpayOSSDK.prototype.__wwsyncCorsShim),null,{timeout:30000});
            await page.click('#loginButton');
            await page.waitForTimeout(12000);
            const state=await page.evaluate(()=>{const nodes=[...document.querySelectorAll('[id*=mosdk],[class*=mosdk]')];return{status:document.querySelector('#authStatus')?.textContent||'',dialogs:nodes.length,visible:nodes.filter(n=>{const s=getComputedStyle(n);const r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0}).map(n=>({id:n.id,cls:n.className,w:n.getBoundingClientRect().width,h:n.getBoundingClientRect().height})).slice(0,20)}});
            console.log('LOGIN_STATE',JSON.stringify(state));
            await browser.close();
          })().catch(e=>{console.error('DIAG_FATAL',e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" node /tmp/diag.cjs
