name: Patch Fine Photometric Rerank
on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: [.github/workflows/patch-fine-photometric-rerank.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
      - name: Rerank coarse refine and fine candidates with NCC
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          p=Path('vision-sync.js'); s=p.read_text()
          anchor="""function coarseNccAt(field,cx,cy,radius,angle,samples){
            if(!samples?.length)return-1;const a=rad(angle),c=Math.cos(a),sn=Math.sin(a);let n=0,sumS=0,sumR=0,sumSS=0,sumRR=0,sumSR=0;
            for(let k=0;k<samples.length;k+=5){const q=samples[k],rx=q.nx*c-q.ny*sn,ry=q.nx*sn+q.ny*c,x=Math.round(cx+rx*radius),y=Math.round(cy+ry*radius);if(x<1||y<1||x>=field.w-1||y>=field.h-1)continue;const sg=q.gray,rg=field.gray[y*field.w+x];n++;sumS+=sg;sumR+=rg;sumSS+=sg*sg;sumRR+=rg*rg;sumSR+=sg*rg}
            if(n<60)return-1;const den=Math.sqrt(Math.max(1e-9,(n*sumSS-sumS*sumS)*(n*sumRR-sumR*sumR)));if(den<=1e-8)return-1;return .5+.5*clamp((n*sumSR-sumS*sumR)/den,-1,1);
          }
          """
          helper=anchor+"""function photoRerank(candidates,field,samples,edgeWeight=.28,replaceScore=false){
            let best=null;for(const item of candidates||[]){const ncc=coarseNccAt(field,item.x,item.y,item.radius,item.angle,samples);if(ncc<0)continue;const edge=item.edgeScore??item.score,rankScore=edgeWeight*edge+(1-edgeWeight)*ncc,candidate={...item,edgeScore:edge,photoNcc:ncc,rankScore};if(replaceScore)candidate.score=rankScore;if(!best||rankScore>best.rankScore)best=candidate}return best;
          }
          """
          assert anchor in s; s=s.replace(anchor,helper,1)
          old='const best=refineTop[0]||seed;hypotheses.push({...best,rawScore:seed.score});await sleep(0);'
          new='const best=photoRerank(refineTop,field,photoSamples,.30,true)||refineTop[0]||seed;hypotheses.push({...best,rawScore:seed.score});await sleep(0);'
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('async function fineMatch(samples,cfg,pred,search=120,step=8){','async function fineMatch(samples,cfg,pred,search=120,step=8,photoSamples=null){',1)
          s=s.replace('pushTop(top,{x,y,radius:rr,angle:aa,score},30)','pushTop(top,{x,y,radius:rr,angle:aa,score},80)',1)
          old='if(!top.length)return null;let best=top[0],dm=distinctMargin(top,best,Math.max(24,best.radius*.12)),ref=[];'
          new='if(!top.length)return null;let best=photoRerank(top,fine.field,photoSamples,.25,false)||top[0],dm=distinctMargin(top,best,Math.max(24,best.radius*.12)),ref=[];'
          assert old in s; s=s.replace(old,new,1)
          old='if(ref.length)best=ref[0];const globalX=best.x+fine.minX*256,globalY=best.y+fine.minY*256;return{...best,globalX,globalY,margin:dm.margin,fieldGrid:fine,scaleFromCoarse:scale};'
          new='if(ref.length)best=photoRerank(ref,fine.field,photoSamples,.20,false)||ref[0];const globalX=best.x+fine.minX*256,globalY=best.y+fine.minY*256;return{...best,globalX,globalY,margin:dm.margin,fieldGrid:fine,scaleFromCoarse:scale};'
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('const fine=await fineMatch(samples,cfg,{...hypothesis,atlas:coarseSearch.atlas},220,12);','const fine=await fineMatch(samples,cfg,{...hypothesis,atlas:coarseSearch.atlas},220,12,info.verifySamples);',1)
          s=s.replace('async function localFineMatch(samples,cfg,last,search=160){\n  const pred={x:last.globalX/last.scaleFromCoarse,y:last.globalY/last.scaleFromCoarse,radius:last.radius/last.scaleFromCoarse,angle:last.angle,atlas:{factor:last.scaleFromCoarse/(2**(FINE_Z-COARSE_Z))}};return fineMatch(samples,cfg,pred,search)\n}', 'async function localFineMatch(samples,cfg,last,search=160,photoSamples=null){\n  const pred={x:last.globalX/last.scaleFromCoarse,y:last.globalY/last.scaleFromCoarse,radius:last.radius/last.scaleFromCoarse,angle:last.angle,atlas:{factor:last.scaleFromCoarse/(2**(FINE_Z-COARSE_Z))}};return fineMatch(samples,cfg,pred,search,8,photoSamples)\n}',1)
          s=s.replace("fine=await localFineMatch(info.samples,cfg,state.last,170);","fine=await localFineMatch(info.samples,cfg,state.last,170,info.verifySamples);",1)
          s=s.replace("fine=await localFineMatch(info.samples,cfg,state.pending.match,150);","fine=await localFineMatch(info.samples,cfg,state.pending.match,150,info.verifySamples);",1)
          p.write_text(s)
          PY
          python /tmp/patch.py
          node --check vision-sync.js
          grep -Fq 'function photoRerank' vision-sync.js
          grep -Fq 'fineMatch(samples,cfg,pred,search,8,photoSamples)' vision-sync.js
          grep -Fq '220,12,info.verifySamples' vision-sync.js
          git config user.name 'WWMSync CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vision-sync.js
          git commit -m 'fix: photometrically rerank absolute fine candidates'
          git push origin HEAD:feature/wwm-native-sync-v2
