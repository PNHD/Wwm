name: WWMSync Recover Map Fixtures Once
on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: [.github/workflows/wwmsync-recover-map-fixtures-once.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
      - name: Export decoded legacy text carriers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy-map-carriers
          curl -fsSL https://api.github.com/repos/PNHD/Wwm/git/blobs/41bed99418a09856ed470d84468e176121879f22 > /tmp/east.json
          curl -fsSL https://api.github.com/repos/PNHD/Wwm/git/blobs/66e7d42d24c2c4aede69a5ba21c281ce0347b099 > /tmp/general.json
          python - <<'PY'
          import base64,json
          from pathlib import Path
          for stem in ('east','general'):
              meta=json.loads(Path(f'/tmp/{stem}.json').read_text())
              api=''.join(meta['content'].split())
              text=base64.b64decode(api,validate=True)
              Path(f'legacy-map-carriers/{stem}.b64').write_bytes(text)
              print(stem, len(text), text[:16], text[-16:])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wwmsync-legacy-map-carriers-${{ github.run_id }}
          path: legacy-map-carriers/
          if-no-files-found: error
          retention-days: 1
