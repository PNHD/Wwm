name: Patch Absolute Scale Diversity

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/patch-scale-diversity.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
      - name: Preserve scale-diverse coarse hypotheses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('vision-sync.js')
          s=p.read_text('utf8')
          old='NEGATIVE_SAMPLES=20,COARSE_BEAM=8;'
          new='NEGATIVE_SAMPLES=20,COARSE_BEAM=12;'
          if old not in s: raise SystemExit('beam marker missing')
          s=s.replace(old,new,1)
          old="if(seeds.every(seed=>Math.hypot(item.x-seed.x,item.y-seed.y)>=Math.max(20,Math.min(item.radius,seed.radius)*.7))){"
          new="if(seeds.every(seed=>Math.hypot(item.x-seed.x,item.y-seed.y)>=Math.max(20,Math.min(item.radius,seed.radius)*.7)||Math.abs(Math.log(item.radius/seed.radius))>=.24)){"
          if old not in s: raise SystemExit('seed marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,'utf8')
          PY
          node --check vision-sync.js
          grep -Fq 'COARSE_BEAM=12' vision-sync.js
          grep -Fq 'Math.abs(Math.log(item.radius/seed.radius))>=.24' vision-sync.js
          git config user.name 'WWMSync CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vision-sync.js
          git commit -m 'fix: preserve scale-diverse coarse hypotheses'
          git push origin HEAD:feature/wwm-native-sync-v2
