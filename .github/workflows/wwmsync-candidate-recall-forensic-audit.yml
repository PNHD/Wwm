name: WWMSync Candidate Recall Forensic Audit

on:
  workflow_dispatch:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - '.github/workflows/wwmsync-candidate-recall-forensic-audit.yml'
      - 'tools/instrument-candidate-recall-forensic.mjs'
      - 'tools/run-candidate-recall-forensic.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: wwmsync-candidate-recall-forensic-${{ github.ref }}
  cancel-in-progress: false

env:
  START_HEAD: '3251202f001755c7bda957a0b329b9f862c0cfcf'
  VISION_BLOB: '58b5a1babf6a12b944f9b745b8bf7f7df573bf9b'
  CACHE_BLOB: '9388960a8bff53a9cfc7471372af144b7a28c34f'
  CACHE_BUILDER_BLOB: '1a227d06ae41660ea3e3b832e7f1921cc507c0d7'
  EAST_FIXTURE_SHA: '144ff5c7ad8f9c788f69cec049d58bad79d8390abdca7d28bde62fdc8c609792'
  GENERAL_FIXTURE_SHA: '261f910e416028b272f58abcf31f0bf3ac09e19d65490daf7acf6004e89b0d55'
  FANG_RUN: '31609680755'
  FANG_ARTIFACT: '9146646914'
  FANG_DIGEST: 'b305444dff3ac2db6a544020093bd64022ffef5406c246849499d6a96525c041'
  GH_TOKEN: ${{ github.token }}

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/wwm-native-sync-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze branch lineage and production guards
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$START_HEAD" "$GITHUB_SHA"
          test "$(git rev-parse "$START_HEAD:vision-sync.js")" = "$VISION_BLOB"
          test "$(git rev-parse HEAD:vision-sync.js)" = "$VISION_BLOB"
          test "$(git rev-parse HEAD:dashen-tile-cache.js)" = "$CACHE_BLOB"
          test "$(git rev-parse HEAD:tools/build_dashen_visual_cache.py)" = "$CACHE_BUILDER_BLOB"
          grep -Fq "const CONTRACT='ANCHOR_FREE_STRUCTURAL_V11'" vision-sync.js
          grep -Fq "if(fine.scaleScore<.58)" vision-sync.js
          grep -Fq "if(fine.intensityScore<.42)" vision-sync.js
          grep -Fq "fine.beamMargin<.010" vision-sync.js
          python - <<'PY'
          import os,subprocess
          allowed={
            'tools/instrument-candidate-recall-forensic.mjs',
            'tools/run-candidate-recall-forensic.mjs',
            '.github/workflows/wwmsync-candidate-recall-forensic-audit.yml',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['START_HEAD']+'..HEAD'],text=True).splitlines())
          assert not changed-allowed, sorted(changed-allowed)
          print('authorized replay/CI paths:', sorted(changed))
          PY
          git diff --exit-code -- vision-sync.js dashen-tile-cache.js tools/build_dashen_visual_cache.py

      - name: Install replay runtime
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          node --check tools/instrument-candidate-recall-forensic.mjs
          node --check tools/run-candidate-recall-forensic.mjs

      - name: Recover frozen known-GT inputs
        run: |
          set -euo pipefail
          rm -rf recall-input recall-output recall-site
          mkdir -p recall-input recall-output recall-site/controls
          cat fixtures/owner-gfn-controls/base64/east-cross-top-left-216.webp.b64.* | base64 -d > recall-site/controls/east-cross.webp
          cat fixtures/owner-gfn-controls/base64/general-shrine-top-left-216.webp.b64.* | base64 -d > recall-site/controls/general-shrine.webp
          test "$(sha256sum recall-site/controls/east-cross.webp | awk '{print $1}')" = "$EAST_FIXTURE_SHA"
          test "$(sha256sum recall-site/controls/general-shrine.webp | awk '{print $1}')" = "$GENERAL_FIXTURE_SHA"
          cp fixtures/owner-gfn-controls/metadata.json recall-input/owner-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FANG_ARTIFACT" > recall-input/fang-artifact-meta.json
          test "$(jq -r '.workflow_run.id' recall-input/fang-artifact-meta.json)" = "$FANG_RUN"
          test "$(jq -r '.digest' recall-input/fang-artifact-meta.json)" = "sha256:$FANG_DIGEST"
          test "$(jq -r '.expired' recall-input/fang-artifact-meta.json)" = 'false'
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$FANG_ARTIFACT/zip" > recall-input/fang.zip
          mkdir recall-input/fang
          unzip -q recall-input/fang.zip -d recall-input/fang
          test -s recall-input/fang/steam-general-shrine-1-roi.png
          test -s recall-input/fang/steam-general-shrine-ground-truth.json
          test -s recall-input/fang/steam-general-shrine-matcher.json
          cp recall-input/fang/steam-general-shrine-1-roi.png recall-site/controls/fang-xu.png
          jq -e '.classification=="HUD-FAIL"' recall-input/fang/steam-general-shrine-matcher.json >/dev/null
          jq -e '.localKnownCoordinateDiagnostic.best.scaleScore > 0.599 and .localKnownCoordinateDiagnostic.best.scaleScore < 0.600' recall-input/fang/steam-general-shrine-matcher.json >/dev/null

      - name: Build replay-only Dashen cache and instrument copy
        run: |
          set -euo pipefail
          cp index.html styles.css vision-sync.css app.js vision-sync.js dashen-tile-cache.js official-sync.js sw.js manifest.webmanifest _redirects _headers robots.txt recall-site/
          python tools/build_dashen_reference_audit_cache.py recall-site/dashen-cache --workers 24
          test -s recall-site/dashen-cache/main/5/31_31.png
          node tools/instrument-real-gfn-production-replay.mjs recall-site/vision-sync.js
          node tools/instrument-candidate-recall-forensic.mjs recall-site/vision-sync.js
          node --check recall-site/vision-sync.js
          git diff --exit-code -- vision-sync.js dashen-tile-cache.js tools/build_dashen_visual_cache.py

      - name: Write independent control manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          owner=json.load(open('recall-input/owner-metadata.json',encoding='utf8')); by={c['id']:c for c in owner['controls']}
          fang=json.load(open('recall-input/fang/steam-general-shrine-ground-truth.json',encoding='utf8'))
          data={'schema':'wwmsync-candidate-recall-controls-v1','verifiedStartingHead':os.environ['START_HEAD'],'productionGuards':{'contract':'ANCHOR_FREE_STRUCTURAL_V11','visionBlob':os.environ['VISION_BLOB'],'cacheBlob':os.environ['CACHE_BLOB'],'cacheBuilderBlob':os.environ['CACHE_BUILDER_BLOB'],'coarseGate':0.50,'structuralGate':0.58,'intensityGate':0.42,'ambiguityGate':0.010,'productionMatcherChanged':False,'productionCacheChanged':False,'productionPreprocessingChanged':False},'controls':[
            {'id':'east-cross','name':'East Cross GFN','mapId':1,'image':'controls/east-cross.webp','sourceCropSize':215.75,'expected':by['east-cross']['groundTruth']['dashenZ5'],'tolerance':60,'provenance':by['east-cross']['provenance']},
            {'id':'general-shrine','name':'General Shrine GFN','mapId':1,'image':'controls/general-shrine.webp','sourceCropSize':215.75,'expected':by['general-shrine']['groundTruth']['dashenZ5'],'tolerance':60,'provenance':by['general-shrine']['provenance']},
            {'id':'fang-xu','name':'Steam Fang Xu Global-PC HUD','mapId':1,'image':'controls/fang-xu.png','sourceCropSize':None,'expected':fang['expected']['dashenZ5'],'tolerance':60,'provenance':{'source':fang['source'],'lineage':fang['lineage'],'groundTruth':fang['groundTruth'],'artifact':{'run':int(os.environ['FANG_RUN']),'id':int(os.environ['FANG_ARTIFACT']),'digest':'sha256:'+os.environ['FANG_DIGEST']}}}
          ]}
          json.dump(data,open('recall-input/controls.json','w',encoding='utf8'),ensure_ascii=False,indent=2)
          PY

      - name: Execute bounded production candidate-recall trace
        run: |
          set -euo pipefail
          node tools/run-candidate-recall-forensic.mjs --site recall-site --controls recall-input/controls.json --output recall-output | tee recall-output/runner.log
          for f in east-cross general-shrine fang-xu summary; do test -s "recall-output/$f.json"; done
          jq '{verdict,independentRequirement,stressRequired,stressVariants,controls}' recall-output/summary.json
          git diff --exit-code -- vision-sync.js dashen-tile-cache.js tools/build_dashen_visual_cache.py

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-candidate-recall-forensic-diagnostic-${{ github.run_id }}
          path: |
            recall-input/controls.json
            recall-input/fang-artifact-meta.json
            recall-input/fang/steam-general-shrine-ground-truth.json
            recall-input/fang/steam-general-shrine-matcher.json
            recall-output/
          if-no-files-found: error
          retention-days: 30
