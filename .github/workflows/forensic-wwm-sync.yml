name: Forensic WWM Sync Public Client

on:
  push:
    branches: [production/wwm-atlas]
    paths: ['.github/workflows/forensic-wwm-sync.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract flat-map coordinate contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://wwmmap.pages.dev/js/map_2026/gflatmap.js?v=1' \
            -o /tmp/gflatmap.js
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/gflatmap.js').read_text(encoding='utf-8')
          lines=text.splitlines(); out=[]; spans=[]
          terms=['worldRange','project','unproject','lngLat','lng','lat','tileSize','transformRequest','setLngLat','coordinates','{s}','Mercator','normalize']
          for i,line in enumerate(lines):
              if any(t.lower() in line.lower() for t in terms):
                  lo=max(0,i-7); hi=min(len(lines),i+8)
                  if any(lo>=a and hi<=b for a,b in spans): continue
                  spans.append((lo,hi)); out.append(f'=== L{lo+1}-{hi} ===')
                  out.extend(f'{j+1}: {lines[j][:1800]}' for j in range(lo,hi))
          Path('wwm-flatmap-contract.txt').write_text('\n'.join(out),encoding='utf-8')
          print('BYTES',Path('wwm-flatmap-contract.txt').stat().st_size)
          PY

      - name: Upload compact forensic artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwm-flatmap-contract
          path: wwm-flatmap-contract.txt
          if-no-files-found: error
          retention-days: 1
