name: Forensic WWM Sync Public Client

on:
  push:
    branches: [production/wwm-atlas]
    paths: ['.github/workflows/forensic-wwm-sync.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print raster map grid contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://wwmmap.pages.dev/js/map_2026/map_config.js' -o /tmp/map_config.mjs
          cat > /tmp/summary.mjs <<'NODE'
          import { mapInfo } from 'file:///tmp/map_config.mjs';
          for (const id of ['1','2','6','14']) {
            const m = mapInfo[id];
            console.log(JSON.stringify({id, worldRange:m.worldRange, gridSize:m.gridSize, gameTileSize:m.gameTileSize, tileUrl:m.tileUrl, minZoom:m.minZoom, maxZoom:m.maxZoom, center:m.center || null}));
          }
          NODE
          node /tmp/summary.mjs
