name: Forensic WWM Sync Public Client

on:
  push:
    branches: [production/wwm-atlas]
    paths: ['.github/workflows/forensic-wwm-sync.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public sync service availability and CORS
        shell: bash
        run: |
          set -euo pipefail
          origin='https://wwm-atlas-pnhd.pages.dev'
          base='https://wwmmap.pages.dev'
          out='wwm-sync-network.txt'
          : > "$out"

          echo '=== relay_servers GET ===' >> "$out"
          curl --silent --show-error --location \
            --dump-header /tmp/relay.headers \
            --output /tmp/relay.body \
            "$base/service/relay_servers"
          sed -n '1,40p' /tmp/relay.headers >> "$out"
          echo 'BODY:' >> "$out"
          head -c 6000 /tmp/relay.body >> "$out"
          echo >> "$out"

          echo '=== relay_servers CORS GET ===' >> "$out"
          curl --silent --show-error --location \
            --header "Origin: $origin" \
            --dump-header /tmp/cors-get.headers \
            --output /dev/null \
            "$base/service/relay_servers"
          sed -n '1,50p' /tmp/cors-get.headers >> "$out"

          echo '=== gameauth OPTIONS preflight ===' >> "$out"
          curl --silent --show-error --request OPTIONS \
            --header "Origin: $origin" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            --dump-header /tmp/gameauth-options.headers \
            --output /tmp/gameauth-options.body \
            "$base/service/gameauth" || true
          sed -n '1,60p' /tmp/gameauth-options.headers >> "$out"
          echo 'BODY:' >> "$out"
          head -c 2000 /tmp/gameauth-options.body >> "$out"
          echo >> "$out"

          echo '=== call_client_method OPTIONS preflight ===' >> "$out"
          curl --silent --show-error --request OPTIONS \
            --header "Origin: $origin" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type,x-wwm-uid,x-wwm-pass,client-lang' \
            --dump-header /tmp/call-options.headers \
            --output /tmp/call-options.body \
            "$base/service/call_client_method" || true
          sed -n '1,60p' /tmp/call-options.headers >> "$out"
          echo 'BODY:' >> "$out"
          head -c 2000 /tmp/call-options.body >> "$out"
          echo >> "$out"

          echo '=== known websocket relay HTTPS probes ===' >> "$out"
          for host in wwmmapsync.sangtacvietcdn.xyz wwmmapsync.stv-appdomain-00000001.org; do
            echo "HOST $host" >> "$out"
            curl --silent --show-error --head --max-time 15 "https://$host/" >> "$out" 2>&1 || true
          done

          echo "NETWORK_PROBE_BYTES $(wc -c < "$out")"

      - name: Upload compact forensic artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwm-sync-network
          path: wwm-sync-network.txt
          if-no-files-found: error
          retention-days: 1
