name: Forensic WWM Sync Public Client

on:
  push:
    branches: [production/wwm-atlas]
    paths: ['.github/workflows/forensic-wwm-sync.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact public WWM sync client contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request

          UA = {'User-Agent': 'Mozilla/5.0 WWM-Atlas-Forensic/1.0'}
          BASE = 'https://wwmmap.pages.dev/js/map_2026/'

          def get(path):
              url = BASE + path
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  text = r.read().decode('utf-8', 'replace')
                  print('FETCHED', r.status, url, len(text))
                  return text

          def safe(line):
              line = re.sub(r'(?i)(authorization\s*[:=]\s*["\'])[^"\']+', r'\1[redacted]', line)
              line = re.sub(r'(?i)(token\s*[:=]\s*["\'])[^"\']+', r'\1[redacted]', line)
              return line[:1800] + ('…' if len(line) > 1800 else '')

          def dump(name, text, start, end):
              print(f'===== {name} L{start}-L{end} =====')
              lines = text.splitlines()
              for idx in range(max(1,start), min(end,len(lines))+1):
                  print(f'{idx}: {safe(lines[idx-1])}')

          def contexts(name, text, terms, radius=5):
              lines = text.splitlines()
              seen = set()
              for idx, line in enumerate(lines, 1):
                  if any(term.lower() in line.lower() for term in terms):
                      lo, hi = max(1, idx-radius), min(len(lines), idx+radius)
                      key=(lo,hi)
                      if key in seen: continue
                      seen.add(key)
                      dump(name, text, lo, hi)

          gamesync = get('gamesync.js?v=4')
          auth = get('auth_modal.js')
          settings = get('settings_modal.js')
          storage = get('storage.js')

          # Current sync session startup + websocket + packet handling.
          dump('gamesync', gamesync, 266, 390)
          contexts('gamesync', gamesync,
                   ['wsDomain','relay','startSyncer','start_game_sync','X-WWM-UID','WebSocket','completed','marker','gameState','handleState','receivedInitialData'],
                   radius=8)

          # Authentication/linking/client-method transport.
          contexts('auth_modal', auth,
                   ['invokeClientMethod','fetch(','X-WWM-UID','verificationHash','generatedPassword','handleBind','handleLogin','handleReset','uid','password','client_method','method'],
                   radius=10)

          # Relay/server selection and persisted sync snapshot.
          contexts('settings_modal', settings,
                   ['relay','server','snapshotData','completed','sync'],
                   radius=10)
          contexts('storage', storage,
                   ['completed','progress','marker'],
                   radius=8)
          PY
