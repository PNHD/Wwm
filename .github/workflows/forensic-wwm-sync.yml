name: Forensic WWM Sync Public Client

on:
  push:
    branches: [production/wwm-atlas]
    paths: ['.github/workflows/forensic-wwm-sync.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public marker schema and map metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://wwmmap.pages.dev/data/markers_2026.json' \
            -o /tmp/markers.json
          curl --fail --silent --show-error \
            'https://wwmmap.pages.dev/js/map_2026/map_config.js' \
            -o /tmp/map_config.mjs

          python - <<'PY' > /tmp/marker-summary.txt
          import json, os
          data=json.load(open('/tmp/markers.json',encoding='utf-8'))
          markers=data.get('markers',[])
          print('MARKER_FILE_BYTES',os.path.getsize('/tmp/markers.json'))
          print('MARKER_COUNT',len(markers))
          print('TOP_LEVEL_KEYS',sorted(data.keys()))
          if markers:
              print('MARKER_KEYS',sorted(markers[0].keys()))
              for i,m in enumerate(markers[:5]):
                  sample={k:m.get(k) for k in ['id','alId','mapId','category','x','y','z','lng','lat','name','title'] if k in m}
                  print('SAMPLE',i,json.dumps(sample,ensure_ascii=False)[:1600])
          print('MAP_IDS',sorted({str(m.get('mapId')) for m in markers})[:100])
          print('CATEGORY_COUNT',len({str(m.get('category')) for m in markers}))
          ids=[str(m.get('id')) for m in markers if m.get('id') is not None]
          alids=[str(m.get('alId')) for m in markers if m.get('alId')]
          prefixes={s.split('_',1)[0] for s in ids+alids if '_' in s}
          print('SYNCISH_PREFIXES',sorted(prefixes))
          PY

          cat > /tmp/map-summary.mjs <<'NODE'
          import { mapInfo } from 'file:///tmp/map_config.mjs';
          const summary = Object.entries(mapInfo).map(([id,m]) => ({
            id,
            name: m.name,
            spaceId: m.spaceId,
            tileFolder: m.tileFolder,
            tileUrl: m.tileUrl,
            worldRange: m.worldRange,
            center: m.center,
            minZoom: m.minZoom,
            maxZoom: m.maxZoom,
            isDungeon: m.isDungeon || false,
          }));
          console.log('MAP_COUNT', summary.length);
          console.log(JSON.stringify(summary, null, 2));
          NODE
          node /tmp/map-summary.mjs > /tmp/map-summary.txt

          cat /tmp/marker-summary.txt /tmp/map-summary.txt > wwm-map-data-summary.txt
          echo "SUMMARY_BYTES $(wc -c < wwm-map-data-summary.txt)"

      - name: Upload compact forensic artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwm-map-data-summary
          path: wwm-map-data-summary.txt
          if-no-files-found: error
          retention-days: 1
