name: Forensic WWM Sync Public Client

on:
  push:
    branches: [production/wwm-atlas]
    paths: ['.github/workflows/forensic-wwm-sync.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public WWM Map client modules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, re, urllib.parse, urllib.request

          ROOT = 'https://wwmmap.pages.dev/map'
          UA = {'User-Agent': 'Mozilla/5.0 WWM-Atlas-Forensic/1.0'}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.headers, r.read().decode('utf-8', 'replace')

          status, headers, body = get(ROOT)
          print('PAGE_STATUS', status)
          seeds = [urllib.parse.urljoin(ROOT, html.unescape(src)) for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', body, re.I)]
          seeds = [u for u in seeds if urllib.parse.urlparse(u).netloc == 'wwmmap.pages.dev']

          fetched = {ROOT: body}
          queue = list(seeds)
          while queue and len(fetched) < 30:
              url = queue.pop(0)
              if url in fetched: continue
              try:
                  st, _, text = get(url)
                  fetched[url] = text
                  print('FETCHED', st, url, len(text))
              except Exception as e:
                  print('FETCH_ERROR', url, type(e).__name__)
                  continue
              base = url
              imports = []
              imports += re.findall(r'\bfrom\s*["\']([^"\']+)["\']', text)
              imports += re.findall(r'\bimport\s*["\']([^"\']+)["\']', text)
              imports += re.findall(r'\bimport\(\s*["\']([^"\']+)["\']\s*\)', text)
              for spec in imports:
                  child = urllib.parse.urljoin(base, spec)
                  p = urllib.parse.urlparse(child)
                  if p.netloc == 'wwmmap.pages.dev' and p.path.endswith('.js') and child not in fetched and child not in queue:
                      queue.append(child)

          print('MODULES_BEGIN')
          for url in fetched:
              if url != ROOT: print(url)
          print('MODULES_END')

          for url, text in fetched.items():
              if 'GameSyncer' in text or re.search(r'(?i)verify|verification|game.?sync|player.?position|discord.?permission', text):
                  print('TARGET_MODULE', url)
                  lines = text.splitlines()
                  for i, line in enumerate(lines):
                      if re.search(r'GameSyncer|(?i:verify|verification|game.?sync|player.?position|discord.?permission)', line):
                          lo, hi = max(0, i-2), min(len(lines), i+3)
                          for j in range(lo, hi):
                              safe = lines[j]
                              safe = re.sub(r'(?i)(authorization\s*[:=]\s*["\'])[^"\']+', r'\1[redacted]', safe)
                              if len(safe) > 1000: safe = safe[:1000] + '…'
                              print(f'CTX {j+1}: {safe}')

          corpus = '\n'.join(fetched.values())
          print('URL_LITERALS_BEGIN')
          urls = sorted(set(re.findall(r'https?://[^"\'`\\\s)]+', corpus)))
          for u in urls:
              if any(k in u.lower() for k in ['sync','api','game','player','discord','wwm','yysl','netease','163.com','easebar']):
                  print(u[:500])
          print('URL_LITERALS_END')

          print('ROUTE_LITERALS_BEGIN')
          strings = re.findall(r'["\']([^"\'\n]{1,300})["\']', corpus)
          wanted = []
          for s in strings:
              sl = s.lower()
              if any(k in sl for k in ['/api/','/sync','/verify','/verification','/character','/player','/permission','/auth','uid','game-sync','gamesync']):
                  if not any(k in sl for k in ['password=', 'authorization=', 'token=']):
                      wanted.append(s)
          for s in sorted(set(wanted))[:1000]:
              print(s)
          print('ROUTE_LITERALS_END')
          PY
