name: Forensic WWM Sync Public Client

on:
  push:
    branches: [production/wwm-atlas]
    paths: ['.github/workflows/forensic-wwm-sync.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public WWM Map client
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, re, urllib.parse, urllib.request

          page = 'https://wwmmap.pages.dev/map'
          req = urllib.request.Request(page, headers={'User-Agent': 'Mozilla/5.0 WWM-Atlas-Forensic/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read().decode('utf-8', 'replace')
              print('PAGE_STATUS', r.status)
              for k, v in r.headers.items():
                  if k.lower() in {'content-security-policy','server','cf-ray','content-type'}:
                      print('HEADER', k, v)

          scripts = []
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', body, re.I):
              url = urllib.parse.urljoin(page, html.unescape(src))
              if urllib.parse.urlparse(url).netloc == 'wwmmap.pages.dev':
                  scripts.append(url)
          print('FIRST_PARTY_SCRIPTS', len(scripts))
          for url in scripts:
              print('SCRIPT', url)

          texts = [body]
          for url in scripts:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 WWM-Atlas-Forensic/1.0'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      text = r.read().decode('utf-8', 'replace')
                      texts.append(text)
                      print('FETCHED_SCRIPT', url, len(text))
              except Exception as e:
                  print('SCRIPT_FETCH_ERROR', url, type(e).__name__)

          corpus = '\n'.join(texts)
          hosts = sorted(set(re.findall(r'https?://([A-Za-z0-9._-]+)', corpus)))
          print('HOSTS_BEGIN')
          for host in hosts:
              print(host)
          print('HOSTS_END')

          route_patterns = [
              r'(?i)["\']([^"\']{0,120}(?:sync|verify|verification|character|player|uid|discord|permission)[^"\']{0,120})["\']',
              r'(?i)["\']((?:/api/|/v1/|/v2/|/auth/|/game/)[^"\']{1,180})["\']',
          ]
          matches = set()
          for pattern in route_patterns:
              for m in re.findall(pattern, corpus):
                  value = re.sub(r'\s+', ' ', m).strip()
                  if len(value) <= 240 and not any(x in value.lower() for x in ['password=', 'token=', 'authorization']):
                      matches.add(value)
          print('ROUTE_HINTS_BEGIN')
          for value in sorted(matches)[:500]:
              print(value)
          print('ROUTE_HINTS_END')
          PY
