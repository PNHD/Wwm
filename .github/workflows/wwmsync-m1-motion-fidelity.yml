name: WWMSync M1.2 Static-Support Outcome

on:
  push:
    branches: [fix/wwmsync-m1-motion-fidelity]
    paths:
      - 'vision-sync.js'
      - 'index.html'
      - 'vision-sync.css'
      - 'tools/replay-m1-manual-relative.mjs'
      - 'tools/replay-m1-2-static-held-red.mjs'
      - 'docs/wwmsync/audits/m1-2-relative-motion-fidelity-preregistration-2026-08-19.json'
      - 'docs/wwmsync/audits/m1-2-static-held-before-after-2026-08-19.json'
      - '.github/workflows/wwmsync-m1-motion-fidelity.yml'
  pull_request:
    branches: [feature/wwm-native-sync-v2]
    paths:
      - 'vision-sync.js'
      - 'index.html'
      - 'vision-sync.css'
      - 'tools/replay-m1-manual-relative.mjs'
      - 'tools/replay-m1-2-static-held-red.mjs'
      - 'docs/wwmsync/audits/m1-2-relative-motion-fidelity-preregistration-2026-08-19.json'
      - 'docs/wwmsync/audits/m1-2-static-held-before-after-2026-08-19.json'
      - '.github/workflows/wwmsync-m1-motion-fidelity.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FIXTURE_BASENAME: wwmsync-gfn-motion-20260810-143835.zip
  FIXTURE_SHA256: aa14ce0e703d0af5c4c86946f2932b465f8a7fd529001cd1900b3b99b501a216
  FIXTURE_ASSET_ID: '511291145'

jobs:
  m1-motion-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify M1.2 partial-outcome boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check vision-sync.js
          node --check tools/replay-m1-2-static-held-red.mjs
          grep -Fq 'M1_2_STATIC_CONTENT_SUPPRESSION_V1' vision-sync.js
          grep -Fq 'DYNAMIC_INNER_RADIUS=48' vision-sync.js
          grep -Fq 'DYNAMIC_OUTER_RADIUS=72' vision-sync.js
          grep -Fq 'MOTION_EVIDENCE_MIN=.05' vision-sync.js
          grep -Fq 'FIXED_RATE_LATEST_FRAME_SINGLE_INFLIGHT' vision-sync.js
          grep -Fq 'calibration-disabled-m1-2' vision-sync.js
          grep -Fq 'absoluteLocalization:false' vision-sync.js
          ! grep -Fq 'applyAbsoluteFix' vision-sync.js
          ! grep -Fq 'ANCHOR_FREE_STRUCTURAL' vision-sync.js
          ! grep -Fq '__WWMSYNC_ABSOLUTE_REPLAY__' vision-sync.js

      - name: Resolve exact 40-frame GFN fixture
        id: fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$FIXTURE_BASENAME"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$FIXTURE_ASSET_ID" > "$archive"
          test -s "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$FIXTURE_SHA256"
          mkdir -p "$RUNNER_TEMP/m1-fixture"
          unzip -q "$archive" -d "$RUNNER_TEMP/m1-fixture"
          capture="$(find "$RUNNER_TEMP/m1-fixture" -type f -name capture.json -print -quit)"
          test -n "$capture"
          fixture_dir="$(dirname "$capture")"
          test "$(python -c "import json,sys; print(len(json.loads(open(sys.argv[1],encoding='utf-8-sig').read())['frames']))" "$capture")" = 40
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "fixture_dir=$fixture_dir" >> "$GITHUB_OUTPUT"

      - name: Prepare deterministic browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.62.1 leaflet@1.9.4 >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          mkdir -p m1-site m1-output
          printf '%s\n' "$GITHUB_SHA" > m1-output/head.txt
          cp index.html styles.css vision-sync.css app.js vision-sync.js dashen-tile-cache.js official-sync.js sw.js manifest.webmanifest _redirects _headers robots.txt m1-site/
          cp node_modules/leaflet/dist/leaflet.js m1-site/leaflet.js
          cp node_modules/leaflet/dist/leaflet.css m1-site/leaflet.css
          python - <<'PY'
          from pathlib import Path
          p=Path('m1-site/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','/leaflet.css')
          s=s.replace('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','/leaflet.js')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Run authoritative M1.2 frozen primary-gate outcome
        shell: bash
        run: |
          set -euo pipefail
          M1_2_RECORD_ONLY=1 node tools/replay-m1-2-static-held-red.mjs \
            --site m1-site \
            --fixture '${{ steps.fixture.outputs.fixture_dir }}' \
            --archive '${{ steps.fixture.outputs.archive }}' \
            --report m1-output/wwmsync-m1-2-static-held.json
          jq '{runtime,requiredMinimumGain,results,redObserved}' m1-output/wwmsync-m1-2-static-held.json
          test "$(jq -r '.redObserved' m1-output/wwmsync-m1-2-static-held.json)" = 'true'
          test "$(jq -r '.verdict' docs/wwmsync/audits/m1-2-static-held-before-after-2026-08-19.json)" = 'M1.2-PARTIAL'

      - name: Upload authoritative M1.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wwmsync-m1-2-static-support-outcome-${{ github.run_id }}
          path: m1-output/
          if-no-files-found: error
          retention-days: 90
