name: Probe Official Global Map Read Boundary

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/probe-global-map-read-boundary.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only schema and CORS probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > /tmp/probe.py <<'PY'
          import json, subprocess
          from pathlib import Path

          MAP='https://s2.easebar.com/39f12eda6b86452b'
          DATA='https://s2.easebar.com/78ae9d90792a3e9b'
          ORIGINS=['https://preview.wwmsync.pages.dev','https://wwmsync.pages.dev']
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          out={'gets':{},'cors':[],'schema':{}}

          def curl(url, *, method='GET', headers=None, body=None):
            hfile=Path('/tmp/headers.txt'); bfile=Path('/tmp/body.bin')
            cmd=['curl','-sS','-L','--compressed','--connect-timeout','5','--max-time','20','-A',UA,'-X',method,'-D',str(hfile),'-o',str(bfile),'-w','%{http_code}\t%{url_effective}',url]
            for k,v in (headers or {}).items(): cmd += ['-H',f'{k}: {v}']
            if body is not None: cmd += ['--data-raw',body]
            p=subprocess.run(cmd,capture_output=True,text=True)
            status,_,effective=p.stdout.partition('\t')
            rawh=hfile.read_text('utf8',errors='ignore') if hfile.exists() else ''
            rawb=bfile.read_text('utf8',errors='replace') if bfile.exists() else ''
            blocks=[x for x in rawh.replace('\r','').split('\n\n') if x.strip()]
            block=blocks[-1] if blocks else ''
            hdr={}
            for line in block.splitlines()[1:]:
              if ':' in line:
                k,v=line.split(':',1); hdr[k.strip().lower()]=v.strip()
            return {'http':status.strip(),'effective':effective.strip(),'rc':p.returncode,'headers':hdr,'body':rawb}

          endpoints={
            'map_list': f'{MAP}/api/map/list?lang=en-US',
            'map_points_1': f'{MAP}/api/map/points?mapId=1&lang=en-US',
            'user_info': f'{MAP}/api/user/info?lang=en-US',
            'data_sso_ticket': f'{DATA}/sso/ticket?appKey=h72na_map',
          }
          for name,url in endpoints.items():
            out['gets'][name]=curl(url,headers={'Origin':ORIGINS[0]})

          try:
            obj=json.loads(out['gets']['map_points_1']['body'])
            data=obj.get('data') or {}
            points=[]; categories=[]
            def walk(x):
              if isinstance(x,dict):
                if 'pointList' in x and isinstance(x.get('pointList'),list): categories.append(x)
                if ('id' in x or 'pointId' in x) and 'lat' in x and 'lng' in x: points.append(x)
                for v in x.values(): walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            walk(data)
            key_counts={}
            for p in points:
              for k in p: key_counts[k]=key_counts.get(k,0)+1
            ids=[p.get('id',p.get('pointId')) for p in points if p.get('id',p.get('pointId')) is not None]
            out['schema']={
              'point_count_detected':len(points),
              'keys':dict(sorted(key_counts.items())),
              'finished_present':sum('finished' in p for p in points),
              'finished_true':sum(p.get('finished') is True or p.get('finished')==1 for p in points),
              'finished_false':sum(p.get('finished') is False or p.get('finished')==0 for p in points),
              'category_count_detected':len(categories),
              'category_finishPointsNum_nonzero':sum(bool(c.get('finishPointsNum')) for c in categories),
              'category_finishPointsNum_sum':sum(int(c.get('finishPointsNum') or 0) for c in categories),
              'sample_ids':ids[:5]
            }
            if ids:
              out['gets']['map_point_detail']=curl(f'{MAP}/api/map/point?pointId={ids[0]}&lang=en-US',headers={'Origin':ORIGINS[0]})
          except Exception as e:
            out['schema_error']=repr(e)

          cors_targets=[
            ('map_points',f'{MAP}/api/map/points?mapId=1&lang=en-US','GET','h72_map_accessToken'),
            ('user_info',f'{MAP}/api/user/info?lang=en-US','GET','h72_map_accessToken'),
            ('h72na_login',f'{MAP}/api/auth/h72naLogin','POST','content-type'),
            ('data_sso_ticket',f'{DATA}/sso/ticket?appKey=h72na_map','GET','access_token'),
          ]
          for origin in ORIGINS:
            for name,url,req_method,req_headers in cors_targets:
              r=curl(url,method='OPTIONS',headers={
                'Origin':origin,
                'Access-Control-Request-Method':req_method,
                'Access-Control-Request-Headers':req_headers,
              })
              keep={k:v for k,v in r['headers'].items() if k.startswith('access-control-') or k in ('vary','server','allow')}
              out['cors'].append({'origin':origin,'target':name,'http':r['http'],'headers':keep,'body':r['body'][:500]})

          # Keep evidence compact: preserve full public points response separately, previews elsewhere.
          Path('evidence/map-points-1-public.json').write_text(out['gets']['map_points_1']['body'],'utf8')
          for r in out['gets'].values(): r['body']=r['body'][:2000]
          Path('evidence/global-map-read-boundary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),'utf8')
          print('PUBLIC_SCHEMA',json.dumps(out.get('schema',{}),ensure_ascii=False))
          for name,r in out['gets'].items():
            print('GET',name,'HTTP',r['http'],'ACAO',r['headers'].get('access-control-allow-origin'),'ACAC',r['headers'].get('access-control-allow-credentials'),'BODY',r['body'][:240].replace('\n',' '))
          for r in out['cors']: print('CORS',json.dumps(r,ensure_ascii=False))
          PY
          python /tmp/probe.py

      - name: Upload read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: global-map-read-boundary
          path: evidence/
          if-no-files-found: error
          retention-days: 7
