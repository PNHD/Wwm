name: Patch Absolute Gate Semantics

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: [.github/workflows/patch-absolute-gate-semantics.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
      - name: Align photometric rank margins and self-test with runtime gate
        shell: bash
        run: |
          set -euo pipefail
          echo ' return`fine-score ${fine.score.toFixed(3)}`;if(Number.isFinite(fine.verifyScore)&&fine.verifyScore<.56)return`verify-score ${fine.verifyScore.toFixed(3)}`;if(Number.isFinite(fine.nccScore)&&fine.nccScore<.52)return`ncc-score ${fine.nccScore.toFixed(3)}`;"
new="if(!fine)return'no-fine-match';if(fine.score<.50)return`fine-score ${fine.score.toFixed(3)}`;const strongPhotometric=Number.isFinite(fine.nccScore)&&fine.nccScore>=.90&&Number.isFinite(fine.verificationMargin)&&fine.verificationMargin>=.05;if(Number.isFinite(fine.verifyScore)&&fine.verifyScore<.56&&!strongPhotometric)return`verify-score ${fine.verifyScore.toFixed(3)}`;if(Number.isFinite(fine.nccScore)&&fine.nccScore<.52)return`ncc-score ${fine.nccScore.toFixed(3)}`;"
assert old in s
s=s.replace(old,new,1)
old="""  const info=roiSamples(c),match=await globalMatch(info,cfg),fine=match.fine,coarse=match.coarse,scale=fine?.scaleFromCoarse||1,actual=fine?{x:fine.globalX/scale,y:fine.globalY/scale,radius:fine.radius/scale,angle:fine.angle}:null,error=actual?Math.hypot(actual.x-center.x,actual.y-center.y):Infinity,rotationError=actual?Math.min(angleDiff(actual.angle,angle),angleDiff(angleNorm(actual.angle+180),angle)):Infinity;
  return{ok:!!actual&&error<=8&&rotationError<=25,error,rotationError,score:fine?.score??-1,verifyScore:fine?.verifyScore??-1,nccScore:fine?.nccScore??-1,combinedScore:fine?.combinedScore??-1,margin:fine?.margin??0,localMargin:fine?.localMargin??0,beamMargin:fine?.beamMargin??0,coarseScore:coarse?.score??-1,coarseMargin:coarse?.margin??0,expected:center,actual,features:info.samples.length,verifyFeatures:info.verifySamples.length,positiveFeatures:info.positiveCount??0,negativeFeatures:info.negativeCount??0,alternatives:match.alternatives??[]};
"""
new="""  const info=roiSamples(c),match=await globalMatch(info,cfg),fine=match.fine,coarse=match.coarse,scale=fine?.scaleFromCoarse||1,actual=fine?{x:fine.globalX/scale,y:fine.globalY/scale,radius:fine.radius/scale,angle:fine.angle}:null,error=actual?Math.hypot(actual.x-center.x,actual.y-center.y):Infinity,rotationError=actual?Math.min(angleDiff(actual.angle,angle),angleDiff(angleNorm(actual.angle+180),angle)):Infinity,gateReason=matchGate(coarse,fine,info,cfg);
  return{ok:!!actual&&error<=8&&rotationError<=25&&!gateReason,gateReason,error,rotationError,score:fine?.score??-1,verifyScore:fine?.verifyScore??-1,nccScore:fine?.nccScore??-1,combinedScore:fine?.combinedScore??-1,margin:fine?.margin??0,localMargin:fine?.localMargin??0,beamMargin:fine?.beamMargin??0,coarseScore:coarse?.score??-1,coarseMargin:coarse?.margin??0,expected:center,actual,features:info.samples.length,verifyFeatures:info.verifySamples.length,positiveFeatures:info.positiveCount??0,negativeFeatures:info.negativeCount??0,alternatives:match.alternatives??[]};
"""
assert old in s
s=s.replace(old,new,1)
p.write_text(s)
' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check vision-sync.js
          grep -Fq 'function photoDistinctMargin' vision-sync.js
          grep -Fq 'strongPhotometric' vision-sync.js
          grep -Fq 'gateReason=matchGate' vision-sync.js
          git config user.name 'WWMSync CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vision-sync.js
          git commit -m 'fix: align absolute confidence gates with photometric ranking'
          git push origin HEAD:feature/wwm-native-sync-v2
