name: Probe WWMSync Cloudflare Domain

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/cloudflare-wwmsync-migrate.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_PROJECT: wwmsync
  PRODUCTION_BRANCH: production/wwsync

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure clean Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${TARGET_PROJECT}"
          status="$(curl --silent --show-error --output /tmp/project.json --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url")"
          if [ "$status" = 200 ]; then
            node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/project.json','utf8'));
          console.log('PROJECT_EXISTS',x?.result?.name||'unknown',x?.result?.subdomain||'');
          NODE
            exit 0
          fi
          if [ "$status" != 404 ]; then
            echo "PROJECT_LOOKUP_HTTP_${status}" >&2
            node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/project.json','utf8')); console.error(JSON.stringify({success:x.success,errors:x.errors}))" >&2 || true
            exit 1
          fi
          echo "Project wwmsync not present in this account; attempting creation."
          npx --yes wrangler@latest pages project create "$TARGET_PROJECT" --production-branch "$PRODUCTION_BRANCH"
          echo "CREATED https://${TARGET_PROJECT}.pages.dev"
