name: Patch Absolute Matcher Beam Search

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/patch-absolute-matcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2

      - name: Replace single-winner coarse search with beam refinement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path('vision-sync.js')
          s=p.read_text('utf8')
          s=s.replace('const CHECK_MS=6500,COARSE_Z=3,FINE_Z=5,ROI_N=72,SAMPLES=36,NEGATIVE_SAMPLES=20;','const CHECK_MS=6500,COARSE_Z=3,FINE_Z=5,ROI_N=72,SAMPLES=36,NEGATIVE_SAMPLES=20,COARSE_BEAM=4;',1)
          blocks={
            'coarse':('async function coarseMatch(samples,cfg){','async function fineFieldAround', ''),
            'gate':('function matchGate(coarse,fine,roiInfo,cfg){','async function registerFrame', ''),
            'register':('async function registerFrame(cfg,mapId){','function confirmDistance', ''),
            'self':('async function selfTest(){','window.__WWMSYNC_ABSOLUTE_DIAGNOSTICS__', '')
          }
          for name,(start,end,data) in blocks.items():
            i=s.find(start);j=s.find(end,i)
            if i<0 or j<0: raise SystemExit(f'marker missing: {name}')
            s=s[:i]+base64.b64decode(data).decode('utf8')+'\n'+s[j:]
          marker='async function localFineMatch(samples,cfg,last,search=160){'
          i=s.find(marker)
          if i<0: raise SystemExit('localFineMatch marker missing')
          global_block=base64.b64decode('').decode('utf8')
          s=s[:i]+global_block+'\n'+s[i:]
          p.write_text(s,'utf8')
          PY
          node --check vision-sync.js
          grep -Fq 'COARSE_BEAM=4' vision-sync.js
          grep -Fq 'async function globalMatch' vision-sync.js
          grep -Fq 'beamMargin' vision-sync.js
          git config user.name 'WWMSync CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vision-sync.js
          git commit -m 'fix: refine multiple absolute localization hypotheses'
          git push origin HEAD:feature/wwm-native-sync-v2
