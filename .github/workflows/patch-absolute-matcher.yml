name: Patch Absolute Matcher Discrimination

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: ['.github/workflows/patch-absolute-matcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2

      - name: Add negative-edge evidence to visual matcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path('vision-sync.js')
          s=p.read_text('utf8')
          pairs=[
            ('Y29uc3QgQ0hFQ0tfTVM9NjUwMCxDT0FSU0VfWj0zLEZJTkVfWj01LFJPSV9OPTcyLFNBTVBMRVM9MzY7','Y29uc3QgQ0hFQ0tfTVM9NjUwMCxDT0FSU0VfWj0zLEZJTkVfWj01LFJPSV9OPTcyLFNBTVBMRVM9MzYsTkVHQVRJVkVfU0FNUExFUz0yMDs='),
            ('',''),
            ('','')
          ]
          for old64,new64 in pairs:
            old=base64.b64decode(old64).decode('utf8')
            new=base64.b64decode(new64).decode('utf8')
            if old not in s:
              raise SystemExit('expected matcher block not found')
            s=s.replace(old,new,1)
          p.write_text(s,'utf8')
          PY
          node --check vision-sync.js
          grep -Fq 'NEGATIVE_SAMPLES=20' vision-sync.js
          grep -Fq 'negativeCount' vision-sync.js
          git config user.name 'WWMSync CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vision-sync.js
          git commit -m 'fix: strengthen absolute visual match discrimination'
          git push origin HEAD:feature/wwm-native-sync-v2
