name: Patch Scale-Bucket Coarse Search

on:
  push:
    branches: [feature/wwm-native-sync-v2]
    paths: [.github/workflows/patch-scale-bucket-coarse.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wwm-native-sync-v2
      - name: Preserve coarse candidates per scale bucket
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check vision-sync.js
          grep -Fq 'const topByRadius=new Map' vision-sync.js
          grep -Fq 'COARSE_BEAM=24' vision-sync.js
          git config user.name 'WWMSync CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vision-sync.js
          git commit -m 'fix: preserve coarse candidates per scale bucket'
          git push origin HEAD:feature/wwm-native-sync-v2
