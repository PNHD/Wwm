<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a36"><title>City Flow</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a36;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.l{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#203d6b,#101a36 62%)}.c{text-align:center}.m{width:58px;height:58px;margin:auto;border-radius:18px;background:#31c7bd;position:relative;box-shadow:0 18px 40px #0005}.m:before,.m:after{content:"";position:absolute;height:6px;border-radius:5px;background:#fff;left:12px;top:27px}.m:before{width:35px;transform:rotate(-38deg)}.m:after{width:28px;transform:translate(12px,-10px) rotate(35deg)}h1{font-size:15px;letter-spacing:.22em;margin:20px 0 8px}.p{font-size:11px;color:#b7c7e5}.bar{width:210px;height:5px;margin:18px auto;background:#ffffff18;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#ffc95c;border-radius:8px;animation:a 1s ease-in-out infinite alternate}@keyframes a{to{transform:translateX(190%)}}</style></head><body><div class="l"><div class="c"><div class="m"></div><h1>CITY FLOW</h1><div class="p">Loading the city…</div><div class="bar"><i></i></div></div></div><script>(async()=>{try{const files=["https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/d00.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/e00.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/e01.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/a01.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/a02.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/a03.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/b00.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/b01.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/b02.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/b03.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/cf02.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/cf03.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/cf04.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/cf05.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/cf06.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/cf07.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/c00.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/c01.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/c02.txt","https://raw.githubusercontent.com/PNHD/Wwm/city-flow-host/city-flow-v3/c03.txt"];const parts=await Promise.all(files.map(x=>fetch(x,{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('Chunk '+r.status);return r.text()})));const b=atob(parts.join(''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()}catch(e){document.querySelector('.p').textContent='Could not load City Flow. Refresh to try again.';console.error(e)}})()</script></body></html>
